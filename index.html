<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="theme-color" content="#6366f1">
<title>Vocabulary</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>(function(){try{var s=(JSON.parse(localStorage.getItem('vocab.v2')||'{}').settings)||{};var m=s.theme||'auto',dark;if(m==='dark')dark=true;else if(m==='light')dark=false;else{var h=new Date().getHours();dark=h<7||h>=19;}document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>
:root{
  --bg:#f5f6f9; --surf:#ffffff; --surf2:#fbfbfd;
  --tx:#0f1222; --mut:#6b7280; --fade:#9aa0ae;
  --line:#ebedf2; --line2:#e2e5ec;
  --pri:#6366f1; --pri-d:#4f46e5; --pri-soft:#eef0ff;
  --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  --ok:#10b981; --ok-soft:#e7f8f1; --bad:#ef4444; --bad-soft:#fdecec;
  --warn:#f59e0b; --info:#3b82f6;
  --sh-sm:0 1px 2px rgba(16,24,40,.05); --sh:0 2px 4px rgba(16,24,40,.04),0 10px 28px rgba(16,24,40,.06);
  --r:18px; --r-sm:13px;
  --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Segoe UI",Roboto,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b0c11; --surf:#161822; --surf2:#1b1e2a;
  --tx:#eef0f7; --mut:#9aa0ae; --fade:#6a7080;
  --line:#242736; --line2:#2d3142;
  --pri:#818cf8; --pri-d:#6366f1; --pri-soft:#232648;
  --grad:linear-gradient(135deg,#6366f1,#a78bfa);
  --ok:#34d399; --ok-soft:#113329; --bad:#f87171; --bad-soft:#3a1d1d;
  --sh-sm:0 1px 2px rgba(0,0,0,.3); --sh:0 2px 6px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
#app{max-width:680px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
::selection{background:var(--pri-soft)}

/* header */
header{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(var(--bg) 72%,transparent)}
header h1{flex:1;min-width:0;margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:42px;height:42px;flex:none;border-radius:13px;background:var(--surf);box-shadow:var(--sh-sm);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--tx)}
.ic:active{transform:scale(.93)}
.back{font-size:26px;font-weight:600;color:var(--pri)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:15px;background:var(--surf);box-shadow:var(--sh-sm);
  border:1px solid var(--line);font-weight:650;font-size:16px;letter-spacing:-.01em}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line2)}
.btn.danger{color:var(--bad)}
.btn.sm{width:auto;padding:10px 14px;font-size:14.5px}
.stack>*+*{margin-top:10px}

/* segmented control */
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--sh-sm);margin:2px 0 14px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:650;font-size:15px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.seg .cnt{font-size:12px;font-weight:700;opacity:.9;background:rgba(255,255,255,.22);padding:1px 7px;border-radius:9px}
.seg button:not(.on) .cnt{background:var(--line2);color:var(--mut)}

/* mode pills */
.modes{display:flex;gap:10px;overflow-x:auto;padding:2px 0 14px;margin:0 -16px;
  padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.mcard{flex:none;scroll-snap-align:start;width:104px;padding:14px 12px;border-radius:17px;background:var(--surf);
  box-shadow:var(--sh-sm);border:1px solid var(--line);text-align:left}
.mcard:active{transform:scale(.96)}
.mcard .em{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:9px}
.mcard b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.mcard small{color:var(--mut);font-size:11.5px;font-weight:500}
.em-a{background:#eef0ff;color:#4f46e5}.em-b{background:#e7f8f1;color:#059669}
.em-c{background:#fff1e6;color:#d97706}.em-d{background:#e8f1ff;color:#2563eb}
:root[data-theme="dark"] .em-a{background:#22264a}:root[data-theme="dark"] .em-b{background:#0f2e26}:root[data-theme="dark"] .em-c{background:#33240f}:root[data-theme="dark"] .em-d{background:#11223f}

/* list / dictionary */
.subhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px}
.subhead .t{font-size:13px;font-weight:700;color:var(--fade);text-transform:uppercase;letter-spacing:.06em}
.search{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:0 13px;margin-bottom:10px;box-shadow:var(--sh-sm)}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;color:var(--tx)}
.search svg{width:17px;height:17px;fill:var(--fade);flex:none}
.item{display:flex;align-items:center;gap:13px;background:var(--surf);box-shadow:var(--sh-sm);
  border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:9px}
.item:active{background:var(--surf2)}
.item .t{flex:1;min-width:0}
.item .en{font-weight:700;font-size:16.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ru{color:var(--mut);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:3px;flex:none}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.pip.on1{background:var(--warn)}.pip.on2{background:var(--info)}.pip.on3{background:var(--ok)}
.chk{width:24px;height:24px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.spk{width:34px;height:34px;flex:none;border-radius:10px;background:var(--surf2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px}
.spk:active{background:var(--pri-soft)}

/* selection / bulk archive */
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px;min-height:24px}
.tbar .t{font-size:13px;font-weight:700;color:var(--fade);text-transform:uppercase;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{font-size:14.5px;font-weight:700;color:var(--pri);padding:5px 4px;flex:none;border-radius:9px}
.lnk:active{background:var(--pri-soft)}
.cbox{width:25px;height:25px;flex:none;border-radius:50%;border:2px solid var(--line2);background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;transition:.12s}
.cbox.on{background:var(--pri);border-color:var(--pri)}
.item.pick{border-color:var(--pri);background:var(--pri-soft)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(transparent,var(--bg) 34%);
  padding:20px 16px calc(14px + env(safe-area-inset-bottom))}
.selbar .in{max-width:680px;margin:0 auto}
.btn:disabled{opacity:.5;box-shadow:none}
.ans-bad,.ans-ok{font-size:14px;font-weight:650;padding:6px 12px;border-radius:11px;line-height:1.2}
.ans-bad{background:var(--bad-soft);color:var(--bad)}
.ans-ok{background:var(--ok-soft);color:var(--ok)}
/* test question palette */
.qpal{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;-webkit-overflow-scrolling:touch}
.qpal::-webkit-scrollbar{display:none}
.qdot{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:11px;border:1.5px solid var(--line2);background:var(--surf);color:var(--mut);font-weight:700;font-size:14.5px}
.qdot.on{border-color:var(--pri);color:var(--pri-d);background:var(--pri-soft)}
.qdot.cur{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.opt.pick{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.btn.selp{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.arch-ic{width:46px;height:46px;flex:none;border-radius:50%;background:var(--pri-soft);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-size:22px}
.src{color:var(--fade);font-size:12.5px;font-weight:600}

/* account */
.acct-dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.ic{position:relative}
.tabs2{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--sh-sm);margin-bottom:14px}
.tabs2 button{flex:1;padding:10px 6px;border-radius:10px;font-weight:650;font-size:15px;color:var(--mut)}
.tabs2 button.on{background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pri-soft);border-radius:15px;padding:16px;margin:4px 0 12px}
.codebox b{font-size:28px;font-weight:850;letter-spacing:.08em;color:var(--pri-d)}
.roster{display:flex;align-items:center;gap:13px;background:var(--surf);box-shadow:var(--sh-sm);border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:9px}
.roster .av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.roster .t{flex:1;min-width:0}
.roster .nm{font-weight:700;font-size:16px}
.roster .meta{color:var(--mut);font-size:13px}
.err{color:var(--bad);font-size:13.5px;font-weight:600;margin:2px 2px 8px;min-height:17px}

/* set card on home */
.setcard{display:flex;align-items:center;gap:14px;background:var(--surf);box-shadow:var(--sh);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:11px}
.setcard:active{transform:scale(.99)}
.setcard .t{flex:1;min-width:0}
.setcard .nm{font-weight:750;font-size:18px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setcard .meta{color:var(--mut);font-size:13.5px;margin-top:2px}
.ring{flex:none}

/* empty */
.empty{text-align:center;color:var(--mut);padding:46px 24px}
.empty .big{font-size:52px;margin-bottom:10px;filter:grayscale(.1)}
.empty b{display:block;color:var(--tx);font-size:18px;font-weight:700;margin-bottom:5px;letter-spacing:-.02em}
.empty p{margin:0;font-size:14.5px;line-height:1.5}

/* banner */
.banner{display:flex;gap:11px;background:var(--pri-soft);border-radius:15px;padding:13px 15px;margin-bottom:14px;font-size:14px;line-height:1.5;align-items:flex-start}
.banner .x{margin-left:auto;font-size:18px;color:var(--pri);flex:none;padding:0 2px}
.banner b{font-weight:700}

/* fab */
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:15;
  width:60px;height:60px;border-radius:20px;background:var(--grad);color:#fff;font-size:30px;font-weight:300;
  box-shadow:0 8px 22px rgba(99,102,241,.45);display:flex;align-items:center;justify-content:center;line-height:1}
.fab:active{transform:scale(.92)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.sheet{width:100%;max-width:680px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grip{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
.sheet h2{margin:0 0 14px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--fade);text-transform:uppercase;letter-spacing:.05em;margin:0 2px 6px}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--pri)}
textarea.inp{resize:vertical;line-height:1.5;min-height:120px;font-size:15px}
.row{display:flex;gap:9px;align-items:center}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.hint{color:var(--mut);font-size:13px;min-height:17px;margin:2px 2px 6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.chip{background:var(--pri-soft);color:var(--pri-d);border-radius:11px;padding:7px 13px;font-size:14px;font-weight:600}
.chip:active{transform:scale(.95)}
.sel-opt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sel-opt button{padding:9px 13px;border-radius:11px;background:var(--surf);border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--mut)}
.sel-opt button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d)}
.toggle{display:flex;align-items:center;gap:10px;padding:12px 2px}
.toggle label{flex:1;font-weight:600;font-size:15px}
.sw{width:50px;height:30px;border-radius:16px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw.on{background:var(--ok)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:23px}

/* study */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .x{font-size:15px;font-weight:650;color:var(--mut)}
.pbar{flex:1;height:7px;background:var(--line2);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.stat{font-size:14px;font-weight:700;color:var(--mut);flex:none;min-width:52px;text-align:right}
.fc{perspective:1200px;margin:12px 0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:26px;min-height:min(60vh,340px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:var(--sh)}
.card .word{font-size:clamp(28px,8vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.card .ex{font-size:16px;font-weight:400;color:var(--mut);margin-top:16px;line-height:1.4;font-style:italic}
.card .tip{font-size:13.5px;color:var(--fade);margin-top:18px;font-weight:500}
.card .lbl{font-size:12.5px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.07em;margin-bottom:16px}
.opt{display:flex;align-items:center;width:100%;text-align:left;background:var(--surf);border:1.5px solid var(--line2);
  border-radius:15px;padding:16px 17px;margin-bottom:10px;font-size:17px;font-weight:600;box-shadow:var(--sh-sm);transition:.12s}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{padding:15px;border-radius:15px;margin:12px 0;font-weight:700;font-size:16px;line-height:1.4}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:500;margin-top:5px;opacity:.85}
.big-pct{text-align:center;font-size:58px;font-weight:850;letter-spacing:-.04em;line-height:1;margin:14px 0 2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:72px;padding:10px;border-radius:16px;background:var(--surf);border:1.5px solid var(--line2);
  box-shadow:var(--sh-sm);font-weight:650;font-size:15.5px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.tile.done{opacity:0;pointer-events:none;transform:scale(.8);transition:.3s}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.celebrate{text-align:center;padding:30px 0 6px}.celebrate .big{font-size:66px}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:#15171f;color:#fff;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:600;z-index:60;
  opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
:root[data-theme="dark"] #toast{background:#2a2e3d}

/* theme segmented control */
.seg3{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:4px;box-shadow:var(--sh-sm)}
.seg3 button{flex:1;padding:10px 6px;border-radius:9px;font-weight:650;font-size:14.5px;color:var(--mut)}
.seg3 button.on{background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}

/* result hero + score ring */
.hero{text-align:center;padding:14px 0 6px}
.hero-emoji{font-size:62px;line-height:1;animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-22deg);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.hero-title{font-size:27px;font-weight:850;letter-spacing:-.025em;margin-top:8px}
.hero-sub{color:var(--mut);font-size:16px;margin-top:5px;font-weight:500}
.ring-big{display:block;margin:6px auto 2px}
.rb-track{fill:none;stroke:var(--line2);stroke-width:13}
.rb-fill{fill:none;stroke:url(#gbig);stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--off);animation:ringfill 1.15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
.rb-pct{font-size:42px;font-weight:850;fill:var(--tx);letter-spacing:-.03em}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* bigger, fuller desktop layout */
@media(min-width:720px){
  body{font-size:17.5px}
  #app{max-width:780px;padding:0 24px}
  header h1{font-size:32px}
  .ic{width:46px;height:46px;font-size:21px}
  .btn{font-size:17px;padding:16px 20px}
  .setcard{padding:20px}.setcard .nm{font-size:21px}.setcard .meta{font-size:15px}
  .item{padding:15px 18px}.item .en{font-size:18.5px}.item .ru{font-size:16px}
  .mcard{width:120px;padding:17px 14px}.mcard b{font-size:16px}.mcard small{font-size:12.5px}
  .card .word{font-size:clamp(36px,4.6vw,50px)}
  .opt{font-size:18px;padding:18px 19px}

const plural=(n,one,few,many)=>{const m10=n%10,m100=n%100;return n+' '+(m10===1&&m100!==11?one:(m10>=2&&m10<=4&&(m100<10||m100>=20)?few:many));};

let _voices=[];function loadVoices(){try{_voices=speechSynthesis.getVoices()||[]}catch(e){_voices=[]}}
function bestVoice(){
  const target=(S.settings.accent==='us')?'en-us':'en-gb';
  const en=_voices.filter(v=>/^en/i.test(v.lang||''));
  if(!en.length)return null;
  const score=v=>{let s=0;const n=(v.name||'').toLowerCase();
    if(/\b(enhanced|premium|neural|natural)\b/.test(n))s+=70;
    if(/\b(siri|ava|allison|samantha|serena|daniel|kate|arthur|oliver|stephanie|aria|jenny|guy|libby|sonia|ryan|nicky|aaron)\b/.test(n))s+=42;
    if(/\bgoogle\b/.test(n))s+=34;
    if(/\b(compact|eloquence|fred|albert|zarvox|trinoids|whisper|novelty|bad|bells|boing|bubbles|cellos|wobble|superstar)\b/.test(n))s-=90;
    return s;};
  const inTarget=en.filter(v=>(v.lang||'').replace('_','-').toLowerCase()===target);
  const pool=inTarget.length?inTarget:en;
  return pool.slice().sort((a,b)=>score(b)-score(a))[0];
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);const v=bestVoice();

/* ---------- theme (day/night) ---------- */
function sunTimes(date,lat,lon){
  const rad=Math.PI/180,deg=180/Math.PI;
  const J=date.getTime()/86400000+2440587.5;
  const n=Math.round(J-2451545.0+0.0008);
  const Js=n-lon/360;
  const M=(357.5291+0.98560028*Js)%360;
  const C=1.9148*Math.sin(M*rad)+0.0200*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const lam=(M+C+180+102.9372)%360;
  const Jt=2451545.0+Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*lam*rad);
  const dec=Math.asin(Math.sin(lam*rad)*Math.sin(23.44*rad));
  let cH=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  cH=Math.max(-1,Math.min(1,cH));
  const H=Math.acos(cH)*deg;
  const toD=x=>new Date((x-2440587.5)*86400000);
  return {rise:toD(Jt-H/360),set:toD(Jt+H/360)};
}
function resolveDark(){
  const m=(S.settings.theme)||'auto';
  if(m==='dark')return true;if(m==='light')return false;
  const now=new Date(),g=S.settings.geo;
  if(g){try{const t=sunTimes(now,g.lat,g.lon);return now<t.rise||now>t.set;}catch(e){}}
  const h=now.getHours()+now.getMinutes()/60;return h<7||h>=19;
}
let _themeTimer=null;
function applyTheme(){

  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute('content',dark?'#0b0c11':'#f5f6f9');
  clearTimeout(_themeTimer);
  if(((S.settings.theme)||'auto')==='auto')_themeTimer=setTimeout(applyTheme,60000);
}

function toggleTheme(){const dark=document.documentElement.getAttribute('data-theme')==='dark';S.settings.theme=dark?'light':'dark';save();applyTheme();render();}

function bigRing(pct){

}

}
function confetti(n){
  try{
    const cv=document.createElement('canvas');cv.className='confetti';
    const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    document.body.appendChild(cv);
    const cols=['#6366f1','#8b5cf6','#10b981','#f59e0b','#ef4444','#3b82f6','#a3e635'];
    const N=n||120,P=[];
    for(let i=0;i<N;i++)P.push({x:W/2+(Math.random()-.5)*160,y:H*0.3+(Math.random()-.5)*50,
      vx:(Math.random()-.5)*11,vy:Math.random()*-9-4,g:0.3+Math.random()*0.12,
      s:5+Math.random()*7,rot:Math.random()*6.28,vr:(Math.random()-.5)*0.4,
      col:cols[i%cols.length],sq:Math.random()<.5,life:0});
    const start=performance.now();let t0=start;
    function frame(t){const dt=Math.min(34,t-t0);t0=t;ctx.clearRect(0,0,W,H);let alive=0;
      for(const p of P){p.life+=dt;p.vy+=p.g*(dt/16);p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);p.rot+=p.vr;
        const a=Math.max(0,1-(p.life-1300)/1500);
        if(p.y<H+24&&a>0){alive++;ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;
          if(p.sq)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.283);ctx.fill();}ctx.restore();}}
      if(alive>0&&t-start<3400)requestAnimationFrame(frame);else cv.remove();}
    requestAnimationFrame(frame);
  }catch(e){}
}

/* award: update mastery; returns 'arch' if word just archived */
function award(w,correct){
  touch(w);

  else{w.bad++;w.box=Math.max(0,w.box-1);}
  return '';
}

     stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})"/>
   <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="13" font-weight="800" fill="var(--tx)">${Math.round(p*100)}</text>

/* ---------- translation ---------- */
async function translate(t){
  const order=S.settings.prov==='mm'?['mm']:['google','mm'];
  for(const p of order){
    try{
      if(p==='google'){
        const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&dt=bd&q='+encodeURIComponent(t));
        if(!r.ok)continue;const j=await r.json();const main=(j[0]||[]).map(x=>x[0]).join('').trim();
        const alts=(j[1]||[]).flatMap(e=>e[1]||[]).filter(x=>x&&x.toLowerCase()!==main.toLowerCase()).slice(0,6);
        if(main)return{main,alts};
      }else{
        const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|ru&q='+encodeURIComponent(t));
        if(!r.ok)continue;const j=await r.json();const main=(j.responseData.translatedText||'').trim();
        const alts=[...new Set((j.matches||[]).map(m=>m.translation).filter(x=>x&&x.toLowerCase()!==main.toLowerCase()))].slice(0,5);
        if(main&&!/^[A-Z\s]+$/.test(main))return{main,alts};
      }
    }catch(e){}
  }
  return null;
}

async function cloudPush(){

      const rows=S.sets.map((s,i)=>({id:s.id,owner_id:me,name:s.name,position:i,deleted:false,updated_at:new Date(s.upd||Date.now()).toISOString()}));

    }
    const wr=[];
    S.sets.forEach(s=>s.words.forEach((w,i)=>wr.push({id:w.id,set_id:s.id,owner_id:me,en:w.en,ru:w.ru||'',ex:w.ex||'',
      box:w.box||0,arch:!!w.arch,ok:w.ok||0,bad:w.bad||0,position:i,deleted:false,updated_at:new Date(w.upd||Date.now()).toISOString()})));
    for(let i=0;i<wr.length;i+=200){

async function cloudPull(){
  if(!cloudEnabled()||syncing)return;
  syncing=true;
  try{
    const me=AUTH.user.id;
    const [rs,rw]=await Promise.all([
      sb.from('sets').select('*').eq('owner_id',me).eq('deleted',false),
      sb.from('words').select('*').eq('owner_id',me).eq('deleted',false)
    ]);
    if(rs.error||rw.error){syncing=false;return;}
    const cs=rs.data||[],cw=rw.data||[];
    const setIds=new Set(cs.map(x=>x.id)),wordIds=new Set(cw.map(x=>x.id));
    cs.forEach(c=>{
      const u=+new Date(c.updated_at),l=S.sets.find(x=>x.id===c.id);
      if(!l)S.sets.push({id:c.id,name:c.name,words:[],upd:u,synced:true});
      else if(u>(l.upd||0)){l.name=c.name;l.upd=u;l.synced=true;}
    });
    S.sets=S.sets.filter(s=>setIds.has(s.id)||!s.synced);
    cw.forEach(c=>{
      const s=S.sets.find(x=>x.id===c.set_id);if(!s)return;
      const u=+new Date(c.updated_at),l=s.words.find(x=>x.id===c.id);

    });
    S.sets.forEach(s=>{s.words=s.words.filter(w=>wordIds.has(w.id)||!w.synced);});
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  }catch(e){}
  syncing=false;
}

function selBar(inArch){
  const n=selIds.size;
  const moveLabel=inArch?`↩ To learning${n?` (${n})`:''}`:`🗄 To Archive${n?` (${n})`:''}`;
  return `<div class="selbar"><div class="in row2">

function toggleSelMode(){selMode=!selMode;selIds.clear();render();}
function togglePick(id){if(selIds.has(id))selIds.delete(id);else selIds.add(id);render();}
function selAll(){const p=poolNow();if(selIds.size>=p.length)selIds.clear();else p.forEach(w=>selIds.add(w.id));render();}
function bulkArch(toArch){
  let n=0;
  S.sets.forEach(s=>s.words.forEach(w=>{if(selIds.has(w.id)&&w.arch!==toArch){w.arch=toArch;w.box=toArch?3:Math.min(w.box,2);touch(w);n++;}}));
  save();clearSel();render();
  toast(toArch?`Moved to Archive: ${n}`:`Moved back to learning: ${n}`);
}
function bulkDelete(){
  const n=selIds.size;if(!n)return;
  if(!confirm(`Delete ${n} ${n===1?'word':'words'}? This can't be undone.`))return;
  S.sets.forEach(s=>{s.words.forEach(w=>{if(selIds.has(w.id))cloudDeleteWord(w);});s.words=s.words.filter(w=>!selIds.has(w.id));});
  save();clearSel();render();
  toast(`Deleted: ${n} ${n===1?'word':'words'}`);
}
function listHtml(words,arch,qs){
  qs=(qs||'').toLowerCase();
  const ws=qs?words.filter(w=>(w.en+' '+w.ru).toLowerCase().includes(qs)):words;
  if(!words.length)return `<div class="empty"><div class="big">✍️</div><b>Add your first word</b><p>Tap ＋ below to enter a word and its translation, or import a whole list from the ⋯ menu.</p></div>`;
  if(!ws.length)return `<div class="empty"><p>Nothing found</p></div>`;
  return ws.map(w=>{
    const picked=selIds.has(w.id);
    const left=selMode
      ?`<span class="cbox ${picked?'on':''}">${picked?'✓':''}</span>`
      :`<span class="pips"><i class="pip ${w.box>=1?'on1':''}"></i><i class="pip ${w.box>=2?'on2':''}"></i><i class="pip ${w.box>=3?'on3':''}"></i></span>`;
    const onclick=selMode?`togglePick('${w.id}')`:`wordForm('${w.id}')`;
    return `<div class="item ${picked&&selMode?'pick':''}" onclick="${onclick}">
      ${left}
      <div class="t"><div class="en">${esc(w.en)}</div><div class="ru">${esc(w.ru)}</div></div>
      ${selMode?'':`<button class="spk" aria-label="Pronounce" onclick="event.stopPropagation();speak('${q1(w.en)}')">🔊</button>`}</div>`;
  }).join('');
}
function archListHtml(items,qs){
  qs=(qs||'').toLowerCase();
  const its=qs?items.filter(x=>(x.w.en+' '+x.w.ru).toLowerCase().includes(qs)):items;
  if(!items.length)return `<div class="empty"><div class="big">🗄️</div><b>Archive is empty</b><p>Learned words from all your lists collect here — automatically in Learn and Test, or when you move them here with Select.</p></div>`;
  if(!its.length)return `<div class="empty"><p>Nothing found</p></div>`;
  return its.map(({w,sn})=>{
    const picked=selIds.has(w.id);
    const left=selMode?`<span class="cbox ${picked?'on':''}">${picked?'✓':''}</span>`:'<span class="chk">✓</span>';
    const onclick=selMode?`togglePick('${w.id}')`:`wordForm('${w.id}')`;
    return `<div class="item ${picked&&selMode?'pick':''}" onclick="${onclick}">
      ${left}
      <div class="t"><div class="en">${esc(w.en)}</div><div class="ru">${esc(w.ru)}<span class="src"> · ${esc(sn)}</span></div></div>
      ${selMode?'':`<button class="spk" aria-label="Pronounce" onclick="event.stopPropagation();speak('${q1(w.en)}')">🔊</button>`}</div>`;
  }).join('');
}

let impTerm='auto',impCard='line',impAuto=true;
function importSheet(){
  impTerm='auto';impCard='line';impAuto=true;
  sheet(`<h2>Import words</h2>
   <div class="hint">Paste a list from Quizlet, Excel or plain text. Translations are optional — they'll be filled in automatically.</div>
   <div class="field"><textarea class="inp" id="imp" placeholder="apple&#9;яблоко&#10;reliable&#9;надёжный&#10;to give up&#10;book	книга" oninput="impPrev()"></textarea></div>
   <div class="field"><label>Between word and translation</label><div class="sel-opt" id="selT">
     ${[['auto','Auto'],['tab','Tab ⇥'],['dash','Dash –'],['comma','Comma'],['eq','= ']].map(o=>`<button data-v="${o[0]}" class="${o[0]==='auto'?'on':''}" onclick="impTerm='${o[0]}';syncSel();impPrev()">${o[1]}</button>`).join('')}</div></div>
   <div class="field"><label>Between cards</label><div class="sel-opt" id="selC">
     ${[['line','New line'],['semi','; semicolon'],['blank','Blank line']].map(o=>`<button data-v="${o[0]}" class="${o[0]==='line'?'on':''}" onclick="impCard='${o[0]}';syncSel();impPrev()">${o[1]}</button>`).join('')}</div></div>
   <div class="toggle"><label>Translate when the translation is missing</label><div class="sw on" id="swA" onclick="impAuto=!impAuto;this.classList.toggle('on',impAuto)"><i></i></div></div>
   <div class="hint" id="impInfo">Preview will appear here</div>
   <button class="btn pri" id="impBtn" onclick="runImport()">Add</button>`);
  setTimeout(()=>$('#imp')&&$('#imp').focus(),60);
}
function syncSel(){$$('#selT button').forEach(b=>b.classList.toggle('on',b.dataset.v===impTerm));
  $$('#selC button').forEach(b=>b.classList.toggle('on',b.dataset.v===impCard));}
function splitCards(text){
  if(impCard==='semi')return text.split(';');
  if(impCard==='blank')return text.split(/\n\s*\n/);
  return text.split(/\r?\n/);
}
function splitPair(line){
  line=line.trim();if(!line)return null;
  let en,ru;
  if(impTerm==='tab'){[en,...ru]=line.split('\t');ru=(ru||[]).join(' ');}
  else if(impTerm==='comma'){[en,...ru]=line.split(',');ru=(ru||[]).join(',');}
  else if(impTerm==='eq'){[en,...ru]=line.split('=');ru=(ru||[]).join('=');}
  else if(impTerm==='dash'){const m=line.split(/\s+[-–—]\s+/);en=m[0];ru=m.slice(1).join(' - ');}
  else{ // auto
    if(line.includes('\t')){[en,...ru]=line.split('\t');ru=ru.join(' ');}
    else{const m=line.split(/\s+[-–—:]\s+/);if(m.length>1){en=m[0];ru=m.slice(1).join(' - ');}
      else{en=line;ru='';}}
  }
  en=(en||'').trim();ru=(ru||'').trim();
  return en?{en,ru}:null;
}
function parseImport(){const t=$('#imp').value;return splitCards(t).map(splitPair).filter(Boolean);}
function impPrev(){
  const p=parseImport();const miss=p.filter(x=>!x.ru).length;
  const info=$('#impInfo');if(!info)return;
  if(!p.length){info.textContent='Preview will appear here';return;}
  const ex=p.slice(0,3).map(x=>`${esc(x.en)} → ${x.ru?esc(x.ru):'<span style="color:var(--warn)">auto</span>'}`).join(' · ');
  info.innerHTML=`Found <b>${p.length}</b> ${p.length===1?'word':'words'}${miss?`, ${miss} without translation`:''}.<br>${ex}${p.length>3?' …':''}`;
}
async function runImport(){
  const pairs=parseImport();if(!pairs.length)return toast('Nothing to import');
  const s=curSet(),btn=$('#impBtn');btn.disabled=true;
  let done=0;
  for(const p of pairs){
    let ru=p.ru;
    if(!ru&&impAuto){btn.textContent=`Translating… ${done+1}/${pairs.length}`;const t=await translate(p.en);ru=t?t.main:'';}
    s.words.push(newWord(p.en,ru||'—'));done++;
  }
  save();closeSheet();render();toast(`Added: ${done} ${done===1?'word':'words'}`);
}

/* ---------- questions engine ---------- */
function mkQ(pool,w,kind,forceDir){
  const others=pool.filter(x=>x!==w);
  if(kind==='mc'&&others.length<1)kind='type';
  if(kind==='tf'&&others.length<1)kind='type';
  const dir=forceDir||(Math.random()<.5?'en2ru':'ru2en');
  if(kind==='mc'){const ds=shuffle(others).slice(0,Math.min(3,others.length));
    return{w,type:'mc',dir,opts:shuffle([w,...ds]).map(x=>({t:dir==='en2ru'?x.ru:x.en,c:x===w}))};}
  if(kind==='tf'){const isTrue=Math.random()<.5;const d=isTrue?w:shuffle(others)[0];
    const td=forceDir==='ru2en'?'ru2en':'en2ru';
    return{w,type:'tf',dir:td,shown:td==='ru2en'?d.en:d.ru,isTrue};}
  return{w,type:'type',dir};
}
function renderQ(box,q,o){
  const w=q.w,en2ru=q.dir==='en2ru',prompt=en2ru?w.en:w.ru,answer=en2ru?w.ru:w.en;
  let lbl=q.type==='tf'?'Is this a correct match?':q.type==='type'?(en2ru?'Type the translation':'Type in English'):(en2ru?'Choose the translation':'Choose the word');
  let h=(o.skipped?`<div style="text-align:center;color:var(--warn);font-weight:650;font-size:13.5px;margin:-2px 0 8px">↩ Back to a skipped word</div>`:'')+
    `<div class="card" style="min-height:min(34vh,200px)"><div class="lbl">${lbl}</div>
    <div class="word">${esc(prompt)}</div>${q.type==='tf'?`<div class="word" style="font-size:24px;color:var(--mut);margin-top:10px">= ${esc(q.shown)}</div>`:''}</div>`;
  if(q.type==='mc')h+=`<div style="margin-top:14px">${q.opts.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>`;
  if(q.type==='tf')h+=`<div class="row2" style="margin-top:14px"><button class="btn" data-tf="1">✓ True</button><button class="btn" data-tf="0">✗ False</button></div>`;
  if(q.type==='type')h+=`<div style="margin-top:14px"><input class="inp" id="ta" placeholder="Answer" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off">
    <div style="height:9px"></div><button class="btn pri" id="tsub">Check</button>
    <div style="height:8px"></div><button class="btn ghost" id="tskip">Don't know</button></div>`;
  if(o.onSkip)h+=`<div style="height:8px"></div><button class="btn ghost" id="qskip" style="color:var(--mut)">↷ Skip — think later</button>`;
  h+=`<div id="fbx"></div>`;box.innerHTML=h;
  let done=false;
  const finish=(ok,given)=>{
    if(done)return;done=true;
    if(!o.feedback){o.onDone(ok,given);return;}
    const f=$('#fbx');
    f.innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'Correct ✓':'Wrong'}${ok?'':`<small>Answer: ${esc(q.type==='tf'?(q.isTrue?'the match is correct':'the match is wrong'):answer)}</small>`}</div>${ok?'':'<button class="btn pri" id="nx">Next →</button>'}`;
    if(!en2ru||q.type==='tf')speak(w.en);
    if(ok)setTimeout(()=>o.onDone(ok,given),620);else $('#nx').onclick=()=>o.onDone(ok,given);
  };
  if(q.type==='mc')box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const x=q.opts[+b.dataset.i];
    if(o.feedback){box.querySelectorAll('.opt').forEach((bb,i)=>{if(q.opts[i].c)bb.classList.add('ok');});if(!x.c)b.classList.add('bad');}
    finish(x.c,x.t);});
  if(q.type==='tf')box.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>finish((b.dataset.tf==='1')===q.isTrue,b.dataset.tf==='1'?'True':'False'));
  if(q.type==='type'){const ta=$('#ta');setTimeout(()=>ta&&ta.isConnected&&ta.focus(),60);
    const chk=()=>{if(done)return;const ok=okAns(ta.value,answer,en2ru);ta.disabled=true;finish(ok,ta.value);};
    $('#tsub').onclick=chk;ta.addEventListener('keydown',e=>{if(e.key==='Enter')chk();});
    $('#tskip').onclick=()=>{if(done)return;ta.disabled=true;finish(false,'');};}
  if(o.onSkip){const sb=$('#qskip');if(sb)sb.onclick=()=>{if(done)return;done=true;o.onSkip();};}
}

function startCards(review){

/* ---------- learn (active only) ---------- */
function startLearn(review){
  const pool=review?poolNow():active(curSet());
  if(!pool.length)return toast(review?'No words':'No words to learn');
  const B={};if(review)pool.forEach(w=>B[w.id]=0);
  const lvl=w=>review?B[w.id]:(w.box||0);
  let queue=shuffle(pool.filter(w=>lvl(w)<3));if(!queue.length)queue=shuffle(pool);
  const target=queue.reduce((n,w)=>n+(3-lvl(w)),0)||queue.length;let gained=0;const app=$('#app');
  function next(){
    if(!queue.length){
      app.innerHTML=hdr('Learn',"render()")+
        `<div class="hero"><div class="hero-emoji">🏆</div><div class="hero-title" style="margin-top:14px">${review?'Review complete':'Great job!'}</div>
         <div class="hero-sub">${review?'You revised every word in this session.':'Every word this session is mastered and moved to the Archive.'}</div></div>
        <div style="height:14px"></div><button class="btn pri" onclick="render()">Done</button>`;
      confetti();return;
    }
    const w=queue.shift();const L=lvl(w);const kind=L<=1?'mc':'type';const dir=L===0?'en2ru':'ru2en';
    app.innerHTML=studyTop('Learn',Math.min(100,gained/target*100),'mastered '+gained+'/'+target);
    const q=mkQ(pool,w,kind,dir);
    renderQ($('#qb'),q,{feedback:true,onDone:ok=>{
      const before=lvl(w);
      if(review){B[w.id]=ok?Math.min(3,before+1):Math.max(0,before-1);}
      else{const r=award(w,ok);save();if(ok&&r==='arch')toast('“'+w.en+'” → Archive ✓');}
      const after=lvl(w);
      if(ok){gained+=Math.max(0,after-before);
        if(after<3)queue.splice(Math.min(queue.length,3+(Math.random()*3|0)),0,w);}
      else queue.splice(Math.min(queue.length,2),0,w);
      next();
    }});
  }
  next();
}

function beginTest(review){
  const kinds=[$('#k1').classList.contains('on')&&'mc',$('#k2').classList.contains('on')&&'type',$('#k3').classList.contains('on')&&'tf'].filter(Boolean);
  if(!kinds.length)return toast('Pick at least one type');
  const n=+$('#tn').value;closeSheet();runTest(shuffle(poolNow()).slice(0,n),kinds,review);
}
function runTest(words,kinds,review){
  const pool=poolNow(),app=$('#app');
  const qs=words.map(w=>mkQ(pool,w,kinds[Math.random()*kinds.length|0],'ru2en'));
  const total=qs.length;
  const ans=qs.map(q=>q.type==='type'?'':null);
  let i=0;
  const answered=ix=>{const q=qs[ix];return q.type==='type'?(ans[ix]||'').trim()!=='':ans[ix]!==null;};
  const countAns=()=>{let n=0;for(let k=0;k<total;k++)if(answered(k))n++;return n;};
  function go2(nx){if(nx<0||nx>=total)return;i=nx;draw();}
  function finishTest(){const blanks=total-countAns();if(blanks&&!confirm(blanks+(blanks===1?' question is':' questions are')+' still blank. Finish anyway?'))return;result();}
  function draw(){
    const q=qs[i],en2ru=q.dir==='en2ru',prompt=en2ru?q.w.en:q.w.ru;
    const lbl=q.type==='tf'?'Is this a correct match?':q.type==='type'?(en2ru?'Type the translation':'Type in English'):(en2ru?'Choose the translation':'Choose the word');
    const ca=countAns();
    const dots=qs.map((_,ix)=>`<button class="qdot ${answered(ix)?'on':''} ${ix===i?'cur':''}" data-ix="${ix}">${ix+1}</button>`).join('');
    let h=hdr('Test',"if(confirm('Exit this session?'))render()")+
      `<div class="topbar"><div class="pbar"><i style="width:${ca/total*100}%"></i></div><span class="stat">${ca}/${total}</span></div>`+
      `<div class="qpal">${dots}</div>`+
      `<div class="card" style="min-height:min(30vh,180px)"><div class="lbl">${lbl}</div>
        <div class="word">${esc(prompt)}</div>${q.type==='tf'?`<div class="word" style="font-size:24px;color:var(--mut);margin-top:10px">= ${esc(q.shown)}</div>`:''}</div>`;
    if(q.type==='mc')h+=`<div style="margin-top:14px">${q.opts.map((x,k)=>`<button class="opt ${ans[i]===k?'pick':''}" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>`;
    if(q.type==='tf')h+=`<div class="row2" style="margin-top:14px"><button class="btn ${ans[i]===true?'selp':''}" data-tf="1">✓ True</button><button class="btn ${ans[i]===false?'selp':''}" data-tf="0">✗ False</button></div>`;
    if(q.type==='type')h+=`<div style="margin-top:14px"><input class="inp" id="ta" placeholder="Answer" value="${esc(ans[i]||'')}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div>`;
    h+=`<div style="height:14px"></div><div class="row2">
      <button class="btn ghost" id="tback" ${i===0?'disabled':''}>← Back</button>
      ${i<total-1?`<button class="btn pri" id="tnext">Next →</button>`:`<button class="btn pri tfinbtn">Finish ✓</button>`}</div>
      ${i<total-1?`<div style="height:9px"></div><button class="btn ghost tfinbtn" style="color:var(--mut)">Finish test</button>`:''}`;
    app.innerHTML=h;
    $$('.qdot').forEach(b=>b.onclick=()=>go2(+b.dataset.ix));
    if(q.type==='mc')$$('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;draw();});
    if(q.type==='tf')$$('[data-tf]').forEach(b=>b.onclick=()=>{ans[i]=(b.dataset.tf==='1');draw();});
    if(q.type==='type'){const ta=$('#ta');if(ta){ta.oninput=()=>{ans[i]=ta.value;};ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&i<total-1)go2(i+1);});setTimeout(()=>ta.isConnected&&ta.focus(),40);}}
    const bk=$('#tback');if(bk)bk.onclick=()=>go2(i-1);
    const nx=$('#tnext');if(nx)nx.onclick=()=>go2(i+1);
    $$('.tfinbtn').forEach(b=>b.onclick=finishTest);
  }
  function result(){
    const res=qs.map((q,ix)=>{
      const en2ru=q.dir==='en2ru',answer=en2ru?q.w.ru:q.w.en;let ok,given;
      if(q.type==='mc'){const k=ans[ix];ok=k!=null&&q.opts[k].c;given=k!=null?q.opts[k].t:'';}
      else if(q.type==='tf'){ok=ans[ix]!=null&&ans[ix]===q.isTrue;given=ans[ix]==null?'':(ans[ix]?'True':'False');}
      else{const v=(ans[ix]||'').trim();ok=v!==''&&okAns(v,answer,en2ru);given=v;}
      const correct=q.type==='tf'?(q.isTrue?'True':'False'):answer;
      return {w:q.w,ok,given,correct};
    });
    if(!review){res.forEach(r=>award(r.w,r.ok));save();}
    const good=res.filter(r=>r.ok).length,pct=Math.round(good/res.length*100),bad=res.filter(r=>!r.ok);
    const toArch=res.filter(r=>r.ok&&r.w.arch).length;
    app.innerHTML=hdr('Result',"render()")+
      scoreHero(pct,`${good} of ${res.length} correct${!review&&toArch?` · ${toArch} moved to Archive`:''}`)+
      `<div style="height:8px"></div>`+
      (bad.length?`<div class="subhead"><span class="t">Mistakes — ${bad.length}</span></div>`+
        bad.map(r=>`<div class="item" style="display:block;padding:13px 15px">
          <div style="display:flex;align-items:center;gap:13px">
            <div class="t" style="flex:1"><div class="en">${esc(r.w.en)}</div><div class="ru">${esc(r.w.ru)}</div></div>
            <button class="spk" onclick="speak('${q1(r.w.en)}')">🔊</button></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
            <span class="ans-bad">✗ ${r.given?esc(r.given):'no answer'}</span>
            <span class="ans-ok">✓ ${esc(r.correct||r.w.en)}</span></div></div>`).join('')+
        `<div style="height:10px"></div><button class="btn pri" id="rt">Retry mistakes</button><div style="height:9px"></div>`:'')+
      `<button class="btn ghost" onclick="render()">Close</button>`;
    if(bad.length)$('#rt').onclick=()=>runTest(shuffle(bad.map(r=>r.w)),kinds,review);
    if(pct>=60)confetti(pct>=90?160:120);
  }
  draw();
}

/* ---------- match ---------- */
function startMatch(){
  const pool=poolNow();if(pool.length<3)return toast('Need at least 3 words');
  const ws=shuffle(pool).slice(0,6);
  const tiles=shuffle(ws.flatMap(w=>[{id:w.id,t:w.en},{id:w.id,t:w.ru}]));
  let sel=null,left=ws.length,t0=Date.now(),miss=0;const app=$('#app');
  app.innerHTML=hdr('Match',"render()",`<span class="stat" id="tm" style="font-size:16px;min-width:64px">0.0s</span>`)+
    `<div class="hint" style="text-align:center;margin-bottom:12px">Match each word with its translation</div>
     <div class="tiles">${tiles.map((x,i)=>`<button class="tile" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>`;
  const iv=setInterval(()=>{const e=$('#tm');if(!e)return clearInterval(iv);e.textContent=((Date.now()-t0)/1000).toFixed(1)+'s';},100);
  app.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('done')||el===sel)return;
    const x=tiles[+el.dataset.i];
    if(!sel){sel=el;el.classList.add('sel');return;}
    const y=tiles[+sel.dataset.i];
    if(x.id===y.id){el.classList.add('done');sel.classList.add('done');sel=null;left--;
      if(!left){clearInterval(iv);const t=((Date.now()-t0)/1000).toFixed(1);
        app.innerHTML=hdr('Match',"render()")+
          `<div class="hero"><div class="hero-emoji">🎉</div><div class="big-pct" style="margin:6px 0 0">${t}s</div>
           <div class="hero-sub">Mistakes: ${miss}</div></div>
          <div style="height:14px"></div><button class="btn pri" onclick="startMatch()">Again</button><div style="height:9px"></div>
          <button class="btn ghost" onclick="render()">Close</button>`;
        confetti(miss===0?150:90);}}
    else{miss++;const a=sel;sel=null;a.classList.remove('sel');a.classList.add('no');el.classList.add('no');
      setTimeout(()=>{a.classList.remove('no');el.classList.remove('no');},380);}
  });
}

try{if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme:dark)');mq.addEventListener&&mq.addEventListener('change',()=>{if((S.settings.theme||'auto')==='auto')applyTheme();});}}catch(e){}

authInit();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudEnabled())cloudPull().then(render);});
setInterval(()=>{if(cloudEnabled()&&document.visibilityState==='visible')cloudPull();},150000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
