<style>
@font-face{font-family:Madefor;src:url(wixt-lat.woff2)format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Madefor;src:url(wixt-cyr.woff2)format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:MadeforD;src:url(wixd-lat.woff2)format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:MadeforD;src:url(wixd-cyr.woff2)format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{
  --bg:#f3f6fb; --surf:#ffffff; --surf2:#f2f6fd;
  --tx:#0f1a2e; --mut:#5a6885; --fade:#808ea9;
  --line:#e4eaf4; --line2:#d2dcec;
  --pri:#1f66ee; --pri-d:#1a56db; --pri-soft:#e9f0ff; --on-pri:#ffffff;
  --acc:#a8ccff; --acc-ink:#1a46a8; --mint:#9ed0ff;
  --grad:linear-gradient(135deg,#1a56db,#2f86f5 62%,#9ed0ff);
  --ok:#1b7a4d; --ok-soft:#e3f1e9; --bad:#c03a28; --bad-soft:#fae7e3;
  --warn:#a9700f; --info:#1f6f8b;
  --word:#0f1a2e; --card-bg:#1a46a8; --card-tx:#f4f8ff; --card-mut:#aec6ef;
  --sh-sm:0 1px 2px rgba(15,26,46,.05); --sh:0 10px 30px rgba(15,26,46,.10),0 2px 6px rgba(15,26,46,.05);
  --r:16px; --r-sm:12px;
  --ff:Madefor,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --ff-serif:MadeforD,Madefor,-apple-system,"SF Pro Display",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#070c17; --surf:#0f1726; --surf2:#141e32;
  --tx:#e8eefb; --mut:#94a3c0; --fade:#6d7d9c;
  --line:#1b2538; --line2:#27344b;
  --pri:#7db4ff; --pri-d:#aed2ff; --pri-soft:#15243f; --on-pri:#06142e;
  --acc:#b6d6ff; --acc-ink:#0b1d3f; --mint:#9ed0ff;
  --grad:linear-gradient(135deg,#2f86f5,#7db4ff 62%,#c6e2ff);
  --ok:#4ed39a; --ok-soft:#0d2a20; --bad:#ef8a76; --bad-soft:#2d1512;
  --word:#f2f6ff; --card-bg:#19356d; --card-tx:#f0f6ff; --card-mut:#a8c3ec;
  --sh-sm:0 1px 2px rgba(0,0,0,.35); --sh:0 14px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.i{display:block;flex:none}
.btn .i{margin-right:-1px}
.seg3 button,.seg button,.tabs2 button{display:flex;align-items:center;justify-content:center;gap:7px}
.flame .n{display:flex;align-items:center;gap:5px;justify-content:center}
.lnk{display:inline-flex;align-items:center;gap:6px}
.item .pips,.item .chk,.item .cbox{align-self:center}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
#app{max-width:680px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
::selection{background:rgba(47,111,237,.32);color:inherit}
:root[data-theme="dark"] ::selection{background:rgba(122,172,255,.55);color:#fff}
input::selection,textarea::selection{background:rgba(47,111,237,.32);color:inherit}
:root[data-theme="dark"] input::selection,:root[data-theme="dark"] textarea::selection{background:rgba(122,172,255,.55);color:#fff}

/* header */
header{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(var(--bg) 72%,transparent)}
header h1{flex:1;min-width:0;margin:0;font-family:var(--ff-serif);font-size:25px;font-weight:700;letter-spacing:-.025em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;flex:none;border-radius:11px;background:transparent;
  border:1px solid transparent;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ic:hover{color:var(--tx);background:var(--surf2)}
.ic{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.ic:active{transform:scale(.96);transition-duration:.12s}
.back{font-size:26px;font-weight:600;color:var(--pri)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:14px 18px;border-radius:var(--r-sm);background:var(--surf);
  border:1px solid var(--line2);font-weight:600;font-size:16px;letter-spacing:-.01em}
.btn{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .18s ease}
.btn:active{transform:scale(.988);transition-duration:.12s}
.btn.pri{background:var(--pri);color:var(--on-pri);border:1px solid transparent;font-weight:650}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line2)}
.btn.danger{color:var(--bad)}
.stack>*+*{margin-top:10px}


/* mode pills */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.modes .mcard{width:auto;padding:14px 5px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.modes .mcard .em{width:48px;height:48px;border-radius:15px;margin:0}
.modes .mcard b{font-size:13px;letter-spacing:-.015em}
.mcard{flex:none;width:113px;padding:13px 12px;border-radius:var(--r-sm);background:var(--surf);
  border:1px solid var(--line);text-align:left}
.mcard{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease}
.mcard:active{transform:scale(.978);transition-duration:.12s}
.mcard .em{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--pri-soft);color:var(--pri)}
.mcard b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.mcard small{color:var(--mut);font-size:11.5px;font-weight:500}
.mcard:hover .em{background:var(--pri-soft)}

/* list / dictionary */
.subhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px}
.subhead .t{font-size:13.5px;font-weight:600;color:var(--fade);letter-spacing:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:0 13px;margin-bottom:10px;box-shadow:var(--sh-sm)}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;color:var(--tx)}
.search svg{width:17px;height:17px;fill:var(--fade);flex:none}
.item{display:flex;align-items:center;gap:13px;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:8px}
.item{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease}
.item:active{background:var(--surf2);transform:scale(.995);transition-duration:.12s}
/* words read as one continuous list, the way a dictionary page does */
.wlist{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);overflow:hidden}
.wlist .item{background:none;border:0;border-radius:0;margin:0;box-shadow:none;
  border-bottom:1px solid var(--line);padding:13px 16px}
.wlist .item:last-child{border-bottom:0}
.wlist .item:active{background:var(--surf2);transform:none}
.wlist .item.pick{background:var(--pri-soft);box-shadow:inset 3px 0 0 var(--pri)}
.item .t{flex:1;min-width:0}
.item .en{font-family:var(--ff-serif);font-weight:700;font-size:17px;letter-spacing:-.005em;color:var(--word);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ru{color:var(--mut);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;align-items:flex-end;gap:3px;flex:none;height:16px}
.pip{width:4px;border-radius:2px;background:var(--line2)}
.pip:nth-child(1){height:7px}.pip:nth-child(2){height:11px}.pip:nth-child(3){height:15px}
.pip.on1,.pip.on2,.pip.on3{background:var(--pri)}
.pip.on1{opacity:.4}.pip.on2{opacity:.7}.pip.on3{opacity:1}
.numx{min-width:30px;height:24px;padding:0 5px;border-radius:7px;background:var(--line);color:var(--mut);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;
  font-variant-numeric:tabular-nums}
.rangebar{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:12px 14px;
  background:var(--surf);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-align:left}
.rangebar>span{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14.5px;flex:none}
.rangebar em{flex:1;font-style:normal;color:var(--mut);font-size:14px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rangebar.on{border-color:var(--pri);color:var(--pri)}
.rangebar.on em{color:var(--pri);font-weight:650}
.rangerow{display:flex;gap:10px}
.akword{text-align:center;padding:18px 10px 14px}
.akword .en{font-family:var(--ff-serif);font-weight:700;font-size:26px;color:var(--word)}
.akword .ru{color:var(--mut);font-size:16px;margin-top:5px}
.aklist{max-height:44vh;overflow:auto;margin:10px 0 14px}
.chk{width:24px;height:24px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none}
.spk{width:34px;height:34px;flex:none;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.spk{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.spk:active{background:var(--pri-soft);color:var(--pri);transform:scale(.95);transition-duration:.12s}

/* selection / bulk archive */
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px;min-height:24px}
.tbar .t{font-size:13.5px;font-weight:600;color:var(--fade);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{font-size:14.5px;font-weight:700;color:var(--pri);padding:5px 4px;flex:none;border-radius:9px}
.lnk:active{background:var(--pri-soft)}
.cbox{width:25px;height:25px;flex:none;border-radius:50%;border:2px solid var(--line2);background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;transition:.12s}
.cbox.on{background:var(--pri);border-color:var(--pri);transform:scale(1.06)}
.item.pick{border-color:var(--pri);background:var(--pri-soft)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(transparent,var(--bg) 34%);
  padding:20px 16px calc(14px + env(safe-area-inset-bottom))}
.selbar .in{max-width:680px;margin:0 auto}
.btn:disabled{opacity:.5;box-shadow:none}
.ans-bad,.ans-ok{font-size:14px;font-weight:650;padding:6px 12px;border-radius:11px;line-height:1.2}
.ans-bad{background:var(--bad-soft);color:var(--bad);font-family:var(--ff-serif);font-weight:600}
.ans-ok{background:var(--ok-soft);color:var(--ok);font-family:var(--ff-serif);font-weight:600}
/* test question palette */
.qpalbox{display:flex;align-items:flex-start;gap:8px;margin:0 0 12px}
.qpal{position:relative;flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:7px;max-height:79px;overflow:hidden;
  transition:max-height .3s cubic-bezier(.22,1,.36,1)}
.qpal.open{max-height:min(42vh,340px);overflow:auto}
.qpal::-webkit-scrollbar{display:none}
.qmore{flex:none;width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line2);
  background:var(--surf);color:var(--mut);font-size:15px;font-weight:800;line-height:1;
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.qmore:active{transform:scale(.95);transition-duration:.12s}
.qmore .n{font-size:11px;font-weight:700;display:block;margin-top:-2px}
.qdot{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:11px;border:1.5px solid var(--line2);background:var(--surf);color:var(--mut);font-weight:700;font-size:14.5px}
.qdot.on{border-color:var(--pri);color:var(--pri-d);background:var(--pri-soft)}
.qdot{transition:transform .2s cubic-bezier(.22,1,.36,1),background-color .18s ease,border-color .18s ease,color .18s ease}
.qdot:active{transform:scale(.95);transition-duration:.12s}
.qdot.cur{background:var(--pri);color:var(--on-pri);border-color:transparent}
.tq{scroll-margin-top:calc(70px + env(safe-area-inset-top));margin:0 0 30px;opacity:.6;transition:opacity .35s ease}
.tq.done{opacity:.82}.tq.cur,.tq:focus-within{opacity:1}
.tqfin{scroll-margin-top:calc(70px + env(safe-area-inset-top))}
.qn{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:8px;background:var(--pri-soft);color:var(--pri-d);font-size:12.5px;font-weight:800;margin-right:8px;letter-spacing:0;vertical-align:middle}
.tq.done .qn{background:var(--pri);color:var(--on-pri)}
.mqhead .qn{margin-right:8px}
.opt.pick{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.btn.selp{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.btn.tfy{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.btn.tfn{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700}
.btn.tfy.selp{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 16px rgba(27,122,77,.28)}
.btn.tfn.selp{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 6px 16px rgba(192,58,40,.28)}
.arch-ic{width:44px;height:44px;flex:none;border-radius:13px;background:var(--surf2);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.src{color:var(--fade);font-size:12.5px;font-weight:600}

/* account */
.ic{position:relative}
.tabs2{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--sh-sm);margin-bottom:14px}
.tabs2 button{flex:1;padding:10px 6px;border-radius:10px;font-weight:650;font-size:15px;color:var(--mut)}
.tabs2 button{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.tabs2 button.on{background:var(--pri);color:var(--on-pri)}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pri-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px;margin:4px 0 12px}
.codebox b{font-family:var(--ff-serif);font-size:30px;font-weight:700;letter-spacing:.1em;color:var(--pri)}
.roster{display:flex;align-items:center;gap:13px;background:var(--surf);box-shadow:var(--sh-sm);border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:9px}
.roster{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.roster:active{transform:scale(.995);transition-duration:.12s}
.roster .av{width:40px;height:40px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.roster .t{flex:1;min-width:0}
.roster .nm{font-weight:700;font-size:16px}
.roster .meta{color:var(--mut);font-size:13px}
.err{color:var(--bad);font-size:13.5px;font-weight:600;margin:2px 2px 8px;min-height:17px}

/* daily goal + review */
.daycard{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);
  border-radius:15px;padding:12px 15px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.daycard .t{flex:1;min-width:0}
.daycard .lbl{font-size:13.5px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.daycard .lbl b{font-family:var(--ff-serif);color:var(--tx);font-weight:700;font-size:14.5px}
.daycard .pbar{margin-top:7px}
.flame{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;min-width:40px}
.flame .n{font-family:var(--ff-serif);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1}
.flame .c{font-size:11px;color:var(--fade);font-weight:500}
.near{background:#fff4e0;color:#b45309}
:root[data-theme="dark"] .near{background:#3a2c10;color:#fbbf24}
.fb.near{background:#fff4e0;color:#b45309}
:root[data-theme="dark"] .fb.near{background:#3a2c10;color:#fbbf24}

/* set card on home */
.setcard{display:flex;align-items:center;gap:14px;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.setcard{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease,border-color .2s ease}
.setcard:active{transform:scale(.993);transition-duration:.12s}
.setcard .t{flex:1;min-width:0}
.setcard .nm{font-weight:750;font-size:18px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setcard .meta{color:var(--mut);font-size:13.5px;margin-top:2px}
.ring{flex:none}
.ring text{font-family:var(--ff-serif);font-weight:700}

/* empty */
.empty{text-align:center;color:var(--mut);padding:46px 24px}
.empty .big{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--surf);border:1px solid var(--line);color:var(--fade);display:flex;align-items:center;justify-content:center}
.empty b{display:block;color:var(--tx);font-size:18px;font-weight:700;margin-bottom:5px;letter-spacing:-.02em}
.empty p{margin:0;font-size:14.5px;line-height:1.5}

/* banner */
.banner{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:14px;font-size:14px;line-height:1.5;align-items:flex-start;color:var(--mut)}
.banner b{color:var(--tx)}
.banner .ib{color:var(--pri);flex:none;margin-top:1px}
.banner .x{margin-left:auto;font-size:18px;color:var(--pri);flex:none;padding:0 2px}
.banner b{font-weight:700}

/* fab */
.fab{position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:15;
  width:56px;height:56px;border-radius:18px;background:var(--pri);color:var(--on-pri);
  box-shadow:0 10px 26px rgba(14,59,44,.30);display:flex;align-items:center;justify-content:center;line-height:1}
.fab{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease}
.fab:active{transform:scale(.95);transition-duration:.12s}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;animation:fade .26s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(12px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes down{to{transform:translateY(14px);opacity:0}}
@keyframes fadeout{to{opacity:0}}
.sheet{width:100%;max-width:680px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
  animation:up .28s cubic-bezier(.33,1,.68,1);will-change:transform}
.scrim.closing{animation:fadeout .18s ease forwards;pointer-events:none}
.scrim.closing .sheet{animation:down .18s ease forwards}
.grip{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
.sheet h2{margin:0 0 14px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.field{margin-bottom:11px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 2px 7px}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--pri)}
textarea.inp{resize:vertical;line-height:1.5;min-height:120px;font-size:15px}
.row{display:flex;gap:9px;align-items:center}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.hint{color:var(--mut);font-size:13px;min-height:17px;margin:2px 2px 6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.chip{background:var(--pri-soft);color:var(--pri-d);border-radius:11px;padding:7px 13px;font-size:14px;font-weight:600}
.chip{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.chip:active{transform:scale(.97);transition-duration:.12s}
.chip small{font-size:12px;font-weight:500;opacity:.62;margin-left:6px}
.chip.on{background:var(--pri);color:var(--on-pri)}
.chip.on small{opacity:.85}
.chpos{flex:0 0 100%;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut,#7a869a);margin-top:4px}
.chpos:first-child{margin-top:0}
.chip.exs{font-weight:500;text-align:left;font-size:13.5px;max-width:100%}
.chip.exs small{display:block;margin:3px 0 0;font-size:12.5px;opacity:.7}
.exhint{flex:0 0 100%;font-size:12.5px;color:var(--mut,#7a869a)}
/* ---- texts / reader ---- */
.txsep{display:flex;align-items:center;gap:12px;margin:16px 0 12px;color:var(--fade);font-size:13px}
.txsep:before,.txsep:after{content:"";flex:1;height:1px;background:var(--line)}
.txprev{display:block;max-width:100%;max-height:200px;margin:0 auto 14px;border-radius:14px;border:1px solid var(--line);object-fit:contain;background:#fff}
.txbarw{height:8px;border-radius:99px;background:var(--surf2);border:1px solid var(--line);overflow:hidden}
.txbar{height:100%;width:3%;border-radius:99px;background:var(--grad);transition:width .35s cubic-bezier(.22,1,.36,1)}
.tdinfo{margin-top:12px;padding:14px 16px;border-radius:var(--r);background:var(--pri-soft);color:var(--pri-d);display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.45}
.tdinfo b{font-weight:750}
.tdinfo span{color:var(--mut)}
.tdinfo .lnk{align-self:flex-start;margin-top:6px;color:var(--pri-d);font-weight:650;font-size:14px}
.tdimgs{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.tdimgs img{width:100%;border-radius:12px;border:1px solid var(--line2);background:#fff}
.tdbody{min-height:260px;line-height:1.6;resize:none;overflow:hidden;font-size:16.5px}
.rdmeta{color:var(--mut);font-size:13px;margin:0 2px 16px}
.reader{font-family:var(--ff);font-size:var(--rd,19px);line-height:1.72;letter-spacing:0;padding:2px 1px 8px;-webkit-touch-callout:none;white-space:pre-line}
.reader.serif{font-family:Charter,"Iowan Old Style","Source Serif Pro",Georgia,"Times New Roman",serif}
.reader p{margin:0 0 1.05em}
.reader .rs{font-size:1.2em;line-height:1.3;margin:1.5em 0 .5em;font-weight:750;letter-spacing:-.02em}
.reader .w{border-radius:5px;padding:0 1px;margin:0 -1px;cursor:pointer;transition:background-color .15s;-webkit-user-select:none;user-select:none}
.reader .w:active{background:var(--pri-soft)}
.w.kn{text-decoration:underline dotted var(--pri) 2px;text-underline-offset:5px}
.w.lr{text-decoration:underline dotted var(--ok) 2px;text-underline-offset:5px}
.w.ad{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rdlegend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);font-size:12.5px;margin:18px 2px 8px;padding-top:14px;border-top:1px solid var(--line)}
.rdlegend i{font-style:normal;font-size:12.5px;padding:0 3px;pointer-events:none}
.reader .w.cur{background:var(--pri-soft);box-shadow:0 0 0 2px var(--pri-soft);border-radius:4px}
.rdpop{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:680px;margin:0 auto;background:var(--surf);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 36px rgba(0,0,0,.22),0 -1px 0 var(--line);padding:4px 14px 0;max-height:64vh;overflow-y:auto;
  animation:rdup .24s cubic-bezier(.22,1,.36,1)}
.rdpop.out{animation:rddn .17s ease forwards}
@keyframes rdup{from{transform:translateY(100%)}to{transform:none}}
@keyframes rddn{to{transform:translateY(100%)}}
.rpgrip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:5px auto 9px;position:relative}
.rpgrip::after{content:"";position:absolute;left:-30px;right:-30px;top:-12px;bottom:-12px}
.rp-top{display:flex;align-items:center;gap:6px}
.rdpop .rp-en{flex:1;min-width:0;height:42px;padding:0 12px;font-size:16px;font-weight:700;background:transparent;border-color:transparent;padding-left:2px}
.rdpop .rp-b{width:42px;height:42px;flex:none}
.rp-form{display:inline-block;margin:0 0 4px;padding:3px 10px;border-radius:9px;background:var(--surf2);color:var(--mut);font-size:12.5px}
.rp-form[hidden]{display:none}
.rp-form b{color:var(--tx);font-weight:650}
.rp-ru{display:flex;gap:8px;margin:2px 0 4px}
.rdpop .rp-ru .inp{flex:1;min-width:0;height:60px;font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--pri-d);background:var(--pri-soft);border-color:transparent;padding:0 14px}
.rdpop .rp-ru .rp-g{width:52px;height:60px}
.rdpop .rp-st{font-size:12px;margin:0 2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdpop .rp-chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 10px;padding:0 14px;scrollbar-width:none;align-items:center}
.rdpop .rp-chips::-webkit-scrollbar{display:none}
.rdpop .rp-chips .chip,.rdpop .rp-chips .chpos{flex:none;white-space:nowrap}
.rp-more{display:none;margin-bottom:6px}
.rdpop.more .rp-more{display:block}
.rp-act{display:flex;gap:8px;position:sticky;bottom:0;background:var(--surf);padding:8px 0 calc(12px + env(safe-area-inset-bottom))}
.rp-act .btn{height:48px;width:auto;margin:0}
.rp-act .btn.ghost{flex:none;padding:0 20px}
.rp-act .btn.pri{flex:1;min-width:0}
.rp-st[hidden]{display:none}
.lbadge{flex:none;margin-right:6px;padding:3px 9px;border-radius:9px;background:var(--pri-soft);color:var(--pri-d);font-size:12.5px;font-weight:700}
.lbadge.ok{background:var(--ok-soft);color:var(--ok)}
.libwords{border:1px solid var(--line);border-radius:16px;background:var(--surf);overflow:hidden;margin-top:6px}
.lw{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-top:1px solid var(--line);font-size:15px}
.lw:first-child{border-top:0}
.lw b{font-weight:650}
.lw span{color:var(--mut);text-align:right}
.rwstrip{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.pw{padding:6px 11px;border-radius:10px;background:var(--surf2);border:1px solid var(--line);font-size:14.5px;color:var(--tx);transition:background-color .15s,color .15s}
.pw.on{background:var(--pri);color:var(--on-pri);border-color:transparent;font-weight:650}
.pw.gap{background:none;border-color:transparent;color:var(--fade);padding:6px 2px}
.rwtr{font-size:13.5px;line-height:1.5;color:var(--mut);margin:6px 2px 0}
.rwru{display:block;margin-top:5px;color:var(--tx);opacity:.82;font-style:italic}
.rwdup{margin:0 0 10px;padding:10px 13px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:14px}
.chip.ctx{box-shadow:inset 0 0 0 1.5px var(--ok)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tdimgs[hidden]{display:none}
.rtitle{margin:6px 2px 6px;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.03em}
.rtitle.serif{font-family:Charter,"Iowan Old Style","Source Serif Pro",Georgia,"Times New Roman",serif}

.sel-opt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sel-opt button{padding:9px 13px;border-radius:11px;background:var(--surf);border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--mut)}
.sel-opt button{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .22s cubic-bezier(.22,1,.36,1)}
.sel-opt button:active{transform:scale(.975);transition-duration:.12s}
.sel-opt button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d)}
.toggle{display:flex;align-items:center;gap:10px;padding:12px 2px}
.toggle label{flex:1;font-weight:600;font-size:15px}
.sw{width:50px;height:30px;border-radius:16px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw.on{background:var(--pri)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:23px}

/* study */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .x{font-size:15px;font-weight:650;color:var(--mut)}
.pbar{flex:1;height:7px;background:var(--line2);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .3s ease-out}
.stat{font-size:14px;font-weight:700;color:var(--mut);flex:none;min-width:52px;text-align:right}
.fc{perspective:1200px;margin:12px 0}
.card{background:var(--card-bg);border:1px solid transparent;border-radius:22px;min-height:min(60vh,340px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:var(--sh)}
.card .word{font-family:var(--ff-serif);font-size:clamp(30px,8.4vw,44px);font-weight:700;letter-spacing:-.015em;line-height:1.12;color:var(--card-tx);overflow-wrap:anywhere;max-width:100%}
.card .ex{overflow-wrap:anywhere;font-size:16.5px;font-weight:450;color:var(--card-mut);margin-top:18px;line-height:1.45}
.card .tip{font-size:13.5px;color:var(--card-mut);opacity:.8;margin-top:20px;font-weight:450}
.card .lbl{font-size:13.5px;font-weight:500;color:var(--card-mut);margin-bottom:18px}
.opt{display:flex;align-items:center;width:100%;text-align:left;overflow-wrap:anywhere;background:var(--surf);border:1.5px solid var(--line2);
  border-radius:15px;padding:16px 17px;margin-bottom:10px;font-size:17px;font-weight:600;box-shadow:var(--sh-sm);
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,color .18s ease}
.opt:active{transform:scale(.995);transition-duration:.12s}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{padding:15px;border-radius:15px;margin:12px 0;font-weight:700;font-size:16px;line-height:1.4}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:500;margin-top:5px;opacity:.85}
.big-pct{text-align:center;font-size:58px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:14px 0 2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:72px;padding:10px;border-radius:16px;background:var(--surf);border:1.5px solid var(--line2);
  box-shadow:var(--sh-sm);font-weight:650;font-size:15.5px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
.tile{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,opacity .3s ease}
.tile:active{transform:scale(.98);transition-duration:.12s}
.tile.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.tile.done{opacity:0;pointer-events:none;transform:scale(.8);transition:.3s}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:#15171f;color:#fff;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:600;z-index:60;
  opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
:root[data-theme="dark"] #toast{background:#2a2e3d}

/* theme segmented control */
.seg3{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:4px;box-shadow:var(--sh-sm)}
.seg3 button{flex:1;padding:10px 6px;border-radius:9px;font-weight:650;font-size:14.5px;color:var(--mut)}
.seg3 button{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.seg3 button.on{background:var(--pri);color:var(--on-pri)}

/* result hero + score ring */
.hero{text-align:center;padding:14px 0 6px}
.hero-ic{width:62px;height:62px;margin:0 auto;border-radius:20px;background:var(--pri-soft);color:var(--pri);
  display:flex;align-items:center;justify-content:center;animation:pop .34s ease-out both}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes viewin{from{opacity:.4}to{opacity:1}}
.viewin{animation:viewin .22s ease-out}
/* top loading pill: slides down from above, never replaces content */
#tload{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:60;display:flex;align-items:center;gap:8px;
  padding:8px 15px 8px 12px;border-radius:99px;background:var(--surf);color:var(--mut);font-size:13px;font-weight:650;
  border:1px solid var(--line);box-shadow:0 8px 22px rgba(10,12,20,.14);pointer-events:none;
  transform:translate(-50%,-70px);opacity:0;transition:transform .42s cubic-bezier(.34,1.3,.64,1),opacity .25s ease}
#tload.on{transform:translate(-50%,0);opacity:1}
#tload i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--pri);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* list entrance: items glide in one after another */
@keyframes itemin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{animation:itemin .38s cubic-bezier(.33,1,.68,1) both}
.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}
.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(6){animation-delay:.2s}.stag>*:nth-child(n+7){animation-delay:.24s}
/* skeleton placeholders */
.skel{height:68px;border-radius:15px;margin-bottom:9px;background:linear-gradient(100deg,var(--line) 30%,var(--line2) 50%,var(--line) 70%);
  background-size:220% 100%;animation:shim 1.3s ease-in-out infinite;opacity:.7}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
@keyframes flipout{from{transform:rotateY(0)}to{transform:rotateY(90deg)}}
@keyframes flipin{from{transform:rotateY(-90deg)}to{transform:rotateY(0)}}
.card.fout{animation:flipout .19s cubic-bezier(.4,0,.8,.45) forwards}
.card.fin{animation:flipin .25s cubic-bezier(.2,.65,.3,1)}
.fc .card{transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}
.hero-title{font-size:27px;font-weight:800;letter-spacing:-.025em;margin-top:8px}
.hero-sub{color:var(--mut);font-size:16px;margin-top:5px;font-weight:500}
.ring-big{display:block;margin:6px auto 2px}
.rb-track{fill:none;stroke:var(--line2);stroke-width:13}
.rb-fill{fill:none;stroke:url(#gbig);stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--off);animation:ringfill 1.15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
.rb-pct{font-family:var(--ff-serif);font-size:40px;font-weight:700;fill:var(--tx);letter-spacing:-.01em}
:root[data-theme="dark"] #g stop:first-child,:root[data-theme="dark"] #gbig stop:first-child{stop-color:#2f7d4f}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* bottom navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:2px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:var(--surf);border-top:1px solid var(--line)}
.tab{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 4px;border-radius:12px;color:var(--fade);font-size:11.5px;font-weight:600;
  transition:color .18s ease,background-color .18s ease}
.tab.on{color:var(--pri)}
:root{--m1:#e5484d;--m2:#f0902f;--m3:#e6bd1f;--m4:#30a46c;--m5:#3b82f6;--m6:#9b5de5}
.item[data-m]{box-shadow:inset 4px 0 0 var(--mc);background:color-mix(in srgb,var(--mc) 11%,transparent)}
.wlist .item[data-m]{box-shadow:inset 4px 0 0 var(--mc);background:color-mix(in srgb,var(--mc) 11%,transparent)}
.item[data-m="1"],.msw[data-m="1"]{--mc:var(--m1)}.item[data-m="2"],.msw[data-m="2"]{--mc:var(--m2)}.item[data-m="3"],.msw[data-m="3"]{--mc:var(--m3)}
.item[data-m="4"],.msw[data-m="4"]{--mc:var(--m4)}.item[data-m="5"],.msw[data-m="5"]{--mc:var(--m5)}.item[data-m="6"],.msw[data-m="6"]{--mc:var(--m6)}
.mrow{display:flex;gap:11px;flex-wrap:wrap;padding:4px 0 2px}
.msw{width:34px;height:34px;border-radius:50%;background:var(--mc,transparent);border:3px solid transparent;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .18s ease}
.msw.none{border:2px dashed var(--line2);background:none;color:var(--fade);font-size:15px;display:flex;align-items:center;justify-content:center}
.msw.on{border-color:var(--tx);transform:scale(1.12)}
.msw:active{transform:scale(.92)}
.markbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(transparent,var(--bg) 30%);padding:22px 16px calc(14px + env(safe-area-inset-bottom))}
.markbar .in{max-width:680px;margin:0 auto;background:var(--surf);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(10,12,20,.16);padding:12px 14px;display:flex;align-items:center;gap:12px;animation:up .3s cubic-bezier(.33,1,.68,1)}
.markbar .mrow{flex:1;padding:0;gap:9px;flex-wrap:nowrap;justify-content:space-between}
.markbar .msw{width:32px;height:32px;flex:none}
.markbar .btn{width:auto;padding:0 16px;height:44px;flex:none}
.markmode .item{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.markmode .fab{display:none}
.markhint{color:var(--mut);font-size:13.5px;margin:0 2px 8px}
.linkbtn{display:block;margin:-2px 0 8px auto;padding:6px 2px;color:var(--pri);font-size:14px;font-weight:650}
.tabs{transition:transform .38s cubic-bezier(.33,1,.68,1),opacity .3s ease;will-change:transform}
.tabs.hide{transform:translateY(105%);opacity:0;pointer-events:none}
.tab .ti{display:flex;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tab.on .ti{transform:translateY(-1px) scale(1.08)}
.tab:active .ti{transform:scale(.9)}
.tab:active{background:var(--surf2)}

/* today: the one thing to do */
.sess{background:var(--card-bg);color:var(--card-tx);border-radius:20px;padding:28px 20px 20px;text-align:center;margin-bottom:14px}
.sess-n{font-family:var(--ff-serif);font-size:60px;line-height:1;font-weight:700;color:var(--acc);letter-spacing:-.02em}
.sess-t{color:var(--card-mut);font-size:15px;margin-top:8px}
.sess .btn{margin-top:20px;background:#ffffff;color:var(--card-bg);border-color:transparent;font-weight:700}
.sess .btn:active{background:#eef4ff}
.sess-m{color:var(--card-mut);font-size:13.5px;margin-top:13px;min-height:18px}
.sess.done{padding:26px 20px 20px}
.sess.done .btn{background:transparent;color:var(--card-tx);border:1px solid rgba(255,255,255,.22)}
.sess-ic{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:rgba(255,255,255,.08);
  color:var(--acc);display:flex;align-items:center;justify-content:center}
.sess.done .sess-t{color:var(--card-tx);font-size:19px;font-weight:650}

/* a settings-style row that leads somewhere */
.resumebar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.resumebar .rowlink{margin:0;flex:1}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 15px;margin-bottom:8px;font-size:15.5px;font-weight:600;color:var(--tx);
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.rowlink:active{transform:scale(.995);transition-duration:.12s;background:var(--surf2)}
.rowlink>span{display:flex;align-items:center;gap:11px;min-width:0}
.rowlink>span .i{color:var(--mut)}
.rowlink em{font-style:normal;color:var(--mut);font-weight:500;font-size:14px;flex:none}
.rowlink .i:last-child{color:var(--fade)}


/* modes live in one sheet now */
.modes-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modes-grid .mcard{width:auto}

/* bigger, fuller desktop layout */
@media(min-width:720px){
  body{font-size:17.5px}
  #app{max-width:780px;padding:0 24px}
  header h1{font-size:32px}
  .ic{width:46px;height:46px;font-size:21px}
  .btn{font-size:17px;padding:16px 20px}
  .setcard{padding:20px}.setcard .nm{font-size:21px}.setcard .meta{font-size:15px}
  .item{padding:15px 18px}.item .en{font-size:18.5px}.item .ru{font-size:16px}
  .wlist .item{padding:15px 19px}
  .mcard{width:120px;padding:17px 14px}.mcard b{font-size:16px}.mcard small{font-size:12.5px}
  .modes{gap:11px}.modes .mcard{padding:17px 6px 15px}.modes .mcard .em{width:58px;height:58px;border-radius:18px}.modes .mcard b{font-size:15px}
  .card .word{font-size:clamp(36px,4.6vw,50px)}
  .opt{font-size:18px;padding:18px 19px}
  .hero-title{font-size:32px}.hero-sub{font-size:17px}
  .rb-pct{font-size:46px}
  .subhead .t{font-size:14px}
  .tab{font-size:12.5px}
  .sess-n{font-size:66px}
}

/* ---- edit in the list: hover actions, inline fields, drag ---- */
.item{position:relative}
.racts{display:none;gap:2px;flex:none}
.ra{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--fade);display:flex;align-items:center;justify-content:center;padding:0;flex:none;font:inherit;font-size:12.5px;font-weight:700}
.ra:hover{background:var(--surf2);color:var(--pri)}
.ra.del:hover{background:var(--bad-soft);color:var(--bad)}
.ra.del.sure,.ra.del.sure:hover{background:var(--bad);color:#fff;width:auto;padding:0 11px;white-space:nowrap}
.dgrip{display:none;position:absolute;left:0;top:0;bottom:0;width:26px;align-items:center;justify-content:center;color:var(--fade);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dgrip svg{width:15px;height:15px}
.dgrip:hover{color:var(--pri)}
.item.editing{background:var(--surf2);cursor:default}
.inl{display:block;width:100%;border:1px solid var(--line2);background:var(--surf);color:var(--tx);border-radius:9px;padding:6px 10px;font:inherit;outline:none;min-width:0}
.inl.en{font-family:var(--ff-serif);font-weight:700;font-size:17px;margin-bottom:5px}
.inl.ru{font-size:16px}
.inl:focus{border-color:var(--pri)}
.item.dragging{z-index:6;background:var(--surf);transition:none!important;box-shadow:0 10px 28px rgba(0,0,0,.2);cursor:grabbing;border-radius:10px}
.dnding,.dnding *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
@media (hover:hover) and (pointer:fine){
  .racts{display:flex;position:absolute;right:58px;top:50%;transform:translateY(-50%);padding-left:22px;opacity:0;pointer-events:none;
    background:linear-gradient(to right,transparent,var(--surf) 20px);transition:opacity .15s ease}
  .item:hover .racts,.item.editing .racts,.item:focus-within .racts{opacity:1;pointer-events:auto}
  .item.editing .racts{display:none}
  .item:hover .dgrip{display:flex}
  .wlist .item[data-m]:hover .racts{background:linear-gradient(to right,transparent,var(--surf) 20px)}
}
.swact{display:none}
@media (hover:none),(pointer:coarse){
  .item[data-id]{touch-action:pan-y}
  .item[data-dr]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .swact{display:flex;position:absolute;left:100%;top:0;bottom:0;width:160px}
  .swact button{flex:1;border:0;padding:0;font:inherit;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff}
  .swact .e{background:var(--pri);color:var(--on-pri)}
  .swact .d{background:var(--bad);color:var(--on-pri)}
  .item.swiped{transform:translateX(-160px)}
  .wlist .item.swiped:active{transform:translateX(-160px)}
}

html[data-bg="aurora"] body::before,html[data-bg="milky"] body::before,html[data-bg="city"] body::before,html[data-bg="aurora"] body::after,html[data-bg="city"] body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
html[data-bg="aurora"] body::before,html[data-bg="milky"] body::before,html[data-bg="city"] body::before{inset:0}
html[data-bg="aurora"] body::before{background:var(--nbg-aurora-base)}
html[data-bg="aurora"] body::after{inset:-10% -10% 30% -10%;background:var(--nbg-aurora);filter:blur(18px);opacity:.9;animation:aurm 16s ease-in-out infinite alternate}
@keyframes aurm{from{transform:translateX(-4%) skewX(-2deg);opacity:.65}to{transform:translateX(4%) skewX(2deg);opacity:1}}
html[data-bg="milky"] body::before{background:var(--nbg-milky)}
html[data-bg="city"] body::before{background:var(--nbg-city-sky)}
html[data-bg="city"] body::after{left:0;right:0;bottom:56px;height:clamp(150px,52vw,270px);background:var(--nbg-city) center bottom/cover no-repeat}
@media (prefers-reduced-motion:reduce){html[data-bg="aurora"] body::after{animation:none}}
html[data-bg]:not([data-bg="none"]):not([data-bg="stars"]) header{background:linear-gradient(color-mix(in srgb,var(--bg) 70%,transparent) 66%,transparent)}
html[data-bg]:not([data-bg="none"]):not([data-bg="stars"]) .selbar,html[data-bg]:not([data-bg="none"]):not([data-bg="stars"]) .markbar{background:linear-gradient(transparent,color-mix(in srgb,var(--surf) 88%,transparent) 36%)}
.bgsw .sw-aurora i{background:var(--nbg-aurora),linear-gradient(180deg,#050a16,#0a1b33)}
.bgsw .sw-milky i{background:var(--nbg-milky)}
.bgsw .sw-city i{background:var(--nbg-city) center bottom/100% auto no-repeat,var(--nbg-city-sky)}
.bgsw .sw-nstars i{background:var(--nbg-stars)}
.bgsw .sw-nnone i{background:#070c17}

/* bars that used a flat page colour become soft glass over a picture */
html[data-dbg]:not([data-dbg="none"]) header{background:linear-gradient(color-mix(in srgb,var(--bg) 62%,transparent) 66%,transparent)}
html[data-dbg]:not([data-dbg="none"]) .selbar,html[data-dbg]:not([data-dbg="none"]) .markbar{background:linear-gradient(transparent,color-mix(in srgb,var(--surf) 86%,transparent) 36%);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.bgsw{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.bgsw button{border:2px solid var(--line2);border-radius:14px;background:var(--surf);padding:5px 5px 7px;font:inherit;font-size:11.5px;font-weight:650;color:var(--mut);cursor:pointer;display:block;text-align:center;transition:border-color .18s,transform .18s}
.bgsw button:active{transform:scale(.97)}
.bgsw button i{display:block;height:58px;border-radius:9px;margin-bottom:6px;border:1px solid var(--line);background-color:#f3f6fb;overflow:hidden}
.bgsw button.on{border-color:var(--pri);color:var(--pri-d)}
.bgsw .sw-none i{background:#f3f6fb}.bgsw .sw-dawn i{background:var(--dbg-dawn)}.bgsw .sw-dots i{background:var(--dbg-dots)}.bgsw .sw-sea i{background:var(--dbg-sea)}

.card .word.sub{font-size:clamp(26px,7.2vw,38px);color:rgba(255,255,255,.8);margin-top:12px;font-weight:600}
@media (min-width:700px){.card .word.sub{font-size:clamp(30px,4vw,42px)}}
/* ===== v69: constellation, celebrations ===== */
:root{
  --cs-bg:linear-gradient(168deg,#c9deff 0%,#e6f0ff 46%,#fff3d9 100%);
  --cs-cardbg:linear-gradient(165deg,#e1ecff 0%,#f5f9ff 58%,#fff5df 100%);
  --cs-star:#1a56db; --cs-halo-c:#2f86f5; --cs-hot-c:#ffb400; --cs-hot:#ffb81c; --cs-hot-st:#e58a00;
  --cs-line:rgba(26,86,219,.52); --cs-line2:rgba(26,86,219,.16);
  --cs-miss:#b1bfda; --cs-lbl:#6b7ea3; --cs-lblon:#0f1a2e;
  --cs-tx:#0f1a2e; --cs-mut:#4a5d85; --cs-dot:#1a56db;
  --cs-card:#ffffff; --cs-cardst:#1a56db; --cs-g1:#1a56db; --cs-g2:#62adff;
  --cs-num:linear-gradient(180deg,#4a9aff 0%,#1a56db 55%,#0b3394 100%);
  --cs-cta:#1a56db; --cs-ctatx:#fff; --cs-ctash:#0f3c9c;
  --cs-glow:rgba(255,196,60,.5); --cs-ping:rgba(255,184,28,.55);
}
:root[data-theme="dark"]{
  --cs-bg:radial-gradient(110% 70% at 50% 108%,#17295a 0%,rgba(23,41,90,0) 60%),linear-gradient(180deg,#03060f 0%,#08112a 100%);
  --cs-cardbg:linear-gradient(180deg,#0a1226 0%,#101d3f 100%);
  --cs-star:#dfeaff; --cs-halo-c:#8fb4ff; --cs-hot-c:#cfe0ff; --cs-hot:#ffffff; --cs-hot-st:#bcd3ff;
  --cs-line:rgba(190,214,255,.55); --cs-line2:rgba(190,214,255,.16);
  --cs-miss:#5d6b88; --cs-lbl:rgba(255,255,255,.5); --cs-lblon:#ffffff;
  --cs-tx:#ffffff; --cs-mut:rgba(255,255,255,.68); --cs-dot:#ffffff;
  --cs-card:#141e32; --cs-cardst:#9fc0ff; --cs-g1:#7db4ff; --cs-g2:#e3efff;
  --cs-num:linear-gradient(180deg,#ffffff 8%,#cfe0ff 60%,#8fb4ff 100%);
  --cs-cta:#8fb4ff; --cs-ctatx:#071433; --cs-ctash:#4d74c7;
  --cs-glow:rgba(143,180,255,.35); --cs-ping:rgba(150,190,255,.5);
}
.fb,.nd{transform-box:fill-box;transform-origin:center}
.cs-s{fill:var(--cs-star)}
.cs-hot{fill:var(--cs-hot);stroke:var(--cs-hot-st);stroke-width:.9;stroke-linejoin:round}
.cs-ghost{fill:none;stroke:var(--cs-star);stroke-width:1.5;stroke-linejoin:round;stroke-dasharray:3 3;opacity:.8}
.cs-miss{fill:var(--cs-miss)}
.cs-fut{fill:none;stroke:var(--cs-miss);stroke-width:1.2;stroke-dasharray:2 2.4}
.cs-l{font-family:var(--ff-serif);font-weight:700;font-size:12px;text-anchor:middle;fill:var(--cs-lbl)}
.cs-l.now{fill:var(--cs-lblon)}
.cl{stroke:var(--cs-line2);stroke-width:1.4;stroke-linecap:round;fill:none}
.cl.on{stroke:var(--cs-line)}
.cs-arc-t{fill:none;stroke:var(--cs-line2);stroke-width:2.4}
.cs-arc{fill:none;stroke:var(--cs-hot);stroke-width:2.6;stroke-linecap:round}
.cs-ping{fill:none;stroke:var(--cs-hot);stroke-width:1.5}

/* ---------- Today: the streak card ---------- */
.cst-card{background:var(--cs-cardbg);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;margin-bottom:12px;color:var(--cs-tx);position:relative;overflow:hidden;box-shadow:var(--sh-sm)}
.cst-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cst-n b{display:block;font-family:var(--ff-serif);font-size:58px;line-height:.95;font-weight:800;letter-spacing:-.035em;background:var(--cs-num);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.cst-n span{display:block;font-size:14px;font-weight:600;color:var(--cs-mut);margin-top:4px}
.cst-goal{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--surf) 70%,transparent);border:1px solid var(--line2);color:var(--cs-tx);font:inherit;font-size:14px;cursor:pointer}
.cst-goal b{font-family:var(--ff-serif);font-weight:700;font-variant-numeric:tabular-nums}
.cst-goal .i{color:var(--cs-star)}
.cst-svg{display:block;width:100%;max-width:430px;height:auto;margin:2px auto;overflow:visible}
.cst-foot .pbar{margin-top:6px}
.cst-ft{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;font-weight:600;color:var(--cs-mut)}
.cst-card.met .cst-ft span:first-child{color:var(--cs-tx)}
.cst-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 80% 8%,rgba(255,200,80,.20),transparent 70%)}
:root[data-theme="dark"] .cst-card::before{background:radial-gradient(60% 50% at 80% 8%,rgba(143,180,255,.16),transparent 70%)}
@media (prefers-reduced-motion:no-preference){
  .cst-svg .nd{transform-box:fill-box;transform-origin:center;animation:cstIn .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*70ms)}
  .cst-svg .nd.done .cs-s{animation:cstTw 3.4s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.7s)}
  .cst-svg .nd.lit .cs-hot{transform-box:fill-box;transform-origin:center;animation:cstBeat 2.6s ease-in-out infinite alternate}
  .cst-svg .nd.today .cs-ping{transform-box:fill-box;transform-origin:center;animation:cstPing 2.6s ease-out infinite}
  .wsk{animation:cstIn .55s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*90ms + 120ms)}
}
@keyframes cstIn{from{opacity:0;transform:translateY(8px) scale(.5)}to{opacity:1;transform:none}}
@keyframes cstTw{from{opacity:1}to{opacity:.62}}
@keyframes cstBeat{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes cstPing{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(1.9)}}

/* the words under the streak */
.wsky{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:14px 14px 10px;margin-bottom:12px}
.wsky-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.wsky-h span{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.02em}
.wsky-h button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--pri);font:inherit;font-size:13px;font-weight:650;padding:4px 6px;border-radius:8px;cursor:pointer}
.wsky-h button:active{background:var(--pri-soft)}
.wsk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;font:inherit;color:inherit;padding:9px 4px;border-radius:12px;cursor:pointer;border-top:1px solid var(--line)}
.wsk:first-of-type{border-top:0}
.wsk:active{background:var(--surf2)}
.wsk-s{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri)}
.wsk-t{flex:1;min-width:0}
.wsk-t b{display:block;font-family:var(--ff-serif);font-size:19px;font-weight:700;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsk-t em{display:block;font-style:normal;color:var(--mut);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsk-p{flex:none;display:flex;gap:3px}
.wsk-p i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.wsk-p i.on{background:var(--cs-hot);box-shadow:0 0 6px var(--cs-hot-c)}

/* ---------- the streak overlay ---------- */
.celeb{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--cs-tx);overflow:hidden;touch-action:manipulation}
.cel-bg{position:absolute;inset:0;background:var(--cs-bg)}
.cel-sky{position:absolute;inset:0;width:100%;height:100%}
.cel-cloud{position:absolute;border-radius:50%;background:#fff;filter:blur(26px);opacity:.7}
:root[data-theme="dark"] .cel-cloud{display:none}
@media (prefers-reduced-motion:no-preference){
  .cel-cloud{animation:celDrift 26s ease-in-out infinite alternate}
}
@keyframes celDrift{from{transform:translateX(-26px)}to{transform:translateX(30px)}}
.cel-glow{position:absolute;left:50%;top:30%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(closest-side,var(--cs-glow),transparent);opacity:0;pointer-events:none}
.cel-col{position:relative;z-index:2;width:min(100%,430px);padding:0 22px 104px;display:flex;flex-direction:column;align-items:center}
.cel-hero{width:100%;max-width:380px}
.cel-hero svg{width:100%;height:auto;overflow:visible;display:block}
.cel-num{margin-top:8px;font-family:var(--ff-serif);font-weight:800;font-size:92px;line-height:1.04;height:1.04em;overflow:hidden;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cel-num .tr{display:flex;flex-direction:column}
.cel-num span{display:block;height:1.04em;background:var(--cs-num);-webkit-background-clip:text;background-clip:text;color:transparent}
.cel-lbl{font-family:var(--ff-serif);font-weight:700;font-size:19px;margin-top:2px;color:var(--cs-tx);opacity:.92}
.cel-hl{font-family:var(--ff-serif);font-weight:800;font-size:27px;letter-spacing:-.015em;margin-top:18px;line-height:1.15;text-wrap:balance}
.cel-hl i{font-style:normal;display:inline-block;will-change:transform}
.cel-sub{color:var(--cs-mut);font-size:15px;margin-top:8px;font-weight:500}
.cel-cta{position:absolute;left:0;right:0;margin:0 auto;width:min(calc(100% - 44px),420px);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:6}
.cel-cta button{width:100%;padding:16px;border:0;border-radius:16px;font-family:var(--ff-serif);font-weight:800;font-size:17px;letter-spacing:.03em;text-transform:uppercase;background:var(--cs-cta);color:var(--cs-ctatx);box-shadow:0 5px 0 var(--cs-ctash);cursor:pointer;transition:transform .1s,box-shadow .1s}
.cel-cta button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cs-ctash)}
.cel-cta button:focus-visible{outline:3px solid var(--cs-hot);outline-offset:3px}
.cel-cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
@media (max-height:660px){.cel-num{font-size:68px}.cel-hero{max-width:300px}.cel-hl{font-size:23px;margin-top:10px}}

/* ---------- finale heroes ---------- */
.chero{width:min(100%,260px);margin:0 auto;position:relative}
.chero svg{display:block;width:100%;height:auto;overflow:visible}
.k-test .chero{width:min(100%,214px)}
.k-session .chero{width:min(100%,280px)}
.ch-card{fill:var(--cs-card);stroke:var(--cs-cardst);stroke-width:1.6}
.ch-ln{fill:var(--cs-line)}
.ch-ln2{fill:var(--cs-line2)}
.ch-track{fill:none;stroke:var(--cs-line2)}
.ch-num{font-family:var(--ff-serif);font-weight:800;font-size:46px;fill:var(--tx);letter-spacing:-.03em;text-anchor:middle;font-variant-numeric:tabular-nums}
.ch-dot{fill:var(--surf);stroke:var(--cs-line);stroke-width:1.6}
.ch-dot-on{fill:var(--cs-hot);stroke:var(--cs-hot-st);stroke-width:1}
.ch-ground{fill:var(--cs-line2)}
.hero .big-pct{font-variant-numeric:tabular-nums}

/* ---------- test: matching question ---------- */
.mqhead{text-align:center;color:var(--mut);font-weight:600;font-size:14.5px;margin:6px 0 12px}
.mq{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
.mqi{display:flex;align-items:center;gap:7px;text-align:left;min-height:58px;padding:9px 8px;border-radius:14px;background:var(--surf);border:1.5px solid var(--line2);font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background-color .15s,transform .12s}
.mqi:active{transform:scale(.985)}
.mqi .bd{flex:none;min-width:24px;height:24px;padding:0 5px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--surf2);color:var(--mut)}
.mqi .tx{flex:1;min-width:0;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;font-family:var(--ff-serif);font-weight:650;font-size:15px;line-height:1.2}
.mqi .chip{flex:none;min-width:22px;height:22px;padding:0 5px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--pc);color:#fff}
.mqi.sel{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
.mqi.pair{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--surf))}
.mqi.pair .bd{background:var(--pc);color:#fff}

/* v96 · word frequency chip */
.fqc{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:7px;font-family:var(--ff);font-size:11.5px;font-weight:650;letter-spacing:.01em;line-height:1.35;vertical-align:2px;white-space:nowrap}
.fqc.b1{background:rgba(48,164,108,.14);color:#1b8150}.fqc.b2{background:rgba(59,130,246,.13);color:#2563eb}
.fqc.b3{background:rgba(155,93,229,.13);color:#7c3aed}.fqc.b4{background:rgba(240,144,47,.16);color:#b85f0c}
.fqc.b5{background:rgba(120,130,150,.15);color:#636c80}
[data-theme="dark"] .fqc.b1{background:rgba(74,222,150,.16);color:#6ee7b0}[data-theme="dark"] .fqc.b2{background:rgba(96,165,250,.17);color:#93c5fd}
[data-theme="dark"] .fqc.b3{background:rgba(192,132,252,.17);color:#d8b4fe}[data-theme="dark"] .fqc.b4{background:rgba(251,176,90,.17);color:#fdba74}
[data-theme="dark"] .fqc.b5{background:rgba(160,170,190,.16);color:#aeb6c6}
.fqline{display:flex;align-items:center;gap:10px;margin:-4px 2px 12px;color:var(--mut);font-size:13.5px;min-height:18px}
.fqline:empty{display:none}
.fqscale{display:flex;gap:3px;flex:none}.fqscale i{width:16px;height:5px;border-radius:3px;background:var(--line2)}.fqscale i.on{background:var(--pri)}
/* v96 · pairs that get mixed up */
.cfcard{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:15px 18px 6px;margin:14px 0}
.cfh{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-weight:650;font-size:14.5px;margin-bottom:4px}
.cfh button{background:none;border:0;padding:4px 0;color:var(--pri);font:inherit;font-weight:650;display:flex;align-items:center;gap:4px;cursor:pointer}
.cfp{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:var(--word,var(--tx));font-family:var(--ff-serif);font-size:17px;font-weight:700;text-align:left;cursor:pointer}
.cfp:first-of-type{border-top:0}
.cfp .vs{color:var(--fade);font-weight:500;font-family:var(--ff)}
.cfp .n{margin-left:auto;color:var(--fade);font-family:var(--ff);font-size:13px;font-weight:600;white-space:nowrap}
.cfcmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cfcmp .c{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.cfcmp .w{font-family:var(--ff-serif);font-size:23px;font-weight:750;margin-bottom:6px;overflow-wrap:anywhere;color:var(--word,var(--tx))}
.cfcmp .r{color:var(--mut);font-size:14.5px;line-height:1.38;overflow-wrap:anywhere}
.cfcmp .e{margin-top:12px;font-size:14.5px;line-height:1.42;overflow-wrap:anywhere}
.cfcmp .e u{text-decoration:none;background:var(--pri-soft);color:var(--pri-d);border-radius:5px;padding:0 3px;font-weight:650}
.cftip{color:var(--mut);font-size:14px;line-height:1.45;margin:4px 4px 16px}
.cftwo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cftwo .btn{height:64px;font-size:19px;font-weight:700;padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfnote{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14.5px;line-height:1.45;background:var(--bad-soft);color:var(--bad)}
.cfnote b{font-weight:750}
.ffnote{border-radius:14px;padding:10px 13px;margin-top:8px;font-size:14px;line-height:1.45;background:var(--bad-soft);color:var(--bad)}
.ffnote b{font-weight:750}
/* ---- v97: word formation ---- */
.wf-lv{display:flex;gap:8px;margin:14px 0 6px}
.wf-lv button{flex:1;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surf);color:var(--tx);font:inherit;cursor:pointer}
.wf-lv button b{font-size:15px;letter-spacing:-.01em}
.wf-lv button span{font-size:12px;color:var(--mut);line-height:1.25}
.wf-lv button.on{border-color:var(--pri);background:var(--pri-soft)}
.wf-lv button.on b{color:var(--pri-d)}
.wfcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px 16px 6px;margin-top:12px}
.wfcard h2{font-size:19px;font-weight:750;letter-spacing:-.02em;text-align:center;margin:2px 0 12px;color:var(--tx)}
.wfintro{font-size:17px;line-height:1.7;padding-bottom:10px;color:var(--tx)}
.wfr{display:grid;grid-template-columns:1fr auto;column-gap:12px;padding:11px 8px;margin:0 -8px;border-top:1px solid var(--line);border-radius:12px;transition:background .15s}
.wfr.cur{background:var(--pri-soft);border-top-color:transparent}
.wfx{font-size:17px;line-height:1.95;color:var(--tx)}
.wfb{display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;padding-top:5px;font-size:11.5px;font-weight:750;letter-spacing:.07em;color:var(--mut);word-break:keep-all}
.wfg{display:inline-block;white-space:nowrap;margin:0 2px;vertical-align:middle;line-height:1.5}
.wfg i{font-style:normal;font-size:11px;font-weight:700;color:var(--fade);vertical-align:middle;margin-right:4px}
.wfg input{display:inline-block;vertical-align:middle;font:inherit;font-size:17px;line-height:1.5;height:1.7em;color:var(--pri);font-weight:600;border:0;border-bottom:1.5px solid var(--line2);background:transparent;padding:0 2px;margin:0;border-radius:0;min-width:5.5ch;width:8ch;outline:none;-webkit-appearance:none;appearance:none;text-align:left;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.wfg input:focus{border-bottom:2px solid var(--pri)}
.wfg.blank input{border-bottom-color:var(--bad)}
.wfbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--surf);border-top:1px solid var(--line);font-size:14px;color:var(--mut);box-shadow:0 -4px 16px rgba(15,26,46,.06)}
.wfbar.on{display:flex}
.wfbar b{color:var(--pri)}
.wfbar button{border:0;background:transparent;color:var(--pri);font:inherit;font-weight:650;padding:8px 6px;cursor:pointer;min-width:46px}
.wfbar button:disabled{color:var(--fade);opacity:.5}
.wfbar .mid{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfres{font-size:17px;line-height:2;color:var(--tx)}
.wfa{text-transform:uppercase;letter-spacing:.03em;display:inline;white-space:normal;border-bottom:2px solid var(--ok);font-weight:650;color:var(--ok);padding:0 1px}
.wfa.bad{border-bottom-color:var(--bad);color:var(--bad)}
.wfa i{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;background:var(--ok);border-radius:8px;padding:1px 6px;margin-right:4px;vertical-align:2px}

const uiEn=()=>{try{return (S.settings.lang||'ru')==='en';}catch(e){return false;}};
function langInfo(c){return LANG_MAP[c]||LANG_MAP[DEF_LANG];}
function langName(c){const l=langInfo(c);return uiEn()?l.e:l.ru;}
/* inside brackets Russian reads better lowercase: “Слово (венгерский)” */
function langNameLc(c){const n=langName(c);return uiEn()?n:n.charAt(0).toLowerCase()+n.slice(1);}
/* “Напишите по-венгерски” / “Type in Hungarian” */
function langAdv(c){const l=langInfo(c);return uiEn()?('in '+l.e):l.adv;}

function langPrep(c){const l=langInfo(c);return uiEn()?('in '+l.e):(l.prep||l.ru);}
const setLangOf=s=>(s&&s.lang)||DEF_LANG;
/* a new list starts in the language of the last one you made */
function newSetLang(){
  try{const l=S.settings.lastLang;if(LANG_MAP[l])return l;}catch(e){}
  return DEF_LANG;
}
/* the languages that actually have a list, in the order the lists appear */
function langsUsed(){const seen=[];S.sets.forEach(s=>{const c=setLangOf(s);if(seen.indexOf(c)<0)seen.push(c);});return seen;}
const multiLang=()=>langsUsed().length>1;
/* word id → language of the list it sits in, rebuilt whenever the data changes */
let _lgIdx=null;
function lgIdx(){
  if(_lgIdx)return _lgIdx;
  const m=new Map();
  S.sets.forEach(s=>{const L=setLangOf(s);s.words.forEach(w=>m.set(w.id,L));});
  _lgIdx=m;return m;
}

/* ---------- what to study right now ---------- */
function buildSession(force){
  const goal=S.stats.goal||10, target=Math.max(6,goal);
  const dueAll=dueWords(),hardAll=hardWords();
  const langs=[...new Set(S.sets.flatMap(x=>x.words).map(langOf))];
  /* never mix languages: plan every language on its own, then take the one that needs attention most */
  const mk=lg=>{
    const only=w=>lg==null||langOf(w)===lg;
    const due=dueAll.filter(only);
    const seen=new Set(due.map(w=>w.id));
    const tricky=hardAll.filter(w=>!w.arch&&!seen.has(w.id)&&only(w)).slice(0,5);
    tricky.forEach(w=>seen.add(w.id));
    const pool=S.sets.flatMap(x=>active(x)).filter(w=>!seen.has(w.id)&&only(w))
      .sort((a,b)=>(a.box||0)-(b.box||0)||(a.upd||0)-(b.upd||0));
    const fresh=pool.slice(0,Math.max(0,target-due.length-tricky.length));
    const old=fresh.length?fresh.reduce((m,w)=>Math.min(m,w.upd||0),Infinity):Infinity;
    return {due,tricky,fresh,lg,old,words:[...due,...tricky,...fresh]};
  };
  let plan;
  if(langs.length<=1)plan=mk(langs[0]||null);
  else{
    const all=langs.map(mk);
    /* most due + tricky first; then the language practised longest ago */
    all.sort((a,b)=>(b.due.length+b.tricky.length)-(a.due.length+a.tricky.length)||(a.old-b.old));
    plan=all.find(x=>x.words.length)||all[0];
  }
  let words=plan.words;
  if(!words.length&&force){
    const lg=langs.length>1?langs[Math.floor(Math.random()*langs.length)]:null;
    words=shuffle(S.sets.flatMap(x=>x.words).filter(w=>lg==null||langOf(w)===lg)).slice(0,target);
  }
  return {due:plan.due,tricky:plan.tricky,fresh:plan.fresh,lg:plan.lg,words:shuffle(words)};
}

/* ---------- one adaptive session: the question fits the word ---------- */
function startSession(force){
  const plan=buildSession(force);

/* ---------- spaced repetition (archive) ---------- */
const DAY=864e5;
function srCfg(){return Object.assign({},DEF_SR,(S.settings&&S.settings.sr)||{});}

/* schedule an archived word for its next review */
function srSchedule(w,reset){

/* ---- FSRS (optional): a memory model per word instead of a fixed ladder.

const FS_W=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];

function fsrsState(w){

  const d=srDays();
  const iv=Math.max(1,d[Math.min(Math.max((w.rep||1)-1,0),d.length-1)]);
  w.fs=iv;w.fd=w.fd>0?w.fd:5.2;w.fl=(w.due||now)-iv*DAY;w.fx=w.due||0;

  else{

  if(c.onFail==='relearn'){w.arch=false;w.aat=0;w.box=1;w.rep=0;w.due=0;return 'relearn';}

const vScore=v=>{let s=0;const n=(v.name||'').toLowerCase();
  if(/\b(enhanced|premium|neural|natural)\b/.test(n))s+=70;
  if(/\b(siri|ava|allison|samantha|serena|daniel|kate|arthur|oliver|stephanie|aria|jenny|guy|libby|sonia|ryan|nicky|aaron)\b/.test(n))s+=42;
  if(/\bgoogle\b/.test(n))s+=34;
  if(/\b(compact|eloquence|fred|albert|zarvox|trinoids|whisper|novelty|bad|bells|boing|bubbles|cellos|wobble|superstar)\b/.test(n))s-=90;

/* the exact region if the device has it, otherwise any voice for the language */
function bestVoice(tag){

function speakOnline(txt,tag){
  try{

/* ---------- theme (day/night) ---------- */
function sunTimes(date,lat,lon){
  const rad=Math.PI/180,deg=180/Math.PI;

  const M=(357.5291+0.98560028*Js)%360;
  const C=1.9148*Math.sin(M*rad)+0.0200*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);

  }else if(rn===ln&&rn>0){                     /* same day on both — combine the progress */
    const set=new Set(l.ids||[]);let grew=false;
    (r.ids||[]).forEach(x=>{if(!set.has(x)){set.add(x);grew=true;}});
    if(grew){l.ids=[...set];ch=true;}
    if(r.met&&!l.met){l.met=true;ch=true;}
    const st=Math.max(l.streak||0,r.streak||0);
    if(st!==(l.streak||0)){l.streak=st;ch=true;}
  }
  if(r.goal&&(r.upd||0)>(l.upd||0)&&r.goal!==l.goal){l.goal=r.goal;ch=true;}
  /* pairs that get mixed up: each pair keeps whichever device changed it last */
  if(r.conf&&typeof r.conf==='object'){
    const lc=l.conf||(l.conf={});
    Object.keys(r.conf).forEach(k=>{const a=r.conf[k],b=lc[k];if(a&&typeof a==='object'&&(!b||(+a.u||0)>(+b.u||0))){lc[k]=Object.assign({},a);ch=true;}});
  }
  /* word formation: finished texts keep the later result; the chosen level follows the newer choice */
  if(r.wf&&typeof r.wf==='object'){
    const lw=wfSt();
    if(r.wf.d&&typeof r.wf.d==='object')Object.keys(r.wf.d).forEach(lv=>{const a=r.wf.d[lv];if(!a||typeof a!=='object')return;const b=lw.d[lv]||(lw.d[lv]={});
      Object.keys(a).forEach(i=>{const v=+a[i]||0;if(v>(+b[i]||0)){b[i]=v;ch=true;}});});
    if(r.wf.lv&&(+r.wf.u||0)>(+lw.u||0)&&r.wf.lv!==lw.lv){lw.lv=r.wf.lv;lw.u=+r.wf.u;ch=true;}
  }
  if(r.act&&typeof r.act==='object'&&!Array.isArray(r.act)){
    const la=actAll();
    Object.keys(r.act).forEach(k=>{const b=r.act[k];if(!Array.isArray(b))return;const a=la[k],b0=+b[0]||0,b1=+b[1]||0;
      if(!a){la[k]=[b0,b1];ch=true;}else if(b0>a[0]||b1>a[1]){a[0]=Math.max(a[0],b0);a[1]=Math.max(a[1],b1);ch=true;}});
  }
  if(r.asg&&typeof r.asg==='object'&&!Array.isArray(r.asg)){
    const la=asgRes();
    Object.keys(r.asg).forEach(k=>{
      if(!okId(k))return;const b=r.asg[k];if(!b||typeof b!=='object')return;const a=la[k];
      const bd=+b.d||0,ad=a?+a.d||0:0;
      const nb={b:Math.max(+b.b||0,a?+a.b||0:0),n:Math.max(+b.n||0,a?+a.n||0:0),d:(bd&&ad)?Math.min(bd,ad):(bd||ad),u:Math.max(+b.u||0,a?+a.u||0:0)};
      if(!a||nb.b!==a.b||nb.n!==a.n||nb.d!==a.d||nb.u!==a.u){la[k]=nb;ch=true;}
    });
  }
  if((l.best||0)<(l.streak||0)){l.best=l.streak;ch=true;}
  if(ch)l.upd=Math.max(l.upd||0,r.upd||0,Date.now());   /* re-sync the merged truth */
  return ch;
}

/* everything in settings EXCEPT the day/night theme (and the geo it uses) travels between devices */
function settingsBlob(){const s=S.settings;return {prov:s.prov,accent:s.accent,lang:s.lang,sr:s.sr,upd:s.upd||0};}
/* last-write-wins on the whole settings blob */
function mergeSettings(r){
  if(!r||typeof r!=='object')return false;
  if((r.upd||0)<=(S.settings.upd||0))return false;      /* ours is newer */
  let ch=false;
  ['prov','accent','lang'].forEach(k=>{if(r[k]!==undefined&&r[k]!==S.settings[k]){S.settings[k]=r[k];ch=true;}});
  if(r.sr&&typeof r.sr==='object'){S.settings.sr=Object.assign({},DEF_SR,r.sr);ch=true;}
  if(ch)S.settings.upd=r.upd;
  return ch;
}

async function pushPrefs(me){
  if(noPrefsSync)return;
  /* read-merge-write: never overwrite what another device has already saved */
  await pullPrefs(me,true);
  if(noPrefsSync)return;
  const patch={};
  if((S.stats.upd||0)>0||SEEN>0)patch.stats=statsBlob();
  if(!noSettingsCol&&(S.settings.upd||0)>0)patch.settings=settingsBlob();
  if(!Object.keys(patch).length)return;
  const run=()=>sb.from('profiles').update(patch).eq('id',me).select('id');
  let {data,error}=await run();
  /* a database that has stats but not the newer settings column — send stats alone */
  if(error&&('settings' in patch)&&colMissing(error)&&errText(error).indexOf('settings')>=0){
    noSettingsCol=true;delete patch.settings;
    if(Object.keys(patch).length)({data,error}=await run());
  }
  if(error){
    prefsErr=isJwtErr(error)?t('Your login expired — sign out and sign in again.'):(errText(error).slice(0,140)||'error');
    if(colMissing(error))noPrefsSync=true;
    return;
  }
  /* RLS hides a refused update: no error, just zero rows touched */
  if(!data||!data.length){prefsErr='no row updated (access rule missing)';return;}
  prefsErr='';
  if(patch.stats)statsSyncedUpd=S.stats.upd||0;
  if(patch.settings)settingsSyncedUpd=S.settings.upd||0;
}
async function pullPrefs(me,quiet){
  if(noPrefsSync)return;
  let {data,error}=await sb.from('profiles').select(noSettingsCol?'stats':'stats,settings').eq('id',me).maybeSingle();
  if(error&&!noSettingsCol&&colMissing(error)&&errText(error).indexOf('settings')>=0){
    noSettingsCol=true;({data,error}=await sb.from('profiles').select('stats').eq('id',me).maybeSingle());
  }
  if(error){prefsErr=errText(error).slice(0,140)||'error';if(colMissing(error))noPrefsSync=true;return;}
  let ch=false;
  if(data){if(data.stats&&mergeStats(data.stats))ch=true;if(data.settings&&mergeSettings(data.settings))ch=true;}
  if(ch)persist();
}
/* merge whatever the profile row already carried (called right after sign-in) */
function mergePrefsFrom(profile){
  if(!profile)return false;let ch=false;
  if(profile.stats&&mergeStats(profile.stats))ch=true;
  if(profile.settings&&mergeSettings(profile.settings))ch=true;
  return ch;
}

let _pushTimer=null;
