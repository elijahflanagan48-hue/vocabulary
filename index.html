});

/* put the dragged words into their new order: the new order takes the places the words held before,
   so only the words that actually moved are changed (and synced) */
function slotOrder(words,ids,getP,setP){
  const byId=new Map(words.map(w=>[w.id,w])),set=new Set(ids);
  const ws=ids.map(i=>byId.get(i)).filter(Boolean);
  const idx=[];words.forEach((w,i)=>{if(set.has(w.id))idx.push(i);});
  if(!idx.length||idx.length!==ws.length)return null;
  const oldPos=idx.map(i=>getP(words[i])||0);
  const arr=words.slice();idx.forEach((i,k)=>{arr[i]=ws[k];});
  let tie=false;
  for(let k=1;k<oldPos.length;k++)if(oldPos[k]<=oldPos[k-1])tie=true;
  const nx=words[idx[idx.length-1]+1];
  if(nx&&(getP(nx)||0)<=oldPos[oldPos.length-1])tie=true;
  const changed=[];
  if(!tie){idx.forEach((i,k)=>{if((getP(arr[i])||0)!==oldPos[k]){setP(arr[i],oldPos[k]);changed.push(arr[i]);}});}
  else{   /* equal positions can't express an order: number the rest of the list afresh */
    const from=idx[0],base=oldPos[0];
    for(let i=from;i<arr.length;i++){if((getP(arr[i])||0)!==base+(i-from)){setP(arr[i],base+(i-from));changed.push(arr[i]);}}
  }
  return {arr,changed};
}
function reorderSet(ids){
  const s=curSet();if(!s)return;
  const r=slotOrder(s.words,ids,w=>w.pos,(w,p)=>{w.pos=p;touch(w);});
  if(!r)return;
  s.words=r.arr;save();
}
/* the teacher moves words in a student's list: the new positions go straight to the database */
async function tReorder(ids){
  const base=TV.base||[],old=new Map(base.map(w=>[w.id,w.position]));
  const r=slotOrder(base,ids,w=>w.position,(w,p)=>{w.position=p;});
  if(!r||!r.changed.length)return;
  const now=new Date().toISOString();
  try{
    for(let i=0;i<r.changed.length;i+=8){
      await Promise.all(r.changed.slice(i,i+8).map(async w=>{
        const {error}=await sb.from('words').update({position:w.position,updated_at:now}).eq('id',w.id);
        if(error)throw error;
      }));
    }
  }catch(e){
    r.changed.forEach(w=>{w.position=old.get(w.id);});
    toast(srvMsg(e,t('Couldn’t save — check your connection')));
    const l=$('#tl');if(l)l._h='';tDrawWords(false);
  }
}
function dragUpdate(){
  if(!dnd)return;
  const {row,list}=dnd;
  const dy0=dnd.y+window.scrollY-dnd.startY;
  const center=dnd.top0+dy0+row.offsetHeight/2;
  let p=row.previousElementSibling;
  while(p&&p.classList.contains('item')&&center<p.offsetTop+p.offsetHeight/2){list.insertBefore(row,p);p=row.previousElementSibling;}
  let n=row.nextElementSibling;
  while(n&&n.classList.contains('item')&&center>n.offsetTop+n.offsetHeight/2){list.insertBefore(n,row);n=row.nextElementSibling;}
  row.style.transform='translateY('+(dy0+(dnd.top0-row.offsetTop))+'px)';
}
function dragLoop(){
  if(!dnd)return;
  const y=dnd.y,H=window.innerHeight,edge=90;
  let v=0;
  if(y<edge+40)v=-Math.min(18,(edge+40-y)/4);else if(y>H-edge)v=Math.min(18,(y-(H-edge))/4);
  if(v)window.scrollBy(0,v);
  dragUpdate();
  dnd.raf=requestAnimationFrame(dragLoop);
}
function dragEnd(commit){
  if(!dnd)return;
  const d=dnd;dnd=null;cancelAnimationFrame(d.raf);
  try{d.grip.releasePointerCapture(d.pid);}catch(x){}
  d.row.classList.remove('dragging');d.row.style.transform='';document.body.classList.remove('dnding');noClickUntil=Date.now()+400;swReset();
  const ids=[...d.list.children].filter(r=>r.classList&&r.classList.contains('item')).map(r=>r.dataset.id);
  const moved=ids.join()!==d.ids.join();
  if(commit&&moved){if(isTeacherList())tReorder(ids);else reorderSet(ids);}
  else if(moved){   /* cancelled: put the rows back where they were */
    const m=new Map([...d.list.children].map(r=>[r.dataset&&r.dataset.id,r]));
    d.ids.forEach(id=>{const r=m.get(id);if(r)d.list.appendChild(r);});
  }
  if(isTeacherList())tDrawWords(false);
  else{softMode=true;try{render();}finally{softMode=false;}}

}
function dragBegin(row,cap,e,y){
  if(inl)inlineCommit();
  const list=row.parentElement;
  dnd={row,list,grip:cap,pid:e.pointerId,y:y,startY:y+window.scrollY,top0:row.offsetTop,raf:0,
       ids:[...list.children].filter(r=>r.classList&&r.classList.contains('item')).map(r=>r.dataset.id)};
  try{cap.setPointerCapture(e.pointerId);}catch(x){}
  row.classList.add('dragging');document.body.classList.add('dnding');
  try{navigator.vibrate&&navigator.vibrate(10);}catch(x){}
  dnd.raf=requestAnimationFrame(dragLoop);
}
/* swipe a word sideways to reveal Edit / Delete; hold it still for a moment to pick it up and move it */
const SWW=160;
let SW=null,swOpen=null;
function swClose(){
  if(swOpen){swOpen.classList.remove('swiped');swOpen=null;}
}
function swReset(){if(SW){clearTimeout(SW.timer);SW=null;}}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('.dgrip');
  if(g){
    if(dnd||(e.pointerType==='mouse'&&e.button!==0))return;
    const row=g.closest('.item');if(!row)return;
    e.preventDefault();dragBegin(row,g,e,e.clientY);return;
  }
  if(e.pointerType==='mouse'||dnd||markMode||selMode||(typeof tSelMode!=='undefined'&&tSelMode))return;
  const row=e.target.closest&&e.target.closest('.item[data-id]');
  if(swOpen&&(!row||row!==swOpen)&&!(e.target.closest&&e.target.closest('.swact')))swClose();
  if(!row||inl||e.target.closest('.swact,.spk,.inl'))return;
  swReset();
  SW={row,pid:e.pointerId,x:e.clientX,y:e.clientY,cy:e.clientY,mode:'',base:row===swOpen?-SWW:0,dx:0,timer:0};
  if(row.dataset.dr&&row!==swOpen){
    SW.timer=setTimeout(()=>{
      if(!SW||SW.mode||dnd)return;
      SW.mode='drag';
      dragBegin(row,row,e,SW.cy);
    },420);
  }
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!SW||dnd||e.pointerId!==SW.pid)return;
  SW.cy=e.clientY;
  const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.mode){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){
      clearTimeout(SW.timer);SW.mode='swipe';SW.row.style.transition='none';
      try{SW.row.setPointerCapture(SW.pid);}catch(x){}
    }
    else if(Math.abs(dy)>8){swReset();return;}   /* the page is scrolling */
    else return;
  }
  if(SW.mode==='swipe'){
    SW.dx=Math.max(-SWW,Math.min(0,SW.base+dx));
    SW.row.style.transform='translateX('+SW.dx+'px)';
  }
},{passive:true});
function swEnd(cancel){
  if(!SW)return;
  const w=SW;swReset();
  if(w.mode==='swipe'){
    w.row.style.transition='';w.row.style.transform='';
    noClickUntil=Date.now()+350;
    const open=!cancel&&w.dx<-SWW/2;
    if(swOpen&&swOpen!==w.row)swClose();
    w.row.classList.toggle('swiped',open);
    swOpen=open?w.row:null;
  }
}
document.addEventListener('pointerup',e=>{if(SW&&e.pointerId===SW.pid)swEnd(false);},{passive:true});
document.addEventListener('pointercancel',e=>{if(SW&&e.pointerId===SW.pid)swEnd(true);},{passive:true});
document.addEventListener('contextmenu',e=>{if(dnd||(SW&&SW.mode==='drag'))e.preventDefault();});
/* once a word is picked up the finger must move the word, not the page */
document.addEventListener('touchmove',e=>{if(dnd&&e.cancelable)e.preventDefault();},{passive:false});
window.addEventListener('scroll',()=>{if(swOpen&&!SW)swClose();},{passive:true});
document.addEventListener('pointermove',e=>{if(dnd&&e.pointerId===dnd.pid){dnd.y=e.clientY;e.preventDefault();}});
document.addEventListener('pointerup',e=>{if(dnd&&e.pointerId===dnd.pid)dragEnd(true);});
document.addEventListener('pointercancel',e=>{if(dnd&&e.pointerId===dnd.pid)dragEnd(false);});
document.addEventListener('keydown',e=>{if(dnd&&e.key==='Escape')dragEnd(false);});

let markMode=false,markColor=1;

const markbarHtml=()=>markMode?`<div class="markbar"><div class="in"><div class="mrow" id="mbar"><button class="msw none ${markColor===0?'on':''}" data-m="0" aria-label="${t('No color')}" onclick="setMarkColor(0)">✕</button>`+
  Array.from({length:MARKS},(_,i)=>`<button class="msw ${markColor===i+1?'on':''}" data-m="${i+1}" aria-label="${t('Color')} ${i+1}" onclick="setMarkColor(${i+1})"></button>`).join('')+

function agoTxt(ts){
  if(!ts)return t('no activity yet');
  const d=Math.floor((Date.now()-ts)/DAY);
  if(d<=0)return t('active today');
  if(d===1)return t('active yesterday');
  if(d<7)return t('active')+' '+d+' '+plr(d,t('day'),t('day2'),t('days'))+' '+t('ago');
  if(d<30){const w=Math.round(d/7);return t('last seen')+' '+w+' '+plr(w,t('week'),t('week2'),t('weeks'))+' '+t('ago');}
  const mo=Math.round(d/30);return t('last seen')+' '+mo+' '+plr(mo,t('month'),t('month2'),t('months'))+' '+t('ago');
}
/* precise presence text: 'online now', '12 min ago', 'today at 14:32', 'yesterday at 09:05', … */
function seenTxt(ts){
  if(!ts)return t('no activity yet');
  const now=Date.now(),diff=now-ts,mn=Math.floor(diff/60000);
  const dt=new Date(ts),hm=dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
  if(mn<5)return t('online now');
  if(mn<60)return t('last seen')+' '+mn+' '+plr(mn,t('min'),t('min2'),t('mins'))+' '+t('ago');
  const day0=x=>{const d=new Date(x);d.setHours(0,0,0,0);return +d;};
  const dd=Math.round((day0(now)-day0(ts))/DAY);
  if(dd<=0)return t('last seen')+' '+t('today at')+' '+hm;
  if(dd===1)return t('last seen')+' '+t('yesterday at')+' '+hm;
  if(dd<7)return t('last seen')+' '+dd+' '+plr(dd,t('day'),t('day2'),t('days'))+' '+t('ago')+', '+hm;
  return agoTxt(ts);
}
function fmtDT(ts){

async function tDupDelete(){

      const {error}=await sb.from('words').update({deleted:true,updated_at:new Date().toISOString()}).in('id',ids.slice(i,i+100));
      if(error)throw error;

  if(!confirm(t('Delete this list and all its words from the student’s app?')+' “'+name+'”'+(keepN?'\n'+t('Learned words stay in the Archive.'):'')))return;
  try{
    const now=new Date().toISOString();

      const hid=await tHolderId(tSetLang(TV.setId));
      const m=await sb.from('words').update({set_id:hid,updated_at:now}).eq('set_id',TV.setId).eq('arch',true);
      if(m.error)throw m.error;
    }
    let r=await sb.from('words').update({deleted:true,updated_at:now}).eq('set_id',TV.setId);
    if(r.error)throw r.error;

async function tSaveWord(id){
  const en=($('#tEn').value||'').trim(),ru=($('#tRu').value||'').trim(),ex=($('#tEx').value||'').trim();
  const err=$('#tErr');
  if(!en){err.textContent=t('Enter a word');return;}
  const btn=$('#tSave');btn.disabled=true;btn.textContent=t('Saving…');
  const now=new Date().toISOString();
  try{
    if(id){
      const {error}=await sb.from('words').update({en,ru,ex,updated_at:now}).eq('id',id);
      if(error)throw error;
    }else{
      const toArch=TV.setId==='archive';
      if(toArch&&TV.words.some(x=>x.arch&&tSetLang(x.set_id)===tArchLg&&fold(x.en)===fold(en))){
        err.textContent='“'+en+'” '+t('is already in the Archive');btn.disabled=false;btn.textContent=t('Add');return;
      }
      let setId=TV.setId,extra={box:0,arch:false};
      if(toArch){
        setId=await tHolderId(tArchLg);
        const tmp={box:3,arch:true,due:0,rep:0};srStart(tmp);
        extra={box:3,arch:true,aat:Date.now(),due:tmp.due||0,rep:tmp.rep||0};
      }
      const row=Object.assign({id:uid(),set_id:setId,owner_id:TV.sid,en,ru,ex,
        ok:0,bad:0,position:posNow(),deleted:false,updated_at:now},extra);
      const {error}=await aatRetry(()=>sb.from('words').insert(withAat(row)));
      if(error)throw error;
      if(noAatCol)delete row.aat;
      /* keep the form open so a whole batch can be typed in one go */
      TV.words.push(row);tDrawWords();
      toast(t('Added ✓'));
      btn.disabled=false;btn.textContent=t('Add');
      ['tEn','tRu','tEx'].forEach(k=>{const e=$('#'+k);if(e)e.value='';});
      const ch=$('#tChips');if(ch)ch.innerHTML='';clearEx();
      const st=$('#tTrSt');if(st)st.textContent=t('Add the next word');
      ruTouched=false;const f=$('#tEn');if(f)f.focus();
      return;
    }
    closeSheet();toast(t('Saved ✓'));tBack();
  }catch(e){
    err.textContent=srvMsg(e,t('Couldn’t save — check your connection'));btn.disabled=false;btn.textContent=id?t('Save'):t('Add');
  }
}

/* say what the server actually refused, instead of blaming the connection */
function srvMsg(e,fallback){
  const code=(e&&e.code)||'', m=(e&&(e.message||e.error_description))||'';
  if(code==='42501'||/row-level security/i.test(m))return t('The database refused this. Open Supabase → SQL Editor and run the access-rule fix.');
  if(/Failed to fetch|NetworkError|offline/i.test(m)||!navigator.onLine)return fallback;
  return m?fallback+' — '+m:fallback;
}

/* ---------- sheets ---------- */
/* a backdrop closes its sheet only when the press AND the release both happen on it —
   dragging a text selection out of the sheet must never count as a tap outside */
function backdrop(d,fn){
  d._dn=false;
  d.addEventListener('pointerdown',e=>{d._dn=(e.target===d);},true);
  d.onclick=e=>{const ok=e.target===d&&d._dn;d._dn=false;if(ok)fn();};
}
function sheet(html){
  const ex=$('#scrim');
  if(ex&&!ex.classList.contains('closing')){      /* already open: swap the contents, don't replay the slide-up */
    const box=ex.querySelector('.sheet'),top=box.scrollTop,h0=box.offsetHeight;
    box.innerHTML=`<div class="grip"></div>${html}`;
    box.scrollTop=top;
    const h1=box.offsetHeight;
    if(Math.abs(h1-h0)>4){
      box.style.height=h0+'px';box.style.overflow='hidden';
      requestAnimationFrame(()=>{
        box.style.transition='height .26s cubic-bezier(.22,1,.36,1)';box.style.height=h1+'px';
        setTimeout(()=>{box.style.transition='';box.style.height='';box.style.overflow='';},280);
      });
    }
    return;
  }
  const d=document.createElement('div');d.className='scrim';d.id='scrim';
  backdrop(d,closeSheet);
  d.innerHTML=`<div class="sheet"><div class="grip"></div>${html}</div>`;
  document.body.appendChild(d);d.querySelector('.sheet').scrollTop=0;
}
function closeSheet(){
  const s=$('#scrim');if(!s)return;
  s.id='';s.classList.add('closing');                /* free the id at once so a new sheet can open */
  setTimeout(()=>s.remove(),190);
}

/* ---- example sentences: Tatoeba (with a Russian translation), then Wiktionary and the dictionary ---- */
const EXC={};
const TAT_FIX={no:'nob',zh:'cmn',fa:'pes',la:'lat'};
const tatCode=l=>TAT_FIX[l]||(typeof OCR_CODES!=='undefined'&&OCR_CODES[l])||null;
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* does the sentence really use the word (or one of its forms), not just contain it inside another word? */
function usesForm(sent,forms){
  const low=sent.toLowerCase();
  return forms.some(f=>{
    if(/\s/.test(f))return low.includes(f);
    return new RegExp('(^|[^\\p{L}])'+reEsc(f)+'(?:s|es|ed|d|ing|ly|er|est|ies|ied)?(?![\\p{L}])','u').test(low);
  });
}
async function getJson(url,ms){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms||7000);
  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)return null;return await r.json();}
  catch(e){return null;}
  finally{clearTimeout(tm);}
}
async function exTatoeba(q,lang,forms){
  const code=tatCode(lang);if(!code)return[];
  const j=await getJson('https://tatoeba.org/en/api_v0/search?from='+code+'&to=rus&query='+encodeURIComponent(q)+'&orphans=no&unapproved=no&sort=relevance');
  const out=[];
  ((j&&j.results)||[]).forEach(r=>{
    const x=String(r.text||'').trim();if(!x||x.length>120||!usesForm(x,forms))return;
    const tr=[].concat(...(r.translations||[])).filter(y=>y&&y.lang==='rus'&&y.text);
    const ru=(tr.find(y=>y.isDirect)||tr[0]||{}).text||'';
    out.push({en:x,ru,s:(ru?0:40)+Math.abs(x.length-60)/3});
  });
  return out.sort((a,b)=>a.s-b.s);
}
async function exWiki(q,forms){
  const j=await getJson('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(q));
  const out=[],strip=x=>String(x||'').replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
  ((j&&j.en)||[]).forEach(e=>(e.definitions||[]).forEach(d=>{
    [].concat(d.examples||[],(d.parsedExamples||[]).map(x=>x.example)).forEach(x=>{x=strip(x);if(x&&x.length>=12&&x.length<=120&&usesForm(x,forms))out.push({en:x,ru:'',s:50});});
  }));
  return out;
}
async function exDict(q,forms){
  const j=await getJson('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q));
  const out=[];
  (Array.isArray(j)?j:[]).forEach(en=>(en.meanings||[]).forEach(m=>(m.definitions||[]).forEach(d=>{
    const x=String(d.example||'').trim();if(x&&x.length<=120&&usesForm(x,forms))out.push({en:x,ru:'',s:55});
  })));
  return out;
}
/* up to three sentences: those with a Russian translation first */
async function fetchExamples(word,lang,irr){
  const q=String(word||'').toLowerCase().trim();if(!q)return{list:[],failed:false};
  const k=lang+'|'+q+(irr?'|'+irr.forms:'');if(k in EXC)return EXC[k];
  const forms=irr?irr.forms.split(' '):[q];
  const jobs=[exTatoeba(irr?irr.base:q,lang,forms)];
  if(lang==='en'){jobs.push(exWiki(irr?irr.base:q,forms));jobs.push(exDict(irr?irr.base:q,forms));}
  const res=await Promise.all(jobs.map(x=>x.catch(()=>null)));
  const all=[].concat(...res.map(x=>x||[])).sort((a,b)=>a.s-b.s);
  const seen=new Set(),list=[];
  all.forEach(x=>{const k2=x.en.toLowerCase();if(seen.has(k2)||list.length>=3)return;seen.add(k2);list.push(x);});
  const out={list,failed:!list.length&&res.every(x=>x==null||!x.length)};
  if(list.length)EXC[k]=out;
  return out;
}

function pickChip(b){

function splitCards(text){
  if(impCard==='semi')return text.split(';');
  if(impCard==='blank')return text.split(/\n\s*\n/);
  return text.split(/\r?\n/);
}
function splitPair(line){
  line=line.trim();if(!line)return null;
  let en,ru;
  if(impTerm==='tab'){[en,...ru]=line.split('\t');ru=(ru||[]).join(' ');}
  else if(impTerm==='comma'){[en,...ru]=line.split(',');ru=(ru||[]).join(',');}
  else if(impTerm==='eq'){[en,...ru]=line.split('=');ru=(ru||[]).join('=');}
  else if(impTerm==='dash'){const m=line.split(/\s+[-–—]\s+/);en=m[0];ru=m.slice(1).join(' - ');}
  else{ // auto
    if(line.includes('\t')){[en,...ru]=line.split('\t');ru=ru.join(' ');}
    else{const m=line.split(/\s+[-–—:]\s+/);if(m.length>1){en=m[0];ru=m.slice(1).join(' - ');}
      else{en=line;ru='';}}
  }
  en=(en||'').trim();ru=(ru||'').trim();
  return en?{en,ru}:null;
}

async function runImport(){
  const pairs=parseImport();if(!pairs.length)return toast(t('Nothing to import'));
  const btn=$('#impBtn');btn.disabled=true;
  const s=(impTo||impArch)?null:addTarget();
  const lg=impArch?((($('#impLg')||{}).value)||DEF_LANG):(impTo?tSetLang(impTo.setId):setLangOf(s));
  const er=$('#impErr');if(er)er.textContent='';
  const need=pairs.filter(p=>!p.ru&&impAuto);
  if(need.length){
    const queue=need.slice();let done=0;
    const worker=async()=>{
      while(queue.length){
        const p=queue.shift();
        const r=await translate(p.en,lg);
        p.ru=r?r.main:'';
        done++;if(btn)btn.textContent=t('Translating…')+' '+done+'/'+need.length;
      }
    };

    const h=holderFor(lg);

    {const st=archStamp();pairs.forEach(p=>{const w=newWord(p.en,p.ru||'—');w.arch=true;w.box=3;w.aat=st;srStart(w);h.words.push(w);idsNew.push(w.id);});}

  }

  save();closeSheet();render();toast(t('Added')+': '+nWords(pairs.length));

/* ---------- matching question (as in Quizlet): pair several words with their translations ---------- */
const MQC=['#2f86f5','#e0902a','#2fa36b','#a05bd6','#d6547a','#1fa3b5'];
function mkMatchQ(ws){
  let order=ws.map((_,i)=>i);
  for(let a=0;a<8;a++){order=shuffle(order);if(order.some((v,i)=>v!==i))break;}
  return {w:ws[0],ws,lg:langOf(ws[0]),type:'match',dir:'ru2en',order};
}
/* words picked for "Matching" are grouped (3–6 per question, same language); too few left over → ordinary questions */
function buildQs(words,kinds,pool){
  const other=kinds.filter(k=>k!=='match'),out=[],mw={};
  words.forEach(w=>{
    const k=kinds[Math.random()*kinds.length|0];
    if(k==='match'){const l=langOf(w);(mw[l]=mw[l]||[]).push(w);}
    else out.push(mkQ(pool,w,k,'ru2en'));
  });
  Object.values(mw).forEach(arr=>{
    if(arr.length<3){arr.forEach(w=>out.push(mkQ(pool,w,other.length?other[Math.random()*other.length|0]:'mc','ru2en')));return;}
    const g=Math.ceil(arr.length/6),base=Math.floor(arr.length/g),extra=arr.length%g;let at=0;
    for(let x=0;x<g;x++){const n=base+(x<extra?1:0);out.push(mkMatchQ(arr.slice(at,at+n)));at+=n;}
  });
  return shuffle(out);
}
function mqHtml(q,a,sel){
  const L='ABCDEFGH';
  return '<div class="mq">'+q.ws.map((_,r)=>{
    const tj=a[r],ow=a.indexOf(r);
    return `<button class="mqi${sel&&sel.s==='t'&&sel.k===r?' sel':''}${tj!=null?' pair':''}" data-s="t" data-k="${r}" style="--pc:${MQC[r%6]}"><span class="bd">${r+1}</span><span class="tx">${esc(q.ws[r].ru)}</span>${tj!=null?`<span class="chip">${L[tj]}</span>`:''}</button>`+
      `<button class="mqi${sel&&sel.s==='d'&&sel.k===r?' sel':''}${ow>=0?' pair':''}" data-s="d" data-k="${r}" style="--pc:${MQC[(ow>=0?ow:0)%6]}"><span class="bd">${L[r]}</span><span class="tx">${esc(q.ws[q.order[r]].en)}</span>${ow>=0?`<span class="chip">${ow+1}</span>`:''}</button>`;

/* ---------- questions engine ---------- */
function mkQ(pool,w,kind,forceDir){
  const lg=langOf(w);
  /* decoys must be in the same language as the word, or the question makes no sense */
  const others=pool.filter(x=>x!==w&&langOf(x)===lg);
  if(kind==='mc'&&others.length<1)kind='type';
  if(kind==='tf'&&others.length<1)kind='type';
  const dir=forceDir||(Math.random()<.5?'en2ru':'ru2en');
  if(kind==='mc'){const ds=shuffle(others).slice(0,Math.min(3,others.length));
    return{w,lg,type:'mc',dir,opts:shuffle([w,...ds]).map(x=>({t:dir==='en2ru'?x.ru:x.en,c:x===w}))};}
  if(kind==='tf'){const isTrue=Math.random()<.5;const d=isTrue?w:shuffle(others)[0];
    const td=forceDir==='ru2en'?'ru2en':'en2ru';
    return{w,lg,type:'tf',dir:td,shown:td==='ru2en'?d.en:d.ru,isTrue};}
  return{w,lg,type:'type',dir};
}
/* “Напишите по-венгерски” / “Выберите слово — венгерский” once more than one language is in play */
function qLabel(q){
  const en2ru=q.dir==='en2ru',lg=q.lg||langOf(q.w);
  if(q.type==='tf')return t('Is this a correct match?');
  /* answering into the studied language: always say which one, so a mixed session stays clear */
  if(q.type==='type')return en2ru?t('Type the translation')

  return en2ru?t('Choose the translation')
    :(multiLang()?t('Choose the word')+' '+langPrep(lg):t('Choose the word'));
}

function startCards(review){
  const pool=poolNow();if(!pool.length)return toast(t('No words'));
  let deck=shuffle(pool),i=0,flip=false,dir='en',unknown=[],total=deck.length;const app=$('#app');
  function draw(){

        <div style="height:14px"></div>${unknown.length?`<button class="btn pri" id="rep">${t('Review tough ones')} (${unknown.length})</button><div style="height:9px"></div>`:''}
        <button class="btn ghost" onclick="render()">${t('Done')}</button>`;
      celPlay();
      if(unknown.length)$('#rep').onclick=()=>{deck=shuffle(unknown);unknown=[];i=0;total=deck.length;flip=false;draw();};return;
    }
    const w=deck[i];const front=dir==='en'?w.en:w.ru,back=dir==='en'?w.ru:w.en;
    app.innerHTML=hdr(t('Flashcards'),"render()",`<button class="ic" aria-label="Flip side" onclick="window._flip()">${ic('swap')}</button>`)+
     `<div class="topbar"><div class="pbar"><i style="width:${i/deck.length*100}%"></i></div><span class="stat">${i+1}/${deck.length}</span></div>
      <div class="fc"><div class="card" id="cd">
        ${flip
          ?`<div class="word">${esc(back)}</div>${w.ex?`<div class="ex">${esc(w.ex)}</div>`:''}`
          :`<div class="word">${esc(front)}</div><div class="tip">${t('tap to flip')}</div>`}
      </div></div>
      <div class="row2"><button class="btn" id="no" style="color:var(--bad)">${ic('close',17)}${t("Don't know")}</button><button class="btn" id="yes" style="color:var(--ok)">${ic('check',17,2)}${t('Know')}</button></div>
      <div style="height:9px"></div><button class="btn ghost" id="sp">${ic('sound')}${t('Pronounce')}</button>`;
    $('#cd').onclick=()=>{
      const c=$('#cd');
      if(!c||c.classList.contains('fout')){flip=!flip;draw();return;}
      c.classList.add('fout');
      setTimeout(()=>{flip=!flip;draw();const n=$('#cd');if(n){n.classList.add('fin');setTimeout(()=>n.classList.remove('fin'),270);}},185);
    };
    $('#sp').onclick=()=>speak(w.en,langOf(w));

  }
  window._flip=()=>{dir=dir==='en'?'ru':'en';flip=false;draw();};
  draw();
}

/* ---------- learn (active only) ---------- */
function startLearn(review){
  const pool=review?poolNow():(view.name==='set'?viewPool():poolNow());
  if(!pool.length)return toast(review?t('No words'):t('No words to learn'));
  const B={};if(review)pool.forEach(w=>B[w.id]=0);
  const lvl=w=>Math.min(3,review?B[w.id]:(w.box||0));
  let queue=shuffle(pool.filter(w=>lvl(w)<3));
  /* every word already mastered: one practice pass, a word counts once it is answered right */
  const practice=!queue.length;if(practice)queue=shuffle(pool);
  const session=queue.slice(),N=session.length,app=$('#app');
  const start=new Map(session.map(w=>[w.id,practice?0:lvl(w)])),okSet=new Set();
  /* the count is read from the words' real state, so a slip and a re-learn can never be counted twice */
  const isDone=w=>practice?okSet.has(w.id):lvl(w)>=3;
  const doneN=()=>session.filter(isDone).length;
  const progress=()=>{
    if(practice)return okSet.size/N;
    let base=0,now=0;session.forEach(w=>{base+=start.get(w.id);now+=lvl(w);});
    const tot=3*N-base;return tot>0?Math.max(0,Math.min(1,(now-base)/tot)):1;
  };
  function finish(){
    app.innerHTML=hdr(t('Learn'),"render()")+
      celHero('learn',{n:N,title:review?t('Review complete'):t('Great job!'),
        sub:`${N} / ${N} ${t('mastered')}<br>${review?t('You revised every word in this session.'):t('Every word this session is mastered.')}`})+
      `<div style="height:14px"></div><button class="btn pri" onclick="render()">${t('Done')}</button>`;
    celPlay();
  }
  function next(){
    if(doneN()>=N)return finish();
    if(!queue.length)queue=shuffle(session.filter(w=>!isDone(w)));
    const w=queue.shift();const L=lvl(w);const kind=L<=1?'mc':'type';const dir=L===0?'en2ru':'ru2en';
    app.innerHTML=studyTop(t('Learn'),progress()*100,t('mastered')+' '+doneN()+'/'+N);
    const q=mkQ(pool,w,kind,dir);
    pulse($('#qb'));
    renderQ($('#qb'),q,{feedback:true,onDone:ok=>{
      const before=lvl(w);
      if(review){B[w.id]=ok?Math.min(3,before+1):Math.max(0,before-1);}
      else{award(w,ok);save();}
      if(ok&&practice)okSet.add(w.id);
      if(isDone(w)){}
      else if(ok)queue.splice(Math.min(queue.length,3+(Math.random()*3|0)),0,w);
      else queue.splice(Math.min(queue.length,2),0,w);
      next();
    }});
  }
  next();
}

function testSetup(review){

     ${[['k1',t('Multiple choice')],['k2',t('Type the answer')],['k3',t('True / false')],['k4',t('Matching')]].map(o=>
       `<div class="toggle" onclick="const sw=this.querySelector('.sw');sw.classList.toggle('on');"><label>${o[1]}</label><div class="sw on" id="${o[0]}"><i></i></div></div>`).join('')}</div></div>

       return arrow+body;
     })()}</div>
   ${review?'<div class="hint">'+t('Archive review: results don\'t change progress.')+'</div>':''}
   <button class="btn pri" onclick="beginTest(${!!review})">${t('Start test')}</button>`);

function beginTest(review){
  const kinds=[$('#k1').classList.contains('on')&&'mc',$('#k2').classList.contains('on')&&'type',$('#k3').classList.contains('on')&&'tf',$('#k4').classList.contains('on')&&'match'].filter(Boolean);
  if(!kinds.length)return toast(t('Pick at least one type'));
  const n=+$('#tn').value;closeSheet();runTest(shuffle(poolNow()).slice(0,n),kinds,review);
}
/* an unfinished test is kept on the device, so a stray Back or a refresh doesn't lose it */
const TKEY='vocab.test';
function testClear(){try{localStorage.removeItem(TKEY);}catch(e){}}
function testSaved(){
  try{
    const x=JSON.parse(localStorage.getItem(TKEY)||'null');
    if(!x||!Array.isArray(x.qs)||Date.now()-(x.at||0)>3*DAY)return null;
    const qs=[],ans=[];
    x.qs.forEach((q,k)=>{const f=findWord(q.w);if(!f)return;
      if(q.type==='match'){const ws=(q.ws||[]).map(id=>{const g=findWord(id);return g&&g.w;});if(!ws.length||ws.some(v=>!v))return;
        qs.push(Object.assign({},q,{w:ws[0],ws}));ans.push(Array.isArray(x.ans[k])?x.ans[k]:ws.map(()=>null));return;}
      qs.push(Object.assign({},q,{w:f.w}));ans.push(x.ans[k]===undefined?null:x.ans[k]);});
    if(!qs.length)return null;
    return {qs,ans,i:Math.min(x.i||0,qs.length-1),kinds:x.kinds||['mc','type','tf'],review:!!x.review};
  }catch(e){return null;}
}
function testBanner(){
  const s=testSaved();if(!s)return '';
  const n=s.qs.reduce((c,q,k)=>c+((q.type==='match'?(s.ans[k]||[]).every(v=>v!=null):q.type==='type'?String(s.ans[k]||'').trim()!=='':s.ans[k]!==null)?1:0),0);
  return `<div class="resumebar"><button class="rowlink" onclick="resumeTest()"><span>${ic('repeat',19)}${t('Resume test')}</span><em>${n}/${s.qs.length}</em></button>
    <button class="ic" aria-label="${t('Discard')}" onclick="discardTest()">✕</button></div>`;
}
function resumeTest(){const s=testSaved();if(!s){render();return;}runTest(null,s.kinds,s.review,s);}
function discardTest(){testClear();render();}
function runTest(words,kinds,review,resume){
  const pool=resume?null:poolNow(),app=$('#app');
  const qs=resume?resume.qs:buildQs(words,kinds,pool);
  const total=qs.length;
  const ans=resume?resume.ans:qs.map(q=>q.type==='match'?q.ws.map(()=>null):q.type==='type'?'':null);
  let i=resume?resume.i:0,shown=-1,palOpen=false,sel=null;
  const persist=()=>{if(PRACTICE)return;try{localStorage.setItem(TKEY,JSON.stringify({at:Date.now(),kinds,review,i,ans,qs:qs.map(q=>Object.assign({},q,{w:q.w.id},q.ws?{ws:q.ws.map(x=>x.id)}:{}))}));}catch(e){}};
  const answered=ix=>{const q=qs[ix];return q.type==='match'?(ans[ix]||[]).length===q.ws.length&&ans[ix].every(v=>v!=null):q.type==='type'?(ans[ix]||'').trim()!=='':ans[ix]!==null;};
  const countAns=()=>{let n=0;for(let k=0;k<total;k++)if(answered(k))n++;return n;};
  const sels={};let advT=0,palFit=()=>{};
  const feed=()=>$('#tfeed');
  function secInner(ix){
    const q=qs[ix],prompt=q.dir==='en2ru'?q.w.en:q.w.ru;
    const n=`<b class="qn">${ix+1}</b>`;
    let h=q.type==='match'?`<div class="mqhead">${n}${t('Match each word with its translation')}</div>`
      :`<div class="card" style="min-height:min(24vh,150px)"><div class="lbl">${n}${qLabel(q)}</div><div class="word">${esc(prompt)}</div>${q.type==='tf'?`<div class="word sub">= ${esc(q.shown)}</div>`:''}</div>`;
    if(q.type==='mc')h+=`<div style="margin-top:14px">${q.opts.map((x,k)=>`<button class="opt ${ans[ix]===k?'pick':''}" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>`;
    if(q.type==='tf')h+=`<div class="row2" style="margin-top:14px"><button class="btn tfy ${ans[ix]===true?'selp':''}" data-tf="1">✓ True</button><button class="btn tfn ${ans[ix]===false?'selp':''}" data-tf="0">✗ False</button></div>`;
    if(q.type==='type')h+=`<div style="margin-top:14px"><input class="inp ta" data-ix="${ix}" placeholder="${t('Answer')}" value="${esc(ans[ix]||'')}" ${NOASSIST}></div>`;
    if(q.type==='match')h+=mqHtml(q,ans[ix],sels[ix]||null);
    return h;
  }
  function updateTop(){
    const ca=countAns(),pb=$('.pbar i'),st=$('.topbar .stat');
    if(pb)pb.style.width=(ca/total*100)+'%';
    if(st)st.textContent=ca+'/'+total;
    $$('.qdot').forEach((b,ix)=>{b.classList.toggle('on',answered(ix));b.classList.toggle('cur',ix===i);});
    $$('.tq[data-ix]').forEach((s,ix)=>{s.classList.toggle('done',answered(ix));s.classList.toggle('cur',ix===i);});
    palFit();
  }
  function setCur(ix){if(ix===i)return;i=ix;persist();updateTop();}
  function scrollQ(ix,smooth){
    const el=$('#tq'+ix)||$('#tfin');if(!el)return;
    try{el.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});}catch(e){el.scrollIntoView();}
  }
  /* after an answer the next question slides up by itself */
  function advance(ix,delay,focus){
    clearTimeout(advT);
    advT=setTimeout(()=>{
      if(!feed())return;
      const nx=ix+1;
      if(nx>=total){scrollQ(total,true);return;}
      setCur(nx);scrollQ(nx,true);
      if(focus&&qs[nx].type==='type')setTimeout(()=>{const ta=$('#tq'+nx+' .ta');if(ta&&ta.isConnected)try{ta.focus({preventScroll:true});}catch(e){ta.focus();}},420);
    },delay);
  }
  function afterAns(ix,first){persist();drawSec(ix);updateTop();if(first)advance(ix,380);}
  /* tap a word, then its translation (either order); tap a paired item to undo the pair */
  function mqTap(ix,side,k){
    const a=ans[ix],was=answered(ix);let sel=sels[ix]||null;
    if(sel&&sel.s!==side){
      const tk=side==='t'?k:sel.k,dk=side==='d'?k:sel.k;
      for(let x=0;x<a.length;x++)if(a[x]===dk)a[x]=null;
      a[tk]=dk;sel=null;
    }else if(sel&&sel.s===side&&sel.k===k){sel=null;}
    else if(!sel&&(side==='t'?a[k]!=null:a.indexOf(k)>=0)){
      if(side==='t')a[k]=null;else a[a.indexOf(k)]=null;
    }else sel={s:side,k};
    sels[ix]=sel;persist();drawSec(ix);updateTop();
    if(!was&&answered(ix))advance(ix,520);
  }
  function finishTest(){const blanks=total-countAns();if(blanks&&!confirm(t('Still blank')+': '+blanks+'. '+t('Finish anyway?')))return;clearTimeout(advT);result();}
  function bindSec(ix){
    const el=$('#tq'+ix),q=qs[ix];if(!el)return;
    if(q.type==='mc')el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const f=!answered(ix);ans[ix]=+b.dataset.k;afterAns(ix,f);});
    if(q.type==='tf')el.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{const f=!answered(ix);ans[ix]=(b.dataset.tf==='1');afterAns(ix,f);});
    if(q.type==='type'){const ta=el.querySelector('.ta');hardenInput(ta);if(ta){
      ta.oninput=()=>{ans[ix]=ta.value;persist();updateTop();};
      ta.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();advance(ix,0,true);}});}}
    el.querySelectorAll('.mqi').forEach(b=>b.onclick=()=>mqTap(ix,b.dataset.s,+b.dataset.k));
  }
  function drawSec(ix){const el=$('#tq'+ix);if(!el)return;el.innerHTML=secInner(ix);bindSec(ix);}
  function draw(){
    persist();
    const ca=countAns();
    const dots=qs.map((_,ix)=>`<button class="qdot ${answered(ix)?'on':''} ${ix===i?'cur':''}" data-ix="${ix}">${ix+1}</button>`).join('');
    app.innerHTML=hdr(t('Test'),"if(confirm(t('Exit this session?')))render()")+
      `<div class="topbar"><div class="pbar"><i style="width:${ca/total*100}%"></i></div><span class="stat">${ca}/${total}</span></div>`+
      `<div class="qpalbox"><div class="qpal${palOpen?' open':''}" id="qpal">${dots}</div><button class="qmore" id="qmore" aria-label="${palOpen?t('Collapse'):t('Show all questions')}">${palOpen?ic('up',18):ic('down',18)}</button></div>`+
      `<div id="tfeed">${qs.map((_,ix)=>`<section class="tq${answered(ix)?' done':''}${ix===i?' cur':''}" id="tq${ix}" data-ix="${ix}">${secInner(ix)}</section>`).join('')}</div>`+
      `<div id="tfin" class="tqfin"><button class="btn pri tfinbtn">${ic('check',18,2)}${t('Finish')}</button></div>`;
    qs.forEach((_,ix)=>bindSec(ix));
    const fd=feed();
    const act=e=>{const s=e.target.closest&&e.target.closest('.tq[data-ix]');if(s)setCur(+s.dataset.ix);};
    fd.addEventListener('pointerdown',act);fd.addEventListener('focusin',act);
    const pal=$('#qpal'),more=$('#qmore');
    if(pal&&more){
      const base=pal.getBoundingClientRect().top;
      const top=el=>Math.round(el.getBoundingClientRect().top-base+pal.scrollTop);
      const rows=new Set([...pal.children].map(top)).size;
      if(rows<=2&&!palOpen){more.style.display='none';}
      else{
        more.style.display='';
        palFit=()=>{const cur=pal.querySelector('.qdot.cur');if(cur)pal.scrollTop=palOpen?Math.max(0,top(cur)-pal.clientHeight/2+18):Math.max(0,top(cur)-4);};
        palFit();
        more.onclick=()=>{palOpen=!palOpen;pal.classList.toggle('open',palOpen);
          more.innerHTML=palOpen?ic('up',18):ic('down',18);
          more.setAttribute('aria-label',palOpen?t('Collapse'):t('Show all questions'));
          requestAnimationFrame(palFit);};
      }
    }
    $$('.qdot').forEach(b=>b.onclick=()=>{const ix=+b.dataset.ix;clearTimeout(advT);setCur(ix);scrollQ(ix,true);});
    $$('.tfinbtn').forEach(b=>b.onclick=finishTest);
    if(i>0)requestAnimationFrame(()=>scrollQ(i,false));
  }
  function result(){
    shown=-1;testClear();
    /* grade first, collect what got mastered, then ask before drawing the result */
    if(!review){
      const ready=[];
      qs.forEach((q,ix)=>{
        if(q.type==='match'){q.ws.forEach((w,k)=>{const j=ans[ix][k];if(award(w,j!=null&&q.order[j]===k)==='ready')ready.push(w);});return;}
        const en2ru=q.dir==='en2ru',answer=en2ru?q.w.ru:q.w.en;let ok;
        if(q.type==='mc'){const k=ans[ix];ok=k!=null&&q.opts[k].c;}
        else if(q.type==='tf'){ok=ans[ix]!=null&&ans[ix]===q.isTrue;}
        else{const v=(ans[ix]||'').trim();ok=v?checkAns(v,answer,en2ru)==='ok':false;}
        if(award(q.w,ok)==='ready')ready.push(q.w);
      });
      save();
      return draw2();
    }
    draw2();
  }
  function draw2(){
    const res=qs.flatMap((q,ix)=>{
      if(q.type==='match')return q.ws.map((w,k)=>{const j=ans[ix][k],ok=j!=null&&q.order[j]===k;return {w,ok,given:j!=null?q.ws[q.order[j]].en:'',correct:w.en,near:false};});
      const en2ru=q.dir==='en2ru',answer=en2ru?q.w.ru:q.w.en;let ok,given,near=false;
      if(q.type==='mc'){const k=ans[ix];ok=k!=null&&q.opts[k].c;given=k!=null?q.opts[k].t:'';}
      else if(q.type==='tf'){ok=ans[ix]!=null&&ans[ix]===q.isTrue;given=ans[ix]==null?'':(ans[ix]?'True':'False');}
      else{const v=(ans[ix]||'').trim();const r=v?checkAns(v,answer,en2ru):'no';ok=r==='ok';near=r==='near';given=v;}
      const correct=q.type==='tf'?(q.isTrue?'True':'False'):answer;
      return [{w:q.w,ok,given,correct,near}];
    });
    /* grading already happened in result() */
    const good=res.filter(r=>r.ok).length,pct=Math.round(good/res.length*100);
    /* a spelling slip is a mistake too — it is only listed apart so it reads clearly */
    const wrong=res.filter(r=>!r.ok);
    const slips=wrong.filter(r=>r.near),bad=wrong.filter(r=>!r.near);
    const toArch=res.filter(r=>r.ok&&r.w.arch).length;
    app.innerHTML=hdr(t('Result'),"render()")+
      celHero('test',{pct,title:scoreTitle(pct),sub:`${good} / ${res.length} ${t('correct')}${!review&&toArch?` · ${toArch} ${t('moved to Archive')}`:''}`})+
      `<div style="height:8px"></div>`+
      (slips.length?`<div class="subhead"><span class="t">${t('Spelling slips')} — ${slips.length}</span></div>
        <div class="hint" style="margin:0 2px 8px">${t('A slip counts as a mistake — the spelling has to be exact.')}</div>`+
        slips.map(r=>`<div class="item" style="display:block;padding:13px 15px">
          <div style="display:flex;align-items:center;gap:13px">
            <div class="t" style="flex:1"><div class="en">${esc(r.w.en)}</div><div class="ru">${esc(r.w.ru)}</div></div>
            <button class="spk" onclick="speakWord('${r.w.id}')">${ic('sound',17)}</button></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
            <span class="ans-bad near">${esc(r.given)}</span>
            <span class="ans-ok">${esc(r.correct||r.w.en)}</span></div></div>`).join('')+
        `<div style="height:10px"></div>`:'')+
      (bad.length?`<div class="subhead"><span class="t">${t('Mistakes')} — ${bad.length}</span></div>`+
        bad.map(r=>`<div class="item" style="display:block;padding:13px 15px">
          <div style="display:flex;align-items:center;gap:13px">
            <div class="t" style="flex:1"><div class="en">${esc(r.w.en)}</div><div class="ru">${esc(r.w.ru)}</div></div>
            <button class="spk" onclick="speakWord('${r.w.id}')">${ic('sound',17)}</button></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
            <span class="ans-bad">${r.given?esc(r.given):t('no answer')}</span>
            <span class="ans-ok">${esc(r.correct||r.w.en)}</span></div></div>`).join('')+
        `<div style="height:10px"></div>`:'')+
      (wrong.length?`<button class="btn pri" id="rt">${t('Retry mistakes')}</button><div style="height:9px"></div>`:'')+
      `<button class="btn ghost" onclick="render()">${t('Close')}</button>`;
    if(wrong.length)$('#rt').onclick=()=>runTest(shuffle(wrong.map(r=>r.w)),kinds,review);
    celPlay();
  }
  draw();
}

/* ---------- match ---------- */
function startMatch(){
  const pool=poolNow();if(pool.length<3)return toast(t('Need at least 3 words'));
  const ws=shuffle(pool).slice(0,6);
  const tiles=shuffle(ws.flatMap(w=>[{id:w.id,t:w.en},{id:w.id,t:w.ru}]));
  let sel=null,left=ws.length,t0=Date.now(),miss=0;const app=$('#app');
  app.innerHTML=hdr(t('Match'),"render()",`<span class="stat" id="tm" style="font-size:16px;min-width:64px">0.0s</span>`)+
    `<div class="hint" style="text-align:center;margin-bottom:12px">${t('Match each word with its translation')}</div>
     <div class="tiles">${tiles.map((x,i)=>`<button class="tile" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>`;
  const iv=setInterval(()=>{const e=$('#tm');if(!e)return clearInterval(iv);e.textContent=((Date.now()-t0)/1000).toFixed(1)+'s';},100);
  app.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('done')||el===sel)return;
    const x=tiles[+el.dataset.i];
    if(!sel){sel=el;el.classList.add('sel');return;}
    const y=tiles[+sel.dataset.i];
    if(x.id===y.id){el.classList.add('done');sel.classList.add('done');sel=null;left--;
      if(!left){clearInterval(iv);const tt=((Date.now()-t0)/1000).toFixed(1);
        app.innerHTML=hdr(t('Match'),"render()")+
          celHero('match',{n:ws.length,miss,time:tt,title:miss?t('All pairs matched'):t('Flawless!'),mid:`<div class="big-pct" style="margin:6px 0 0">0.0s</div>`,sub:t('Mistakes')+': '+miss})+
          `<div style="height:14px"></div><button class="btn pri" onclick="startMatch()">${t('Again')}</button><div style="height:9px"></div>
          <button class="btn ghost" onclick="render()">${t('Close')}</button>`;
        celPlay();}}
    else{miss++;const a=sel;sel=null;a.classList.remove('sel');a.classList.add('no');el.classList.add('no');
      setTimeout(()=>{a.classList.remove('no');el.classList.remove('no');},380);}
  });
}

  bell(f,t,g=.12,dur=1.9,bright=1){

      const o=c.createOscillator(),e=c.createGain();o.type='sine';o.frequency.value=f*r;

  sweep(f0,f1,t,dur,g=.05,type='sine'){

  thump(t,g=.3){

const celPal=()=>celDark()
  ?{spark:['#ffffff','#cfe0ff','#8fb4ff'],soft:['#ffffff','#bcd3ff'],gold:['#ffffff','#e6efff','#bcd3ff']}
  :{spark:['#ffb400','#ffcf4a','#2f86f5','#1a56db'],soft:['#ffcf4a','#7db4ff'],gold:['#ffb400','#ff9a00','#ffd25a']};
function mkFx(z){
  const comp=celDark()?'lighter':'source-over',dpr=Math.min(2,window.devicePixelRatio||1);
  let cv=null,cx=null,ps=[],raf=0,last=0,pend=0,W=0,H=0;const spr={};
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function sprite(color,kind){
    const k=color+kind;if(spr[k])return spr[k];
    const s=64,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    const h=color.replace('#',''),rgb=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
    const c0=`rgba(${rgb},1)`,c1=`rgba(${rgb},.35)`,cz=`rgba(${rgb},0)`;
    if(kind==='glow'){const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,c0);g.addColorStop(.2,c0);g.addColorStop(.55,c1);g.addColorStop(1,cz);x.fillStyle=g;x.fillRect(0,0,s,s);}
    else{x.translate(s/2,s/2);const g=x.createRadialGradient(0,0,0,0,0,s/2);g.addColorStop(0,c0);g.addColorStop(1,cz);
      x.fillStyle=g;x.beginPath();x.moveTo(0,-s/2);x.quadraticCurveTo(2,-2,s/2,0);x.quadraticCurveTo(2,2,0,s/2);x.quadraticCurveTo(-2,2,-s/2,0);x.quadraticCurveTo(-2,-2,0,-s/2);x.fill();}
    return spr[k]=c;
  }
  function attach(){
    if(cv)return;
    cv=document.createElement('canvas');cv.className='cel-cv';cv.style.zIndex=z;document.body.appendChild(cv);
    W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx=cv.getContext('2d');
  }
  function tick(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!cv){raf=0;return;}
    cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);cx.globalCompositeOperation=comp;

/* ---------- the week as a constellation ---------- */
const CST_PTS=[[28,150],[74,98],[122,140],[170,70],[218,126],[266,84],[312,118]];
function cstWeek(prevDone,todayLit){
  const idx=(new Date().getDay()+6)%7;
  return {idx,st:Array.from({length:7},(_,i)=>i<idx?((idx-i<=prevDone)?'done':'miss'):i===idx?(todayLit?'lit':'today'):'future')};
}
function cstLetters(){
  const lg=(S.settings.lang||'ru')==='en'?'en':'ru';
  return Array.from({length:7},(_,i)=>{try{return new Date(2024,0,1+i).toLocaleDateString(lg,{weekday:'narrow'}).toUpperCase();}catch(e){return 'MTWTFSS'[i];}});
}
/* o: id prefix, st (7 states), idx, view, ignite (today's star is drawn filled, ready to light), flare, goal/done (progress ring) */
function cstSvg(o){
  const P=CST_PTS,L=cstLetters(),pf=o.id,S7=o.st,on=i=>S7[i]==='done'||S7[i]==='lit';
  const lines=P.slice(1).map((p,i)=>{const a=P[i];
    return `<line id="${pf}ln${i+1}" class="cl${on(i)&&on(i+1)?' on':''}" x1="${a[0]}" y1="${a[1]}" x2="${p[0]}" y2="${p[1]}"/>`;}).join('');
  const nodes=P.map(([x,y],i)=>{
    const st=S7[i];let g='';
    if(st==='done')g=`<circle cx="${x}" cy="${y}" r="24" fill="url(#${pf}h)"/><path class="cs-s" d="${cStarP(x,y,12)}"/>`;
    else if(st==='lit')g=`<circle id="${pf}tgl" cx="${x}" cy="${y}" r="38" fill="url(#${pf}hh)"/><path class="cs-hot" d="${cStarP(x,y,19)}"/>`;
    else if(st==='today'){
      g=`<circle id="${pf}tgl" cx="${x}" cy="${y}" r="38" fill="url(#${pf}hh)" opacity="0"/>`+
        (o.ignite?`<g id="${pf}tstar" class="fb"><path class="cs-hot" d="${cStarP(x,y,19)}"/></g>`
          :`<path class="cs-ghost" d="${cStarP(x,y,15)}"/><circle class="cs-ping" cx="${x}" cy="${y}" r="20"/>`)+
        (o.ignite?`<circle id="${pf}tring" class="cs-ping" cx="${x}" cy="${y}" r="8" opacity="0"/>`:'');
      if(o.goal){const c=2*Math.PI*26,p=Math.max(0,Math.min(1,(o.done||0)/o.goal));
        g+=`<circle class="cs-arc-t" cx="${x}" cy="${y}" r="26"/><circle class="cs-arc" cx="${x}" cy="${y}" r="26" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}" transform="rotate(-90 ${x} ${y})"/>`;}
    }
    else if(st==='miss')g=`<circle class="cs-miss" cx="${x}" cy="${y}" r="3"/>`;
    else g=`<circle class="cs-fut" cx="${x}" cy="${y}" r="3.4"/>`;
    return `<g id="${pf}nd${i}" class="nd ${st}" style="--i:${i}">${g}</g><text class="cs-l${i===o.idx?' now':''}" x="${x}" y="${y+36}">${L[i]}</text>`;
  }).join('');
  const t=P[o.idx];
  const flare=o.flare?`<g id="${pf}flare" class="fb"><rect x="${t[0]-72}" y="${t[1]-1}" width="144" height="2" fill="url(#${pf}spk)"/><rect x="${t[0]-1}" y="${t[1]-72}" width="2" height="144" fill="url(#${pf}spk2)"/></g>`:'';
  return `<svg class="${o.cls||'cst-svg'}" viewBox="${o.view}" aria-hidden="true">
    <defs>
      <radialGradient id="${pf}h"><stop offset="0" style="stop-color:var(--cs-halo-c);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--cs-halo-c);stop-opacity:0"/></radialGradient>
      <radialGradient id="${pf}hh"><stop offset="0" style="stop-color:var(--cs-hot-c);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--cs-hot-c);stop-opacity:0"/></radialGradient>
      <linearGradient id="${pf}spk" x1="0" x2="1"><stop offset="0" style="stop-color:var(--cs-hot-c);stop-opacity:0"/><stop offset=".5" style="stop-color:var(--cs-hot-c)"/><stop offset="1" style="stop-color:var(--cs-hot-c);stop-opacity:0"/></linearGradient>
      <linearGradient id="${pf}spk2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--cs-hot-c);stop-opacity:0"/><stop offset=".5" style="stop-color:var(--cs-hot-c)"/><stop offset="1" style="stop-color:var(--cs-hot-c);stop-opacity:0"/></linearGradient>
    </defs>${lines}${nodes}${flare}</svg>`;
}

/* ---------- Today: the streak card and the words ---------- */
function dayStrip(){
  const total=S.sets.reduce((n,s)=>n+s.words.length,0);
  if(!total)return '';
  const goal=S.stats.goal||10,done=todayCount(),st=S.stats.streak||0,met=!!S.stats.met;
  const pct=Math.min(100,done/goal*100),w=cstWeek(met?Math.max(0,st-1):st,met);
  const left=Math.max(0,goal-done);
  return `<div class="cst-card${met?' met':''}">
    <div class="cst-top"><div class="cst-n"><b>${st}</b><span>${plr(st,t('day'),t('day2'),t('days'))} ${t('in a row')}</span></div>
      <button class="cst-goal" onclick="goalSheet()" aria-label="${t('Daily goal')}">${ic('target',15)}<b>${done}/${goal}</b></button></div>
    ${cstSvg({id:'t',st:w.st,idx:w.idx,view:'0 40 340 164',goal:met?0:goal,done})}
    <div class="cst-foot"><div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="cst-ft"><span>${met?t("Today's star is lit"):nWords(left)+' '+t("to light today's star")}</span><span>${t('best:')} ${S.stats.best||0}</span></div></div></div>`;
}
function learnPick(){
  const all=S.sets.flatMap(s=>s.words);
  const act=all.filter(w=>!w.arch);
  const base=act.length?act:all;
  /* the three words always share one language */
  const by={};base.forEach(w=>{(by[langOf(w)]=by[langOf(w)]||[]).push(w);});
  const ks=Object.keys(by),big=ks.filter(k=>by[k].length>=3),pickFrom=big.length?big:ks;
  if(!pickFrom.length)return [];
  /* follow the language of today's session, so the whole home page speaks one language */
  let lg0=null;try{lg0=ks.length>1?buildSession(false).lg:null;}catch(e){}
  const k=(lg0&&by[lg0]&&by[lg0].length)?lg0:pickFrom[Math.floor(Math.random()*pickFrom.length)];
  return shuffle(by[k].slice()).slice(0,3).map(w=>w.id);
}
function wordsCard(){
  if(!S.sets.some(s=>s.words.length))return '';
  if(!todayPick||todayPick.some(id=>!findWord(id)))todayPick=learnPick();
  const ws=todayPick.map(findWord).filter(Boolean);
  if(!ws.length)return '';
  return `<div class="wsky" id="wsky"><div class="wsky-h"><span>${t('Words you are learning')}</span>
    <button onclick="todayShuffle()">${ic('repeat',15)}${t('Shuffle')}</button></div>
    ${ws.map(({w},i)=>{const lv=Math.min(3,w.box||0);
      return `<button class="wsk" style="--i:${i}" onclick="speakWord('${w.id}')"><span class="wsk-s">${ic('sound',16)}</span>
        <span class="wsk-t"><b>${esc(w.en)}</b><em>${esc(w.ru)}</em></span>
        <span class="wsk-p">${[1,2,3].map(k=>`<i class="${k<=lv?'on':''}"></i>`).join('')}</span></button>`;}).join('')}</div>`;
}
function todayShuffle(){todayPick=learnPick();const e=$('#wsky');if(e)e.outerHTML=wordsCard();}

const celMil=n=>[7,14,21,30,50,75,100,150,200,365].indexOf(n)>=0||(n>365&&n%100===0);
const celMilTitle=n=>n===7?t('A whole week in a row!'):n===14?t('Two weeks in a row!'):n===30?t('A month with no gaps!'):n===100?t('One hundred days!'):n===365?t('A whole year!'):t('A new milestone!');
function celSky(){
  const dark=celDark(),r=(()=>{let x=11;return()=>(x=(x*16807)%2147483647)/2147483647;})();let s='';
  if(dark){for(let i=0;i<70;i++)s+=`<circle cx="${(r()*390).toFixed(1)}" cy="${(r()*780).toFixed(1)}" r="${(.4+r()*.9).toFixed(2)}" fill="#fff" opacity="${(.15+r()*.5).toFixed(2)}"/>`;}
  else{for(let i=0;i<30;i++)s+=`<path d="${cStarP((r()*390).toFixed(1),(r()*780).toFixed(1),(2+r()*3.5).toFixed(1))}" fill="var(--cs-dot)" opacity="${(.06+r()*.16).toFixed(2)}"/>`;}
  return `<svg class="cel-sky" viewBox="0 0 390 780" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s}</svg>`+

}

/* ---------- the streak overlay ---------- */
function celShow(){
  if(CEL.open)return;
  const st=S.stats,n=Math.max(1,st.streak||1),mil=celMil(n),w=cstWeek(n-1,false),dark=celDark();
  try{localStorage.setItem('noeon_cel',JSON.stringify({day:st.day,shown:true}));}catch(e){}
  CEL.open=true;
  const ov=document.createElement('div');ov.id='celeb';ov.className='celeb';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
  const head=(mil?celMilTitle(n):t('A new star lights up')).split(' ').map(x=>`<i>${esc(x)}</i>`).join(' ');
  ov.innerHTML=`<div class="cel-bg"></div>${celSky()}<div class="cel-glow" id="cglow"></div>
    <div class="cel-col">
      <div class="cel-hero" id="chero2">${cstSvg({id:'c',st:w.st,idx:w.idx,ignite:true,flare:true,view:'0 30 340 176',cls:'cel-svg'})}</div>
      <div class="cel-num" id="cnum"><div class="tr"><span>${n-1}</span><span>${n}</span></div></div>
      <div class="cel-lbl" id="clbl">${plr(n,t('day'),t('day2'),t('days'))} ${t('in a row')}</div>
      <div class="cel-hl" id="chl">${head}</div>
      <div class="cel-sub" id="csub">${t('Daily goal reached')} · ${nWords(st.goal||10)}</div>
    </div>
    <div class="cel-cta"><button type="button" id="cgo">${t('Continue')}</button></div>`;
  document.body.appendChild(ov);
  const prevOv=document.body.style.overflow;document.body.style.overflow='hidden';
  const fx=mkFx(120),idx=w.idx,P=CST_PTS,tm=x=>celRM?0:x;
  let closed=false;
  function close(){
    if(closed)return;closed=true;fx.stop();
    document.removeEventListener('keydown',onKey);
    const a=ov.animate?ov.animate([{opacity:1},{opacity:0}],{duration:celRM?1:260,easing:'ease-out',fill:'forwards'}):null;
    const fin=()=>{ov.remove();document.body.style.overflow=prevOv;CEL.open=false;};
    if(a)a.onfinish=fin;else fin();
  }
  function onKey(e){if(e.key==='Escape'){e.preventDefault();close();}}
  document.addEventListener('keydown',onKey);
  $('#cgo').onclick=close;
  const q=s=>ov.querySelector(s),qa=s=>[...ov.querySelectorAll(s)];
  const hot=dark?'#d2e4ff':'#1a56db';
  /* the stars that are already lit arrive, then idle */
  qa('.nd.done').forEach((g,i)=>{
    wa(g,[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{delay:tm(100+i*70),duration:600,easing:CE.spring});
    wa(g,[{opacity:1},{opacity:.72}],{delay:tm(1200+i*230),duration:1700+i*180,iterations:Infinity,direction:'alternate',easing:'ease-in-out',composite:'replace'});
  });
  qa('.nd.future,.nd.miss').forEach((g,i)=>wa(g,[{opacity:0},{opacity:1}],{delay:tm(150+i*50),duration:600}));
  /* the thread to today's star */
  const ln=idx>0?q('#cln'+idx):null;
  if(ln){const len=ln.getTotalLength?ln.getTotalLength():60;ln.style.strokeDasharray=len;
    wa(ln,[{strokeDashoffset:len,stroke:hot,strokeWidth:2.2},{strokeDashoffset:0,stroke:hot,strokeWidth:2.2,offset:.6},{strokeDashoffset:0,stroke:hot,strokeWidth:1.4,strokeOpacity:.55}],{delay:tm(380),duration:1500,easing:CE.soft});}
  /* ignition */
  const ts=q('#ctstar'),tg=q('#ctgl'),tr=q('#ctring'),fl=q('#cflare'),tx=P[idx][0],ty=P[idx][1];
  [ts,tg,tr].forEach(e=>{if(e){e.style.transformBox='fill-box';e.style.transformOrigin='center';}});
  wa(ts,[{transform:'scale(0) rotate(-60deg)',opacity:0},{transform:'scale(1.5) rotate(8deg)',opacity:1,offset:.5},{transform:'scale(1) rotate(0)',opacity:1}],{delay:tm(900),duration:900,easing:CE.soft});
  wa(tg,[{opacity:0,transform:'scale(.2)'},{opacity:.95,transform:'scale(1.6)',offset:.35},{opacity:.55,transform:'scale(1)'}],{delay:tm(900),duration:1300});
  wa(tr,[{opacity:0,transform:'scale(.6)'},{opacity:.9,transform:'scale(.65)',offset:.02},{opacity:0,transform:'scale(4.2)'}],{delay:tm(920),duration:1100});
  wa(fl,[{opacity:0,transform:'scale(.1) rotate(0)'},{opacity:1,transform:'scale(1) rotate(0)',offset:.3},{opacity:0,transform:'scale(1.25) rotate(14deg)'}],{delay:tm(930),duration:1300});
  wa(ts,[{opacity:1},{opacity:.85}],{delay:tm(2300),duration:1600,iterations:Infinity,direction:'alternate',easing:'ease-in-out',composite:'replace'});
  wa(q('#cglow'),[{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1)'}],{delay:tm(900),duration:1600});
  if(mil){
    qa('.nd').forEach((g,i)=>wa(g,[{filter:'brightness(1)'},{filter:'brightness(1.8)',offset:.4},{filter:'brightness(1)'}],{delay:tm(2150+i*110),duration:900,easing:CE.soft}));
    qa('.cl').forEach((l,i)=>wa(l,[{strokeWidth:1.4},{strokeWidth:2.6,stroke:hot,offset:.4},{strokeWidth:1.4}],{delay:tm(2150+i*110),duration:900,easing:CE.soft}));
  }
  /* number, label, headline */
  wa(q('#cnum .tr'),[{transform:'translateY(0)',filter:'blur(0)'},{filter:'blur(3px)',offset:.45},{transform:'translateY(-50%)',filter:'blur(0)'}],{delay:tm(1250),duration:750,easing:'cubic-bezier(.5,0,.1,1)'});
  wa(q('#cnum'),[{transform:'scale(1)'},{transform:'scale(1.14)',offset:.6},{transform:'scale(1)'}],{delay:tm(1350),duration:1100,easing:CE.soft});
  wa(q('#clbl'),[{opacity:0,transform:'translateY(10px)'},{opacity:.92,transform:'none'}],{delay:tm(1600),duration:600});
  qa('#chl i').forEach((e,i)=>wa(e,[{opacity:0,transform:'translateY(16px) scale(.96)'},{opacity:1,transform:'none'}],{delay:tm(1750+i*80),duration:650}));
  wa(q('#csub'),[{opacity:0},{opacity:1}],{delay:tm(2300),duration:700});
  wa(q('.cel-cta'),[{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],{delay:tm(2400),duration:600});
  setTimeout(()=>{const b=$('#cgo');if(b&&!closed)b.focus({preventScroll:true});},celRM?50:3000);
  /* sparks come from the star itself */
  const at=()=>{const e=ts||q('#ctgl');return e?cen(e):{x:innerWidth/2,y:innerHeight/3};};
  fx.later(tm(930),()=>{const p=at();sparkAt(fx,p,mil?46:30,true);});
  if(!celRM){
    for(let i=1;i<=Math.floor(1900/110);i++)fx.later(930+1200+i*110,()=>{const p=at();fx.burst({x:p.x,y:p.y,n:1,speed:[10,70],angle:0,spread:180,life:[1.2,2],size:[.9,1.8],colors:celPal().soft,drag:.98,kind:'spark',jx:26,jy:26});});
    if(mil)fx.later(2150,()=>qa('.nd').forEach((g,i)=>fx.later(i*110,()=>{const p=cen(g);fx.burst({x:p.x,y:p.y,n:9,speed:[30,120],angle:0,spread:180,life:[.8,1.4],size:[1.2,2.4],colors:celPal().spark,drag:.97,kind:'spark'});})));
  }
  /* the score */
  celSound(t0=>{
    const A=CAU,t=x=>t0+x;
    A.sweep(420,2100,t(.38),.52,.045);
    A.bell(CN.D6,t(.92),.1,2.4,1.3);A.bell(CN.A6,t(.94),.07,2.6,1.3);A.bell(CN.E7,t(.97),.04,2.4,1.5);
    [CN.A5,CN.C6,CN.D6,CN.E6,CN.G6,CN.A6,CN.D7].forEach((f,i)=>A.bell(f,t(1.0+i*.065),.045,1.0,1.5));
    A.pad([CN.D3,CN.A3,CN.D5],t(.9),3.4,.08,.35);
    A.tick(t(1.28),.05);
    if(mil){[CN.D6,CN.A6,CN.D7,CN.E7].forEach((f,i)=>A.bell(f,t(2.1+i*.12),.06,2.4,1.4));A.noise(t(2.05),.9,3000,6500,.03,1.5,'bandpass',.3);}
  });
  try{if(navigator.vibrate&&!celRM)navigator.vibrate([12,40,14]);}catch(e){}
}

/* ================= the finales — one for each way of studying ================= */
const scoreTitle=p=>p>=90?t('Excellent!'):p>=70?t('Great job!'):p>=50?t('Good effort'):t('Keep practising');
const HDEFS=`<defs><radialGradient id="hhh"><stop offset="0" style="stop-color:var(--cs-hot-c);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--cs-hot-c);stop-opacity:0"/></radialGradient>
  <radialGradient id="hhb"><stop offset="0" style="stop-color:var(--cs-halo-c);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--cs-halo-c);stop-opacity:0"/></radialGradient>
  <linearGradient id="hsp" x1="0" x2="1"><stop offset="0" style="stop-color:var(--cs-hot-c);stop-opacity:0"/><stop offset=".5" style="stop-color:var(--cs-hot-c)"/><stop offset="1" style="stop-color:var(--cs-hot-c);stop-opacity:0"/></linearGradient>
  <linearGradient id="hsp2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--cs-hot-c);stop-opacity:0"/><stop offset=".5" style="stop-color:var(--cs-hot-c)"/><stop offset="1" style="stop-color:var(--cs-hot-c);stop-opacity:0"/></linearGradient>
  <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--cs-g1)"/><stop offset="1" style="stop-color:var(--cs-g2)"/></linearGradient></defs>`;
/* a flash of light at (x,y): glow, ring, cross flare */
function ignite(root,x,y,at){
  const g=root.querySelector('#hglow'),r=root.querySelector('#hring'),f=root.querySelector('#hflare');
  [g,r,f].forEach(e=>{if(e){e.style.transformBox='fill-box';e.style.transformOrigin='center';}});
  wa(g,[{opacity:0,transform:'scale(.2)'},{opacity:.95,transform:'scale(1.5)',offset:.35},{opacity:.5,transform:'scale(1)'}],{delay:at,duration:1300});
  wa(r,[{opacity:0,transform:'scale(.5)'},{opacity:.9,transform:'scale(.6)',offset:.02},{opacity:0,transform:'scale(4)'}],{delay:at+20,duration:1100});
  wa(f,[{opacity:0,transform:'scale(.1) rotate(0)'},{opacity:1,transform:'scale(1) rotate(0)',offset:.3},{opacity:0,transform:'scale(1.25) rotate(14deg)'}],{delay:at+30,duration:1300});
}
const igniteSvg=(x,y,r)=>`<circle id="hglow" cx="${x}" cy="${y}" r="${r}" fill="url(#hhh)" opacity="0"/><circle id="hring" cx="${x}" cy="${y}" r="9" fill="none" class="cs-ping" opacity="0"/>
  <g id="hflare" opacity="0"><rect x="${x-62}" y="${y-1}" width="124" height="2" fill="url(#hsp)"/><rect x="${x-1}" y="${y-62}" width="2" height="124" fill="url(#hsp2)"/></g>`;

/* CARDS — the deck fans out, gathers into a stack, and the top card lights up */
function heroCards(){
  const cards=[0,1,2,3,4].map(i=>`<g class="fb" id="hk${i}"><rect x="83" y="42" width="74" height="104" rx="13" class="ch-card"/><rect x="95" y="58" width="28" height="5" rx="2.5" class="ch-ln"/><rect x="95" y="70" width="46" height="4" rx="2" class="ch-ln2"/><rect x="95" y="80" width="38" height="4" rx="2" class="ch-ln2"/></g>`).join('');
  return {svg:`<svg viewBox="0 0 240 190" aria-hidden="true">${HDEFS}${igniteSvg(120,94,72)}${cards}<g id="hstar" class="fb"><path class="cs-hot" d="${cStarP(120,100,17)}"/></g></svg>`,
  run(root){
    const T=1900,fx=mkFx(60);
    [0,1,2,3,4].forEach(i=>{
      const fan=`translate(${(i-2)*34}px,${Math.abs(i-2)*7}px) rotate(${(i-2)*15}deg)`,stack=`translate(${(i-4)*-1.5}px,${(i-4)*2.4}px) rotate(${(i-2)*1.3}deg)`;
      wa(root.querySelector('#hk'+i),[
        {opacity:0,transform:'translateY(-50px) rotate(0deg)',offset:0},
        {opacity:1,transform:'translateY(0) rotate(0deg)',offset:.2},

        {opacity:1,transform:fan,offset:.5},
        {opacity:1,transform:fan,offset:.58},
        {opacity:1,transform:stack,offset:.8},
        {opacity:1,transform:stack,offset:1}],{delay:i*80,duration:T,easing:'cubic-bezier(.4,0,.2,1)'});
    });
    const hs=root.querySelector('#hstar');
    wa(hs,[{transform:'scale(0) rotate(-60deg)',opacity:0},{transform:'scale(1.5) rotate(8deg)',opacity:1,offset:.5},{transform:'scale(1) rotate(0)',opacity:1}],{delay:1560,duration:850,easing:CE.soft});
    ignite(root,120,100,1560);
    fx.later(1580,()=>sparkAt(fx,cen(hs),30,false));
    celSound(t0=>{const A=CAU,t=x=>t0+x;
      for(let i=0;i<5;i++)A.noise(t(.04+i*.08),.07,3400,1300,.05,.8,'bandpass',.004);
      A.noise(t(.5),.45,500,2600,.05,.9,'bandpass',.12);A.sweep(320,820,t(.55),.4,.03);
      A.noise(t(1.4),.12,1800,500,.05,.8,'bandpass',.005);A.thump(t(1.43),.1);
      A.bell(CN.E6,t(1.58),.09,2.2,1.3);A.bell(CN.A6,t(1.6),.06,2.2,1.3);
      [CN.C6,CN.E6,CN.G6,CN.C7].forEach((f,i)=>A.bell(f,t(1.68+i*.07),.04,1.1,1.4));
      A.pad([CN.A3,CN.E5],t(1.5),2.4,.05,.3);});
  }};
}

/* LEARN — each mastered word becomes a star; they join into a ring and the centre ignites */
function heroLearn(o){
  const k=Math.max(3,Math.min(9,o.n||5)),cx=120,cy=100,R=66;
  const pts=Array.from({length:k},(_,i)=>{const a=(-90+i*360/k)*Math.PI/180;return [cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  const lines=pts.map((p,i)=>{const b=pts[(i+1)%k];return `<line id="hl${i}" class="cl on" x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;}).join('');
  const stars=pts.map((p,i)=>`<g class="fb" id="hs${i}"><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="18" fill="url(#hhb)"/><path class="cs-s" d="${cStarP(p[0].toFixed(1),p[1].toFixed(1),10)}"/></g>`).join('');
  return {svg:`<svg viewBox="0 0 240 200" aria-hidden="true">${HDEFS}${igniteSvg(cx,cy,78)}<g id="hrot" style="transform-origin:${cx}px ${cy}px">${lines}${stars}</g><g id="hstar" class="fb"><path class="cs-hot" d="${cStarP(cx,cy,24)}"/></g></svg>`,
  run(root){
    const fx=mkFx(60),step=.12,s0=.2,end=s0+k*step+.3;
    pts.forEach((p,i)=>{
      wa(root.querySelector('#hs'+i),[{opacity:0,transform:'scale(0) rotate(-40deg)'},{opacity:1,transform:'scale(1.5) rotate(6deg)',offset:.55},{opacity:1,transform:'scale(1) rotate(0)'}],{delay:(s0+i*step)*1000,duration:560,easing:CE.soft});
      const ln=root.querySelector('#hl'+(i===0?k-1:i-1));
      if(ln&&(i>0)){const len=ln.getTotalLength();ln.style.strokeDasharray=len;wa(ln,[{strokeDashoffset:len},{strokeDashoffset:0}],{delay:(s0+i*step+.05)*1000,duration:260,easing:CE.soft});}
      else if(ln&&i===0){ln.style.opacity=0;}
    });
    /* the last line closes the ring */
    const lst=root.querySelector('#hl'+(k-1));
    if(lst){lst.style.opacity=1;const len=lst.getTotalLength();lst.style.strokeDasharray=len;wa(lst,[{strokeDashoffset:len},{strokeDashoffset:0}],{delay:(s0+(k-1)*step+.3)*1000,duration:320,easing:CE.soft});}
    const hs=root.querySelector('#hstar');
    wa(hs,[{transform:'scale(0) rotate(-80deg)',opacity:0},{transform:'scale(1.5) rotate(10deg)',opacity:1,offset:.5},{transform:'scale(1) rotate(0)',opacity:1}],{delay:end*1000,duration:900,easing:CE.soft});
    ignite(root,cx,cy,end*1000);
    wa(root.querySelector('#hrot'),[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{delay:(end+.6)*1000,duration:70000,iterations:Infinity,easing:'linear'});
    pts.forEach((p,i)=>fx.later((s0+i*step)*1000+120,()=>{const e=root.querySelector('#hs'+i);if(e)sparkAt(fx,cen(e),5,false);}));
    fx.later(end*1000+60,()=>sparkAt(fx,cen(hs),36,true));
    celSound(t0=>{const A=CAU,t=x=>t0+x;
      for(let i=0;i<k;i++)A.pluck(PENT[i%PENT.length],t(s0+i*step),.12,.8);
      A.bell(CN.C6,t(end),.1,2.2);A.bell(CN.G6,t(end+.02),.07,2.2);A.bell(CN.E7,t(end+.04),.04,2.2,1.5);
      A.pad([CN.C4,CN.G4,CN.E5],t(end-.1),3,.07,.4);});
  }};
}

/* TEST — the ring fills with a comet at its tip; stars light as the score passes them */
const TEST_TH=[50,70,90];
function heroTest(o){
  const pct=Math.max(0,Math.min(100,o.pct|0)),r=82,c=2*Math.PI*r;
  const stars=TEST_TH.map((th,k)=>{const x=64+k*36,y=226;
    return `<g class="fb" id="hst${k}"><path class="cs-ghost" d="${cStarP(x,y,13)}"/><g class="fb" id="hsl${k}" opacity="0"><path class="cs-hot" d="${cStarP(x,y,13)}"/></g></g>`;}).join('');
  return {svg:`<svg viewBox="0 0 200 250" aria-hidden="true">${HDEFS}<circle class="ch-track" cx="100" cy="100" r="${r}" stroke-width="11"/>
    <circle id="hfill" cx="100" cy="100" r="${r}" fill="none" stroke="url(#hg)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" transform="rotate(-90 100 100)"/>
    <g id="hcomet" style="transform-origin:100px 100px;${pct?'':'opacity:0'}"><circle cx="100" cy="18" r="13" fill="url(#hhh)"/><circle cx="100" cy="18" r="3.8" style="fill:var(--cs-hot)"/></g>
    <text id="hnum" class="ch-num" x="100" y="116">0%</text>${stars}</svg>`,
  run(root){
    const fx=mkFx(60),DUR=celRM?1:1500,fill=root.querySelector('#hfill'),comet=root.querySelector('#hcomet'),num=root.querySelector('#hnum');
    const lit=[false,false,false];
    const light=k=>{
      lit[k]=true;const g=root.querySelector('#hsl'+k);
      wa(g,[{opacity:0,transform:'scale(.2) rotate(-50deg)'},{opacity:1,transform:'scale(1.6) rotate(8deg)',offset:.55},{opacity:1,transform:'scale(1) rotate(0)'}],{duration:620,easing:CE.soft});
      sparkAt(fx,cen(g),10,false);
    };
    const t0=performance.now();
    (function f(now){
      if(!fill.isConnected)return;
      const x=Math.min(1,(now-t0)/DUR),p=1-Math.pow(1-x,4),v=pct*p;
      fill.setAttribute('stroke-dashoffset',(c*(1-v/100)).toFixed(2));
      comet.style.transform=`rotate(${(v*3.6).toFixed(2)}deg)`;
      num.textContent=Math.round(v)+'%';
      TEST_TH.forEach((th,k)=>{if(!lit[k]&&pct>=th&&v>=th-.001)light(k);});
      if(x<1)requestAnimationFrame(f);
      else{
        num.textContent=pct+'%';
        if(pct>=80){const cc=cen(comet.querySelector('circle:last-child'));sparkAt(fx,{x:cc.x,y:cc.y},34,true);}
        wa(comet,[{opacity:1},{opacity:0}],{delay:200,duration:600});
      }
    })(t0);
    celSound(t0s=>{const A=CAU,t=x=>t0s+x,d=DUR/1000;
      for(let i=0;i<8;i++)A.tick(t(.08+i*.17),.035+i*.003,1100+i*90);
      const notes=[CN.E6,CN.G6,CN.C7];
      TEST_TH.forEach((th,k)=>{if(pct>=th){const x=th>=pct?1:1-Math.pow(1-th/pct,.25);A.bell(notes[k],t(x*d),.08,1.8,1.3);}});
      if(pct>=80){A.bell(CN.D6,t(d+.05),.08,2.4,1.3);A.bell(CN.A6,t(d+.07),.06,2.4,1.3);A.pad([CN.D3,CN.A3,CN.D5],t(d),3,.06,.3);}
      else if(pct>=50)A.bell(CN.A5,t(d+.05),.06,1.6);});
  }};
}

/* MATCH — pairs are joined by threads of light; the hub star ignites when all are linked */
function heroMatch(o){
  const n=Math.max(3,Math.min(6,o.n||6)),ys=Array.from({length:n},(_,i)=>24+i*(132/(n-1))),sh=Math.ceil(n/2);

/* sharpen what the engine sees: right size, light text on dark flipped to dark on light, contrast stretched, a quiet margin */
async function ocrPrepare(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){bmp=await createImageBitmap(file);}
  const long=Math.max(bmp.width,bmp.height);
  let k=1;
  if(long<1600)k=Math.min(3,1600/long);
  else if(long>3400)k=3400/long;
  const w=Math.round(bmp.width*k),h=Math.round(bmp.height*k),pad=Math.round(Math.max(w,h)*.02)+12;
  const c=document.createElement('canvas');c.width=w+pad*2;c.height=h+pad*2;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality='high';x.drawImage(bmp,pad,pad,w,h);
  const img=x.getImageData(0,0,c.width,c.height),d=img.data,n=d.length/4;
  const g=new Uint8ClampedArray(n),hist=new Uint32Array(256);let sum=0;
  for(let i=0,j=0;i<d.length;i+=4,j++){const v=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;g[j]=v;hist[v]++;sum+=v;}
  const mean=sum/n;
  /* more than half of the picture dark → a dark theme: flip it */
  let dark=0;for(let v=0;v<128;v++)dark+=hist[v];
  const invert=dark/n>0.55&&mean<125;
  if(invert){for(let j=0;j<n;j++)g[j]=255-g[j];hist.reverse();}
  /* stretch between the 1st and the 99th percentile */
  let acc=0,lo=0,hi=255;
  for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*.01){lo=v;break;}}
  acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>=n*.01){hi=v;break;}}
  const span=Math.max(40,hi-lo);
  for(let i=0,j=0;i<d.length;i+=4,j++){const v=Math.max(0,Math.min(255,(g[j]-lo)*255/span));d[i]=d[i+1]=d[i+2]=v;}
  x.putImageData(img,0,0);

  const tilt=ocrSkew(c);
  if(Math.abs(tilt)>=.6){
    const r=tilt*Math.PI/180,cw=c.width,ch=c.height;
    const nw=Math.ceil(Math.abs(cw*Math.cos(r))+Math.abs(ch*Math.sin(r))),nh=Math.ceil(Math.abs(cw*Math.sin(r))+Math.abs(ch*Math.cos(r)));
    const c2=document.createElement('canvas');c2.width=nw;c2.height=nh;
    const y=c2.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,nw,nh);
    y.translate(nw/2,nh/2);y.rotate(-r);y.imageSmoothingQuality='high';y.drawImage(c,-cw/2,-ch/2);

  }

}
/* projection profile: the right angle puts the ink of each text line into as few rows as possible */
function ocrSkew(c){
  const k=Math.min(1,700/Math.max(c.width,c.height)),w=Math.max(1,Math.round(c.width*k)),h=Math.max(1,Math.round(c.height*k));
  const s=document.createElement('canvas');s.width=w;s.height=h;
  const x=s.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,pts=[];
  for(let yy=0;yy<h;yy+=1)for(let xx=0;xx<w;xx+=1){if(d[(yy*w+xx)*4]<110)pts.push(xx,yy);}
  if(pts.length<400)return 0;
  const step=pts.length>120000?4:2;
  const score=deg=>{
    const r=deg*Math.PI/180,sn=Math.sin(r),cs=Math.cos(r),bins=new Float64Array(w+h+4),off=w+2;
    for(let i=0;i<pts.length;i+=step){const yy=pts[i+1]*cs-pts[i]*sn;bins[Math.round(yy)+off]++;}
    let q=0;for(let i=0;i<bins.length;i++)q+=bins[i]*bins[i];return q;
  };
  let best=0,bs=score(0);const base=bs;
  for(let a=-8;a<=8;a+=.5){if(!a)continue;const v=score(a);if(v>bs){bs=v;best=a;}}
  for(let a=best-.4;a<=best+.4;a+=.1){const v=score(a);if(v>bs){bs=v;best=a;}}
  return bs>base*1.04?Math.round(best*10)/10:0;
}
/* the engine returns lines; turn them back into headings and paragraphs a person would read */
function ocrTidy(data){
  const med=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[a.length>>1]:0;};
  let L=(data.lines||[]).map(l=>({t:(l.text||'').replace(/\s+/g,' ').trim(),c:l.confidence==null?100:l.confidence,x0:l.bbox.x0,x1:l.bbox.x1,y0:l.bbox.y0,y1:l.bbox.y1}));
  if(!L.length){
    L=String(data.text||'').split(/\n+/).map(t=>({t:t.replace(/\s+/g,' ').trim(),c:data.confidence==null?100:data.confidence,x0:0,x1:100,y0:0,y1:10})).map((l,i)=>Object.assign(l,{y0:i*30,y1:i*30+10}));
  }
  /* interface debris: no letters, or an unsure scrap of a few characters */
  L=L.filter(l=>{
    if(!l.t)return false;
    const letters=(l.t.match(/\p{L}/gu)||[]).length;
    if(letters<2)return false;
    if(letters/l.t.length<.45&&l.t.length<30)return false;
    if(l.c<30&&l.t.length<14)return false;
    return true;
  });
  L.forEach(l=>{l.h=l.y1-l.y0;});
  const body=L.filter(l=>l.t.length>=12);
  const medH=med((body.length?body:L).map(l=>l.h))||20;
  const rights=(body.length?body:L).map(l=>l.x1).sort((x,y)=>x-y);
  const maxR=rights.length?rights[Math.floor(rights.length*.9)]:0;
  const BUL=/^[•·▪●◦■□○*-–—]\s+/;
  const SENT=/[.!?…”"’')]$/;
  const paras=[];let cur=null;
  L.forEach((l,i)=>{
    const head=l.h>1.3*medH&&l.t.length<130;
    const prev=i?L[i-1]:null;
    let brk=!cur||!prev;
    if(!brk){
      const gap=l.y0-prev.y1;
      const prevHead=cur.head;
      if(head!==prevHead)brk=true;
      else if(head&&Math.abs(l.h-prev.h)>.25*medH)brk=true;
      else if(l.y0<prev.y0-medH)brk=true;                               /* back up the page: a new column or block */
      else if(gap>.75*medH)brk=true;
      else if(BUL.test(l.t))brk=true;
      else if(SENT.test(prev.t)&&prev.x1<maxR*.8&&/^[\p{Lu}“‘"]/u.test(l.t)&&!head)brk=true;   /* a short last line ends the paragraph */
    }
    if(brk){cur={head,lines:[l]};paras.push(cur);}else cur.lines.push(l);
  });
  const join=lines=>{
    let out='';
    lines.forEach((l,i)=>{
      const t=l.t;
      if(!i){out=t;return;}
      if(/\p{L}-$/u.test(out)&&/^\p{Ll}/u.test(t))out=out.slice(0,-1)+t;   /* exam-\nple → example */
      else out+=' '+t;
    });
    return out;
  };
  const fix=t=>t
    .replace(BUL,'• ')
    .replace(/(^|\s)\|(?=\s|$)/g,'$1I')                    /* a lone bar is an "I" */
    .replace(/(^|\s)l(?=\s)/g,'$1I')                        /* so is a lone small L */
    .replace(/\s+([,.;:!?])/g,'$1')
    .replace(/([“‘(])\s+/g,'$1').replace(/\s+([”’)])/g,'$1')
    .replace(/\s{2,}/g,' ').trim();
  let title='';const out=[];
  paras.forEach(p=>{
    const t=fix(join(p.lines));if(!t)return;
    const c=p.lines.reduce((a,l)=>a+l.c,0)/p.lines.length;
    if(p.head){if(!title)title=t;else out.push({t:'## '+t,c});}
    else out.push({t,c});
  });
  const total=out.reduce((a,p)=>a+p.t.length,0)||1;
  const conf=Math.round(out.reduce((a,p)=>a+p.c*p.t.length,0)/total);
  return {title,body:out.map(p=>p.t).join('\n\n'),conf};
}
async function ocrRead(file,lang,onProg){
  _ocrProg=onProg||null;

/* which words of the text are already in the learner's lists (1 = still learning, 2 = learned) */
function knownMap(lang){

function txNorm(s){
  return String(s||'').replace(/\r\n?/g,'\n').replace(/[ \t ]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim()
    .split(/\n{2,}/).map(p=>p.replace(/\n(?![•·▪●◦■□○*–—-]\s|##\s)/g,' ')).join('\n\n');
}
function txTitleOf(body){
  const ps=body.split(/\n{2,}/);
  if(ps.length>1&&ps[0].length<=90&&!/[.!?…:;,”"]$/.test(ps[0])&&!/^##/.test(ps[0]))return{title:ps[0],body:ps.slice(1).join('\n\n')};
  const w=body.split(/\s+/).slice(0,6).join(' ');
  return{title:w+(body.split(/\s+/).length>6?'…':''),body};
}
function txPasteGo(){
  const raw=$('#txIn')?$('#txIn').value:'';
  if(!raw.trim())return toast(t('Paste or type the text here…'));
  const lang=($('#txLang')&&$('#txLang').value)||TXLANG||targetLang();TXLANG=lang;try{localStorage.setItem(TXK,lang);}catch(e){}
  const {title,body}=txTitleOf(txNorm(raw));

  texts().push(x);save();closeSheet();go('read',{id:x.id});
}
async function txClip(){
  try{
    if(navigator.clipboard&&navigator.clipboard.read){
      const items=await navigator.clipboard.read();
      for(const it of items){const ty=it.types.find(x=>/^image\//.test(x));if(ty){const b=await it.getType(ty);return txFiles([new File([b],'clipboard.png',{type:ty})]);}}
      for(const it of items){if(it.types.includes('text/plain')){const tx=await(await it.getType('text/plain')).text();if(tx.trim()){$('#txIn').value=tx;return txPasteGo();}}}
    }else if(navigator.clipboard&&navigator.clipboard.readText){
      const tx=await navigator.clipboard.readText();if(tx.trim()){$('#txIn').value=tx;return txPasteGo();}
    }
    toast(t('The clipboard is empty'));
  }catch(e){toast(t('Can’t read the clipboard — paste into the box below'));const i=$('#txIn');if(i)i.focus();}
}
function txProg(i,n,m,url){
  const st=$('#txSt'),bar=$('#txBar');if(!st||!bar)return;
  const pre=n>1?`${t('Page')} ${i+1} ${t('of')} ${n} · `:'';
  let txt,p=null;
  if(m.status==='prep'){txt=t('Preparing the image…');p=.03;}
  else if(m.status==='recognizing text'){txt=t('Reading the text…');p=.15+.85*(m.progress||0);}
  else if(m.status){txt=t('Loading the recognizer (only the first time, about 7 MB)…');p=.08;}
  if(txt)st.textContent=pre+txt;
  if(p!=null){const v=Math.max(0,Math.min(1,(i+p)/n));bar.style.width=(v*100).toFixed(1)+'%';}
}
function txCancel(){OCRCANCEL=true;try{if(_ocr){_ocr.terminate();_ocr=null;_ocrCode=null;}}catch(e){}closeSheet();}
async function txFiles(fl){
  const files=[...(fl||[])].filter(f=>/^image\//.test(f.type)||/\.(png|jpe?g|webp|heic|heif|gif|bmp)$/i.test(f.name||''));
  if(!files.length)return;
  const lang=($('#txLang')&&$('#txLang').value)||TXLANG||targetLang();TXLANG=lang;try{localStorage.setItem(TXK,lang);}catch(e){}
  OCRCANCEL=false;
  const urls=files.map(f=>URL.createObjectURL(f)),n=files.length;
  closeSheet();
  setTimeout(()=>sheet(`<h2>${t('Reading the text…')}</h2>
    <img class="txprev" src="${urls[0]}" alt="">
    <div class="txbarw"><div class="txbar" id="txBar"></div></div>
    <div class="hint" id="txSt" style="margin-top:8px">${t('Preparing the image…')}</div>
    <button class="btn ghost" style="margin-top:12px" onclick="txCancel()">${t('Cancel')}</button>`),200);
  await new Promise(r=>setTimeout(r,260));
  try{
    const parts=[];
    for(let i=0;i<n;i++){
      if(OCRCANCEL)return;
      parts.push(await ocrRead(files[i],lang,m=>txProg(i,n,m)));
    }
    if(OCRCANCEL)return;
    let title='',bodies=[];
    parts.forEach((r,i)=>{
      if(r.title){if(!title&&i===0)title=r.title;else bodies.push('## '+r.title);}
      if(r.body)bodies.push(r.body);
    });
    const body=bodies.join('\n\n').trim();
    if(!body){closeSheet();setTimeout(()=>sheet(`<h2>${t('Reading the text…')}</h2><p style="color:var(--mut);margin:0 0 14px">${t('No text found in the picture.')}</p><button class="btn pri" onclick="closeSheet()">OK</button>`),220);return;}
    const conf=Math.round(parts.reduce((a,r)=>a+r.conf,0)/parts.length);
    TD={id:null,title,body,lang,conf,imgs:urls,ocr:true};
    closeSheet();go('tedit');
  }catch(e){
    if(OCRCANCEL)return;
    closeSheet();setTimeout(()=>sheet(`<h2>${t('Reading the text…')}</h2><p style="color:var(--mut);margin:0 0 14px">${t('Couldn’t read the text. Try another picture or paste the text.')}</p><button class="btn pri" onclick="closeSheet()">OK</button>`),220);
  }
}
