/* send only what actually changed — a whole library per answer is wasteful */
async function cloudPush(){
  if(!cloudEnabled())return;
  await ensureAuth();
  if(syncing)return;
  const dirtySets=S.sets.filter(s=>!s.synced);
  const dirtyWords=[];
  S.sets.forEach(s=>s.words.forEach((w,i)=>{if(!w.synced)dirtyWords.push({w,s,i});}));
  const prefsDirty=!noPrefsSync&&(((S.stats.upd||0)>0&&(S.stats.upd||0)!==statsSyncedUpd)||(!noSettingsCol&&(S.settings.upd||0)>0&&(S.settings.upd||0)!==settingsSyncedUpd));
  if(!dirtySets.length&&!dirtyWords.length&&!prefsDirty)return;
  syncing=true;pushErr='';
  try{
    const me=AUTH.user.id;
    if(dirtySets.length){
      const rows=dirtySets.map(s=>({id:s.id,owner_id:me,name:s.name,position:S.sets.indexOf(s),deleted:false,
        updated_at:new Date(s.upd||Date.now()).toISOString()}));
      const {error}=await sb.from('sets').upsert(withLang(rows,dirtySets));
      /* an older database has no lang column yet — send the rest rather than stall the sync */
      if(error&&!noLangCol&&missingLangCol(error)){
        noLangCol=true;
        const r2=await sb.from('sets').upsert(rows);
        if(!r2.error)dirtySets.forEach(s=>s.synced=true);
      }
      else if(!error)dirtySets.forEach(s=>s.synced=true);
      else pushErr=errText(error).slice(0,140)||'error';
    }
    for(let i=0;i<dirtyWords.length;i+=200){
      let slice=dirtyWords.slice(i,i+200);
      try{
        const {data:rem,error:re}=await sb.from('words').select('id,en,ru,ex,ipa,deleted').in('id',slice.map(x=>x.w.id));
        if(!re&&rem){
          const gone=new Set();
          rem.forEach(r=>{
            const x=slice.find(y=>y.w.id===r.id);if(!x)return;const w=x.w;
            if(r.deleted){gone.add(w.id);return;}                         /* removed by the other side */
            if(w.sv!==undefined&&th(w)===w.sv&&thRow(r)!==w.sv){w.en=r.en;w.ru=r.ru||'';w.ex=r.ex||'';w.ipa=r.ipa||'';}   /* we only studied it: keep their wording */
          });
          if(gone.size){S.sets.forEach(st=>{st.words=st.words.filter(w=>!gone.has(w.id));});slice=slice.filter(x=>!gone.has(x.w.id));}
        }
      }catch(e){}
      if(!slice.length)continue;
      const mkRows=()=>slice.map(({w,s,i:pos})=>withAat({id:w.id,set_id:s.id,owner_id:me,en:w.en,ru:w.ru||'',ex:w.ex||'',
        ipa:w.ipa||'',due:w.due||0,rep:w.rep||0,box:w.box||0,arch:!!w.arch,aat:w.aat||0,mark:w.arch?0:(w.mark||0),ok:w.ok||0,bad:w.bad||0,position:(w.pos!=null?w.pos:pos),
        deleted:false,updated_at:new Date(w.upd||Date.now()).toISOString()}));
      const {error}=await aatRetry(()=>sb.from('words').upsert(mkRows()));
      if(!error)slice.forEach(({w})=>{w.synced=true;w.sv=th(w);});
      else pushErr=errText(error).slice(0,140)||'error';
    }
    if(prefsDirty)await pushPrefs(me);
    persist();
  }catch(e){}
  syncing=false;
  if(PULLAGAIN){PULLAGAIN=false;setTimeout(()=>cloudPull().then(softRender),250);}
}
/* the server caps how many rows one reply may carry, so ask page by page */
async function fetchPaged(table,ownerId){
  const PAGE=1000;let from=0,rows=[];
  for(;;){
    const {data,error}=await sb.from(table).select('*').eq('owner_id',ownerId).eq('deleted',false).range(from,from+PAGE-1);
    if(error)return {rows,complete:false};
    rows=rows.concat((data||[]).filter(r=>okId(r.id)&&(table==='sets'||okId(r.set_id))).map(r=>{if(table==='sets'&&!okLang(r.lang))r.lang='en';return r;}));
    if(!data||data.length<PAGE)return {rows,complete:true};
    from+=PAGE;
    if(from>100000)return {rows,complete:false};   /* never loop forever */
  }
}
async function cloudPull(){
  if(!cloudEnabled())return;
  await ensureAuth();
  if(syncing){PULLAGAIN=true;return;}
  syncing=true;
  try{
    const me=AUTH.user.id;
    const [rs,rw]=await Promise.all([fetchPaged('sets',me),fetchPaged('words',me)]);
    if(!rs.complete||!rw.complete){
      /* a partial answer must never look like "everything else was deleted" */
      mergeCloud(rs.rows,rw.rows,false);await pullPrefs(me);syncing=false;return;
    }
    mergeCloud(rs.rows,rw.rows,true);
    await pullPrefs(me);
  }catch(e){}
  syncing=false;
  if(PULLAGAIN){PULLAGAIN=false;setTimeout(()=>cloudPull().then(softRender),250);}
}
const th=w=>[w.en,w.ru||'',w.ex||'',w.ipa||''].join('\u0001');
const thRow=r=>[r.en,r.ru||'',r.ex||'',r.ipa||''].join('\u0001');
function mergeCloud(cs,cw,authoritative){
  try{
    const setIds=new Set(cs.map(x=>x.id)),wordIds=new Set(cw.map(x=>x.id));
    cs.forEach(c=>{
      const u=+new Date(c.updated_at),l=S.sets.find(x=>x.id===c.id);
      /* a row from a database without the column keeps whatever language we already had */
      const cl=LANG_MAP[c.lang]?c.lang:null;
      if(!l)S.sets.push({id:c.id,name:c.name,lang:cl||DEF_LANG,words:[],upd:u,synced:true});
      else if(l.synced?u!==(l.upd||0):u>(l.upd||0)){l.name=c.name;if(cl)l.lang=cl;l.upd=u;l.synced=true;}
    });
    if(authoritative)S.sets=S.sets.filter(s=>setIds.has(s.id)||!s.synced);
    cw.forEach(c=>{
      const s=S.sets.find(x=>x.id===c.set_id);if(!s)return;
      const u=+new Date(c.updated_at);
      /* a word that changed list (moved into the archive holder) must not appear twice */
      const other=findWord(c.id);
      if(other&&other.s!==s){
        if(other.w.synced===false||u<=(other.w.upd||0))return;
        other.s.words=other.s.words.filter(x=>x!==other.w);
      }
      const l=s.words.find(x=>x.id===c.id);
      if(!l)s.words.push({id:c.id,en:c.en,ru:c.ru||'',ex:c.ex||'',ipa:c.ipa||'',due:c.due||0,rep:c.rep||0,box:c.box||0,arch:!!c.arch,aat:c.aat||0,mark:c.arch?0:(c.mark||0),pos:Number.isFinite(c.position)?c.position:0,ok:c.ok||0,bad:c.bad||0,added:u,upd:u,synced:true});
      else if(l.synced?u!==(l.upd||0):u>(l.upd||0))Object.assign(l,{en:c.en,ru:c.ru||'',ex:c.ex||'',ipa:c.ipa||'',due:c.due||0,rep:c.rep||0,box:c.box||0,arch:!!c.arch,aat:c.aat||0,mark:c.arch?0:(c.mark||0),pos:Number.isFinite(c.position)?c.position:(l.pos||0),ok:c.ok||0,bad:c.bad||0,upd:u,synced:true});
    });
    cw.forEach(c=>{const f=findWord(c.id);if(f&&f.w.synced)f.w.sv=thRow(c);});   /* the text as the server last had it */
    if(authoritative)S.sets.forEach(s=>{s.words=s.words.filter(w=>wordIds.has(w.id)||!w.synced);});
    S.sets.forEach(sortPos);
    _lgIdx=null;
    persist();
  }catch(e){}
}

/* search ignores case and accents (kenyer finds kenyér) */
const fold=x=>String(x==null?'':x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

/* Russian <-> English name matching: "ясм" finds "Yasmina", "alex" finds "Алексей" */
const XL_MAP={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'i',ь:'',э:'e',ю:'yu',я:'ya'};
function xlLoose(x){
  let r=String(x==null?'':x).toLowerCase().replace(/ё/g,'е').normalize('NFD').replace(/[̀-ͯ]/g,'');
  r=r.replace(/[а-я]/g,c=>XL_MAP[c]!==undefined?XL_MAP[c]:c);
  r=r.replace(/ph/g,'f').replace(/kh/g,'h').replace(/ck/g,'k').replace(/x/g,'ks').replace(/[yj]/g,'i').replace(/c(?![h])/g,'k').replace(/w/g,'v').replace(/q/g,'k');
  r=r.replace(/h/g,'').replace(/([a-z])\1+/g,'$1').replace(/[^a-z0-9 ]/g,'');
  return r.replace(/\s+/g,' ').trim();
}
function nameHit(name,q){
  const a=fold(name),b=fold(q);
  if(!b)return true;
  if(a.includes(b))return true;
  const la=xlLoose(name),lb=xlLoose(q);
  return !!lb&&la.includes(lb);
}

function inlineCommit(){

        catch(e){w.en=old.en;w.ru=old.ru;toast(srvMsg(e,t('Couldn’t save — check your connection')));const l=$('#tl');if(l)l._h='';tDrawWords(false);}

  if(f&&(f.w.en!==en||f.w.ru!==ru)){f.w.en=en;f.w.ru=ru;touch(f.w);save();}

let delTimer=0;

  clearTimeout(delTimer);

    const i=TV.words.findIndex(x=>x.id===id);if(i<0)return;

    tDrawWords(false);toast(t('Deleted'));
    (async()=>{
      try{const {error}=await sb.from('words').update({deleted:true,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;}
      catch(e){TV.words.push(w);const l=$('#tl');if(l)l._h='';toast(srvMsg(e,t('Couldn’t delete')));tDrawWords(false);}
    })();
    return;
  }
  const f=findWord(id);if(!f)return;
  cloudDeleteWord(f.w);f.s.words=f.s.words.filter(w=>w.id!==id);save();
  const row=rowEl(id);if(row)row.remove();

}
let noClickUntil=0;
document.addEventListener('click',e=>{
  const tg=e.target;if(!tg||!tg.closest)return;
  if(Date.now()<noClickUntil){e.stopPropagation();e.preventDefault();return;}   /* the tap that ends a swipe or a drag */
  const sb=tg.closest('.swact button');

  const b=tg.closest('.racts .ra');

},true);
document.addEventListener('keydown',e=>{
  if(!inl||!e.target.classList||!e.target.classList.contains('inl'))return;
  if(e.key==='Escape'){e.preventDefault();inlineCancel();}
  else if(e.key==='Enter'){

    else inlineCommit();

});
document.addEventListener('focusout',e=>{
  if(!inl||!e.target.classList||!e.target.classList.contains('inl'))return;

    if(!inl)return;

    inlineCommit();
  },0);
});

/* put the dragged words into their new order: the new order takes the places the words held before,
   so only the words that actually moved are changed (and synced) */
function slotOrder(words,ids,getP,setP){
  const byId=new Map(words.map(w=>[w.id,w])),set=new Set(ids);
  const ws=ids.map(i=>byId.get(i)).filter(Boolean);
  const idx=[];words.forEach((w,i)=>{if(set.has(w.id))idx.push(i);});
  if(!idx.length||idx.length!==ws.length)return null;
  const oldPos=idx.map(i=>getP(words[i])||0);
  const arr=words.slice();idx.forEach((i,k)=>{arr[i]=ws[k];});
  let tie=false;
  for(let k=1;k<oldPos.length;k++)if(oldPos[k]<=oldPos[k-1])tie=true;
  const nx=words[idx[idx.length-1]+1];
  if(nx&&(getP(nx)||0)<=oldPos[oldPos.length-1])tie=true;
  const changed=[];
  if(!tie){idx.forEach((i,k)=>{if((getP(arr[i])||0)!==oldPos[k]){setP(arr[i],oldPos[k]);changed.push(arr[i]);}});}
  else{   /* equal positions can't express an order: number the rest of the list afresh */
    const from=idx[0],base=oldPos[0];
    for(let i=from;i<arr.length;i++){if((getP(arr[i])||0)!==base+(i-from)){setP(arr[i],base+(i-from));changed.push(arr[i]);}}
  }
  return {arr,changed};
}
function reorderSet(ids){
  const s=curSet();if(!s)return;
  const r=slotOrder(s.words,ids,w=>w.pos,(w,p)=>{w.pos=p;touch(w);});
  if(!r)return;
  s.words=r.arr;save();
}
/* the teacher moves words in a student's list: the new positions go straight to the database */
async function tReorder(ids){
  const base=TV.base||[],old=new Map(base.map(w=>[w.id,w.position]));
  const r=slotOrder(base,ids,w=>w.position,(w,p)=>{w.position=p;});
  if(!r||!r.changed.length)return;
  const now=new Date().toISOString();
  try{
    for(let i=0;i<r.changed.length;i+=8){
      await Promise.all(r.changed.slice(i,i+8).map(async w=>{
        const {error}=await sb.from('words').update({position:w.position,updated_at:now}).eq('id',w.id);
        if(error)throw error;
      }));
    }
  }catch(e){
    r.changed.forEach(w=>{w.position=old.get(w.id);});
    toast(srvMsg(e,t('Couldn’t save — check your connection')));
    const l=$('#tl');if(l)l._h='';tDrawWords(false);
  }
}
function dragUpdate(){
  if(!dnd)return;
  const {row,list}=dnd;
  const dy0=dnd.y+window.scrollY-dnd.startY;
  const center=dnd.top0+dy0+row.offsetHeight/2;
  let p=row.previousElementSibling;
  while(p&&p.classList.contains('item')&&center<p.offsetTop+p.offsetHeight/2){list.insertBefore(row,p);p=row.previousElementSibling;}
  let n=row.nextElementSibling;
  while(n&&n.classList.contains('item')&&center>n.offsetTop+n.offsetHeight/2){list.insertBefore(n,row);n=row.nextElementSibling;}
  row.style.transform='translateY('+(dy0+(dnd.top0-row.offsetTop))+'px)';
}
function dragLoop(){
  if(!dnd)return;
  const y=dnd.y,H=window.innerHeight,edge=90;
  let v=0;
  if(y<edge+40)v=-Math.min(18,(edge+40-y)/4);else if(y>H-edge)v=Math.min(18,(y-(H-edge))/4);
  if(v)window.scrollBy(0,v);
  dragUpdate();
  dnd.raf=requestAnimationFrame(dragLoop);
}
function dragEnd(commit){
  if(!dnd)return;
  const d=dnd;dnd=null;cancelAnimationFrame(d.raf);
  try{d.grip.releasePointerCapture(d.pid);}catch(x){}
  d.row.classList.remove('dragging');d.row.style.transform='';document.body.classList.remove('dnding');noClickUntil=Date.now()+400;swReset();
  const ids=[...d.list.children].filter(r=>r.classList&&r.classList.contains('item')).map(r=>r.dataset.id);
  const moved=ids.join()!==d.ids.join();
  if(commit&&moved){if(isTeacherList())tReorder(ids);else reorderSet(ids);}
  else if(moved){   /* cancelled: put the rows back where they were */
    const m=new Map([...d.list.children].map(r=>[r.dataset&&r.dataset.id,r]));
    d.ids.forEach(id=>{const r=m.get(id);if(r)d.list.appendChild(r);});
  }
  if(isTeacherList())tDrawWords(false);
  else{softMode=true;try{render();}finally{softMode=false;}}

}
function dragBegin(row,cap,e,y){
  if(inl)inlineCommit();
  const list=row.parentElement;
  dnd={row,list,grip:cap,pid:e.pointerId,y:y,startY:y+window.scrollY,top0:row.offsetTop,raf:0,
       ids:[...list.children].filter(r=>r.classList&&r.classList.contains('item')).map(r=>r.dataset.id)};
  try{cap.setPointerCapture(e.pointerId);}catch(x){}
  row.classList.add('dragging');document.body.classList.add('dnding');
  try{navigator.vibrate&&navigator.vibrate(10);}catch(x){}
  dnd.raf=requestAnimationFrame(dragLoop);
}
/* swipe a word sideways to reveal Edit / Delete; hold it still for a moment to pick it up and move it */
const SWW=160;
let SW=null,swOpen=null;
function swClose(){
  if(swOpen){swOpen.classList.remove('swiped');swOpen=null;}
}
function swReset(){if(SW){clearTimeout(SW.timer);SW=null;}}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('.dgrip');
  if(g){
    if(dnd||(e.pointerType==='mouse'&&e.button!==0))return;
    const row=g.closest('.item');if(!row)return;
    e.preventDefault();dragBegin(row,g,e,e.clientY);return;
  }
  if(e.pointerType==='mouse'||dnd||markMode||selMode||(typeof tSelMode!=='undefined'&&tSelMode))return;
  const row=e.target.closest&&e.target.closest('.item[data-id]');
  if(swOpen&&(!row||row!==swOpen)&&!(e.target.closest&&e.target.closest('.swact')))swClose();
  if(!row||inl||e.target.closest('.swact,.spk,.inl'))return;
  swReset();
  SW={row,pid:e.pointerId,x:e.clientX,y:e.clientY,cy:e.clientY,mode:'',base:row===swOpen?-SWW:0,dx:0,timer:0};
  if(row.dataset.dr&&row!==swOpen){
    SW.timer=setTimeout(()=>{
      if(!SW||SW.mode||dnd)return;
      SW.mode='drag';
      dragBegin(row,row,e,SW.cy);
    },420);
  }
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!SW||dnd||e.pointerId!==SW.pid)return;
  SW.cy=e.clientY;
  const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.mode){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){
      clearTimeout(SW.timer);SW.mode='swipe';SW.row.style.transition='none';
      try{SW.row.setPointerCapture(SW.pid);}catch(x){}
    }
    else if(Math.abs(dy)>8){swReset();return;}   /* the page is scrolling */
    else return;
  }
  if(SW.mode==='swipe'){
    SW.dx=Math.max(-SWW,Math.min(0,SW.base+dx));
    SW.row.style.transform='translateX('+SW.dx+'px)';
  }
},{passive:true});
function swEnd(cancel){
  if(!SW)return;
  const w=SW;swReset();
  if(w.mode==='swipe'){
    w.row.style.transition='';w.row.style.transform='';
    noClickUntil=Date.now()+350;
    const open=!cancel&&w.dx<-SWW/2;
    if(swOpen&&swOpen!==w.row)swClose();
    w.row.classList.toggle('swiped',open);
    swOpen=open?w.row:null;
  }
}
document.addEventListener('pointerup',e=>{if(SW&&e.pointerId===SW.pid)swEnd(false);},{passive:true});
document.addEventListener('pointercancel',e=>{if(SW&&e.pointerId===SW.pid)swEnd(true);},{passive:true});
document.addEventListener('contextmenu',e=>{if(dnd||(SW&&SW.mode==='drag'))e.preventDefault();});
/* once a word is picked up the finger must move the word, not the page */
document.addEventListener('touchmove',e=>{if(dnd&&e.cancelable)e.preventDefault();},{passive:false});
window.addEventListener('scroll',()=>{if(swOpen&&!SW)swClose();},{passive:true});
document.addEventListener('pointermove',e=>{if(dnd&&e.pointerId===dnd.pid){dnd.y=e.clientY;e.preventDefault();}});
document.addEventListener('pointerup',e=>{if(dnd&&e.pointerId===dnd.pid)dragEnd(true);});
document.addEventListener('pointercancel',e=>{if(dnd&&e.pointerId===dnd.pid)dragEnd(false);});
document.addEventListener('keydown',e=>{if(dnd&&e.key==='Escape')dragEnd(false);});

let markMode=false,markColor=1;
const PS={drag:false,ids:new Set(),target:0,timer:null,sx:0,sy:0,touch:false,active:false};
function toggleMarkMode(){
  markMode=!markMode;
  if(markMode){selMode=false;selIds.clear();try{tSelMode=false;tSelIds.clear();}catch(e){}}
  document.body.classList.toggle('markmode',markMode);
  if(view.name==='twords')tDrawWords(false);else render();
}
function setMarkColor(c){
  markColor=c;
  document.querySelectorAll('#mbar .msw').forEach(b=>{const v=+(b.dataset.m||0);b.classList.toggle('on',v===c);});
}
const markbarHtml=()=>markMode?`<div class="markbar"><div class="in"><div class="mrow" id="mbar"><button class="msw none ${markColor===0?'on':''}" data-m="0" aria-label="${t('No color')}" onclick="setMarkColor(0)">✕</button>`+
  Array.from({length:MARKS},(_,i)=>`<button class="msw ${markColor===i+1?'on':''}" data-m="${i+1}" aria-label="${t('Color')} ${i+1}" onclick="setMarkColor(${i+1})"></button>`).join('')+
  `</div><button class="btn pri" onclick="toggleMarkMode()">${t('Done')}</button></div></div>`:'';
const markHint=()=>markMode?`<div class="markhint">${t('Tap a word or drag over several to highlight them.')}</div>`:'';
function rowAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.item[data-id]'):null;}
function paintRow(row){
  if(!row||PS.ids.has(row.dataset.id))return;
  PS.ids.add(row.dataset.id);
  if(PS.target)row.setAttribute('data-m',PS.target);else row.removeAttribute('data-m');
}
function paintEnd(){
  clearTimeout(PS.timer);
  if(!PS.active)return;
  const ids=[...PS.ids],c=PS.target;PS.active=false;PS.drag=false;PS.ids=new Set();
  if(!ids.length)return;
  if(view.name==='twords'){
    tPutMark(ids,c).then(ok=>{if(!ok)tDrawWords(false);}).catch(e=>{toast(srvMsg(e,t('Couldn’t update')));tDrawWords(false);});
  }else{
    const set=new Set(ids);
    S.sets.forEach(x=>x.words.forEach(w=>{if(set.has(w.id)&&!w.arch&&(w.mark||0)!==c){w.mark=c;touch(w);}}));
    save();
  }
}
document.addEventListener('pointerdown',e=>{
  if(!markMode)return;
  const row=e.target.closest&&e.target.closest('.item[data-id]');if(!row||e.target.closest('.spk'))return;
  PS.active=true;PS.ids=new Set();PS.touch=e.pointerType!=='mouse';PS.sx=e.clientX;PS.sy=e.clientY;
  const cur=+(row.getAttribute('data-m')||0);
  PS.target=(markColor===0||cur===markColor)?0:markColor;
  if(!PS.touch){PS.drag=true;paintRow(row);}
  else{
    PS.drag=false;
    PS.timer=setTimeout(()=>{PS.drag=true;paintRow(row);try{navigator.vibrate&&navigator.vibrate(8);}catch(x){}},260);
    PS.first=row;
  }
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!markMode||!PS.active)return;
  if(PS.touch&&!PS.drag){if(Math.abs(e.clientX-PS.sx)>10||Math.abs(e.clientY-PS.sy)>10){clearTimeout(PS.timer);PS.active=false;}return;}
  if(PS.drag)paintRow(rowAt(e.clientX,e.clientY));
},{passive:true});
document.addEventListener('pointerup',e=>{
  if(!markMode||!PS.active)return;
  if(PS.touch&&!PS.drag){clearTimeout(PS.timer);PS.drag=true;paintRow(PS.first);}   /* a plain tap */
  paintEnd();

function agoTxt(ts){
  if(!ts)return t('no activity yet');
  const d=Math.floor((Date.now()-ts)/DAY);
  if(d<=0)return t('active today');
  if(d===1)return t('active yesterday');
  if(d<7)return t('active')+' '+d+' '+plr(d,t('day'),t('day2'),t('days'))+' '+t('ago');
  if(d<30){const w=Math.round(d/7);return t('last seen')+' '+w+' '+plr(w,t('week'),t('week2'),t('weeks'))+' '+t('ago');}
  const mo=Math.round(d/30);return t('last seen')+' '+mo+' '+plr(mo,t('month'),t('month2'),t('months'))+' '+t('ago');
}
/* precise presence text: 'online now', '12 min ago', 'today at 14:32', 'yesterday at 09:05', … */
function seenTxt(ts){
  if(!ts)return t('no activity yet');
  const now=Date.now(),diff=now-ts,mn=Math.floor(diff/60000);
  const dt=new Date(ts),hm=dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
  if(mn<5)return t('online now');
  if(mn<60)return t('last seen')+' '+mn+' '+plr(mn,t('min'),t('min2'),t('mins'))+' '+t('ago');
  const day0=x=>{const d=new Date(x);d.setHours(0,0,0,0);return +d;};
  const dd=Math.round((day0(now)-day0(ts))/DAY);
  if(dd<=0)return t('last seen')+' '+t('today at')+' '+hm;
  if(dd===1)return t('last seen')+' '+t('yesterday at')+' '+hm;
  if(dd<7)return t('last seen')+' '+dd+' '+plr(dd,t('day'),t('day2'),t('days'))+' '+t('ago')+', '+hm;
  return agoTxt(ts);
}
function fmtDT(ts){

function tLearnDraw(sid){
  const el=$('#tLearn');if(!el||!TV||TV.sid!==sid)return;
  const stu=(AUTH.students||[]).find(x=>x.id===sid),st=stu&&stu.stats;if(!st||typeof st!=='object'){el.innerHTML='';return;}
  const ws=TV.words||[],byId=new Map(ws.map(w=>[w.id,w]));
  const conf=st.conf&&typeof st.conf==='object'?Object.values(st.conf):[];
  const act=conf.filter(p=>p&&!p.d&&(p.s||0)>=CF_SHOW&&byId.has(p.a)&&byId.has(p.b)).sort((a,b)=>(b.s||0)-(a.s||0)).slice(0,6);
  const fixed=conf.filter(p=>p&&p.d).length;
  let h='';
  if(act.length||fixed){
    h+=`<div class="subhead"><span class="t">${t('Often mixed up')}</span></div><div class="wlist">`+act.map(p=>{
      const a=byId.get(p.a),b=byId.get(p.b);
      return `<div class="item"><span class="chk" style="background:var(--bad-soft);color:var(--bad)">${p.n||p.s}</span>
        <div class="t"><div class="en">${esc(a.en)} <span style="color:var(--fade)">↔</span> ${esc(b.en)}</div><div class="ru">${esc(a.ru||'')} · ${esc(b.ru||'')}</div></div></div>`;}).join('')+'</div>'
      +(fixed?`<div class="hint" style="margin:6px 2px 0;font-size:13.5px">✓ ${t('sorted out')}: ${fixed}</div>`:'')+'<div style="height:14px"></div>';
  }
  const wf=st.wf&&typeof st.wf==='object'&&st.wf.d&&typeof st.wf.d==='object'?st.wf:null;
  const lvs=wf?WF_LVS.map(x=>x[0]).filter(l=>wf.d[l]&&Object.keys(wf.d[l]).length):[];
  if(lvs.length){
    h+=`<div class="subhead"><span class="t">${t('Word formation')}</span></div><div id="tWf"><div class="hint" style="margin:6px 2px">${t('Loading…')}</div></div><div style="height:14px"></div>`;
    el.innerHTML=h;
    Promise.all(lvs.map(l=>wfLoad(l).then(()=>l))).then(()=>{
      const box=$('#tWf');if(!box||!TV||TV.sid!==sid)return;
      const rows0=[['neg','Negatives (un-, in-, dis-, -less)'],['noun','Nouns'],['adj','Adjectives'],['adv','Adverbs'],['verb','Verbs'],['num','Numerals'],['end','Plural and verb endings']];
      box.innerHTML=lvs.map(l=>{
        const d=wf.d[l],nt=Object.keys(d).length,sts=wfStats(l,d),rows=rows0.filter(r=>sts[r[0]][1]>0);
        let a=0,n=0;Object.keys(d).forEach(i=>{const x=(WF.packs[l]||[])[+i];if(!x)return;const m=(+d[i])%128;x.g.forEach((g,k)=>{n++;a+=(m>>k)&1;});});
        const lab=l==='a2'?'A2–B1':l==='b2'?'B1–B2':'B2–C1';
        return `<div class="wfbars"><div class="h">${lab} · ${nt} ${wfPlural(nt)}${n?` · ${Math.round(a/n*100)}%`:''}</div>`+
          rows.map(r=>{const [aa,nn]=sts[r[0]],p=Math.round(aa/nn*100);return `<div class="r${p<65&&nn>=6?' low':''}"><span>${t(r[1])}</span><div class="tr"><i style="width:${p}%"></i></div><span class="p">${p}%</span></div>`;}).join('')+'</div>';
      }).join('');
    }).catch(()=>{const box=$('#tWf');if(box)box.innerHTML='';});
  }else el.innerHTML=h;
}

/* ---------- sheets ---------- */
/* a backdrop closes its sheet only when the press AND the release both happen on it —
   dragging a text selection out of the sheet must never count as a tap outside */
function backdrop(d,fn){
  d._dn=false;
  d.addEventListener('pointerdown',e=>{d._dn=(e.target===d);},true);
  d.onclick=e=>{const ok=e.target===d&&d._dn;d._dn=false;if(ok)fn();};
}
function sheet(html){
  const ex=$('#scrim');
  if(ex&&!ex.classList.contains('closing')){      /* already open: swap the contents, don't replay the slide-up */
    const box=ex.querySelector('.sheet'),top=box.scrollTop,h0=box.offsetHeight;
    box.innerHTML=`<div class="grip"></div>${html}`;
    box.scrollTop=top;
    const h1=box.offsetHeight;
    if(Math.abs(h1-h0)>4){
      box.style.height=h0+'px';box.style.overflow='hidden';
      requestAnimationFrame(()=>{
        box.style.transition='height .26s cubic-bezier(.22,1,.36,1)';box.style.height=h1+'px';
        setTimeout(()=>{box.style.transition='';box.style.height='';box.style.overflow='';},280);
      });
    }
    return;
  }
  const d=document.createElement('div');d.className='scrim';d.id='scrim';
  backdrop(d,closeSheet);
  d.innerHTML=`<div class="sheet"><div class="grip"></div>${html}</div>`;
  document.body.appendChild(d);d.querySelector('.sheet').scrollTop=0;
}
function closeSheet(){
  const s=$('#scrim');if(!s)return;

  const b=c.cur?Math.min(total,c.cur.to):total;

const lcFirst=(a,en)=>{a=String(a==null?'':a);if(!a||!en||en.charAt(0)!==en.charAt(0).toLowerCase())return a;const c=a.charAt(0);return(c!==c.toLowerCase()&&(a.length<2||a.charAt(1)===a.charAt(1).toLowerCase()))?c.toLowerCase()+a.slice(1):a;};

/* ---- example sentences: Tatoeba (with a Russian translation), then Wiktionary and the dictionary ---- */
const EXC={};
const TAT_FIX={no:'nob',zh:'cmn',fa:'pes',la:'lat'};
const tatCode=l=>TAT_FIX[l]||(typeof OCR_CODES!=='undefined'&&OCR_CODES[l])||null;
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* does the sentence really use the word (or one of its forms), not just contain it inside another word? */
function usesForm(sent,forms){
  const low=sent.toLowerCase();
  return forms.some(f=>{
    if(/\s/.test(f))return low.includes(f);
    return new RegExp('(^|[^\\p{L}])'+reEsc(f)+'(?:s|es|ed|d|ing|ly|er|est|ies|ied)?(?![\\p{L}])','u').test(low);
  });
}
async function getJson(url,ms){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms||7000);
  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)return null;return await r.json();}
  catch(e){return null;}
  finally{clearTimeout(tm);}
}
async function exTatoeba(q,lang,forms){
  const code=tatCode(lang);if(!code)return[];
  const j=await getJson('https://tatoeba.org/en/api_v0/search?from='+code+'&to=rus&query='+encodeURIComponent(q)+'&orphans=no&unapproved=no&sort=relevance');
  const out=[];
  ((j&&j.results)||[]).forEach(r=>{
    const x=String(r.text||'').trim();if(!x||x.length>120||!usesForm(x,forms))return;
    const tr=[].concat(...(r.translations||[])).filter(y=>y&&y.lang==='rus'&&y.text);
    const ru=(tr.find(y=>y.isDirect)||tr[0]||{}).text||'';
    out.push({en:x,ru,s:(ru?0:40)+Math.abs(x.length-60)/3});
  });
  return out.sort((a,b)=>a.s-b.s);
}
async function exWiki(q,forms){
  const j=await getJson('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(q));
  const out=[],strip=x=>String(x||'').replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
  ((j&&j.en)||[]).forEach(e=>(e.definitions||[]).forEach(d=>{
    [].concat(d.examples||[],(d.parsedExamples||[]).map(x=>x.example)).forEach(x=>{x=strip(x);if(x&&x.length>=12&&x.length<=120&&usesForm(x,forms))out.push({en:x,ru:'',s:50});});
  }));
  return out;
}
async function exDict(q,forms){
  const j=await getJson('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q));
  const out=[];
  (Array.isArray(j)?j:[]).forEach(en=>(en.meanings||[]).forEach(m=>(m.definitions||[]).forEach(d=>{
    const x=String(d.example||'').trim();if(x&&x.length<=120&&usesForm(x,forms))out.push({en:x,ru:'',s:55});
  })));
  return out;
}

/* tap = choose, tap again = unchoose, several can be combined; the first tap replaces the automatic guess */
function pickChip(b){
  const ru=$('#'+TR.ru);if(!ru)return;
  let list=ru.dataset.auto==='1'?[]:ru.value.split(/\s*,\s*/).filter(Boolean);
  const v=b.dataset.v,i=list.findIndex(x=>x.toLowerCase()===v.toLowerCase());
  if(i>=0)list.splice(i,1);else list.push(v);
  ru.value=list.join(', ');ru.dataset.auto='0';ruTouched=true;
  syncChips();
  if(TR.after)TR.after('ru');
}
function syncChips(){
  const ru=$('#'+TR.ru),ch=$('#'+TR.chips);if(!ru||!ch)return;
  const have=new Set(ru.value.split(/\s*,\s*/).map(x=>x.toLowerCase()));
  ch.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',have.has((c.dataset.v||'').toLowerCase())));
}
function autoTr(){clearTimeout(trTimer);trTimer=setTimeout(()=>doTr(false),650);}
async function doTr(force){
  const enEl=$('#'+TR.en);if(!enEl)return;const en=enEl.value.trim();if(!en)return;
  const seq=++trSeq;const st=$('#'+TR.st);if(st)st.textContent=t('Translating…');
  const r=await translate(en,TR.lang);
  const now=$('#'+TR.en);
  if(seq!==trSeq||!now||now.value.trim()!==en)return;     /* the field moved on while we waited */
  const ruEl=$('#'+TR.ru);if(!ruEl)return;
  const stEl=$('#'+TR.st);
  if(!r){if(stEl)stEl.textContent='⚠ '+t('Can’t reach the translator — enter the translation manually');return;}
  r.main=lcFirst(r.main,en);r.alts=(r.alts||[]).map(a=>lcFirst(a,en));
  if(force||(!ruTouched&&!ruEl.value)){ruEl.value=r.main;ruEl.dataset.auto='1';ruTouched=false;}
  if(stEl)stEl.textContent=(r.irr?t('Irregular verb')+' · '+r.irr.forms+' → to '+r.irr.base+'. ':'')+t('Options — tap to use:');
  const ch=$('#'+TR.chips);
  if(ch){
    const groups=(r.groups&&r.groups.length)?r.groups.map(g=>({pos:g.pos,items:g.items.map(x=>({v:lcFirst(x.v,en),h:x.h}))})):[{pos:'',items:[r.main,...r.alts].map(v=>({v,h:''}))}];
    const have=new Set(groups.flatMap(g=>g.items.map(x=>x.v.toLowerCase())));
    if(!have.has(r.main.toLowerCase()))groups[0].items.unshift({v:r.main,h:''});
    ch.innerHTML=groups.map(g=>(g.pos?`<div class="chpos">${esc(g.pos)}</div>`:'')+g.items.map(x=>`<button class="chip" data-v="${esc(x.v)}" onclick="pickChip(this)">${esc(x.v)}${x.h?`<small>${esc(x.h)}</small>`:''}</button>`).join('')).join('');
    syncChips();
  }
  if(force&&TR.after)TR.after('ru');
  showExamples(seq,en,r.irr,r);
}

async function makePdf(){
  const sp=PDFSPEC;if(!sp)return;
  const mode=(($('#pdfMode')||{}).value)||'both',withEx=!!($('#pdfEx')&&$('#pdfEx').classList.contains('on'));
  const btn=$('#pdfBtn'),err=$('#pdfErr');
  if(btn){btn.disabled=true;btn.textContent=t('Creating…');}
  try{
    await pdfLibs();
    const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
    doc.addFileToVFS('dv.ttf',PDF_FONTS.regular);doc.addFont('dv.ttf','DV','normal');
    doc.addFileToVFS('dvb.ttf',PDF_FONTS.bold);doc.addFont('dvb.ttf','DV','bold');
    const W=210,H=297,M=16,NUMW=11,GAP=4,colW=(W-2*M-NUMW-GAP)/2,x1=M+NUMW,x2=x1+colW+GAP;
    const date=new Date().toLocaleDateString(uiEn()?'en-GB':'ru-RU');
    let y=M;
    const head=first=>{
      if(first){
        doc.setFont('DV','bold');doc.setFontSize(18);doc.setTextColor(20,28,48);
        doc.text(doc.splitTextToSize(sp.title,W-2*M),M,y+6);y+=6+Math.max(0,(doc.splitTextToSize(sp.title,W-2*M).length-1)*7.5);
        doc.setFont('DV','normal');doc.setFontSize(10);doc.setTextColor(110,120,140);
        doc.text(langName(sp.lang)+' · '+nWords(sp.items.length)+' · '+date,M,y+6);y+=11;
      }
      doc.setFont('DV','bold');doc.setFontSize(9);doc.setTextColor(110,120,140);
      doc.text('№',M,y+4);
      doc.text(langName(sp.lang),x1,y+4);doc.text(uiEn()?'Russian':'Русский',x2,y+4);
      doc.setDrawColor(200,206,220);doc.line(M,y+6,W-M,y+6);y+=9;
    };
    head(true);
    sp.items.forEach((it,i)=>{
      const wrap=(txt,font,size,w)=>{doc.setFont('DV',font);doc.setFontSize(size);return doc.splitTextToSize(String(txt),w);};
      const left=mode==='tr'?[]:wrap(it.en,'bold',11,colW-1);
      const right=mode==='words'?[]:wrap(it.ru,'normal',11,colW-1);
      const exL=(withEx&&it.ex&&mode==='both')?wrap(it.ex,'normal',9,W-2*M-NUMW):[];
      const lines=Math.max(left.length,right.length,1);
      const rh=lines*5.2+3+(exL.length?exL.length*4.2+1:0);
      if(y+rh>H-18){doc.addPage();y=M;head(false);}
      if(i%2===0){doc.setFillColor(244,246,251);doc.rect(M-1,y-1.5,W-2*M+2,rh,'F');}
      doc.setFont('DV','normal');doc.setFontSize(9);doc.setTextColor(120,130,150);doc.text(String(it.n),M,y+3.6);
      doc.setFontSize(11);
      if(left.length){doc.setFont('DV','bold');doc.setTextColor(20,28,48);doc.text(left,x1,y+3.8);}
      if(right.length){doc.setFont('DV','normal');doc.setTextColor(40,48,70);doc.text(right,x2,y+3.8);}
      if(exL.length){doc.setFont('DV','normal');doc.setFontSize(9);doc.setTextColor(120,130,150);doc.text(exL,x1,y+lines*5.2+3.8);}
      y+=rh;
    });
    const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('DV','normal');doc.setFontSize(8.5);doc.setTextColor(150,158,175);
      doc.text(p+' / '+n,W/2,H-9,{align:'center'});doc.text('NOEON Words',M,H-9);}
    const name=(sp.title.replace(/[^\wа-яёА-ЯЁ\- ]/gi,'_').replace(/\s+/g,' ').trim()||'words')+'.pdf';
    const blob=doc.output('blob');
    closeSheet();
    try{const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}
    catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(t('Saved ✓'));
  }catch(e){
    if(err)err.textContent=t('Couldn’t create the PDF')+(navigator.onLine?'':' — '+t('No connection — try again when you’re online.'));
    if(btn){btn.disabled=false;btn.textContent=t('Create PDF');}
  }
}

function splitCards(text){
  if(impCard==='semi')return text.split(';');
  if(impCard==='blank')return text.split(/\n\s*\n/);
  return text.split(/\r?\n/);
}
function splitPair(line){
  line=line.trim();if(!line)return null;
  let en,ru;
  if(impTerm==='tab'){[en,...ru]=line.split('\t');ru=(ru||[]).join(' ');}
  else if(impTerm==='comma'){[en,...ru]=line.split(',');ru=(ru||[]).join(',');}
  else if(impTerm==='eq'){[en,...ru]=line.split('=');ru=(ru||[]).join('=');}
  else if(impTerm==='dash'){const m=line.split(/\s+[-–—]\s+/);en=m[0];ru=m.slice(1).join(' - ');}
  else{ // auto
    if(line.includes('\t')){[en,...ru]=line.split('\t');ru=ru.join(' ');}
    else{const m=line.split(/\s+[-–—:]\s+/);if(m.length>1){en=m[0];ru=m.slice(1).join(' - ');}
      else{en=line;ru='';}}
  }
  en=(en||'').trim();ru=(ru||'').trim();
  return en?{en,ru}:null;
}

async function runImport(){
  const pairs=parseImport();if(!pairs.length)return toast(t('Nothing to import'));

  const s=(impTo||impArch)?null:addTarget();
  const lg=impArch?((($('#impLg')||{}).value)||DEF_LANG):(impTo?tSetLang(impTo.setId):setLangOf(s));
  const er=$('#impErr');if(er)er.textContent='';
  const need=pairs.filter(p=>!p.ru&&impAuto);
  if(need.length){
    const queue=need.slice();let done=0;
    const worker=async()=>{
      while(queue.length){

/* ---------- matching question (as in Quizlet): pair several words with their translations ---------- */
const MQC=['#2f86f5','#e0902a','#2fa36b','#a05bd6','#d6547a','#1fa3b5'];
function mkMatchQ(ws){
  let order=ws.map((_,i)=>i);
  for(let a=0;a<8;a++){order=shuffle(order);if(order.some((v,i)=>v!==i))break;}
  return {w:ws[0],ws,lg:langOf(ws[0]),type:'match',dir:'ru2en',order};
}
/* words picked for "Matching" are grouped (3–6 per question, same language); too few left over → ordinary questions */
function buildQs(words,kinds,pool){
  const other=kinds.filter(k=>k!=='match'),out=[],mw={};
  words.forEach(w=>{
    const k=kinds[Math.random()*kinds.length|0];
    if(k==='match'){const l=langOf(w);(mw[l]=mw[l]||[]).push(w);}
    else out.push(mkQ(pool,w,k,'ru2en'));
  });
  Object.values(mw).forEach(arr=>{
    if(arr.length<3){arr.forEach(w=>out.push(mkQ(pool,w,other.length?other[Math.random()*other.length|0]:'mc','ru2en')));return;}
    const g=Math.ceil(arr.length/6),base=Math.floor(arr.length/g),extra=arr.length%g;let at=0;
    for(let x=0;x<g;x++){const n=base+(x<extra?1:0);out.push(mkMatchQ(arr.slice(at,at+n)));at+=n;}
  });
  return shuffle(out);
}

/* ---------- pairs the student mixes up ----------
   A wrong answer that is another word from the student's own dictionary (same language) counts towards a pair:
   typed = 2 points (the pair shows up at once), picked from options or matched = 1 point (shows up the second time). */
const CF_SHOW=2,CF_MAX=60;
const cfKey=(a,b)=>[a,b].sort().join('~');
function cfAll(){const st=S.stats;if(!st.conf||typeof st.conf!=='object')st.conf={};return st.conf;}
function cfFind(lg,txt,dir,not){
  const n=canon(txt);if(!n)return null;
  for(const s of S.sets){if(setLangOf(s)!==lg)continue;
    for(const x of s.words){
      if(x===not||x.id===not.id)continue;
      if(dir==='en2ru'){if(ruChunks(x).some(c=>canon(c)===n)||canon(x.ru)===n)return x;}
      else{const ir=irregOf(x.en);if(canon(x.en)===n||(ir&&ir.base===n))return x;}
    }}
  return null;
}
function cfNote(w,x,pts){
  if(!w||!x||w===x||w.id===x.id||PRACTICE)return false;
  if(canon(w.en)===canon(x.en)||langOf(w)!==langOf(x))return false;
  const all=cfAll(),k=cfKey(w.id,x.id),now=Date.now();
  const p=all[k]||{a:w.id,b:x.id,s:0,n:0,ok:0,od:'',d:0};
  if(p.d){p.d=0;p.ok=0;p.s=Math.max(p.s,CF_SHOW-pts);}   /* mixed up again after it was sorted out */
  p.s+=pts;p.n++;p.u=now;all[k]=p;
  const ks=Object.keys(all);
  if(ks.length>CF_MAX){ks.sort((a,b)=>((all[a].d?0:1)-(all[b].d?0:1))||((all[a].u||0)-(all[b].u||0)));ks.slice(0,ks.length-CF_MAX).forEach(z=>delete all[z]);}
  S.stats.upd=now;return true;
}
/* one answered question → maybe a pair. given = {id} of the option picked, or {t} the text typed / picked */
function cfFromAnswer(q,given,typed){
  try{
    if(!q||!q.w||q.type==='tf'||q.type==='match'||!given)return false;
    const lg=q.lg||langOf(q.w);
    let x=given.id?(findWord(given.id)||{}).w:null;
    if(!x&&given.t)x=cfFind(lg,given.t,q.dir,q.w);
    return x?cfNote(q.w,x,typed?2:1):false;
  }catch(e){return false;}
}
function cfFromMatch(q,a){
  let ch=false;
  try{q.ws.forEach((w,k)=>{const j=a[k];if(j==null)return;const x=q.ws[q.order[j]];if(x&&x!==w&&cfNote(w,x,1))ch=true;});}catch(e){}
  return ch;
}
/* the pairs to show: enough points, not sorted out, not already practised well today, both words still here */
function cfActive(lg){
  const all=cfAll(),today=dayKey(),out=[];
  Object.keys(all).forEach(k=>{
    const p=all[k];if(!p||p.d||(p.s||0)<CF_SHOW||(p.od===today&&p.ok>0))return;
    const fa=findWord(p.a),fb=findWord(p.b);if(!fa||!fb)return;
    const l=setLangOf(fa.s);if(l!==setLangOf(fb.s)||(lg&&l!==lg))return;
    out.push({k,p,a:fa.w,b:fb.w});
  });
  return out.sort((x,y)=>(y.p.s-x.p.s)||((y.p.u||0)-(x.p.u||0)));
}
const cfTimes=n=>{const m=t('times_many');return n+' '+plr(n,t('time'),t('times'),m==='times_many'?t('times'):m);};
function cfCard(lg){
  const ps=cfActive(lg);if(!ps.length)return '';
  return `<div class="cfcard"><div class="cfh"><span>${t('You mix these up')}</span><button onclick="startConf('${ps[0].k}')">${t('Practise')}${ic('arrowRight',16)}</button></div>`+
    ps.slice(0,3).map(x=>`<button class="cfp" onclick="startConf('${x.k}')">${esc(x.a.en)} <span class="vs">↔</span> ${esc(x.b.en)}<span class="n">${cfTimes(x.p.n||0)}</span></button>`).join('')+`</div>`;
}
/* the student's own example with the word lit up (or the gap), when the sentence really contains it */
function cfFindIn(w){
  const ex=exEn(w);if(!ex||ex.length>140)return null;
  const ir=irregOf(w.en);
  const forms=ir?ir.forms.split(' '):[String(w.en||'').toLowerCase().trim().replace(/^to\s+/,'')];
  for(const f of forms){
    if(!f||/[^a-z' -]/.test(f))continue;
    const re=new RegExp('(^|[^A-Za-z])('+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+(f.includes(' ')?'':'(?:s|es|ed|d|ing|ies|ied)?')+')(?=$|[^A-Za-z])','i');
    const m=ex.match(re);if(m){const at=m.index+m[1].length;return{ex,at,len:m[2].length};}
  }
  return null;
}
function startConf(key){
  const all=cfAll(),p=all[key];if(!p)return render();
  const fa=findWord(p.a),fb=findWord(p.b);if(!fa||!fb)return render();
  const A=fa.w,B=fb.w,lg=setLangOf(fa.s),app=$('#app');
  const title=A.en+' '+t('or')+' '+B.en;
  tabWanted=false;syncTabs();          /* a study screen: no tab bar, like a test */
  const first=x=>(ruChunks(x)[0]||x.ru||'');
  const card=x=>{const m=cfFindIn(x);
    const e=m?`<div class="e">${esc(m.ex.slice(0,m.at))}<u>${esc(m.ex.substr(m.at,m.len))}</u>${esc(m.ex.slice(m.at+m.len))}</div>`:'';
    return `<div class="c"><div class="w">${esc(x.en)}</div><div class="r">${esc(x.ru)}</div>${e}</div>`;};
  app.innerHTML=hdr(title,'render()')+`<div class="cfcmp">${card(A)}${card(B)}</div>
    <div class="cftip">${t('You picked one instead of the other')}: ${cfTimes(p.n||1)}. ${t('6 short questions, about a minute.')}</div>
    <button class="btn pri" style="width:100%" id="cfGo">${t('Practise now')}</button>`;
  window.scrollTo(0,0);
  $('#cfGo').onclick=()=>run();
  function run(){
    /* 3 + 3, mixed; a sentence with a gap when the word has an example, otherwise its translation */
    const same=canon(first(A))===canon(first(B));
    const qs=shuffle([A,A,A,B,B,B]).map(x=>{const m=cfFindIn(x);
      return m&&Math.random()<.75?{x,gap:m.ex.slice(0,m.at)+'____'+m.ex.slice(m.at+m.len)}:{x,ru:same?x.ru:first(x)};});
    let i=0,good=0;
    const step=()=>{
      if(i>=qs.length)return done();
      const q=qs[i];
      app.innerHTML=hdr(title,"if(confirm(t('Exit this session?')))render()")+
        `<div class="topbar"><div class="pbar"><i style="width:${i/qs.length*100}%"></i></div><span class="stat">${i}/${qs.length}</span></div>
        <div id="qb"><div class="card" style="min-height:min(24vh,150px);margin-top:12px"><div class="lbl">${q.gap?t('Which word fits?'):t('Choose the word')}</div>
          <div class="word"${q.gap?' style="font-size:24px;line-height:1.3"':''}>${esc(q.gap||q.ru)}</div>${q.gap?`<div class="word sub" style="font-size:17px">${esc(first(q.x))}</div>`:''}</div>
        <div class="cftwo"><button class="btn ghost" data-k="a">${esc(A.en)}</button><button class="btn ghost" data-k="b">${esc(B.en)}</button></div><div id="cfFb"></div></div>`;
      pulse($('#qb'));
      let ans=false;
      app.querySelectorAll('.cftwo .btn').forEach(b=>b.onclick=()=>{
        if(ans)return;ans=true;
        const pick=b.dataset.k==='a'?A:B,ok=pick===q.x;
        bumpStudy(q.x.id,ok);
        speak(q.x.en,lg);
        const right=app.querySelector(`.cftwo [data-k="${q.x===A?'a':'b'}"]`);
        right.classList.remove('ghost');right.classList.add('tfy');
        if(ok){good++;right.classList.add('selp');i++;setTimeout(step,650);return;}
        b.classList.remove('ghost');b.classList.add('tfn','selp');
        $('#cfFb').innerHTML=`<div class="cfnote"><b>${esc(A.en)}</b> — ${esc(A.ru)}. <b>${esc(B.en)}</b> — ${esc(B.ru)}.</div>
          <div style="height:12px"></div><button class="btn pri" id="cfNx" style="width:100%">${t('Next')}</button>`;
        $('#cfNx').onclick=()=>{i++;step();};
      });
    };
    const done=()=>{
      const today=dayKey(),win=good>=qs.length-1;
      if(win){if(p.od!==today){p.ok=(p.ok||0)+1;p.od=today;}if(p.ok>=2)p.d=1;}
      else{p.ok=0;p.od=today;}
      p.u=Date.now();S.stats.upd=p.u;save();
      const pct=Math.round(good/qs.length*100);
      const nxt=cfActive(lg).find(x=>x.k!==key);
      app.innerHTML=hdr(title,'render()')+celHero('test',{pct,title:p.d?t('Pair sorted out'):scoreTitle(pct),
        sub:good+' / '+qs.length+' · '+(p.d?t('You no longer mix these up.'):win?t('Well done — once more on another day and the pair is done.'):t('Let’s go over it again later.'))})+
        `<div style="height:14px"></div>${nxt?`<button class="btn pri" style="width:100%" onclick="startConf('${nxt.k}')">${t('Next pair')}</button><div style="height:9px"></div>`:''}
        <button class="btn ghost" style="width:100%" onclick="render()">${t('Done')}</button>`;
      celPlay();
    };
    step();
  }
}

/* what a gap trains: for the progress screen and for choosing the next text */
const WF_CATS=['neg','noun','adj','adv','verb','num','end'];
function wfCats(g){
  const m=g[2]||'',p=g[3],c=[];
  if(/(^|[^a-z])(un|in|im|il|ir|non)-|-less|dis-/.test(m))c.push('neg');
  if(p&&WF_CATS.indexOf(p)>=0)c.push(p);
  if(/plural|3rd|past|-ing form|\+\s*-?s\b/.test(m))c.push('end');
  return c;
}
function wfStats(lv,dd){
  const list=WF.packs[lv]||[],d=dd||wfDone(lv),out={};WF_CATS.forEach(k=>out[k]=[0,0]);
  Object.keys(d).forEach(i=>{const x=list[+i];if(!x)return;const mask=(+d[i])%128;
    x.g.forEach((g,k)=>{const ok=(mask>>k)&1;wfCats(g).forEach(c=>{out[c][1]++;out[c][0]+=ok;});});});
  return out;
}
function wfPick(lv){
  const list=WF.packs[lv]||[],d=wfDone(lv),un=[];
  for(let i=0;i<list.length;i++)if(!(i in d))un.push(i);
  if(!un.length){toast(t('You have done every text — starting again.'));
    return Object.keys(d).map(Number).sort((a,b)=>(d[a]-d[b])).slice(0,Math.max(1,Math.floor(list.length/3)))[Math.random()*Math.max(1,Math.floor(list.length/3))|0];}
  /* a few at random; take the one with the most gaps of the kind this student misses most */
  const st=wfStats(lv),weak={};WF_CATS.forEach(k=>{const [a,n]=st[k];weak[k]=n<6?0.35:1-a/n;});
  let best=-1,bi=un[0];
  shuffle(un).slice(0,12).forEach(i=>{const sc=list[i].g.reduce((s,g)=>s+wfCats(g).reduce((q,c)=>q+weak[c],0),0)+Math.random()*.6;if(sc>best){best=sc;bi=i;}});

}
function wfSplit(tx){
  const out=[],re=/[.!?]["”’')]*\s+(?=["“‘(]?[A-Z0-9{])/g;let s=0,m;
  while((m=re.exec(tx))){
    const tok=tx.slice(s,m.index+1).split(/\s+/).pop();
    if(/^(Mr|Mrs|Ms|Dr|St|No|vs|etc|Prof|Mt|Jr|Sr)\.$/.test(tok)||/^[A-Z]\.$/.test(tok))continue;
    out.push(tx.slice(s,m.index+m[0].length));s=m.index+m[0].length;
  }
  out.push(tx.slice(s));return out.filter(x=>x.trim());
}
/* the text as the exam prints it: opening sentences, then one row per sentence with gaps and the base word beside it */
function wfRows(tx){
  const ss=wfSplit(tx),rows=[];let intro=[];
  ss.forEach(s=>{
    const has=/\{\d\}/.test(s);
    if(has)rows.push({t:s,k:[...s.matchAll(/\{(\d)\}/g)].map(m=>+m[1])});
    else if(rows.length)rows[rows.length-1].t+=s;
    else intro.push(s);
  });

}

const EX_NAMES=new Set(['tom','mary','john','boston','australia','japan','tatoeba','bob','alice','ken','jack','mike','paul','anne','tony','jim','sam','kate']);

/* lower = better. null = not good enough for a learner */
function exQuality(x,forms,stems,relax){
  const en=String(x.en||'').trim();
  if(en.length<(relax?14:18)||en.length>(relax>1?150:relax?120:95)||(relax>1?/[\[\]@#\\_*%]|https?:/:EX_BAD).test(en))return null;
  if(!/^[A-Z]/.test(en)||!/[.!?]$/.test(en))return null;
  const ws=(en.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[]);const n=ws.length;
  if(n<(relax?3:4)||n>(relax>1?26:relax?20:15))return null;
  let s=Math.abs(n-9)*2,rare=0,mid=0,name=0;
  ws.forEach(w=>{
    if(forms.some(f=>w===f))return;
    if(EX_NAMES.has(w)){name++;return;}
    const b=fqBand(w.replace(/'(s|t|re|ve|ll|d|m)$/,''),'en');
    if(b===5)rare++;else if(b===4)mid++;

  if(rare>(relax>1?4:relax?2:1))return null;
  s+=rare*14+mid*3+name*3;
  if(x.ru){
    s-=14;
    const low=x.ru.toLowerCase();

function exStems(r){

  return [...st];

/* sources are queried together; `onList` is called each time the best three change, so the first examples appear in about a second */
async function fetchExamples(word,lang,irr,tr,onList){
  const q=String(word||'').toLowerCase().trim();if(!q)return{list:[],failed:false};
  const stems=exStems(tr);
  const k=lang+'|'+q+(irr?'|'+irr.forms:'')+'|'+stems.slice(0,6).join(',');
  if(k in EXC){if(onList)onList(EXC[k].list);return EXC[k];}
  const forms=irr?irr.forms.split(' '):exForms(q);
  const code=tatCode(lang);
  const base=irr?irr.base:q;
  let cand=[],net=false,last='';
  const pick=relax=>{
    const seen=new Set(),sc=[];
    cand.forEach(x=>{
      const key=x.en.toLowerCase();if(seen.has(key)||!usesForm(x.en,forms))return;
      const s=exQuality(x,forms,stems,relax);if(s==null)return;seen.add(key);sc.push([s,x]);
    });
    return sc.sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
  };
  const best=()=>{let l=pick(0);if(l.length<3)l=l.concat(pick(1).filter(x=>!l.includes(x)));if(l.length<3)l=l.concat(pick(2).filter(x=>!l.includes(x)));return l.slice(0,3);};
  const emit=()=>{
    const l=best(),sig=l.map(x=>x.en).join('|');
    if(sig===last)return;last=sig;
    if(onList)onList(l);
    l.filter(x=>!x.ru).forEach(x=>{exRu2(x.en).then(r=>{if(r&&!x.ru){x.ru=r;last='';emit();}});});
  };
  const take=r=>{if(r){net=true;cand=cand.concat(r);emit();}};
  const jobs=[];
  if(lang==='en'&&code){
    jobs.push(tatQuery(base,code,'relevance').then(take).catch(()=>{}));
    jobs.push(tatQuery(base,code,'relevance',2).then(take).catch(()=>{}));
    jobs.push(exGoogle(base,forms).then(take).catch(()=>{}));
    jobs.push(exWiki(base,forms).then(r=>take(r&&r.map(x=>({en:x.en,ru:'',pen:12})))).catch(()=>{}));
    jobs.push(exDict(base,forms).then(r=>take(r&&r.map(x=>({en:x.en,ru:'',pen:12})))).catch(()=>{}));
    await Promise.all(jobs);
    if(best().length<3&&!irr){
      await Promise.all(forms.filter(f=>f!==base).slice(0,3).map(f=>tatQuery(f,code,'relevance').then(take).catch(()=>{})));
    }
  }else if(code){
    take(await tatQuery(q,code,'relevance').catch(()=>null));
  }
  const list=best();
  await Promise.all(list.filter(x=>!x.ru).map(async x=>{x.ru=await exRu2(x.en);}));
  const out={list,failed:!list.length&&!net};
  if(list.length)EXC[k]=out;
  return out;
}

/* ---------- questions engine ---------- */
/* ---- wrong answers that are worth thinking about: same part of speech, similar form ---- */
const ruChunks=w=>String(w.ru||'').toLowerCase().replace(/\(.*?\)/g,' ').split(/[;,\/]/).map(x=>x.trim()).filter(Boolean);
const ADV_EN=new Set('soon often always never sometimes usually already still yet just almost quite very too also again here there now then today tomorrow yesterday well fast hard late early away together maybe perhaps rather really actually nearly hardly ever once twice mostly together abroad upstairs downstairs outside inside nowhere everywhere anywhere somewhere else instead meanwhile however therefore'.split(' '));
const ADV_RU=new Set('часто скоро всегда никогда иногда обычно уже ещё еще почти очень слишком также снова здесь там сейчас теперь потом сегодня завтра вчера вместе поздно рано далеко близко возможно вероятно довольно действительно фактически едва однако поэтому вместо'.split(' '));
/* a rough part of speech from the Russian translation and the word itself: v, adj, adv, n, phr */
function posOf(w){
  const en=String(w.en||'').toLowerCase().trim(),lg=langOf(w);
  const ch=ruChunks(w),head=(ch[0]||'').split(/\s+/)[0]||'';
  const isV=/(ть|ться|ти|тись|чь)$/.test(head)&&head.length>3;
  const multi=/\s/.test(en.replace(/^to\s+/,''));
  if(lg==='en'&&(/^to\s/.test(en)||en.split(/\s+/).length===3&&typeof irregOf==='function'&&irregOf(en)))return 'v';
  if(multi)return isV?'v':'phr';
  if(isV)return 'v';
  if(ADV_EN.has(en)||ADV_RU.has(head))return 'adv';
  if(/(ый|ий|ой|ая|яя|ое|ее|ые|ие)$/.test(head)&&head.length>3)return 'adj';
  if(lg==='en'){
    if(/ly$/.test(en)&&en.length>4&&/[оеи]$/.test(head))return 'adv';
    if(/(ful|ous|ive|able|ible|ical|less|ish|ent|ant)$/.test(en)&&en.length>5)return 'adj';
    if(/(tion|sion|ment|ness|ity|ship|hood|ism|er|or|ist)$/.test(en))return 'n';
  }
  if(/(о|е)$/.test(head)&&/^[а-яё]+$/.test(head)&&lg==='en'&&/ly$/.test(en))return 'adv';
  return 'n';
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[n];
}
const strSim=(a,b)=>{a=String(a).toLowerCase();b=String(b).toLowerCase();const L=Math.max(a.length,b.length)||1;
  let suf=0;while(suf<3&&suf<a.length&&suf<b.length&&a[a.length-1-suf]===b[b.length-1-suf])suf++;
  return Math.max(0,1-lev(a,b)/L)+suf*0.12;};
/* the people who answer should be tempted, not given a free pass; some randomness keeps repeats fresh */
function pickDecoys(cands,w,dir,k){
  const pw=posOf(w),mine=ruChunks(w),tw=dir==='en2ru'?(mine[0]||''):String(w.en||'').toLowerCase();
  const sc=cands.map(x=>{
    const tx=dir==='en2ru'?(ruChunks(x)[0]||''):String(x.en||'').toLowerCase();
    const lenSim=1-Math.abs(tx.length-tw.length)/(Math.max(tx.length,tw.length)||1);
    const wc=(a)=>a.split(/\s+/).length;
    return{x,tx,s:(posOf(x)===pw?3:0)+2*strSim(tx,tw)+0.8*lenSim+(wc(tx)===wc(tw)?0.4:0)+Math.random()*0.9};
  }).sort((a,b)=>b.s-a.s);
  const out=[],seen=new Set([tw]);
  for(const c of sc){if(out.length>=k)break;if(!c.tx||seen.has(c.tx))continue;seen.add(c.tx);out.push(c.x);}
  return out;
}
/* every other word of the same language: the session pool first, then the whole dictionary */
function decoyPool(pool,w,lg){
  const mine=new Set(ruChunks(w)),en=String(w.en||'').toLowerCase().trim(),seen=new Set(),out=[];
  const add=x=>{
    if(!x||x===w||x.id===w.id||seen.has(x.id)||langOf(x)!==lg)return;
    seen.add(x.id);
    if(String(x.en||'').toLowerCase().trim()===en)return;
    if(ruChunks(x).some(c=>mine.has(c)))return;      /* a synonym with the same translation would be a second right answer */
    out.push(x);
  };
  pool.forEach(add);S.sets.forEach(st=>st.words.forEach(add));
  return out;
}
function mkQ(pool,w,kind,forceDir){
  const lg=langOf(w);
  /* decoys must be in the same language as the word, or the question makes no sense */
  const others=decoyPool(pool,w,lg);
  if(kind==='mc'&&others.length<1)kind='type';
  if(kind==='tf'&&others.length<1)kind='type';
  const ff=kind==='mc'?ffOf(w):null;
  const dir=ff?'en2ru':(forceDir||(Math.random()<.5?'en2ru':'ru2en'));
  if(kind==='mc'){
    if(ff&&!ruChunks(w).some(c=>c===ff.trap)){
      const ds=pickDecoys(others,w,dir,Math.min(2,others.length));
      return{w,lg,type:'mc',dir,ff:1,opts:shuffle([{t:w.ru,c:true,id:w.id},{t:ff.trap,c:false,trap:1},...ds.map(x=>({t:x.ru,c:false,id:x.id}))])};
    }
    const ds=pickDecoys(others,w,dir,Math.min(3,others.length));
    return{w,lg,type:'mc',dir,opts:shuffle([w,...ds]).map(x=>({t:dir==='en2ru'?x.ru:x.en,c:x===w,id:x.id}))};}
  if(kind==='tf'){const isTrue=Math.random()<.5;
    const td=forceDir==='ru2en'?'ru2en':'en2ru';
    const d=isTrue?w:shuffle(pickDecoys(others,w,td==='ru2en'?'ru2en':'en2ru',3))[0]||others[0];
    return{w,lg,type:'tf',dir:td,shown:td==='ru2en'?d.en:d.ru,isTrue};}
  return{w,lg,type:'type',dir};
}
/* “Напишите по-венгерски” / “Выберите слово — венгерский” once more than one language is in play */
function qLabel(q){

    :(multiLang()?t('Choose the word')+' '+langPrep(lg):t('Choose the word'));
}

      if(unknown.length)$('#rep').onclick=()=>{deck=shuffle(unknown);unknown=[];i=0;total=deck.length;flip=false;draw();};return;
    }
    const w=deck[i];const front=dir==='en'?w.en:w.ru,back=dir==='en'?w.ru:w.en;
    app.innerHTML=hdr(t('Flashcards'),"render()",`<button class="ic" aria-label="Flip side" onclick="window._flip()">${ic('swap')}</button>`)+
     `<div class="topbar"><div class="pbar"><i style="width:${i/deck.length*100}%"></i></div><span class="stat">${i+1}/${deck.length}</span></div>
      <div class="fc"><div class="card" id="cd">
        ${flip
          ?`<div class="word">${esc(back)}</div>${exEn(w)?`<div class="ex">${esc(exEn(w))}${exRu(w)?`<small style="display:block;font-size:.85em;opacity:.8;margin-top:6px">${esc(exRu(w))}</small>`:''}</div>`:''}`
          :`<div class="word">${esc(front)}</div><div class="tip">${t('tap to flip')}</div>`}
      </div></div>
      <div class="row2"><button class="btn" id="no" style="color:var(--bad)">${ic('close',17)}${t("Don't know")}</button><button class="btn" id="yes" style="color:var(--ok)">${ic('check',17,2)}${t('Know')}</button></div>
      <div style="height:9px"></div><button class="btn ghost" id="sp">${ic('sound')}${t('Pronounce')}</button>`;
    $('#cd').onclick=()=>{
      const c=$('#cd');
      if(!c||c.classList.contains('fout')){flip=!flip;draw();return;}
      c.classList.add('fout');
      setTimeout(()=>{flip=!flip;draw();const n=$('#cd');if(n){n.classList.add('fin');setTimeout(()=>n.classList.remove('fin'),270);}},185);
    };
    $('#sp').onclick=()=>speak(w.en,langOf(w));
    $('#yes').onclick=()=>{
      const step=()=>{i++;flip=false;draw();};
      if(review)return step();
      award(w,true);save();
      step();
    };
    $('#no').onclick=()=>{if(!review){award(w,false);save();}unknown.push(w);i++;flip=false;draw();};
    if(!flip&&dir==='en')speak(w.en,langOf(w));
  }
  window._flip=()=>{dir=dir==='en'?'ru':'en';flip=false;draw();};
  draw();
}

/* ---------- learn (active only) ---------- */
function startLearn(review){
  const pool=review?poolNow():(view.name==='set'?viewPool():poolNow());
  if(!pool.length)return toast(review?t('No words'):t('No words to learn'));
  const B={};if(review)pool.forEach(w=>B[w.id]=0);
  const lvl=w=>Math.min(3,review?B[w.id]:(w.box||0));
  let queue=shuffle(pool.filter(w=>lvl(w)<3));
  /* every word already mastered: one practice pass, a word counts once it is answered right */
  const practice=!queue.length;if(practice)queue=shuffle(pool);
  const session=queue.slice(),N=session.length,app=$('#app');
  const start=new Map(session.map(w=>[w.id,practice?0:lvl(w)])),okSet=new Set();
  /* the count is read from the words' real state, so a slip and a re-learn can never be counted twice */
  const isDone=w=>practice?okSet.has(w.id):lvl(w)>=3;
  const doneN=()=>session.filter(isDone).length;
  const progress=()=>{
    if(practice)return okSet.size/N;
    let base=0,now=0;session.forEach(w=>{base+=start.get(w.id);now+=lvl(w);});
    const tot=3*N-base;return tot>0?Math.max(0,Math.min(1,(now-base)/tot)):1;
  };
  function finish(){
    app.innerHTML=hdr(t('Learn'),"render()")+
      celHero('learn',{n:N,title:review?t('Review complete'):t('Great job!'),
        sub:`${N} / ${N} ${t('mastered')}<br>${review?t('You revised every word in this session.'):t('Every word this session is mastered.')}`})+
      `<div style="height:14px"></div><button class="btn pri" onclick="render()">${t('Done')}</button>`;
    celPlay();
  }
  function next(){
    if(doneN()>=N)return finish();
    if(!queue.length)queue=shuffle(session.filter(w=>!isDone(w)));
    const w=queue.shift();const L=lvl(w);const kind=L<=1?'mc':'type';const dir=L===0?'en2ru':'ru2en';
    app.innerHTML=studyTop(t('Learn'),progress()*100,t('mastered')+' '+doneN()+'/'+N);
    const q=mkQ(pool,w,kind,dir);
    pulse($('#qb'));
    renderQ($('#qb'),q,{feedback:true,onDone:ok=>{
      const before=lvl(w);
      if(review){B[w.id]=ok?Math.min(3,before+1):Math.max(0,before-1);}
      else{award(w,ok);save();}
      if(ok&&practice)okSet.add(w.id);
      if(isDone(w)){}
      else if(ok)queue.splice(Math.min(queue.length,3+(Math.random()*3|0)),0,w);
      else queue.splice(Math.min(queue.length,2),0,w);
      next();
    }});
  }
  next();
}

/* ---------- test ---------- */
function testSetup(review){
  const pool=poolNow();if(!pool.length)return toast(t('No words'));
  const n=pool.length;const opts=[...new Set([5,10,20,n].filter(v=>v<=n))].sort((a,b)=>a-b);

   <div class="field"><label>${t('How many questions')}</label>

       `<div class="toggle" onclick="const sw=this.querySelector('.sw');sw.classList.toggle('on');"><label>${o[1]}</label><div class="sw on" id="${o[0]}"><i></i></div></div>`).join('')}</div></div>
   <div class="hint">${(()=>{
       const ls=[...new Set(pool.map(langOf))];
       const arrow=ls.length===1?'RU → '+ls[0].toUpperCase()+'. ':'';
       const body=(ls.length===1&&ls[0]==='en')
         ?t('The word is shown in Russian — recall and type (or choose) the English. You can move between questions and fix your answers before finishing.')
         :t('The word is shown in Russian — recall and type (or choose) it in the language you are studying. You can move between questions and fix your answers before finishing.');

   ${review?'<div class="hint">'+t('Archive review: results don\'t change progress.')+'</div>':''}
   <button class="btn pri" onclick="beginTest(${!!review})">${t('Start test')}</button>`);

function tnSync(){const v=+($('#tn')||{}).value;document.querySelectorAll('#tnOpts button').forEach(b=>b.classList.toggle('on',+b.dataset.n===v));}
function tnSet(v){const i=$('#tn');if(i){i.value=v;tnSync();}}
function beginTest(review){
  const kinds=[$('#k1').classList.contains('on')&&'mc',$('#k2').classList.contains('on')&&'type',$('#k3').classList.contains('on')&&'tf',$('#k4').classList.contains('on')&&'match'].filter(Boolean);
  if(!kinds.length)return toast(t('Pick at least one type'));
  const max=poolNow().length;let n=Math.round(+$('#tn').value);
  if(!(n>=1))return toast(t('Enter the number of questions'));

  closeSheet();runTest(shuffle(poolNow()).slice(0,n),kinds,review);
}
/* an unfinished test is kept on the device, so a stray Back or a refresh doesn't lose it */
const TKEY='vocab.test';
function testClear(){try{localStorage.removeItem(TKEY);}catch(e){}}
function testSaved(){
  try{
    const x=JSON.parse(localStorage.getItem(TKEY)||'null');
    if(!x||!Array.isArray(x.qs)||Date.now()-(x.at||0)>3*DAY)return null;
    const qs=[],ans=[];
    x.qs.forEach((q,k)=>{const f=findWord(q.w);if(!f)return;
      if(q.type==='match'){const ws=(q.ws||[]).map(id=>{const g=findWord(id);return g&&g.w;});if(!ws.length||ws.some(v=>!v))return;
        qs.push(Object.assign({},q,{w:ws[0],ws}));ans.push(Array.isArray(x.ans[k])?x.ans[k]:ws.map(()=>null));return;}
      qs.push(Object.assign({},q,{w:f.w}));ans.push(x.ans[k]===undefined?null:x.ans[k]);});
    if(!qs.length)return null;
    return {qs,ans,i:Math.min(x.i||0,qs.length-1),kinds:x.kinds||['mc','type','tf'],review:!!x.review};
  }catch(e){return null;}
}
function testBanner(){
  const s=testSaved();if(!s)return '';
  const n=s.qs.reduce((c,q,k)=>c+((q.type==='match'?(s.ans[k]||[]).every(v=>v!=null):q.type==='type'?String(s.ans[k]||'').trim()!=='':s.ans[k]!==null)?1:0),0);
  return `<div class="resumebar"><button class="rowlink" onclick="resumeTest()"><span>${ic('repeat',19)}${t('Resume test')}</span><em>${n}/${s.qs.length}</em></button>
    <button class="ic" aria-label="${t('Discard')}" onclick="discardTest()">✕</button></div>`;
}
function resumeTest(){const s=testSaved();if(!s){render();return;}runTest(null,s.kinds,s.review,s);}

function runTest(words,kinds,review,resume,asg){
  const pool=resume?null:poolNow(),app=$('#app');
  const qs=resume?resume.qs:buildQs(words,kinds,pool);
  const total=qs.length;
  const ans=resume?resume.ans:qs.map(q=>q.type==='match'?q.ws.map(()=>null):q.type==='type'?'':null);
  let i=resume?resume.i:0,shown=-1,palOpen=false,sel=null;
  const persist=()=>{if(PRACTICE)return;try{localStorage.setItem(TKEY,JSON.stringify({at:Date.now(),kinds,review,i,ans,qs:qs.map(q=>Object.assign({},q,{w:q.w.id},q.ws?{ws:q.ws.map(x=>x.id)}:{}))}));}catch(e){}};
  const answered=ix=>{const q=qs[ix];return q.type==='match'?(ans[ix]||[]).length===q.ws.length&&ans[ix].every(v=>v!=null):q.type==='type'?(ans[ix]||'').trim()!=='':ans[ix]!==null;};
  const countAns=()=>{let n=0;for(let k=0;k<total;k++)if(answered(k))n++;return n;};
  const sels={};let advT=0,palFit=()=>{};
  const feed=()=>$('#tfeed');
  function secInner(ix){

      :`<div class="card" style="min-height:min(24vh,150px)"><div class="lbl">${n}${qLabel(q)}</div><div class="word">${esc(prompt)}</div>${q.type==='tf'?`<div class="word sub">= ${esc(q.shown)}</div>`:''}</div>`;
    if(q.type==='mc')h+=`<div style="margin-top:14px">${q.opts.map((x,k)=>`<button class="opt ${ans[ix]===k?'pick':''}" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>`;
    if(q.type==='tf')h+=`<div class="row2" style="margin-top:14px"><button class="btn tfy ${ans[ix]===true?'selp':''}" data-tf="1">✓ True</button><button class="btn tfn ${ans[ix]===false?'selp':''}" data-tf="0">✗ False</button></div>`;
    if(q.type==='type')h+=`<div style="margin-top:14px"><input class="inp ta" data-ix="${ix}" placeholder="${t('Answer')}" value="${esc(ans[ix]||'')}" ${NOASSIST}></div>`;
    if(q.type==='match')h+=mqHtml(q,ans[ix],sels[ix]||null);

  }
  function updateTop(){

    if(st)st.textContent=ca+'/'+total;
    $$('.qdot').forEach((b,ix)=>{b.classList.toggle('on',answered(ix));b.classList.toggle('cur',ix===i);});
    $$('.tq[data-ix]').forEach((s,ix)=>{s.classList.toggle('done',answered(ix));s.classList.toggle('cur',ix===i);});
    palFit();
  }
  function setCur(ix){if(ix===i)return;i=ix;persist();updateTop();}
  function scrollQ(ix,smooth){
    const el=$('#tq'+ix)||$('#tfin');if(!el)return;
    try{el.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});}catch(e){el.scrollIntoView();}
  }
  /* after an answer the next question slides up by itself */
  function advance(ix,delay,focus){
    clearTimeout(advT);

      if(!feed())return;

      if(nx>=total){scrollQ(total,true);return;}
      setCur(nx);scrollQ(nx,true);
      if(focus&&qs[nx].type==='type')setTimeout(()=>{const ta=$('#tq'+nx+' .ta');if(ta&&ta.isConnected)try{ta.focus({preventScroll:true});}catch(e){ta.focus();}},420);
    },delay);
  }
  function afterAns(ix,first){persist();drawSec(ix);updateTop();if(first)advance(ix,380);}
  /* tap a word, then its translation (either order); tap a paired item to undo the pair */
  function mqTap(ix,side,k){
    const a=ans[ix],was=answered(ix);let sel=sels[ix]||null;
    if(sel&&sel.s!==side){

  function bindSec(ix){
    const el=$('#tq'+ix),q=qs[ix];if(!el)return;

    if(q.type==='tf')el.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{const f=!answered(ix);ans[ix]=(b.dataset.tf==='1');afterAns(ix,f);});

  }
  function drawSec(ix){const el=$('#tq'+ix);if(!el)return;el.innerHTML=secInner(ix);bindSec(ix);}
  function draw(){
    persist();
    const ca=countAns();
    const dots=qs.map((_,ix)=>`<button class="qdot ${answered(ix)?'on':''} ${ix===i?'cur':''}" data-ix="${ix}">${ix+1}</button>`).join('');
    app.innerHTML=hdr(t('Test'),"if(confirm(t('Exit this session?')))render()",`<span class="tcount" id="tCount" aria-label="${t('Answered')}">${ca}/${total}</span>`)+
      `<div class="topbar"><div class="pbar"><i style="width:${ca/total*100}%"></i></div></div>`+
      `<div class="qpalbox"><div class="qpal${palOpen?' open':''}" id="qpal">${dots}</div><button class="qmore" id="qmore" aria-label="${palOpen?t('Collapse'):t('Show all questions')}">${palOpen?ic('up',18):ic('down',18)}</button></div>`+
      `<div id="tfeed">${qs.map((_,ix)=>`<section class="tq${answered(ix)?' done':''}${ix===i?' cur':''}" id="tq${ix}" data-ix="${ix}">${secInner(ix)}</section>`).join('')}</div>`+
      `<div id="tfin" class="tqfin"><button class="btn pri tfinbtn">${ic('check',18,2)}${t('Finish')}</button></div>`;
    qs.forEach((_,ix)=>bindSec(ix));
    const fd=feed();
    const act=e=>{const s=e.target.closest&&e.target.closest('.tq[data-ix]');if(s)setCur(+s.dataset.ix);};
    fd.addEventListener('pointerdown',act);fd.addEventListener('focusin',act);
    const pal=$('#qpal'),more=$('#qmore');
    if(pal&&more){
      const base=pal.getBoundingClientRect().top;
      const top=el=>Math.round(el.getBoundingClientRect().top-base+pal.scrollTop);
      const rows=new Set([...pal.children].map(top)).size;
      if(rows<=2&&!palOpen){more.style.display='none';}
      else{
        more.style.display='';
        palFit=()=>{const cur=pal.querySelector('.qdot.cur');if(cur)pal.scrollTop=palOpen?Math.max(0,top(cur)-pal.clientHeight/2+18):Math.max(0,top(cur)-4);};
        palFit();
        more.onclick=()=>{palOpen=!palOpen;pal.classList.toggle('open',palOpen);
          more.innerHTML=palOpen?ic('up',18):ic('down',18);

      }
    }
    $$('.qdot').forEach(b=>b.onclick=()=>{const ix=+b.dataset.ix;clearTimeout(advT);setCur(ix);scrollQ(ix,true);});

  function result(){

        else if(q.type==='type'){const v=(ans[ix]||'').trim();if(v&&checkAns(v,answer,en2ru)==='no'&&cfFromAnswer(q,{t:v},true))cfCh=true;}

    });

    if(!review){
      const ready=[];

        if(q.type==='match'){q.ws.forEach((w,k)=>{const j=ans[ix][k];if(award(w,j!=null&&q.order[j]===k)==='ready')ready.push(w);});return;}
        const en2ru=q.dir==='en2ru',answer=en2ru?q.w.ru:q.w.en;let ok;
        if(q.type==='mc'){const k=ans[ix];ok=k!=null&&q.opts[k].c;}
        else if(q.type==='tf'){ok=ans[ix]!=null&&ans[ix]===q.isTrue;}
        else{const v=(ans[ix]||'').trim();ok=v?checkAns(v,answer,en2ru)==='ok':false;}

  }
  function draw2(){

      const en2ru=q.dir==='en2ru',answer=en2ru?q.w.ru:q.w.en;let ok,given,near=false;

      else{const v=(ans[ix]||'').trim();const r=v?checkAns(v,answer,en2ru):'no';ok=r==='ok';near=r==='near';given=v;}

    app.innerHTML=hdr(t('Result'),"render()")+
      celHero('test',{pct,title:scoreTitle(pct),sub:`${good} / ${res.length} ${t('correct')}${!review&&toArch?` · ${toArch} ${t('moved to Archive')}`:''}`})+
      (asg?asgResultHtml(asg,pct,asgPass):'')+`<div style="height:8px"></div>`+
      (slips.length?`<div class="subhead"><span class="t">${t('Spelling slips')} — ${slips.length}</span></div>
        <div class="hint" style="margin:0 2px 8px">${t('A slip counts as a mistake — the spelling has to be exact.')}</div>`+
        slips.map(r=>`<div class="item" style="display:block;padding:13px 15px">
          <div style="display:flex;align-items:center;gap:13px">
            <div class="t" style="flex:1"><div class="en">${esc(r.w.en)}</div><div class="ru">${esc(r.w.ru)}</div></div>
            <button class="spk" onclick="speakWord('${r.w.id}')">${ic('sound',17)}</button></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
            <span class="ans-bad near">${esc(r.given)}</span>
            <span class="ans-ok">${esc(r.correct||r.w.en)}</span></div></div>`).join('')+
        `<div style="height:10px"></div>`:'')+
      (bad.length?`<div class="subhead"><span class="t">${t('Mistakes')} — ${bad.length}</span></div>`+
        bad.map(r=>`<div class="item" style="display:block;padding:13px 15px">
          <div style="display:flex;align-items:center;gap:13px">

    <div class="cst-top"><div class="cst-n"><b>${st}</b><span>${plr(st,t('day'),t('day2'),t('days'))} ${t('in a row')}</span></div>
      <button class="cst-goal" onclick="goalSheet()" aria-label="${t('Daily goal')}">${ic('target',15)}<b>${done}/${goal}</b></button></div>
    ${cstSvg({id:'t',st:w.st,idx:w.idx,view:'0 40 340 164',goal:met?0:goal,done})}
    <div class="cst-foot"><div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="cst-ft"><span>${met?t("Today's star is lit"):nWords(left)+' '+t("to light today's star")}</span><span>${t('best:')} ${S.stats.best||0}</span></div></div></div>`;
}
function learnPick(){
  const all=S.sets.flatMap(s=>s.words);
  const act=all.filter(w=>!w.arch);
  const base=act.length?act:all;
  /* the three words always share one language */
  const by={};base.forEach(w=>{(by[langOf(w)]=by[langOf(w)]||[]).push(w);});
  const ks=Object.keys(by),big=ks.filter(k=>by[k].length>=3),pickFrom=big.length?big:ks;
  if(!pickFrom.length)return [];
  /* follow the language of today's session, so the whole home page speaks one language */
  let lg0=null;try{lg0=ks.length>1?buildSession(false).lg:null;}catch(e){}
  const k=(lg0&&by[lg0]&&by[lg0].length)?lg0:pickFrom[Math.floor(Math.random()*pickFrom.length)];
  return shuffle(by[k].slice()).slice(0,3).map(w=>w.id);
}
function wordsCard(){
  if(!S.sets.some(s=>s.words.length))return '';
  if(!todayPick||todayPick.some(id=>!findWord(id)))todayPick=learnPick();
  const ws=todayPick.map(findWord).filter(Boolean);
  if(!ws.length)return '';
  return `<div class="wsky" id="wsky"><div class="wsky-h"><span>${t('Words you are learning')}</span>
    <button onclick="todayShuffle()">${ic('repeat',15)}${t('Shuffle')}</button></div>
    ${ws.map(({w},i)=>{const lv=Math.min(3,w.box||0);
      return `<button class="wsk" style="--i:${i}" onclick="speakWord('${w.id}')"><span class="wsk-s">${ic('sound',16)}</span>
        <span class="wsk-t"><b>${esc(w.en)}</b><em>${esc(w.ru)}</em></span>
        <span class="wsk-p">${[1,2,3].map(k=>`<i class="${k<=lv?'on':''}"></i>`).join('')}</span></button>`;}).join('')}</div>`;
}
function todayShuffle(){todayPick=learnPick();const e=$('#wsky');if(e)e.outerHTML=wordsCard();}

/* ================= the finales — one for each way of studying ================= */
const scoreTitle=p=>p>=90?t('Excellent!'):p>=70?t('Great job!'):p>=50?t('Good effort'):t('Keep practising');
const HDEFS=`<defs><radialGradient id="hhh"><stop offset="0" style="stop-color:var(--cs-hot-c);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--cs-hot-c);stop-opacity:0"/></radialGradient>

/* CARDS — the deck fans out, gathers into a stack, and the top card lights up */

/* LEARN — each mastered word becomes a star; they join into a ring and the centre ignites */
function heroLearn(o){
  const k=Math.max(3,Math.min(9,o.n||5)),cx=120,cy=100,R=66;
  const pts=Array.from({length:k},(_,i)=>{const a=(-90+i*360/k)*Math.PI/180;return [cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  const lines=pts.map((p,i)=>{const b=pts[(i+1)%k];return `<line id="hl${i}" class="cl on" x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;}).join('');
  const stars=pts.map((p,i)=>`<g class="fb" id="hs${i}"><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="18" fill="url(#hhb)"/><path class="cs-s" d="${cStarP(p[0].toFixed(1),p[1].toFixed(1),10)}"/></g>`).join('');
  return {svg:`<svg viewBox="0 0 240 200" aria-hidden="true">${HDEFS}${igniteSvg(cx,cy,78)}<g id="hrot" style="transform-origin:${cx}px ${cy}px">${lines}${stars}</g><g id="hstar" class="fb"><path class="cs-hot" d="${cStarP(cx,cy,24)}"/></g></svg>`,
  run(root){
    const fx=mkFx(60),step=.12,s0=.2,end=s0+k*step+.3;
    pts.forEach((p,i)=>{
      wa(root.querySelector('#hs'+i),[{opacity:0,transform:'scale(0) rotate(-40deg)'},{opacity:1,transform:'scale(1.5) rotate(6deg)',offset:.55},{opacity:1,transform:'scale(1) rotate(0)'}],{delay:(s0+i*step)*1000,duration:560,easing:CE.soft});
      const ln=root.querySelector('#hl'+(i===0?k-1:i-1));
      if(ln&&(i>0)){const len=ln.getTotalLength();ln.style.strokeDasharray=len;wa(ln,[{strokeDashoffset:len},{strokeDashoffset:0}],{delay:(s0+i*step+.05)*1000,duration:260,easing:CE.soft});}
      else if(ln&&i===0){ln.style.opacity=0;}
    });
    /* the last line closes the ring */
    const lst=root.querySelector('#hl'+(k-1));
    if(lst){lst.style.opacity=1;const len=lst.getTotalLength();lst.style.strokeDasharray=len;wa(lst,[{strokeDashoffset:len},{strokeDashoffset:0}],{delay:(s0+(k-1)*step+.3)*1000,duration:320,easing:CE.soft});}
    const hs=root.querySelector('#hstar');
    wa(hs,[{transform:'scale(0) rotate(-80deg)',opacity:0},{transform:'scale(1.5) rotate(10deg)',opacity:1,offset:.5},{transform:'scale(1) rotate(0)',opacity:1}],{delay:end*1000,duration:900,easing:CE.soft});
    ignite(root,cx,cy,end*1000);
    wa(root.querySelector('#hrot'),[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{delay:(end+.6)*1000,duration:70000,iterations:Infinity,easing:'linear'});
    pts.forEach((p,i)=>fx.later((s0+i*step)*1000+120,()=>{const e=root.querySelector('#hs'+i);if(e)sparkAt(fx,cen(e),5,false);}));
    fx.later(end*1000+60,()=>sparkAt(fx,cen(hs),36,true));
    celSound(t0=>{const A=CAU,t=x=>t0+x;
      for(let i=0;i<k;i++)A.pluck(PENT[i%PENT.length],t(s0+i*step),.12,.8);
      A.bell(CN.C6,t(end),.1,2.2);A.bell(CN.G6,t(end+.02),.07,2.2);A.bell(CN.E7,t(end+.04),.04,2.2,1.5);
      A.pad([CN.C4,CN.G4,CN.E5],t(end-.1),3,.07,.4);});
  }};
}

/* TEST — the ring fills with a comet at its tip; stars light as the score passes them */
const TEST_TH=[50,70,90];
function heroTest(o){
  const pct=Math.max(0,Math.min(100,o.pct|0)),r=82,c=2*Math.PI*r;
  const stars=TEST_TH.map((th,k)=>{const x=64+k*36,y=226;
