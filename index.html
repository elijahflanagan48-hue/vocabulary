/* ---- the reader ---- */
const RD={T:null,pars:[],map:null,added:null};
function rdParHtml(text,pi){
  let out='',last=0;
  for(const m of text.matchAll(WORD_RE)){
    out+=esc(text.slice(last,m.index));
    const w=m[0],f=fold(w);
    const cls=RD.added.has(f)?' ad':(knownOf(f,RD.map)===2?' lr':(knownOf(f,RD.map)===1?' kn':''));
    out+=`<span class="w${cls}" data-p="${pi}" data-s="${m.index}">${esc(w)}</span>`;
    last=m.index+w.length;
  }
  return out+esc(text.slice(last));
}
function rdArticle(){
  return RD.pars.map((p,i)=>p.h?`<h3 class="rs">${rdParHtml(p.text,i)}</h3>`:`<p>${rdParHtml(p.text,i)}</p>`).join('');
}
/* about 170 words a minute for a learner */
function rdTime(n){const m=Math.round(n/170);return '~'+(m<1?'1':m)+' '+t('min read');}
function rdStats(){

  return `${nWords(n)} · ${rdTime(n)} · ${kn} ${t('in your dictionary')}${add?' · '+t('added')+' '+add:''}`;
}

/* ---- dictionary form: wonders → wonder, went → go ---- */
const LEM_KEEP=new Set('this his its yes us as bus plus news always perhaps thus series species means physics lens gas class glass pass less across process business address success dress press stress mess kiss miss boss cross loss moss during morning evening king thing something nothing anything everything ring spring string bring sing wing swing ceiling bed red need seed speed indeed hundred sacred wicked naked beloved feed weed heed deed reed bleed breed proceed exceed succeed creed greed steed tweed bit rose wound bore lay shed sled embed hatred kindred'.split(/\s+/));
const LEM_PART=new Set('up down out off on in over about at for with to away back through into after along around forward by from of'.split(' '));
const LEM_NOUN={children:'child',men:'man',women:'woman',feet:'foot',teeth:'tooth',mice:'mouse',geese:'goose',oxen:'ox',is:'be',am:'be',are:'be',was:'be',were:'be',been:'be',being:'be',has:'have',having:'have',does:'do',doing:'do',goes:'go',going:'go'};
let LEM_IRR=null;
function lemIrr(w){
  if(!LEM_IRR){irregOf('');LEM_IRR={};Object.keys(IRR).forEach(b=>{IRR[b].past.concat(IRR[b].pp).forEach(f=>{if(f!==b&&!IRR[f]&&!(f in LEM_IRR))LEM_IRR[f]=b;});});}
  return LEM_IRR[w]||null;
}
/* possible base forms of a regular inflection, most likely first; [word, sure-without-a-dictionary] */
function lemCands(w){
  const out=[];
  const add=(x,strong)=>{if(x&&x.length>=2&&x!==w&&!out.some(o=>o[0]===x))out.push([x,!!strong]);};
  const dd=s=>/([^aeiou])\1$/.test(s)&&!/(ll|ss|ff|zz)$/.test(s)?s.slice(0,-1):null;
  const one=s=>(s.match(/[aeiouy]+/g)||[]).length===1&&/[^aeiou][aeiou][^aeiouwxy]$/.test(s);
  const pair=s=>{const d=dd(s);if(d)add(d,true);if(one(s)&&!d){add(s+'e');add(s);}else{add(s);add(s+'e');}};
  if(/ies$/.test(w)&&w.length>4){add(w.slice(0,-3)+'y',true);add(w.slice(0,-1));}
  else if(/(ss|sh|ch|x|z)es$/.test(w)){add(w.slice(0,-2),true);add(w.slice(0,-1));}
  else if(/oes$/.test(w)){add(w.slice(0,-1));add(w.slice(0,-2));}
  else if(/[^su]s$/.test(w)&&!/(ss|is|us)$/.test(w)&&w.length>3)add(w.slice(0,-1),true);
  if(/ied$/.test(w)&&w.length>4){add(w.slice(0,-3)+'y',true);add(w.slice(0,-1));}
  else if(/eed$/.test(w)&&w.length>4)add(w.slice(0,-1));
  else if(/ed$/.test(w)&&w.length>4)pair(w.slice(0,-2));
  if(/ing$/.test(w)&&w.length>=5)pair(w.slice(0,-3));
  if(/[^aeiou]ying$/.test(w)&&w.length>=5)add(w.slice(0,-4)+'ie');
  return out;
}
const LEM_C={};
async function lemExists(w){
  if(w in LEM_C)return LEM_C[w];
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),2500);
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w),{signal:ac.signal});
    if(r.status===404){LEM_C[w]=false;return false;}
    if(!r.ok)return null;
    LEM_C[w]=true;return true;
  }catch(e){return null;}
  finally{clearTimeout(tm);}
}
async function lemWord(w){
  if(!/^[a-z]+$/.test(w)||LEM_KEEP.has(w))return null;
  if(LEM_NOUN[w])return LEM_NOUN[w];
  const ir=lemIrr(w);if(ir)return ir;
  const cs=lemCands(w);
  for(const [c,strong] of cs){
    const ex=await lemExists(c);
    if(ex===true)return c;
    if(ex===null)return strong?c:null;      /* the dictionary is unreachable: trust only the safe rules */
  }
  return null;
}
/* null = keep as is. Only a single English word, or a verb with its particle ("looks forward") */
async function lemmaOf(phrase,lang){
  if(lang!=='en'||/[A-Z]/.test(phrase))return null;
  const p=phrase.trim().split(/\s+/);
  if(p.length>2||(p.length===2&&!LEM_PART.has(p[1])))return null;
  const b=await lemWord(p[0]);
  return b?[b].concat(p.slice(1)).join(' '):null;
}

/* ---- tapping a word opens a small card at the bottom; the text stays readable above it ---- */
const RS={p:0,tokens:[],from:0,to:0,sents:[],phrase:'',sentence:'',seq:0,orig:'',lem:null,more:false};
function rdTap(e){
  const el=e.target.closest&&e.target.closest('.w');
  if(!el||!el.dataset||el.dataset.p==null){rdClose();return;}
  const p=+el.dataset.p,s=+el.dataset.s,text=RD.pars[p].text;
  RS.p=p;RS.tokens=tokensOf(text);RS.sents=sentRanges(text);
  const i=RS.tokens.findIndex(k=>k.s===s);if(i<0)return;
  RS.from=RS.to=i;rdSheet();
}
function rdExt(i){
  if(i<RS.from)RS.from=i;
  else if(i>RS.to)RS.to=i;
  else if(i===RS.from&&RS.from<RS.to)RS.from++;
  else if(i===RS.to&&RS.from<RS.to)RS.to--;
  else return;
  rdSheet();
}
const SENT_CACHE={};
function rdClose(now){
  const pop=$('#rdPop');
  document.querySelectorAll('.reader .w.cur').forEach(x=>x.classList.remove('cur'));
  const sp=$('#rdSpace');if(sp)sp.style.height='0px';
  RS.seq++;RS.more=false;
  if(!pop)return;
  pop.id='';
  if(now){pop.remove();return;}
  pop.classList.add('out');setTimeout(()=>pop.remove(),180);
}
function rdMore(){
  const pop=$('#rdPop');if(!pop)return;
  RS.more=!RS.more;pop.classList.toggle('more',RS.more);
  const b=$('#rMore');if(b)b.firstChild.nodeValue=t(RS.more?'Less':'More')+' ';
  rdPad();
}
/* keep the tapped word above the card */
function rdPad(){
  const pop=$('#rdPop'),sp=$('#rdSpace');if(!pop)return;
  const h=pop.offsetHeight;if(sp)sp.style.height=(h+12)+'px';
  const w=document.querySelector('.reader .w.cur');if(!w)return;
  const r=w.getBoundingClientRect(),lim=innerHeight-h-18;
  if(r.bottom>lim)scrollBy({top:r.bottom-lim+34,behavior:'smooth'});
  else if(r.top<70)scrollBy({top:r.top-90,behavior:'smooth'});
}
function rdMark(a,b){
  document.querySelectorAll('.reader .w.cur').forEach(x=>x.classList.remove('cur'));
  document.querySelectorAll('.reader .w[data-p="'+RS.p+'"]').forEach(x=>{const s=+x.dataset.s;if(s>=a&&s<=b)x.classList.add('cur');});
}

function rdForm(){

function rdDupUi(){
  const T=RD.T,en=(($('#rEn')||{}).value||'').trim(),box=$('#rDup'),btn=$('#rAdd');if(!box)return;
  const d=en?findDup(T.lang,en):null;
  box.innerHTML=d?`<div class="rwdup">${t('Already in your list')} «${esc(d.s.name===ARCH_NAME?t('Archive'):d.s.name)}»: <b>${esc(d.w.ru||'')}</b></div>`:'';
  if(btn)btn.disabled=!!d;

function rdSheet(){
  const T=RD.T,par=RD.pars[RS.p].text,tk=RS.tokens,a=tk[RS.from],b=tk[RS.to];
  let phrase=par.slice(a.s,b.e).replace(/\s+/g,' ');
  const sr=RS.sents.find(r=>a.s>=r.s&&a.s<r.e)||{s:0,e:par.length};
  const sentence=par.slice(sr.s,sr.e).replace(/\s+/g,' ').trim();
  const idx=tk.map((k,i)=>i).filter(i=>tk[i].s>=sr.s&&tk[i].e<=sr.e);
  const first=idx[0];
  if(RS.from===first&&!/^I(\b|['’])/.test(phrase)&&!/^\p{Lu}{2,}/u.test(phrase))phrase=phrase.charAt(0).toLowerCase()+phrase.slice(1);
  RS.phrase=phrase;RS.sentence=sentence;RS.orig=phrase;RS.lem=null;
  const seq=++RS.seq;

const STEM_END=/(ться|тись|ться|ть|ти|чь|ся|сь|ый|ий|ой|ая|яя|ое|ее|ые|ие|ого|его|ому|ему|ым|им|ом|ем|ую|юю|ей|ов|ев|ам|ям|ах|ях|ами|ями|а|я|о|е|ы|и|у|ю|ь)$/;
async function rdTr(force){

function rdCtx(ruSent){
  const ru=$('#rRu'),ch=$('#rChips');if(!ru||!ch)return;

  ch.querySelectorAll('.chip').forEach(c=>{
    const v=(c.dataset.v||'').toLowerCase();
    const w=v.split(/[\s,;]+/).filter(x=>x.length>2)[0]||v;
    const stem=w.replace(STEM_END,'');const base=stem.length>=3?stem:w;
    const st=base.slice(0,Math.min(base.length,Math.max(4,Math.ceil(base.length*.6))));   /* задаваться ≈ задаются */
    if(toks.some(x=>x.startsWith(st))){c.classList.add('ctx');any=true;if(!first)first=c;}

async function libOpenToken(raw){
  let tok=String(raw||'').trim();const m=tok.match(/[?&]lib=([A-Za-z0-9]+)/);if(m)tok=m[1];
  if(!/^[A-Za-z0-9]{16,64}$/.test(tok))return toast(t('That doesn’t look like a set link'));
  if(!sb)return toast(t('No connection — try again when you’re online.'));
  try{
    const {data,error}=await sb.rpc('library_by_token',{tok});
    if(error)throw error;
    if(!data||!data.length)return toast(t('Set not found, or it is no longer shared'));
    const r=data[0];LV={src:'link',set:Object.assign(libNorm(r),{teacher_name:r.teacher_name||''})};

  }catch(e){toast(t('No connection — try again when you’re online.'));}
}

async function libShare(){

function libAdd(){
  const x=LV&&LV.set;if(!x)return;
  let {sub,set}=libLocal(x);
  if(!set){set={id:uid(),name:libTitle(x),lang:x.lang||'en',words:[],upd:Date.now(),synced:false};S.sets.push(set);}
  const have=new Set(set.words.map(w=>fold(w.en)));
  const fresh=x.words.filter(w=>w.en&&!have.has(fold(w.en)));
  const mine=[],dupes=[];
  fresh.forEach(w=>{(findDup(set.lang,w.en)?dupes:mine).push(w);});
  const rows=mine.map((w,i)=>{const nw=newWord(w.en,w.ru||'—',w.ex||'');nw.pos=posNow(i,mine.length);return nw;});
  set.words.unshift(...rows);set.upd=Date.now();set.synced=false;
  (S.libSubs||(S.libSubs={}))[x.id]={setId:set.id,ver:x.version||1,at:Date.now()};
  S.settings.lastSet=set.id;
  save();
  if(LV.src!=='builtin'&&sb&&AUTH.user&&!libTeacher())sb.from('library_subs').upsert({student_id:AUTH.user.id,lib_id:x.id,ver:x.version||1}).then(()=>{},()=>{});
  toast(t('Added ✓')+': '+rows.length+(dupes.length?' · '+t('already had')+' '+dupes.length:''));
  render();
}

/* ---- live updates: what changes in the cloud shows up here without a refresh ---- */
const LIVE={ch:null,key:'',seen:'',deb:0,pull:0};
function liveIds(){
  const me=AUTH.user&&AUTH.user.id;if(!me)return [];
  const ids=[me];
  if(AUTH.profile&&AUTH.profile.role==='teacher')(AUTH.students||[]).forEach(s=>{if(s&&s.id&&ids.indexOf(s.id)<0)ids.push(s.id);});
  return ids.slice(0,100);
}
function liveStart(){
  if(!cloudEnabled()||!sb.channel){return;}
  const ids=liveIds();if(!ids.length)return;
  const key=ids.join(',');
  if(LIVE.ch&&LIVE.key===key)return;
  liveStop();LIVE.key=key;
  const f=ids.length===1?'owner_id=eq.'+ids[0]:'owner_id=in.('+ids.join(',')+')';
  try{
    LIVE.ch=sb.channel('live-'+ids[0].slice(0,8))
      .on('postgres_changes',{event:'*',schema:'public',table:'words',filter:f},p=>liveRow('words',p))
      .on('postgres_changes',{event:'*',schema:'public',table:'sets',filter:f},p=>liveRow('sets',p))
      .subscribe();
  }catch(e){LIVE.ch=null;LIVE.key='';}
}
function liveStop(){try{if(LIVE.ch&&sb)sb.removeChannel(LIVE.ch);}catch(e){}LIVE.ch=null;LIVE.key='';}
function liveDrop(table,id){
  if(!id)return false;let hit=false;
  if(table==='sets'){const n=S.sets.length;S.sets=S.sets.filter(s=>s.id!==id);hit=S.sets.length!==n;}
  else S.sets.forEach(s=>{const n=s.words.length;s.words=s.words.filter(w=>w.id!==id);if(s.words.length!==n)hit=true;});
  return hit;
}
function liveRow(table,p){
  try{
    const me=AUTH.user&&AUTH.user.id,r=p&&p.new&&p.new.id?p.new:null,old=(p&&p.old)||{};
    const owner=(r&&r.owner_id)||old.owner_id||null;
    let mine=!owner||owner===me,touched=false;
    if(mine){
      if(p.eventType==='DELETE'||(r&&r.deleted)){touched=liveDrop(table,(r||old).id);}
      else if(r){
        if(table==='sets')mergeCloud([r],[],false);
        else if(S.sets.some(s=>s.id===r.set_id))mergeCloud([],[r],false);
        else{liveCatchUp();return;}                    /* a word for a list we don't have yet */
        touched=true;
      }
      if(touched){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
    }
    liveRefresh(owner&&owner!==me?owner:null,touched||!mine);
  }catch(e){}
}
/* many rows can arrive at once (an import): redraw once */
function liveRefresh(otherOwner,doIt){
  if(!doIt)return;
  clearTimeout(LIVE.deb);
  LIVE.deb=setTimeout(()=>{
    if(otherOwner){
      if(TEACH_VIEWS.indexOf(view.name)<0)return;
      if(view.name!=='students'&&view.sid!==otherOwner)return;
    }
    softRender();
  },260);
}
function liveCatchUp(){clearTimeout(LIVE.pull);LIVE.pull=setTimeout(()=>{if(cloudEnabled())cloudPull().then(softRender);},500);}
/* safety net for when the instant channel is not available: one tiny request every 20 s */
async function liveCheck(){
  if(!cloudEnabled()||document.visibilityState!=='visible'||syncing)return;
  liveStart();
  const ids=liveIds();if(!ids.length)return;
  try{
    const q=tb=>sb.from(tb).select('updated_at').in('owner_id',ids).order('updated_at',{ascending:false}).limit(1);
    const [a,b]=await Promise.all([q('words'),q('sets')]);
    if(a.error||b.error)return;
    const k=((a.data&&a.data[0]&&a.data[0].updated_at)||'')+'|'+((b.data&&b.data[0]&&b.data[0].updated_at)||'');
    const was=LIVE.seen;LIVE.seen=k;
    if(was&&was!==k){await cloudPull();softRender();}
  }catch(e){}
}
/* our own writes move the "latest change" too: forget it, so we don't pull our own changes back */
(function(){const o=cloudPush;cloudPush=async function(){const r=await o.apply(this,arguments);LIVE.seen='';return r;};})();
setInterval(liveCheck,20000);
