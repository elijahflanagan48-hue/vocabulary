<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="theme-color" content="#0e3b2c">
<title>Vocabulary</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="description" content="Vocabulary — личный словарь для изучения английских слов: карточки, тесты и интервальные повторения.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>(function(){try{var s=(JSON.parse(localStorage.getItem('vocab.v2')||'{}').settings)||{};var m=s.theme||'auto',dark;if(m==='dark')dark=true;else if(m==='light')dark=false;else{var h=new Date().getHours();dark=h<7||h>=19;}document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>
:root{
  --bg:#f2f4f0; --surf:#ffffff; --surf2:#f7f9f5;
  --tx:#0e1a14; --mut:#5b6b61; --fade:#8e9d93;
  --line:#e4e9e2; --line2:#d5ded3;
  --pri:#0e3b2c; --pri-d:#0a2c21; --pri-soft:#e7efe9; --on-pri:#ffffff;
  --acc:#d4f25a; --acc-ink:#0e3b2c; --mint:#8ef0a8;
  --grad:linear-gradient(135deg,#0e3b2c,#2f7d4f 60%,#d4f25a);
  --ok:#1e7a52; --ok-soft:#e4f2ea; --bad:#b33f2b; --bad-soft:#f9e8e4;
  --warn:#a9700f; --info:#1f6f8b;
  --word:#0e1a14; --card-bg:#0e3b2c; --card-tx:#f3f8f1; --card-mut:#9cc6ad;
  --sh-sm:0 1px 2px rgba(14,26,20,.04); --sh:0 10px 30px rgba(14,26,20,.10),0 2px 6px rgba(14,26,20,.05);
  --r:16px; --r-sm:12px;
  --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Segoe UI",Roboto,system-ui,sans-serif;
  --ff-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;
}
:root[data-theme="dark"]{
  --bg:#0a120d; --surf:#111b15; --surf2:#16231b;
  --tx:#e9f0ea; --mut:#93a69a; --fade:#6d8075;
  --line:#1d2b23; --line2:#26362c;
  --pri:#58b887; --pri-d:#8ef0a8; --pri-soft:#15291f; --on-pri:#04190f;
  --acc:#d4f25a; --acc-ink:#0e3b2c; --mint:#8ef0a8;
  --grad:linear-gradient(135deg,#2f7d4f,#6fc995 62%,#c3e46a);
  --ok:#4ed38f; --ok-soft:#0f2a1e; --bad:#e8806a; --bad-soft:#2c1511;
  --word:#f1f7f1; --card-bg:#132c22; --card-tx:#eef6ee; --card-mut:#8fb79e;
  --sh-sm:0 1px 2px rgba(0,0,0,.35); --sh:0 14px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.i{display:block;flex:none}
.btn .i{margin-right:-1px}
.seg3 button,.seg button,.tabs2 button{display:flex;align-items:center;justify-content:center;gap:7px}
.flame .n{display:flex;align-items:center;gap:5px;justify-content:center}
.lnk{display:inline-flex;align-items:center;gap:6px}
.item .pips,.item .chk,.item .cbox{align-self:center}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
#app{max-width:680px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
::selection{background:var(--pri-soft)}

/* header */
header{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(var(--bg) 72%,transparent)}
header h1{flex:1;min-width:0;margin:0;font-size:25px;font-weight:700;letter-spacing:-.022em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;flex:none;border-radius:11px;background:transparent;
  border:1px solid transparent;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ic:hover{color:var(--tx);background:var(--surf2)}
.ic{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.ic:active{transform:scale(.96);transition-duration:.12s}
.back{font-size:26px;font-weight:600;color:var(--pri)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:14px 18px;border-radius:var(--r-sm);background:var(--surf);
  border:1px solid var(--line2);font-weight:600;font-size:16px;letter-spacing:-.01em}
.btn{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .18s ease}
.btn:active{transform:scale(.988);transition-duration:.12s}
.btn.pri{background:var(--pri);color:var(--on-pri);border:1px solid transparent;font-weight:650}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line2)}
.btn.danger{color:var(--bad)}
.stack>*+*{margin-top:10px}


/* mode pills */
.modes{display:flex;gap:10px;overflow-x:auto;padding:2px 0 14px;margin:0 -16px;
  padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.mcard{flex:none;scroll-snap-align:start;width:104px;padding:13px 12px;border-radius:var(--r-sm);background:var(--surf);
  border:1px solid var(--line);text-align:left}
.mcard{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease}
.mcard:active{transform:scale(.978);transition-duration:.12s}
.mcard .em{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--surf2);border:1px solid var(--line);color:var(--pri)}
.mcard b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.mcard small{color:var(--mut);font-size:11.5px;font-weight:500}
.mcard:hover .em{background:var(--pri-soft)}

/* list / dictionary */
.subhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px}
.subhead .t{font-size:13.5px;font-weight:600;color:var(--fade);letter-spacing:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:0 13px;margin-bottom:10px;box-shadow:var(--sh-sm)}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;color:var(--tx)}
.search svg{width:17px;height:17px;fill:var(--fade);flex:none}
.item{display:flex;align-items:center;gap:13px;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:8px}
.item{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease}
.item:active{background:var(--surf2);transform:scale(.995);transition-duration:.12s}
.item .t{flex:1;min-width:0}
.item .en{font-family:var(--ff-serif);font-weight:600;font-size:17px;letter-spacing:-.005em;color:var(--word);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ru{color:var(--mut);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:3px;flex:none}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.pip.on1{background:var(--line2)}.pip.on2{background:var(--pri);opacity:.55}.pip.on3{background:var(--pri)}
.chk{width:24px;height:24px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none}
.spk{width:34px;height:34px;flex:none;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.spk{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.spk:active{background:var(--pri-soft);color:var(--pri);transform:scale(.95);transition-duration:.12s}

/* selection / bulk archive */
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px;min-height:24px}
.tbar .t{font-size:13.5px;font-weight:600;color:var(--fade);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{font-size:14.5px;font-weight:700;color:var(--pri);padding:5px 4px;flex:none;border-radius:9px}
.lnk:active{background:var(--pri-soft)}
.cbox{width:25px;height:25px;flex:none;border-radius:50%;border:2px solid var(--line2);background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;transition:.12s}
.cbox.on{background:var(--pri);border-color:var(--pri);transform:scale(1.06)}
.item.pick{border-color:var(--pri);background:var(--pri-soft)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(transparent,var(--bg) 34%);
  padding:20px 16px calc(14px + env(safe-area-inset-bottom))}
.selbar .in{max-width:680px;margin:0 auto}
.btn:disabled{opacity:.5;box-shadow:none}
.ans-bad,.ans-ok{font-size:14px;font-weight:650;padding:6px 12px;border-radius:11px;line-height:1.2}
.ans-bad{background:var(--bad-soft);color:var(--bad);font-family:var(--ff-serif)}
.ans-ok{background:var(--ok-soft);color:var(--ok);font-family:var(--ff-serif)}
/* test question palette */
.qpalbox{display:flex;align-items:flex-start;gap:8px;margin:0 0 12px}
.qpal{position:relative;flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:7px;max-height:79px;overflow:hidden;
  transition:max-height .3s cubic-bezier(.22,1,.36,1)}
.qpal.open{max-height:min(42vh,340px);overflow:auto}
.qpal::-webkit-scrollbar{display:none}
.qmore{flex:none;width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line2);
  background:var(--surf);color:var(--mut);font-size:15px;font-weight:800;line-height:1;
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.qmore:active{transform:scale(.95);transition-duration:.12s}
.qmore .n{font-size:11px;font-weight:700;display:block;margin-top:-2px}
.qdot{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:11px;border:1.5px solid var(--line2);background:var(--surf);color:var(--mut);font-weight:700;font-size:14.5px}
.qdot.on{border-color:var(--pri);color:var(--pri-d);background:var(--pri-soft)}
.qdot{transition:transform .2s cubic-bezier(.22,1,.36,1),background-color .18s ease,border-color .18s ease,color .18s ease}
.qdot:active{transform:scale(.95);transition-duration:.12s}
.qdot.cur{background:var(--pri);color:var(--on-pri);border-color:transparent}
.opt.pick{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.btn.selp{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.arch-ic{width:44px;height:44px;flex:none;border-radius:13px;background:var(--surf2);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.src{color:var(--fade);font-size:12.5px;font-weight:600}

/* account */
.ic{position:relative}
.tabs2{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--sh-sm);margin-bottom:14px}
.tabs2 button{flex:1;padding:10px 6px;border-radius:10px;font-weight:650;font-size:15px;color:var(--mut)}
.tabs2 button{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.tabs2 button.on{background:var(--pri);color:var(--on-pri)}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pri-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px;margin:4px 0 12px}
.codebox b{font-family:var(--ff-serif);font-size:30px;font-weight:600;letter-spacing:.1em;color:var(--pri)}
.roster{display:flex;align-items:center;gap:13px;background:var(--surf);box-shadow:var(--sh-sm);border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:9px}
.roster{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.roster:active{transform:scale(.995);transition-duration:.12s}
.roster .av{width:40px;height:40px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.roster .t{flex:1;min-width:0}
.roster .nm{font-weight:700;font-size:16px}
.roster .meta{color:var(--mut);font-size:13px}
.err{color:var(--bad);font-size:13.5px;font-weight:600;margin:2px 2px 8px;min-height:17px}

/* daily goal + review */
.daycard{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);
  border-radius:15px;padding:12px 15px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.daycard .t{flex:1;min-width:0}
.daycard .lbl{font-size:13.5px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.daycard .lbl b{color:var(--tx);font-weight:750}
.daycard .pbar{margin-top:7px}
.flame{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;min-width:40px}
.flame .n{font-size:17px;font-weight:850;letter-spacing:-.02em;line-height:1}
.flame .c{font-size:11px;color:var(--fade);font-weight:500}
.ipa{color:var(--fade);font-size:13.5px;font-weight:500;font-style:normal}
.ipa-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 3px 0;min-height:22px}
.ipa-row .lnk{font-size:13.5px;padding:3px 0}
.card .ipa{font-size:16.5px;margin-top:10px;color:var(--card-mut)}
.near{background:#fff4e0;color:#b45309}
:root[data-theme="dark"] .near{background:#3a2c10;color:#fbbf24}
.fb.near{background:#fff4e0;color:#b45309}
:root[data-theme="dark"] .fb.near{background:#3a2c10;color:#fbbf24}

/* set card on home */
.setcard{display:flex;align-items:center;gap:14px;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.setcard{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease,border-color .2s ease}
.setcard:active{transform:scale(.993);transition-duration:.12s}
.setcard .t{flex:1;min-width:0}
.setcard .nm{font-weight:750;font-size:18px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setcard .meta{color:var(--mut);font-size:13.5px;margin-top:2px}
.ring{flex:none}

/* empty */
.empty{text-align:center;color:var(--mut);padding:46px 24px}
.empty .big{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--surf);border:1px solid var(--line);color:var(--fade);display:flex;align-items:center;justify-content:center}
.empty b{display:block;color:var(--tx);font-size:18px;font-weight:700;margin-bottom:5px;letter-spacing:-.02em}
.empty p{margin:0;font-size:14.5px;line-height:1.5}

/* banner */
.banner{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:14px;font-size:14px;line-height:1.5;align-items:flex-start;color:var(--mut)}
.banner b{color:var(--tx)}
.banner .ib{color:var(--pri);flex:none;margin-top:1px}
.banner .x{margin-left:auto;font-size:18px;color:var(--pri);flex:none;padding:0 2px}
.banner b{font-weight:700}

/* fab */
.fab{position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:15;
  width:56px;height:56px;border-radius:18px;background:var(--pri);color:var(--on-pri);
  box-shadow:0 10px 26px rgba(14,59,44,.30);display:flex;align-items:center;justify-content:center;line-height:1}
.fab{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease}
.fab:active{transform:scale(.95);transition-duration:.12s}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;animation:fade .26s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(12px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes down{to{transform:translateY(14px);opacity:0}}
@keyframes fadeout{to{opacity:0}}
.sheet{width:100%;max-width:680px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
  animation:up .28s cubic-bezier(.33,1,.68,1);will-change:transform}
.scrim.closing{animation:fadeout .18s ease forwards;pointer-events:none}
.scrim.closing .sheet{animation:down .18s ease forwards}
.grip{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
.sheet h2{margin:0 0 14px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.field{margin-bottom:11px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 2px 7px}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--pri)}
textarea.inp{resize:vertical;line-height:1.5;min-height:120px;font-size:15px}
.row{display:flex;gap:9px;align-items:center}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.hint{color:var(--mut);font-size:13px;min-height:17px;margin:2px 2px 6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.chip{background:var(--pri-soft);color:var(--pri-d);border-radius:11px;padding:7px 13px;font-size:14px;font-weight:600}
.chip{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.chip:active{transform:scale(.97);transition-duration:.12s}
.sel-opt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sel-opt button{padding:9px 13px;border-radius:11px;background:var(--surf);border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--mut)}
.sel-opt button{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .22s cubic-bezier(.22,1,.36,1)}
.sel-opt button:active{transform:scale(.975);transition-duration:.12s}
.sel-opt button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d)}
.toggle{display:flex;align-items:center;gap:10px;padding:12px 2px}
.toggle label{flex:1;font-weight:600;font-size:15px}
.sw{width:50px;height:30px;border-radius:16px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw.on{background:var(--ok)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:23px}

/* study */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .x{font-size:15px;font-weight:650;color:var(--mut)}
.pbar{flex:1;height:7px;background:var(--line2);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .3s ease-out}
.stat{font-size:14px;font-weight:700;color:var(--mut);flex:none;min-width:52px;text-align:right}
.fc{perspective:1200px;margin:12px 0}
.card{background:var(--card-bg);border:1px solid transparent;border-radius:22px;min-height:min(60vh,340px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:var(--sh)}
.card .word{font-family:var(--ff-serif);font-size:clamp(30px,8.4vw,44px);font-weight:600;letter-spacing:-.015em;line-height:1.12;color:var(--card-tx);overflow-wrap:anywhere;max-width:100%}
.card .ex{overflow-wrap:anywhere;font-family:var(--ff-serif);font-size:16.5px;font-weight:400;color:var(--card-mut);margin-top:18px;line-height:1.45;font-style:italic}
.card .tip{font-size:13.5px;color:var(--card-mut);opacity:.8;margin-top:20px;font-weight:450}
.card .lbl{font-size:13.5px;font-weight:500;color:var(--card-mut);margin-bottom:18px}
.opt{display:flex;align-items:center;width:100%;text-align:left;overflow-wrap:anywhere;background:var(--surf);border:1.5px solid var(--line2);
  border-radius:15px;padding:16px 17px;margin-bottom:10px;font-size:17px;font-weight:600;box-shadow:var(--sh-sm);
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,color .18s ease}
.opt:active{transform:scale(.995);transition-duration:.12s}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{padding:15px;border-radius:15px;margin:12px 0;font-weight:700;font-size:16px;line-height:1.4}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:500;margin-top:5px;opacity:.85}
.big-pct{text-align:center;font-size:58px;font-weight:850;letter-spacing:-.04em;line-height:1;margin:14px 0 2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:72px;padding:10px;border-radius:16px;background:var(--surf);border:1.5px solid var(--line2);
  box-shadow:var(--sh-sm);font-weight:650;font-size:15.5px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
.tile{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,opacity .3s ease}
.tile:active{transform:scale(.98);transition-duration:.12s}
.tile.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.tile.done{opacity:0;pointer-events:none;transform:scale(.8);transition:.3s}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:#15171f;color:#fff;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:600;z-index:60;
  opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
:root[data-theme="dark"] #toast{background:#2a2e3d}

/* theme segmented control */
.seg3{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:4px;box-shadow:var(--sh-sm)}
.seg3 button{flex:1;padding:10px 6px;border-radius:9px;font-weight:650;font-size:14.5px;color:var(--mut)}
.seg3 button{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.seg3 button.on{background:var(--pri);color:var(--on-pri)}

/* result hero + score ring */
.hero{text-align:center;padding:14px 0 6px}
.hero-ic{width:62px;height:62px;margin:0 auto;border-radius:20px;background:var(--pri-soft);color:var(--pri);
  display:flex;align-items:center;justify-content:center;animation:pop .34s ease-out both}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes viewin{from{opacity:.3}to{opacity:1}}
.viewin{animation:viewin .17s ease-out}
@keyframes flipout{from{transform:rotateY(0)}to{transform:rotateY(90deg)}}
@keyframes flipin{from{transform:rotateY(-90deg)}to{transform:rotateY(0)}}
.card.fout{animation:flipout .19s cubic-bezier(.4,0,.8,.45) forwards}
.card.fin{animation:flipin .25s cubic-bezier(.2,.65,.3,1)}
.fc .card{transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}
.hero-title{font-size:27px;font-weight:850;letter-spacing:-.025em;margin-top:8px}
.hero-sub{color:var(--mut);font-size:16px;margin-top:5px;font-weight:500}
.ring-big{display:block;margin:6px auto 2px}
.rb-track{fill:none;stroke:var(--line2);stroke-width:13}
.rb-fill{fill:none;stroke:url(#gbig);stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--off);animation:ringfill 1.15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
.rb-pct{font-family:var(--ff-serif);font-size:40px;font-weight:600;fill:var(--tx);letter-spacing:-.01em}
:root[data-theme="dark"] #g stop:first-child,:root[data-theme="dark"] #gbig stop:first-child{stop-color:#2f7d4f}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* bottom navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:2px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:var(--surf);border-top:1px solid var(--line)}
.tab{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 4px;border-radius:12px;color:var(--fade);font-size:11.5px;font-weight:600;
  transition:color .18s ease,background-color .18s ease}
.tab.on{color:var(--pri)}
.tab:active{background:var(--surf2)}

/* today: the one thing to do */
.sess{background:var(--card-bg);color:var(--card-tx);border-radius:20px;padding:28px 20px 20px;text-align:center;margin-bottom:14px}
.sess-n{font-family:var(--ff-serif);font-size:60px;line-height:1;font-weight:600;color:var(--acc);letter-spacing:-.02em}
.sess-t{color:var(--card-mut);font-size:15px;margin-top:8px}
.sess .btn{margin-top:20px;background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
.sess .btn:active{background:var(--acc)}
.sess-m{color:var(--card-mut);font-size:13.5px;margin-top:13px;min-height:18px}
.sess.done{padding:26px 20px 20px}
.sess.done .btn{background:transparent;color:var(--card-tx);border:1px solid rgba(255,255,255,.22)}
.sess-ic{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:rgba(255,255,255,.08);
  color:var(--acc);display:flex;align-items:center;justify-content:center}
.sess.done .sess-t{color:var(--card-tx);font-size:19px;font-weight:650}

/* a settings-style row that leads somewhere */
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 15px;margin-bottom:8px;font-size:15.5px;font-weight:600;color:var(--tx);
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.rowlink:active{transform:scale(.995);transition-duration:.12s;background:var(--surf2)}
.rowlink>span{display:flex;align-items:center;gap:11px;min-width:0}
.rowlink>span .i{color:var(--mut)}
.rowlink em{font-style:normal;color:var(--mut);font-weight:500;font-size:14px;flex:none}
.rowlink .i:last-child{color:var(--fade)}


/* modes live in one sheet now */
.modes-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modes-grid .mcard{width:auto}

/* bigger, fuller desktop layout */
@media(min-width:720px){
  body{font-size:17.5px}
  #app{max-width:780px;padding:0 24px}
  header h1{font-size:32px}
  .ic{width:46px;height:46px;font-size:21px}
  .btn{font-size:17px;padding:16px 20px}
  .setcard{padding:20px}.setcard .nm{font-size:21px}.setcard .meta{font-size:15px}
  .item{padding:15px 18px}.item .en{font-size:18.5px}.item .ru{font-size:16px}
  .mcard{width:120px;padding:17px 14px}.mcard b{font-size:16px}.mcard small{font-size:12.5px}
  .card .word{font-size:clamp(36px,4.6vw,50px)}
  .opt{font-size:18px;padding:18px 19px}
  .hero-title{font-size:32px}.hero-sub{font-size:17px}
  .rb-pct{font-size:46px}
  .subhead .t{font-size:14px}
  .tab{font-size:12.5px}
  .sess-n{font-size:66px}
}

/* ---------- storage + migration ---------- */
function load(){
  try{
    let raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);return fix(d);}
    const old=localStorage.getItem('vocab.v1');
    if(old){const d=JSON.parse(old);return fix(migrate(d));}
  }catch(e){}
  return DB();
}
function migrate(d){ // v1 -> v2
  (d.sets||[]).forEach(s=>s.words.forEach(w=>{w.arch=(w.box||0)>=3;w.added=w.added||Date.now();}));
  d.v=2;return d;
}
function fix(d){
  d=d||DB();
  d.settings=Object.assign({prov:'google',hideBanner:false,theme:'auto',accent:'uk',geo:null,lang:'ru'},d.settings||{});
  d.settings.sr=Object.assign({},DEF_SR,d.settings.sr||{});
  /* nobody has chosen a pace yet → follow the current default */
  if(!d.settings.sr.picked)d.settings.sr.plan=DEF_SR.plan;
  d.stats=Object.assign({},DEF_STATS,d.stats||{});
  if(!Array.isArray(d.stats.ids))d.stats.ids=[];
  d.sets=(d.sets||[]).map(s=>({id:s.id,name:s.name,upd:s.upd||Date.now(),synced:!!s.synced,words:(s.words||[]).map(w=>({
    id:w.id,en:w.en,ru:w.ru,ex:w.ex||'',ipa:w.ipa||'',box:w.box||0,arch:!!w.arch,ok:w.ok||0,bad:w.bad||0,added:w.added||Date.now(),
    due:w.due||0,rep:w.rep||0,upd:w.upd||Date.now(),synced:!!w.synced
  }))}));
  return d;
}

function okAns(inp,correct,isRu){const n=norm(inp);if(!n)return false;if(norm(correct)===n)return true;return isRu&&correct.split(/[,;\/]/).some(v=>norm(v)===n);}
/* edit distance (counts a swap of two neighbours as one slip, like "recieve") */
function lev(a,b){
  if(Math.abs(a.length-b.length)>1)return 9;
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++)d[i]=[i];
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
/* 'ok' | 'near' (one typo) | 'no' */
function checkAns(inp,correct,isRu){
  if(okAns(inp,correct,isRu))return 'ok';
  const n=norm(inp);if(!n)return 'no';
  const cands=isRu?correct.split(/[,;\/]/).map(norm).filter(Boolean):[norm(correct)];
  for(const c of cands){
    if(c.length>=4&&n.length>=c.length-1&&lev(n,c)<=1)return 'near';
  }
  return 'no';
}

const archCount=()=>S.sets.reduce((n,s)=>n+s.words.filter(w=>w.arch).length,0);
function findWord(id){for(const s of S.sets){const w=s.words.find(x=>x.id===id);if(w)return{w,s};}return null;}
let scope={kind:'all',id:null};
function setScope(kind,id){scope={kind,id:id||null};}
function poolNow(){
  if(scope.kind==='arch')return allArchived().map(x=>x.w);
  if(scope.kind==='hard')return hardWords();
  if(scope.kind==='set'){const s=S.sets.find(x=>x.id===scope.id);return s?active(s):[];}
  return S.sets.flatMap(s=>active(s));

/* ---------- what to study right now ---------- */
function buildSession(force){
  const goal=S.stats.goal||10, target=Math.max(6,goal);
  const due=dueWords();                       /* archived words that came back */
  const seen=new Set(due.map(w=>w.id));
  const tricky=hardWords().filter(w=>!w.arch&&!seen.has(w.id)).slice(0,5);
  tricky.forEach(w=>seen.add(w.id));
  const fresh=S.sets.flatMap(s=>active(s))
    .filter(w=>!seen.has(w.id))
    .sort((a,b)=>(a.box||0)-(b.box||0)||(a.upd||0)-(b.upd||0))
    .slice(0,Math.max(0,target-due.length-tricky.length));
  let words=[...due,...tricky,...fresh];
  if(!words.length&&force)words=shuffle(S.sets.flatMap(s=>s.words)).slice(0,target);
  return {due,tricky,fresh,words:shuffle(words)};
}

/* ---------- one adaptive session: the question fits the word ---------- */
function startSession(force){
  const plan=buildSession(force);
  if(!plan.words.length)return toast(t('Nothing due right now'));
  const pool=S.sets.flatMap(s=>s.words);
  let queue=plan.words.slice();
  let total=queue.length,done=0,good=0,learnt=0,back=0;const retried=new Set();
  const app=$('#app');
  function next(){
    if(!queue.length)return finish();
    const w=queue.shift();done++;
    app.innerHTML=studyTop(t('Session'),(done-1)/total*100,(done-1)+'/'+total);
    const lvl=w.arch?3:(w.box||0);
    const kind=w.arch?'type':(lvl<=1?'mc':'type');
    const dir=w.arch?'ru2en':(lvl===0?'en2ru':'ru2en');
    const q=mkQ(pool,w,kind,dir);
    pulse($('#qb'));
    renderQ($('#qb'),q,{feedback:true,onDone:ok=>{
      if(w.arch){
        const r=srAnswer(w,ok);
        if(ok){w.ok=(w.ok||0)+1;}else{w.bad=(w.bad||0)+1;if(r==='relearn')back++;}
      }else{
        const r=award(w,ok);
        if(ok&&r==='arch')learnt++;
        if(!ok&&!retried.has(w.id)){retried.add(w.id);queue.push(w);total++;}
      }
      if(ok)good++;
      touch(w);bumpStudy(w.id);save();
      next();
    }});
  }
  function finish(){
    const pct=Math.round(good/Math.max(1,done)*100);
    const bits=[];
    if(learnt)bits.push(learnt+' '+t('mastered'));
    if(plan.due.length)bits.push(plan.due.length+' '+t('reviewed'));
    if(back)bits.push(back+' '+t('returned to learning'));
    app.innerHTML=hdr(t('Session'),"go('today')")+
      scoreHero(pct,bits.length?bits.join(' · '):good+' / '+done+' '+t('correct'))+
      '<div style="height:14px"></div><button class="btn pri" onclick="go(\'today\')">'+t('Done')+'</button>';
    if(pct>=80)confetti(90);
  }
  next();
}

/* ---------- spaced repetition (archive) ---------- */
const DAY=864e5;
function srCfg(){return Object.assign({},DEF_SR,(S.settings&&S.settings.sr)||{});}
function srDays(){
  const c=srCfg();
  if(c.plan==='custom'&&Array.isArray(c.days)&&c.days.length)return c.days;
  return SR_PLANS[c.plan]||SR_PLANS.standard;
}
/* schedule an archived word for its next review */
function srSchedule(w,reset){
  const d=srDays();
  if(reset)w.rep=0;
  const step=Math.min(w.rep||0,d.length-1);
  w.due=Date.now()+d[step]*DAY;
}
/* a word has just been archived → put it on the ladder */
function srStart(w){if(!srCfg().on){w.due=0;w.rep=0;return;}w.rep=0;srSchedule(w,true);}
function srAnswer(w,ok){
  const c=srCfg();
  if(ok){w.rep=(w.rep||0)+1;srSchedule(w,false);return 'kept';}
  if(c.onFail==='relearn'){w.arch=false;w.box=1;w.rep=0;w.due=0;return 'relearn';}
  w.rep=Math.max(0,(w.rep||0)-1);w.due=Date.now()+DAY;return 'again';
}
function dueAll(){
  if(!srCfg().on)return [];
  const now=Date.now();
  return S.sets.flatMap(s=>s.words.filter(w=>w.arch&&w.due&&w.due<=now))
    .sort((a,b)=>(a.due||0)-(b.due||0));
}
function dueWords(){const lim=srCfg().limit||20;return dueAll().slice(0,lim);}
function dueCount(){return dueAll().length;}
function nextDueAt(){
  const f=S.sets.flatMap(s=>s.words.filter(w=>w.arch&&w.due)).map(w=>w.due).sort((a,b)=>a-b)[0];
  return f||0;
}
function whenTxt(ts){
  if(!ts)return '';
  const d=Math.round((ts-Date.now())/DAY);
  if(d<=0)return t('today');
  if(d===1)return t('tomorrow');
  if(d<7)return t('in')+' '+d+' '+plr(d,t('day'),t('day2'),t('days'));
  if(d<30){const w=Math.round(d/7);return t('in')+' '+w+' '+plr(w,t('week'),t('week2'),t('weeks'));}
  const mo=Math.round(d/30);return t('in')+' '+mo+' '+plr(mo,t('month'),t('month2'),t('months'));
}

function hardWords(){

    .sort((a,b)=>((b.bad||0)-(b.ok||0))-((a.bad||0)-(a.ok||0)));
}

/* ---------- daily goal + streak ---------- */
const dayKey=d=>{const x=d||new Date();return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();};
function rollDay(){
  const st=S.stats,k=dayKey();
  if(st.day===k)return;
  const y=dayKey(new Date(Date.now()-DAY));
  if(!(st.day===y&&st.met))st.streak=0;
  st.day=k;st.ids=[];st.met=false;
}
function bumpStudy(id){
  rollDay();const st=S.stats;
  if(st.ids.indexOf(id)<0)st.ids.push(id);
  const goal=st.goal||10;
  if(!st.met&&st.ids.length>=goal){st.met=true;st.streak=(st.streak||0)+1;if(st.streak>(st.best||0))st.best=st.streak;}
}
function todayCount(){rollDay();return S.stats.ids.length;}

/* ---------- theme (day/night) ---------- */
function sunTimes(date,lat,lon){
  const rad=Math.PI/180,deg=180/Math.PI;
  const J=date.getTime()/86400000+2440587.5;
  const n=Math.round(J-2451545.0+0.0008);
  const Js=n-lon/360;
  const M=(357.5291+0.98560028*Js)%360;
  const C=1.9148*Math.sin(M*rad)+0.0200*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const lam=(M+C+180+102.9372)%360;
  const Jt=2451545.0+Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*lam*rad);
  const dec=Math.asin(Math.sin(lam*rad)*Math.sin(23.44*rad));
  let cH=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  cH=Math.max(-1,Math.min(1,cH));
  const H=Math.acos(cH)*deg;
  const toD=x=>new Date((x-2440587.5)*86400000);
  return {rise:toD(Jt-H/360),set:toD(Jt+H/360)};
}
function resolveDark(){
  const m=(S.settings.theme)||'auto';
  if(m==='dark')return true;if(m==='light')return false;
  const now=new Date(),g=S.settings.geo;
  if(g){try{const t=sunTimes(now,g.lat,g.lon);return now<t.rise||now>t.set;}catch(e){}}
  const h=now.getHours()+now.getMinutes()/60;return h<7||h>=19;
}
let _themeTimer=null;
function applyTheme(){
  const dark=resolveDark();
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute('content',dark?'#0a120d':'#f2f4f0');
  clearTimeout(_themeTimer);
  if(((S.settings.theme)||'auto')==='auto')_themeTimer=setTimeout(applyTheme,60000);
}
function themeIcon(){return ic(document.documentElement.getAttribute('data-theme')==='dark'?'sun':'moon');}
function toggleTheme(){const dark=document.documentElement.getAttribute('data-theme')==='dark';S.settings.theme=dark?'light':'dark';save();applyTheme();render();}

function confetti(n){
  try{
    const cv=document.createElement('canvas');cv.className='confetti';
    const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    document.body.appendChild(cv);
    const cols=['#0e3b2c','#2f7d4f','#8ef0a8','#d4f25a','#b7e06a','#1e7a52','#f3f8f1'];
    const N=n||120,P=[];
    for(let i=0;i<N;i++)P.push({x:W/2+(Math.random()-.5)*160,y:H*0.3+(Math.random()-.5)*50,
      vx:(Math.random()-.5)*11,vy:Math.random()*-9-4,g:0.3+Math.random()*0.12,
      s:5+Math.random()*7,rot:Math.random()*6.28,vr:(Math.random()-.5)*0.4,
      col:cols[i%cols.length],sq:Math.random()<.5,life:0});
    const start=performance.now();let t0=start;
    function frame(t){const dt=Math.min(34,t-t0);t0=t;ctx.clearRect(0,0,W,H);let alive=0;
      for(const p of P){p.life+=dt;p.vy+=p.g*(dt/16);p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);p.rot+=p.vr;
        const a=Math.max(0,1-(p.life-1300)/1500);
        if(p.y<H+24&&a>0){alive++;ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;
          if(p.sq)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.283);ctx.fill();}ctx.restore();}}
      if(alive>0&&t-start<3400)requestAnimationFrame(frame);else cv.remove();}
    requestAnimationFrame(frame);
  }catch(e){}
}

/* award: update mastery; returns 'arch' if word just archived */
function award(w,correct){
  touch(w);bumpStudy(w.id);
  if(correct){w.ok++;w.box=Math.min(3,w.box+1);if(w.box>=3&&!w.arch){w.arch=true;srStart(w);return 'arch';}}
  else{w.bad++;w.box=Math.max(0,w.box-1);}
  return '';
}

async function translate(t){
  const order=S.settings.prov==='mm'?['mm']:['google','mm'];
  for(const p of order){
    try{
      if(p==='google'){
        const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&dt=bd&q='+encodeURIComponent(t));
        if(!r.ok)continue;const j=await r.json();const main=(j[0]||[]).map(x=>x[0]).join('').trim();
        const alts=(j[1]||[]).flatMap(e=>e[1]||[]).filter(x=>x&&x.toLowerCase()!==main.toLowerCase()).slice(0,6);
        if(main)return{main,alts};
      }else{
        const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|ru&q='+encodeURIComponent(t));
        if(!r.ok)continue;const j=await r.json();const main=(j.responseData.translatedText||'').trim();
        const alts=[...new Set((j.matches||[]).map(m=>m.translation).filter(x=>x&&x.toLowerCase()!==main.toLowerCase()))].slice(0,5);
        if(main&&!/^[A-Z\s]+$/.test(main))return{main,alts};
      }
    }catch(e){}
  }
  return null;
}

/* the server caps how many rows one reply may carry, so ask page by page */
async function fetchPaged(table,ownerId){
  const PAGE=1000;let from=0,rows=[];
  for(;;){
    const {data,error}=await sb.from(table).select('*').eq('owner_id',ownerId).eq('deleted',false).range(from,from+PAGE-1);
    if(error)return {rows,complete:false};
    rows=rows.concat(data||[]);
    if(!data||data.length<PAGE)return {rows,complete:true};
    from+=PAGE;
    if(from>100000)return {rows,complete:false};   /* never loop forever */
  }
}

  if(/valid email|invalid format/i.test(m))return t('That email address doesn’t look right.');
  if(/Failed to fetch|NetworkError/i.test(m))return t('No connection — try again when you’re online.');

/* ---------- dictionary lookup: pronunciation + real example ---------- */
const _dictCache={};
async function lookupEn(word){
  const key=String(word||'').trim().toLowerCase();
  if(!key)return null;
  if(_dictCache[key]!==undefined)return _dictCache[key];
  try{
    const ctrl=('AbortController' in window)?new AbortController():null;
    const timer=ctrl?setTimeout(()=>ctrl.abort(),7000):null;
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key),ctrl?{signal:ctrl.signal}:undefined);
    if(timer)clearTimeout(timer);
    if(!r.ok){_dictCache[key]=null;return null;}
    const j=await r.json(),e=Array.isArray(j)?j[0]:null;
    if(!e){_dictCache[key]=null;return null;}
    let ipa=e.phonetic||'';
    if(!ipa)ipa=((e.phonetics||[]).map(p=>p.text).filter(Boolean)[0])||'';
    let ex='',pos='';
    for(const m of (e.meanings||[])){
      if(!pos)pos=m.partOfSpeech||'';
      for(const d of (m.definitions||[])){if(d.example){ex=d.example;break;}}
      if(ex)break;
    }
    const out={ipa:ipa||'',ex:ex||'',pos:pos||''};
    _dictCache[key]=out;return out;
  }catch(e){_dictCache[key]=null;return null;}
}

/* one word, on demand */
async function fillOne(){
  const el=$('#fEn');if(!el)return;
  const en=el.value.trim();if(!en)return toast(t('Enter a word'));
  const btn=$('#ipaBtn');if(btn){btn.disabled=true;btn.textContent=t('Looking…');}
  const d=await lookupEn(en);
  if(!$('#fEn'))return;
  if(d&&(d.ipa||d.ex)){
    if(d.ipa){formIpa=d.ipa;const b=$('#ipaBox');if(b)b.textContent=d.ipa+(d.pos?' · '+d.pos:'');}
    const ex=$('#fEx');if(ex&&!ex.value.trim()&&d.ex)ex.value=d.ex;
    const bt=$('#ipaBtn');if(bt)bt.remove();
  }else{
    toast(t('Nothing found for this word'));
    const bt=$('#ipaBtn');if(bt){bt.disabled=false;bt.innerHTML=ic('sound',15)+t('Transcription & example');}
  }
}

let rowCap=400;
function showAllRows(){rowCap=1e9;render();}
function wordRows(items,qs,showSrc){
  qs=(qs||'').toLowerCase();
  let its=qs?items.filter(x=>(x.w.en+' '+x.w.ru).toLowerCase().includes(qs)):items;
  const hidden=Math.max(0,its.length-rowCap);
  if(hidden)its=its.slice(0,rowCap);
  if(!items.length)return `<div class="empty"><div class="big">${ic('pen',26)}</div><b>${t('Add your first word')}</b><p>${t('Tap ＋ below to enter a word and its translation, or import a whole list from the ⋯ menu.')}</p></div>`;
  if(!its.length)return `<div class="empty"><p>${t('Nothing found')}</p></div>`;
  return its.map(({w,sn})=>{
    const picked=selIds.has(w.id);
    const tricky=(w.bad||0)>=2&&(w.bad||0)>(w.ok||0);
    const left=selMode
      ?`<span class="cbox ${picked?'on':''}">${picked?ic('check',14,2.4):''}</span>`
      :(w.arch?'<span class="chk">'+ic('check',14,2.2)+'</span>'
        :tricky?`<span class="chk" style="background:var(--bad-soft);color:var(--bad)">${w.bad}</span>`
        :`<span class="pips"><i class="pip ${w.box>=1?'on1':''}"></i><i class="pip ${w.box>=2?'on2':''}"></i><i class="pip ${w.box>=3?'on3':''}"></i></span>`);
    const meta=[showSrc?esc(sn):'',w.arch&&w.due?esc(whenTxt(w.due)):''].filter(Boolean).join(' · ');

function agoTxt(ts){
  if(!ts)return t('no activity yet');
  const d=Math.floor((Date.now()-ts)/DAY);
  if(d<=0)return t('active today');
  if(d===1)return t('active yesterday');
  if(d<7)return t('active')+' '+d+' '+plr(d,t('day'),t('day2'),t('days'))+' '+t('ago');
  if(d<30){const w=Math.round(d/7);return t('last seen')+' '+w+' '+plr(w,t('week'),t('week2'),t('weeks'))+' '+t('ago');}
  const mo=Math.round(d/30);return t('last seen')+' '+mo+' '+plr(mo,t('month'),t('month2'),t('months'))+' '+t('ago');
}

/* ---------- sheets ---------- */
function sheet(html){
  const ex=$('#scrim');
  if(ex&&!ex.classList.contains('closing')){      /* already open: swap the contents, don't replay the slide-up */
    const box=ex.querySelector('.sheet'),top=box.scrollTop,h0=box.offsetHeight;
    box.innerHTML=`<div class="grip"></div>${html}`;
    box.scrollTop=top;
    const h1=box.offsetHeight;
    if(Math.abs(h1-h0)>4){
      box.style.height=h0+'px';box.style.overflow='hidden';
      requestAnimationFrame(()=>{
        box.style.transition='height .26s cubic-bezier(.22,1,.36,1)';box.style.height=h1+'px';
        setTimeout(()=>{box.style.transition='';box.style.height='';box.style.overflow='';},280);
      });
    }
    return;
  }
  const d=document.createElement('div');d.className='scrim';d.id='scrim';
  d.onclick=e=>{if(e.target===d)closeSheet();};
  d.innerHTML=`<div class="sheet"><div class="grip"></div>${html}</div>`;
  document.body.appendChild(d);d.querySelector('.sheet').scrollTop=0;
}
function closeSheet(){
  const s=$('#scrim');if(!s)return;
  s.id='';s.classList.add('closing');                /* free the id at once so a new sheet can open */
  setTimeout(()=>s.remove(),190);
}

  const seq=++trSeq;const st=$('#trSt');if(st)st.textContent=t('Translating…');
  const r=await translate(en);
  if(seq!==trSeq||!$('#fEn')||$('#fEn').value.trim()!==en)return;
  if(!r){if($('#trSt'))$('#trSt').textContent='⚠ '+t('Can’t reach the translator — enter the translation manually');return;}
  if(force||(!ruTouched&&!$('#fRu').value)){$('#fRu').value=r.main;ruTouched=false;}
  if($('#trSt'))$('#trSt').textContent=t('Options — tap to use:');
  $('#chips').innerHTML=[r.main,...r.alts].map(a=>`<button class="chip" onclick="$('#fRu').value='${q1(a)}';ruTouched=true">${esc(a)}</button>`).join('');
  dictFill(en,seq);
}
async function dictFill(en,seq){
  const d=await lookupEn(en);
  if(!d||seq!==trSeq||!$('#fEn')||$('#fEn').value.trim()!==en)return;
  if(d.ipa){formIpa=d.ipa;const b=$('#ipaBox');if(b)b.textContent=d.ipa+(d.pos?' · '+d.pos:'');}
  const ex=$('#fEx');if(ex&&!ex.value.trim()&&d.ex)ex.value=d.ex;
}
function saveWord(){

  else{const s=addTarget();S.settings.lastSet=s.id;s.words.unshift(newWord(en,ru,ex,formIpa));save();render();toast(t('Added ✓'));

let impTerm='auto',impCard='line',impAuto=true;
function importSheet(){
  impTerm='auto';impCard='line';impAuto=true;
  sheet(`<h2>${t('Import words')}</h2>
   <div class="hint">${t("Paste a list from Quizlet, Excel or plain text. Translations are optional — they'll be filled in automatically.")}</div>
   <div class="field"><textarea class="inp" id="imp" placeholder="apple&#9;яблоко&#10;reliable&#9;надёжный&#10;to give up&#10;book	книга" oninput="impPrev()"></textarea></div>
   <div class="field"><label>${t('Between word and translation')}</label><div class="sel-opt" id="selT">
     ${[['auto',t('Auto')],['tab',t('Tab ⇥')],['dash',t('Dash –')],['comma',t('Comma')],['eq','= ']].map(o=>`<button data-v="${o[0]}" class="${o[0]==='auto'?'on':''}" onclick="impTerm='${o[0]}';syncSel();impPrev()">${o[1]}</button>`).join('')}</div></div>
   <div class="field"><label>${t('Between cards')}</label><div class="sel-opt" id="selC">
     ${[['line',t('New line')],['semi',t('; semicolon')],['blank',t('Blank line')]].map(o=>`<button data-v="${o[0]}" class="${o[0]==='line'?'on':''}" onclick="impCard='${o[0]}';syncSel();impPrev()">${o[1]}</button>`).join('')}</div></div>
   <div class="toggle"><label>${t('Translate when the translation is missing')}</label><div class="sw on" id="swA" onclick="impAuto=!impAuto;this.classList.toggle('on',impAuto)"><i></i></div></div>
   <div class="hint" id="impInfo">${t('Preview will appear here')}</div>
   <button class="btn pri" id="impBtn" onclick="runImport()">${t('Add')}</button>`);
  setTimeout(()=>$('#imp')&&$('#imp').focus(),60);
}
function syncSel(){$$('#selT button').forEach(b=>b.classList.toggle('on',b.dataset.v===impTerm));
  $$('#selC button').forEach(b=>b.classList.toggle('on',b.dataset.v===impCard));}
function splitCards(text){
  if(impCard==='semi')return text.split(';');
  if(impCard==='blank')return text.split(/\n\s*\n/);
  return text.split(/\r?\n/);
}
function splitPair(line){
  line=line.trim();if(!line)return null;
  let en,ru;
  if(impTerm==='tab'){[en,...ru]=line.split('\t');ru=(ru||[]).join(' ');}
  else if(impTerm==='comma'){[en,...ru]=line.split(',');ru=(ru||[]).join(',');}
  else if(impTerm==='eq'){[en,...ru]=line.split('=');ru=(ru||[]).join('=');}
  else if(impTerm==='dash'){const m=line.split(/\s+[-–—]\s+/);en=m[0];ru=m.slice(1).join(' - ');}
  else{ // auto
    if(line.includes('\t')){[en,...ru]=line.split('\t');ru=ru.join(' ');}
    else{const m=line.split(/\s+[-–—:]\s+/);if(m.length>1){en=m[0];ru=m.slice(1).join(' - ');}
      else{en=line;ru='';}}
  }
  en=(en||'').trim();ru=(ru||'').trim();
  return en?{en,ru}:null;
}
function parseImport(){const t=$('#imp').value;return splitCards(t).map(splitPair).filter(Boolean);}
function impPrev(){
  const p=parseImport();const miss=p.filter(x=>!x.ru).length;
  const info=$('#impInfo');if(!info)return;
  if(!p.length){info.textContent=t('Preview will appear here');return;}
  const ex=p.slice(0,3).map(x=>`${esc(x.en)} → ${x.ru?esc(x.ru):'<span style="color:var(--warn)">auto</span>'}`).join(' · ');
  info.innerHTML=`${t('Found')} <b>${p.length}</b>${miss?`, ${miss} ${t('without translation')}`:''}.<br>${ex}${p.length>3?' …':''}`;
}
async function runImport(){
  const pairs=parseImport();if(!pairs.length)return toast(t('Nothing to import'));
  const s=addTarget(),btn=$('#impBtn');btn.disabled=true;
  const need=pairs.filter(p=>!p.ru&&impAuto);
  if(need.length){
    const queue=need.slice();let done=0;
    const worker=async()=>{
      while(queue.length){
        const p=queue.shift();
        const r=await translate(p.en);
        p.ru=r?r.main:'';
        done++;if(btn)btn.textContent=t('Translating…')+' '+done+'/'+need.length;
      }
    };
    await Promise.all(Array.from({length:Math.min(5,need.length)},worker));
  }
  pairs.forEach(p=>s.words.push(newWord(p.en,p.ru||'—')));
  save();closeSheet();render();toast(t('Added')+': '+nWords(pairs.length));
}

/* ---------- questions engine ---------- */
function mkQ(pool,w,kind,forceDir){
  const others=pool.filter(x=>x!==w);
  if(kind==='mc'&&others.length<1)kind='type';
  if(kind==='tf'&&others.length<1)kind='type';
  const dir=forceDir||(Math.random()<.5?'en2ru':'ru2en');
  if(kind==='mc'){const ds=shuffle(others).slice(0,Math.min(3,others.length));
    return{w,type:'mc',dir,opts:shuffle([w,...ds]).map(x=>({t:dir==='en2ru'?x.ru:x.en,c:x===w}))};}
  if(kind==='tf'){const isTrue=Math.random()<.5;const d=isTrue?w:shuffle(others)[0];
    const td=forceDir==='ru2en'?'ru2en':'en2ru';
    return{w,type:'tf',dir:td,shown:td==='ru2en'?d.en:d.ru,isTrue};}
  return{w,type:'type',dir};
}
function renderQ(box,q,o){
  const w=q.w,en2ru=q.dir==='en2ru',prompt=en2ru?w.en:w.ru,answer=en2ru?w.ru:w.en;
  let lbl=q.type==='tf'?t('Is this a correct match?'):q.type==='type'?(en2ru?t('Type the translation'):t('Type in English')):(en2ru?t('Choose the translation'):t('Choose the word'));
  let h=`<div class="card" style="min-height:min(34vh,200px)"><div class="lbl">${lbl}</div>
    <div class="word">${esc(prompt)}</div>${(en2ru&&w.ipa)?`<div class="ipa">${esc(w.ipa)}</div>`:''}${q.type==='tf'?`<div class="word" style="font-size:24px;color:var(--mut);margin-top:10px">= ${esc(q.shown)}</div>`:''}</div>`;
  if(q.type==='mc')h+=`<div style="margin-top:14px">${q.opts.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>`;
  if(q.type==='tf')h+=`<div class="row2" style="margin-top:14px"><button class="btn" data-tf="1">✓ True</button><button class="btn" data-tf="0">✗ False</button></div>`;
  if(q.type==='type')h+=`<div style="margin-top:14px"><input class="inp" id="ta" placeholder="${t('Answer')}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off">
    <div style="height:9px"></div><button class="btn pri" id="tsub">${t('Check')}</button>
    <div style="height:8px"></div><button class="btn ghost" id="tskip">${t("Don't know")}</button></div>`;
  h+=`<div id="fbx"></div>`;box.innerHTML=h;
  let done=false;
  const finish=(ok,given,near)=>{
    if(done)return;done=true;
    if(!o.feedback){o.onDone(ok,given,near);return;}
    const f=$('#fbx');
    const cls=near?'near':(ok?'ok':'bad');
    const title=near?t('Almost — mind the spelling'):(ok?t('Correct ✓'):t('Wrong'));
    const ans=esc(q.type==='tf'?(q.isTrue?t('the match is correct'):t('the match is wrong')):answer);
    f.innerHTML=`<div class="fb ${cls}">${title}${(ok&&!near)?'':`<small>${near?t('Correct spelling: '):t('Answer: ')}${ans}</small>`}</div>`+
      (ok?'':`<button class="btn pri" id="nx">${t("Next")}</button>`);
    if(!en2ru||q.type==='tf')speak(w.en);
    if(ok)setTimeout(()=>o.onDone(ok,given,near),near?1500:620);else $('#nx').onclick=()=>o.onDone(ok,given,near);
  };
  if(q.type==='mc')box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const x=q.opts[+b.dataset.i];
    if(o.feedback){box.querySelectorAll('.opt').forEach((bb,i)=>{if(q.opts[i].c)bb.classList.add('ok');});if(!x.c)b.classList.add('bad');}
    finish(x.c,x.t);});
  if(q.type==='tf')box.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>finish((b.dataset.tf==='1')===q.isTrue,b.dataset.tf==='1'?'True':'False'));
  if(q.type==='type'){const ta=$('#ta');setTimeout(()=>ta&&ta.isConnected&&ta.focus(),60);
    const chk=()=>{if(done)return;const v=checkAns(ta.value,answer,en2ru);ta.disabled=true;finish(v!=='no',ta.value,v==='near');};
    $('#tsub').onclick=chk;ta.addEventListener('keydown',e=>{if(e.key==='Enter')chk();});
    $('#tskip').onclick=()=>{if(done)return;ta.disabled=true;finish(false,'');};}
}

function startCards(review){
  const pool=poolNow();if(!pool.length)return toast(t('No words'));
  let deck=shuffle(pool),i=0,flip=false,dir='en',unknown=[],total=deck.length;const app=$('#app');
  function draw(){
    if(i>=deck.length){
      app.innerHTML=hdr(t('Flashcards'),"render()")+`<div class="hero"><div class="hero-ic">${ic(unknown.length?'trend':'award',30,1.6)}</div></div>
        <div class="empty" style="padding-top:0"><b>${t('Deck complete')}</b><p>${t('Didn’t know')}: ${unknown.length} / ${total}</p></div>
        ${unknown.length?`<button class="btn pri" id="rep">${t('Review tough ones')} (${unknown.length})</button><div style="height:9px"></div>`:''}
        <button class="btn ghost" onclick="render()">${t('Done')}</button>`;
      if(unknown.length)$('#rep').onclick=()=>{deck=shuffle(unknown);unknown=[];i=0;total=deck.length;flip=false;draw();};return;
    }
    const w=deck[i];const front=dir==='en'?w.en:w.ru,back=dir==='en'?w.ru:w.en;
    app.innerHTML=hdr(t('Flashcards'),"render()",`<button class="ic" aria-label="Flip side" onclick="window._flip()">⇄</button>`)+
     `<div class="topbar"><div class="pbar"><i style="width:${i/deck.length*100}%"></i></div><span class="stat">${i+1}/${deck.length}</span></div>
      <div class="fc"><div class="card" id="cd">
        ${flip
          ?`<div class="word">${esc(back)}</div>${(dir==='ru'&&w.ipa)?`<div class="ipa">${esc(w.ipa)}</div>`:''}${w.ex?`<div class="ex">${esc(w.ex)}</div>`:''}`
          :`<div class="word">${esc(front)}</div>${(dir==='en'&&w.ipa)?`<div class="ipa">${esc(w.ipa)}</div>`:''}<div class="tip">${t('tap to flip')}</div>`}
      </div></div>
      <div class="row2"><button class="btn" id="no" style="color:var(--bad)">${ic('close',17)}${t("Don't know")}</button><button class="btn" id="yes" style="color:var(--ok)">${ic('check',17,2)}${t('Know')}</button></div>
      <div style="height:9px"></div><button class="btn ghost" id="sp">${ic('sound')}${t('Pronounce')}</button>`;
    $('#cd').onclick=()=>{
      const c=$('#cd');
      if(!c||c.classList.contains('fout')){flip=!flip;draw();return;}
      c.classList.add('fout');
      setTimeout(()=>{flip=!flip;draw();const n=$('#cd');if(n){n.classList.add('fin');setTimeout(()=>n.classList.remove('fin'),270);}},185);
    };
    $('#sp').onclick=()=>speak(w.en);
    $('#yes').onclick=()=>{if(!review){const r=award(w,true);save();if(r==='arch')toast('“'+w.en+'” → '+t('Archive')+' ✓');}i++;flip=false;draw();};
    $('#no').onclick=()=>{if(!review){award(w,false);save();}unknown.push(w);i++;flip=false;draw();};
    if(!flip&&dir==='en')speak(w.en);
  }
  window._flip=()=>{dir=dir==='en'?'ru':'en';flip=false;draw();};
  draw();
}

/* ---------- learn (active only) ---------- */
function startLearn(review){
  const pool=review?poolNow():(view.name==='set'?active(curSet()):poolNow());
  if(!pool.length)return toast(review?t('No words'):t('No words to learn'));
  const B={};if(review)pool.forEach(w=>B[w.id]=0);
  const lvl=w=>review?B[w.id]:(w.box||0);
  let queue=shuffle(pool.filter(w=>lvl(w)<3));if(!queue.length)queue=shuffle(pool);
  const target=queue.reduce((n,w)=>n+(3-lvl(w)),0)||queue.length;let gained=0;const app=$('#app');
  function next(){
    if(!queue.length){
      app.innerHTML=hdr(t('Learn'),"render()")+
        `<div class="hero"><div class="hero-ic">${ic('award',30,1.6)}</div><div class="hero-title" style="margin-top:14px">${review?t('Review complete'):t('Great job!')}</div>
         <div class="hero-sub">${review?t('You revised every word in this session.'):t('Every word this session is mastered and moved to the Archive.')}</div></div>
        <div style="height:14px"></div><button class="btn pri" onclick="render()">${t('Done')}</button>`;
      confetti(90);return;
    }
    const w=queue.shift();const L=lvl(w);const kind=L<=1?'mc':'type';const dir=L===0?'en2ru':'ru2en';
    app.innerHTML=studyTop(t('Learn'),Math.min(100,gained/target*100),t('mastered')+' '+gained+'/'+target);
    const q=mkQ(pool,w,kind,dir);
    pulse($('#qb'));
    renderQ($('#qb'),q,{feedback:true,onDone:ok=>{
      const before=lvl(w);
      if(review){B[w.id]=ok?Math.min(3,before+1):Math.max(0,before-1);}
      else{const r=award(w,ok);save();if(ok&&r==='arch')toast('“'+w.en+'” → '+t('Archive')+' ✓');}
      const after=lvl(w);
      if(ok){gained+=Math.max(0,after-before);
        if(after<3)queue.splice(Math.min(queue.length,3+(Math.random()*3|0)),0,w);}
      else queue.splice(Math.min(queue.length,2),0,w);
      next();
    }});
  }
  next();
}

/* ---------- test ---------- */
function testSetup(review){
  const pool=poolNow();if(!pool.length)return toast(t('No words'));
  const n=pool.length;const opts=[...new Set([5,10,20,n].filter(v=>v<=n))].sort((a,b)=>a-b);
  sheet(`<h2>${t('Test')}</h2>
   <div class="field"><label>${t('How many questions')}</label>
     <select class="inp" id="tn">${opts.map(v=>`<option value="${v}">${v===n?t('All words')+' ('+n+')':v}</option>`).join('')}</select></div>
   <div class="field"><label>${t('Question types')}</label><div class="stack">
     ${[['k1',t('Multiple choice')],['k2',t('Type the answer')],['k3',t('True / false')]].map(o=>
       `<div class="toggle" onclick="const sw=this.querySelector('.sw');sw.classList.toggle('on');"><label>${o[1]}</label><div class="sw on" id="${o[0]}"><i></i></div></div>`).join('')}</div></div>
   <div class="hint">RU → EN. ${t('The word is shown in Russian — recall and type (or choose) the English. You can move between questions and fix your answers before finishing.')}</div>
   ${review?'<div class="hint">'+t('Archive review: results don\'t change progress.')+'</div>':''}
   <button class="btn pri" onclick="beginTest(${!!review})">${t('Start test')}</button>`);
}
function beginTest(review){
  const kinds=[$('#k1').classList.contains('on')&&'mc',$('#k2').classList.contains('on')&&'type',$('#k3').classList.contains('on')&&'tf'].filter(Boolean);
  if(!kinds.length)return toast(t('Pick at least one type'));
  const n=+$('#tn').value;closeSheet();runTest(shuffle(poolNow()).slice(0,n),kinds,review);
}
function runTest(words,kinds,review){
  const pool=poolNow(),app=$('#app');
  const qs=words.map(w=>mkQ(pool,w,kinds[Math.random()*kinds.length|0],'ru2en'));
  const total=qs.length;
  const ans=qs.map(q=>q.type==='type'?'':null);
  let i=0,shown=-1,palOpen=false;
  const answered=ix=>{const q=qs[ix];return q.type==='type'?(ans[ix]||'').trim()!=='':ans[ix]!==null;};
  const countAns=()=>{let n=0;for(let k=0;k<total;k++)if(answered(k))n++;return n;};
  function go2(nx){if(nx<0||nx>=total)return;i=nx;draw();}
  function finishTest(){const blanks=total-countAns();if(blanks&&!confirm(t('Still blank')+': '+blanks+'. '+t('Finish anyway?')))return;result();}
  function draw(){
    const q=qs[i],en2ru=q.dir==='en2ru',prompt=en2ru?q.w.en:q.w.ru;
    const lbl=q.type==='tf'?t('Is this a correct match?'):q.type==='type'?(en2ru?t('Type the translation'):t('Type in English')):(en2ru?t('Choose the translation'):t('Choose the word'));
    const ca=countAns();
    const dots=qs.map((_,ix)=>`<button class="qdot ${answered(ix)?'on':''} ${ix===i?'cur':''}" data-ix="${ix}">${ix+1}</button>`).join('');
    let h=hdr(t('Test'),"if(confirm(t('Exit this session?')))render()")+
      `<div class="topbar"><div class="pbar"><i style="width:${ca/total*100}%"></i></div><span class="stat">${ca}/${total}</span></div>`+
      `<div class="qpalbox"><div class="qpal${palOpen?' open':''}" id="qpal">${dots}</div><button class="qmore" id="qmore" aria-label="${palOpen?t('Collapse'):t('Show all questions')}">${palOpen?ic('up',18):ic('down',18)}</button></div>`+
      `<div class="card" style="min-height:min(30vh,180px)"><div class="lbl">${lbl}</div>
        <div class="word">${esc(prompt)}</div>${q.type==='tf'?`<div class="word" style="font-size:24px;color:var(--mut);margin-top:10px">= ${esc(q.shown)}</div>`:''}</div>`;
    if(q.type==='mc')h+=`<div style="margin-top:14px">${q.opts.map((x,k)=>`<button class="opt ${ans[i]===k?'pick':''}" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>`;
    if(q.type==='tf')h+=`<div class="row2" style="margin-top:14px"><button class="btn ${ans[i]===true?'selp':''}" data-tf="1">✓ True</button><button class="btn ${ans[i]===false?'selp':''}" data-tf="0">✗ False</button></div>`;
    if(q.type==='type')h+=`<div style="margin-top:14px"><input class="inp" id="ta" placeholder="${t('Answer')}" value="${esc(ans[i]||'')}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div>`;
    h+=`<div style="height:14px"></div><div class="row2">
      <button class="btn ghost" id="tback" ${i===0?'disabled':''}>${ic('arrowLeft',18)}${t('Back')}</button>
      ${i<total-1?`<button class="btn pri" id="tnext">${t('Next')}${ic('arrowRight',18)}</button>`:`<button class="btn pri tfinbtn">${ic('check',18,2)}${t('Finish')}</button>`}</div>
      ${i<total-1?`<div style="height:9px"></div><button class="btn ghost tfinbtn" style="color:var(--mut)">${t('Finish test')}</button>`:''}`;
    app.innerHTML=h;
    if(shown!==i){pulse(app.querySelector('.card'));shown=i;}
    const pal=$('#qpal'),more=$('#qmore');
    if(pal&&more){
      const base=pal.getBoundingClientRect().top;
      const top=el=>Math.round(el.getBoundingClientRect().top-base+pal.scrollTop);
      const rows=new Set([...pal.children].map(top)).size;
      if(rows<=2&&!palOpen){more.style.display='none';}
      else{
        more.style.display='';
        /* never leave the question you are on hidden */
        const cur=pal.querySelector('.qdot.cur');
        if(!palOpen&&cur&&top(cur)>pal.clientHeight-10){palOpen=true;pal.classList.add('open');more.innerHTML=ic('up',18);}
        more.onclick=()=>{palOpen=!palOpen;pal.classList.toggle('open',palOpen);
          more.innerHTML=palOpen?ic('up',18):ic('down',18);
          more.setAttribute('aria-label',palOpen?t('Collapse'):t('Show all questions'));};
      }
    }
    $$('.qdot').forEach(b=>b.onclick=()=>go2(+b.dataset.ix));
    if(q.type==='mc')$$('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;draw();});
    if(q.type==='tf')$$('[data-tf]').forEach(b=>b.onclick=()=>{ans[i]=(b.dataset.tf==='1');draw();});
    if(q.type==='type'){const ta=$('#ta');if(ta){ta.oninput=()=>{ans[i]=ta.value;};ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&i<total-1)go2(i+1);});setTimeout(()=>ta.isConnected&&ta.focus(),40);}}
    const bk=$('#tback');if(bk)bk.onclick=()=>go2(i-1);
    const nx=$('#tnext');if(nx)nx.onclick=()=>go2(i+1);
    $$('.tfinbtn').forEach(b=>b.onclick=finishTest);
  }
  function result(){
    shown=-1;
    const res=qs.map((q,ix)=>{
      const en2ru=q.dir==='en2ru',answer=en2ru?q.w.ru:q.w.en;let ok,given,near=false;
      if(q.type==='mc'){const k=ans[ix];ok=k!=null&&q.opts[k].c;given=k!=null?q.opts[k].t:'';}
      else if(q.type==='tf'){ok=ans[ix]!=null&&ans[ix]===q.isTrue;given=ans[ix]==null?'':(ans[ix]?'True':'False');}
      else{const v=(ans[ix]||'').trim();const r=v?checkAns(v,answer,en2ru):'no';ok=r!=='no';near=r==='near';given=v;}
      const correct=q.type==='tf'?(q.isTrue?'True':'False'):answer;
      return {w:q.w,ok,given,correct,near};
    });
    if(!review){res.forEach(r=>award(r.w,r.ok));save();}
    const good=res.filter(r=>r.ok).length,pct=Math.round(good/res.length*100),bad=res.filter(r=>!r.ok);
    const slips=res.filter(r=>r.ok&&r.near);
    const toArch=res.filter(r=>r.ok&&r.w.arch).length;
    app.innerHTML=hdr(t('Result'),"render()")+
      scoreHero(pct,`${good} / ${res.length} ${t('correct')}${!review&&toArch?` · ${toArch} ${t('moved to Archive')}`:''}`)+
      `<div style="height:8px"></div>`+
      (slips.length?`<div class="subhead"><span class="t">${t('Spelling slips')} — ${slips.length}</span></div>`+
        slips.map(r=>`<div class="item" style="display:block;padding:13px 15px">
          <div style="display:flex;align-items:center;gap:13px">
            <div class="t" style="flex:1"><div class="en">${esc(r.w.en)}</div><div class="ru">${esc(r.w.ru)}</div></div>
            <button class="spk" onclick="speak('${q1(r.w.en)}')">${ic('sound',17)}</button></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
            <span class="ans-bad near">${esc(r.given)}</span>
            <span class="ans-ok">${esc(r.correct||r.w.en)}</span></div></div>`).join('')+
        `<div style="height:10px"></div>`:'')+
      (bad.length?`<div class="subhead"><span class="t">${t('Mistakes')} — ${bad.length}</span></div>`+
        bad.map(r=>`<div class="item" style="display:block;padding:13px 15px">
          <div style="display:flex;align-items:center;gap:13px">
            <div class="t" style="flex:1"><div class="en">${esc(r.w.en)}</div><div class="ru">${esc(r.w.ru)}</div></div>
            <button class="spk" onclick="speak('${q1(r.w.en)}')">${ic('sound',17)}</button></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
            <span class="ans-bad">${r.given?esc(r.given):t('no answer')}</span>
            <span class="ans-ok">${esc(r.correct||r.w.en)}</span></div></div>`).join('')+
        `<div style="height:10px"></div><button class="btn pri" id="rt">${t('Retry mistakes')}</button><div style="height:9px"></div>`:'')+
      `<button class="btn ghost" onclick="render()">${t('Close')}</button>`;
    if(bad.length)$('#rt').onclick=()=>runTest(shuffle(bad.map(r=>r.w)),kinds,review);
    if(pct>=80)confetti(90);
  }
  draw();
}

/* ---------- match ---------- */
function startMatch(){
  const pool=poolNow();if(pool.length<3)return toast(t('Need at least 3 words'));
  const ws=shuffle(pool).slice(0,6);
  const tiles=shuffle(ws.flatMap(w=>[{id:w.id,t:w.en},{id:w.id,t:w.ru}]));
  let sel=null,left=ws.length,t0=Date.now(),miss=0;const app=$('#app');
  app.innerHTML=hdr(t('Match'),"render()",`<span class="stat" id="tm" style="font-size:16px;min-width:64px">0.0s</span>`)+
    `<div class="hint" style="text-align:center;margin-bottom:12px">${t('Match each word with its translation')}</div>
     <div class="tiles">${tiles.map((x,i)=>`<button class="tile" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>`;
  const iv=setInterval(()=>{const e=$('#tm');if(!e)return clearInterval(iv);e.textContent=((Date.now()-t0)/1000).toFixed(1)+'s';},100);
  app.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('done')||el===sel)return;
    const x=tiles[+el.dataset.i];
    if(!sel){sel=el;el.classList.add('sel');return;}
    const y=tiles[+sel.dataset.i];
    if(x.id===y.id){el.classList.add('done');sel.classList.add('done');sel=null;left--;
      if(!left){clearInterval(iv);const t=((Date.now()-t0)/1000).toFixed(1);
        app.innerHTML=hdr(t('Match'),"render()")+
          `<div class="hero"><div class="hero-ic">${ic('award',30,1.6)}</div><div class="big-pct" style="margin:6px 0 0">${t}s</div>
           <div class="hero-sub">${t('Mistakes')}: ${miss}</div></div>
          <div style="height:14px"></div><button class="btn pri" onclick="startMatch()">${t('Again')}</button><div style="height:9px"></div>
          <button class="btn ghost" onclick="render()">${t('Close')}</button>`;
        confetti(miss===0?90:0);}}
    else{miss++;const a=sel;sel=null;a.classList.remove('sel');a.classList.add('no');el.classList.add('no');
      setTimeout(()=>{a.classList.remove('no');el.classList.remove('no');},380);}
  });
}
