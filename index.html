/* sharpen what the engine sees: right size, light text on dark flipped to dark on light, contrast stretched, a quiet margin */
async function ocrPrepare(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){bmp=await createImageBitmap(file);}
  const long=Math.max(bmp.width,bmp.height);
  let k=1;
  if(long<1600)k=Math.min(3,1600/long);
  else if(long>3400)k=3400/long;
  const w=Math.round(bmp.width*k),h=Math.round(bmp.height*k),pad=Math.round(Math.max(w,h)*.02)+12;
  const c=document.createElement('canvas');c.width=w+pad*2;c.height=h+pad*2;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality='high';x.drawImage(bmp,pad,pad,w,h);
  const img=x.getImageData(0,0,c.width,c.height),d=img.data,n=d.length/4;
  const g=new Uint8ClampedArray(n),hist=new Uint32Array(256);let sum=0;
  for(let i=0,j=0;i<d.length;i+=4,j++){const v=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;g[j]=v;hist[v]++;sum+=v;}
  const mean=sum/n;
  /* more than half of the picture dark → a dark theme: flip it */
  let dark=0;for(let v=0;v<128;v++)dark+=hist[v];
  const invert=dark/n>0.55&&mean<125;
  if(invert){for(let j=0;j<n;j++)g[j]=255-g[j];hist.reverse();}
  /* stretch between the 1st and the 99th percentile */
  let acc=0,lo=0,hi=255;
  for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*.01){lo=v;break;}}
  acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>=n*.01){hi=v;break;}}
  const span=Math.max(40,hi-lo);
  for(let i=0,j=0;i<d.length;i+=4,j++){const v=Math.max(0,Math.min(255,(g[j]-lo)*255/span));d[i]=d[i+1]=d[i+2]=v;}
  x.putImageData(img,0,0);
  /* a photographed page is rarely straight: find the tilt that makes the text lines crispest and undo it */
  const tilt=ocrSkew(c);
  if(Math.abs(tilt)>=.6){
    const r=tilt*Math.PI/180,cw=c.width,ch=c.height;
    const nw=Math.ceil(Math.abs(cw*Math.cos(r))+Math.abs(ch*Math.sin(r))),nh=Math.ceil(Math.abs(cw*Math.sin(r))+Math.abs(ch*Math.cos(r)));
    const c2=document.createElement('canvas');c2.width=nw;c2.height=nh;
    const y=c2.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,nw,nh);
    y.translate(nw/2,nh/2);y.rotate(-r);y.imageSmoothingQuality='high';y.drawImage(c,-cw/2,-ch/2);
    return {canvas:c2,invert,scale:k,tilt};
  }
  return {canvas:c,invert,scale:k,tilt:0};
}
/* projection profile: the right angle puts the ink of each text line into as few rows as possible */
function ocrSkew(c){
  const k=Math.min(1,700/Math.max(c.width,c.height)),w=Math.max(1,Math.round(c.width*k)),h=Math.max(1,Math.round(c.height*k));
  const s=document.createElement('canvas');s.width=w;s.height=h;
  const x=s.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,pts=[];
  for(let yy=0;yy<h;yy+=1)for(let xx=0;xx<w;xx+=1){if(d[(yy*w+xx)*4]<110)pts.push(xx,yy);}
  if(pts.length<400)return 0;
  const step=pts.length>120000?4:2;
  const score=deg=>{
    const r=deg*Math.PI/180,sn=Math.sin(r),cs=Math.cos(r),bins=new Float64Array(w+h+4),off=w+2;
    for(let i=0;i<pts.length;i+=step){const yy=pts[i+1]*cs-pts[i]*sn;bins[Math.round(yy)+off]++;}
    let q=0;for(let i=0;i<bins.length;i++)q+=bins[i]*bins[i];return q;
  };
  let best=0,bs=score(0);const base=bs;
  for(let a=-8;a<=8;a+=.5){if(!a)continue;const v=score(a);if(v>bs){bs=v;best=a;}}
  for(let a=best-.4;a<=best+.4;a+=.1){const v=score(a);if(v>bs){bs=v;best=a;}}
  return bs>base*1.04?Math.round(best*10)/10:0;
}
/* the engine returns lines; turn them back into headings and paragraphs a person would read */
function ocrTidy(data){
  const med=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[a.length>>1]:0;};
  let L=(data.lines||[]).map(l=>({t:(l.text||'').replace(/\s+/g,' ').trim(),c:l.confidence==null?100:l.confidence,x0:l.bbox.x0,x1:l.bbox.x1,y0:l.bbox.y0,y1:l.bbox.y1}));
  if(!L.length){
    L=String(data.text||'').split(/\n+/).map(t=>({t:t.replace(/\s+/g,' ').trim(),c:data.confidence==null?100:data.confidence,x0:0,x1:100,y0:0,y1:10})).map((l,i)=>Object.assign(l,{y0:i*30,y1:i*30+10}));
  }
  /* interface debris: no letters, or an unsure scrap of a few characters */
  L=L.filter(l=>{
    if(!l.t)return false;
    const letters=(l.t.match(/\p{L}/gu)||[]).length;
    if(letters<2)return false;
    if(letters/l.t.length<.45&&l.t.length<30)return false;
    if(l.c<30&&l.t.length<14)return false;
    return true;
  });
  L.forEach(l=>{l.h=l.y1-l.y0;});
  const body=L.filter(l=>l.t.length>=12);
  const medH=med((body.length?body:L).map(l=>l.h))||20;
  const rights=(body.length?body:L).map(l=>l.x1).sort((x,y)=>x-y);
  const maxR=rights.length?rights[Math.floor(rights.length*.9)]:0;
  const BUL=/^[•·▪●◦■□○*-–—]\s+/;
  const SENT=/[.!?…”"’')]$/;
  const paras=[];let cur=null;
  L.forEach((l,i)=>{
    const head=l.h>1.3*medH&&l.t.length<130;
    const prev=i?L[i-1]:null;
    let brk=!cur||!prev;
    if(!brk){
      const gap=l.y0-prev.y1;
      const prevHead=cur.head;
      if(head!==prevHead)brk=true;
      else if(head&&Math.abs(l.h-prev.h)>.25*medH)brk=true;
      else if(l.y0<prev.y0-medH)brk=true;                               /* back up the page: a new column or block */
      else if(gap>.75*medH)brk=true;
      else if(BUL.test(l.t))brk=true;
      else if(SENT.test(prev.t)&&prev.x1<maxR*.8&&/^[\p{Lu}“‘"]/u.test(l.t)&&!head)brk=true;   /* a short last line ends the paragraph */
    }
    if(brk){cur={head,lines:[l]};paras.push(cur);}else cur.lines.push(l);
  });
  const join=lines=>{
    let out='';
    lines.forEach((l,i)=>{
      const t=l.t;
      if(!i){out=t;return;}
      if(/\p{L}-$/u.test(out)&&/^\p{Ll}/u.test(t))out=out.slice(0,-1)+t;   /* exam-\nple → example */
      else out+=' '+t;
    });
    return out;
  };
  const fix=t=>t
    .replace(BUL,'• ')
    .replace(/(^|\s)\|(?=\s|$)/g,'$1I')                    /* a lone bar is an "I" */
    .replace(/(^|\s)l(?=\s)/g,'$1I')                        /* so is a lone small L */
    .replace(/\s+([,.;:!?])/g,'$1')
    .replace(/([“‘(])\s+/g,'$1').replace(/\s+([”’)])/g,'$1')
    .replace(/\s{2,}/g,' ').trim();
  let title='';const out=[];
  paras.forEach(p=>{
    const t=fix(join(p.lines));if(!t)return;
    const c=p.lines.reduce((a,l)=>a+l.c,0)/p.lines.length;
    if(p.head){if(!title)title=t;else out.push({t:'## '+t,c});}
    else out.push({t,c});
  });
  const total=out.reduce((a,p)=>a+p.t.length,0)||1;
  const conf=Math.round(out.reduce((a,p)=>a+p.c*p.t.length,0)/total);
  return {title,body:out.map(p=>p.t).join('\n\n'),conf};
}
async function ocrRead(file,lang,onProg){
  _ocrProg=onProg||null;
  try{
    if(onProg)onProg({status:'prep',progress:0});
    const prep=await ocrPrepare(file);
    const w=await ocrWorker(lang);
    const {data}=await w.recognize(prep.canvas);
    return Object.assign(ocrTidy(data),{inverted:prep.invert});
  }finally{_ocrProg=null;}
}

/* ====================== TEXTS: read with your own dictionary ====================== */

function knownMap(lang){
  const m=new Map();

    const k=fold(String(w.en||'').replace(/^to\s+/i,''));if(!k||/\s/.test(k))return;

function rdParHtml(text,pi){
  let out='',last=0;

  const hc=(a,b)=>{const h=H.find(h=>a>=h.s&&b<=h.e);return h?h.c:0;};
  for(const m of text.matchAll(WORD_RE)){
    if(m.index>last){const g=text.slice(last,m.index),c=H.length?hc(last,m.index):0;out+=c?`<span class="hg hl${c}">${esc(g)}</span>`:esc(g);}
    const w=m[0],f=fold(w);
    const hcl=H.length?hc(m.index,m.index+w.length):0;
    const cls=(RD.added.has(f)?' ad':(knownOf(f,RD.map)===2?' lr':(knownOf(f,RD.map)===1?' kn':'')))+(hcl?' hl'+hcl:'');
    out+=`<span class="w${cls}" data-p="${pi}" data-s="${m.index}">${esc(w)}</span>`;
    last=m.index+w.length;
  }
  return out+esc(text.slice(last));
}

/* ---- dictionary form: wonders → wonder, went → go ---- */
const LEM_KEEP=new Set('this his its yes us as bus plus news always perhaps thus series species means physics lens gas class glass pass less across process business address success dress press stress mess kiss miss boss cross loss moss during morning evening king thing something nothing anything everything ring spring string bring sing wing swing ceiling bed red need seed speed indeed hundred sacred wicked naked beloved feed weed heed deed reed bleed breed proceed exceed succeed creed greed steed tweed bit rose wound bore lay shed sled embed hatred kindred'.split(/\s+/));
const LEM_PART=new Set('up down out off on in over about at for with to away back through into after along around forward by from of'.split(' '));
const LEM_NOUN={used:'use',children:'child',men:'man',women:'woman',feet:'foot',teeth:'tooth',mice:'mouse',geese:'goose',oxen:'ox',is:'be',am:'be',are:'be',was:'be',were:'be',been:'be',being:'be',has:'have',having:'have',does:'do',doing:'do',goes:'go',going:'go'};
let LEM_IRR=null;
function lemIrr(w){
  if(!LEM_IRR){irregOf('');LEM_IRR={};Object.keys(IRR).forEach(b=>{IRR[b].past.concat(IRR[b].pp).forEach(f=>{if(f!==b&&!IRR[f]&&!(f in LEM_IRR))LEM_IRR[f]=b;});});}
  return LEM_IRR[w]||null;
}
/* possible base forms of a regular inflection, most likely first; [word, sure-without-a-dictionary] */
function lemCands(w){
  const out=[];
  const add=(x,strong)=>{if(x&&x.length>=2&&x!==w&&!out.some(o=>o[0]===x))out.push([x,!!strong]);};
  const dd=s=>/([^aeiou])\1$/.test(s)&&!/(ll|ss|ff|zz)$/.test(s)?s.slice(0,-1):null;
  const one=s=>(s.match(/[aeiouy]+/g)||[]).length===1&&/[^aeiou][aeiou][^aeiouwxy]$/.test(s);
  const pair=s=>{if(s.length<=2){add(s+'e');return;}const d=dd(s);if(d)add(d,true);if(one(s)&&!d){add(s+'e');add(s);}else{add(s);add(s+'e');}if(!d&&/(ll|ss|ff|zz)$/.test(s))add(s.slice(0,-1));};
  if(/ies$/.test(w)&&w.length>4){add(w.slice(0,-3)+'y',true);add(w.slice(0,-1));}
  else if(/(ss|sh|ch|x|z)es$/.test(w)){if(/zzes$/.test(w))add(w.slice(0,-3));add(w.slice(0,-2),true);add(w.slice(0,-1));}
  else if(/oes$/.test(w)){add(w.slice(0,-1));add(w.slice(0,-2));}
  else if(/[^su]s$/.test(w)&&!/(ss|is|us)$/.test(w)&&w.length>3){add(w.slice(0,-1),true);if(/ves$/.test(w)){add(w.slice(0,-3)+'fe');add(w.slice(0,-3)+'f');}if(/ses$/.test(w)&&w.length>4)add(w.slice(0,-2));}
  if(/ied$/.test(w)&&w.length>=4){add(w.slice(0,-3)+'y',true);add(w.slice(0,-1));}
  else if(/eed$/.test(w)&&w.length>4)add(w.slice(0,-1));
  else if(/ed$/.test(w)&&w.length>4)pair(w.slice(0,-2));
  if(/ing$/.test(w)&&w.length>=5)pair(w.slice(0,-3));
  if(/[^aeiou]ying$/.test(w)&&w.length>=5)add(w.slice(0,-4)+'ie');
  return out;
}
const LEM_C={};
async function lemExists(w){
  if(w in LEM_C)return LEM_C[w];
  if(fqMap().has(w))return true;
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),2500);
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w),{signal:ac.signal});
    if(r.status===404){LEM_C[w]=false;return false;}
    if(!r.ok)return null;
    LEM_C[w]=true;return true;
  }catch(e){return null;}
  finally{clearTimeout(tm);}
}
async function lemWord(w){
  if(!/^[a-z]+$/.test(w)||LEM_KEEP.has(w))return null;
  if(LEM_NOUN[w])return LEM_NOUN[w];
  const ir=lemIrr(w);if(ir)return ir;
  const cs=lemCands(w);
  for(const [c,strong] of cs){
    const ex=await lemExists(c);
    if(ex===true)return c;
    if(ex===null)return strong?c:null;      /* the dictionary is unreachable: trust only the safe rules */

function ctxDiff(full,rest){
  const tk=x=>(String(x).match(/\p{L}+/gu)||[]).map(z=>z.toLowerCase());
  const f=tk(full),cnt={};tk(rest).forEach(w=>{cnt[w]=(cnt[w]||0)+1;});
  const out=[];f.forEach(w=>{if(cnt[w]>0){cnt[w]--;}else out.push(w);});

   <button class="btn pri" id="asgBtn" onclick="asgSave('${a.id}')">${t('Save')}</button>

async function asgSave(id){
  const a=asgMine().find(x=>x.id===id);if(!a)return;
  const ds=$('#asgD').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(ds||''))return($('#asgErr').textContent=t('Pick a due date'));
  const [y,m,d]=ds.split('-').map(Number);
  const patch={title:($('#asgT').value||'').trim().slice(0,120)||a.title,due:new Date(y,m-1,d,23,59,0).toISOString(),pct:Math.min(100,Math.max(1,Math.round(+$('#asgP').value||85)))};
  const {data,error}=await sb.from('assignments').update(patch).eq('id',id).select('id');
  if(error||!data||!data.length){$('#asgErr').textContent=t('Not saved');return;}
  closeSheet();await asgTRefresh(a.student_id);
}
async function asgDel(id){
  const a=asgMine().find(x=>x.id===id);if(!a)return;
  if(!confirm(t('Delete this assignment?')))return;
  const {data,error}=await sb.from('assignments').update({deleted:true}).eq('id',id).select('id');
  if(error||!data||!data.length){$('#asgErr').textContent=t('Not saved');return;}
  closeSheet();toast(t('Assignment deleted'));await asgTRefresh(a.student_id);
}

/* write the chosen settings to the library table: items = [{l, mode:'off'|'all'|'some', ids:[id8,…]}] */
async function examApply(items){
  const now=new Date().toISOString(),ins=[],jobs=[];
  items.forEach(({l,mode,ids})=>{
    const r=examRow(l.id),on=mode!=='off';
    const words=l.w.map(a=>({en:a[0],ru:a[1],ex:a[2]||''}));
    ids=Array.from(new Set(ids)).sort();
    if(!r){
      if(!on)return;
      ins.push({teacher_id:AUTH.user.id,lang:'en',words,version:1,title:l.title,descr:examMarkFor(l,mode,ids)+l.descr,level:l.level,status:'students',updated_at:now});
      return;
    }
    if(!on){if(r.status!=='draft')jobs.push(sb.from('library_sets').update({status:'draft',updated_at:now}).eq('id',r.id).select('id'));return;}
    const stale=(r.cv||0)<l.v,same=r.status==='students'&&(r.cm==='S')===(mode==='some')&&(r.cl||[]).slice().sort().join()===ids.join();
    if(same&&!stale)return;
    const row={title:l.title,level:l.level,descr:examMarkFor(l,mode,ids)+l.descr,status:'students',updated_at:now};
    if(stale){row.words=words;row.version=(r.version||1)+1;}
    jobs.push(sb.from('library_sets').update(row).eq('id',r.id).select('id'));
  });
  if(ins.length)jobs.push(sb.from('library_sets').insert(ins).select('id'));
  const res=await Promise.all(jobs);
  const bad=res.find(x=>x&&x.error);if(bad)throw bad.error;
}

function examSetMode(ids,mode,sids){return examRun(()=>examApply(examLists(ids).map(l=>({l,mode,ids:sids||[]}))));}
/* one student in or out, for several lists at once; everyone else keeps what they had */
function examForStudent(ids,sid,on){
  const k=sid8(sid);
  return examRun(()=>examApply(examLists(ids).map(l=>{
    const c=examCfg(l.id);let mode=c.mode,a=c.ids.slice();
    if(on){
      if(mode==='off'){mode='some';a=[k];}
      else if(mode==='some'){if(a.indexOf(k)<0)a.push(k);}
      else a=a.filter(z=>z!==k);
    }else{
      if(mode==='some'){a=a.filter(z=>z!==k);if(!a.length)mode='off';}
      else if(mode==='all'){if(a.indexOf(k)<0)a.push(k);}
    }
    return {l,mode,ids:a};
  })));
}

/* a list that was improved in a new version of the app: update the teacher's copy, students see "new words" */
async function examSync(){
  if(EXM.synced||!libTeacher()||!sb||!EXM.lists||!libOk())return;
  const key=c=>c.mode+':'+c.ids.slice().sort().join();
  const items=[];
  EXM.lists.forEach(l=>{const r=examRow(l.id);if(r&&r.status!=='draft'&&(r.cv||0)<l.v){const c=examCfg(l.id);items.push({l,mode:c.mode,ids:c.ids});}});
  /* a list that is new in the app joins a folder whose existing lists all have one and the same audience */
  EXAM_FOLDERS.forEach(F=>{
    const mine=EXM.lists.filter(l=>l.f===F.id);
    const have=mine.filter(l=>examRow(l.id)),fresh=mine.filter(l=>!examRow(l.id));
    if(!have.length||!fresh.length)return;
    const cs=have.map(l=>examCfg(l.id));
    if(cs[0].mode==='off'||!cs.every(c=>key(c)===key(cs[0])))return;
    fresh.forEach(l=>items.push({l,mode:cs[0].mode,ids:cs[0].ids}));
  });
  EXM.synced=true;if(!items.length)return;
  try{await ensureAuth();await examApply(items);await libLoad(true);examRedraw();}catch(e){EXM.synced=false;}
}

async function examSheet(ids,title,folder){

  if(!(AUTH.students&&AUTH.students.length))await loadStudents();
  const cs=ids.map(id=>examCfg(id)),c0=cs[0];
  const same=cs.every(c=>c.mode===c0.mode&&c.ids.slice().sort().join()===c0.ids.slice().sort().join());
  let mode='some',sel=new Set();
  const all=(AUTH.students||[]).map(s=>sid8(s.id));

    if(c0.mode==='off')mode='off';
    else if(c0.mode==='all'&&!c0.ids.length)mode='all';
    else if(c0.mode==='all')sel=new Set(all.filter(k=>c0.ids.indexOf(k)<0));

const AN_FROM=new Date(2024,0,1);
function dIdx(d){d=d||new Date();return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-AN_FROM)/DAY);}
function idxDate(i){return new Date(2024,0,1+(+i));}
function actAll(){const st=S.stats;if(!st.act||typeof st.act!=='object'||Array.isArray(st.act))st.act={};return st.act;}
/* one answer: [answers, correct] for the day */
function actLog(ok){
  const a=actAll(),k=dIdx(),v=a[k]||(a[k]=[0,0]);v[0]++;if(ok)v[1]++;
  const ks=Object.keys(a);
  if(ks.length>200)ks.map(Number).sort((x,y)=>x-y).slice(0,ks.length-180).forEach(x=>delete a[x]);
}
const anLoc=()=>S.settings.lang==='en'?'en-GB':'ru-RU';
function anMon(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+(off||0)*7);return d;}
const anLvl=(n,g)=>n<=0?0:n<g*.5?1:n<g?2:n<g*2?3:4;
const anDn=i=>new Date(2024,0,1+i).toLocaleDateString(anLoc(),{weekday:'short'});
function anRange(m){
  const e=new Date(m);e.setDate(m.getDate()+6);const f=(d,o)=>d.toLocaleDateString(anLoc(),o);
  return m.getMonth()===e.getMonth()?m.getDate()+'–'+f(e,{day:'numeric',month:'long'}):f(m,{day:'numeric',month:'short'})+' – '+f(e,{day:'numeric',month:'short'});
}

function anData(sid){
  if(!sid){
    const ws=S.sets.flatMap(s=>s.words.map(w=>({en:w.en,ru:w.ru||'',arch:!!w.arch,aat:+w.aat||0,ok:w.ok||0,bad:w.bad||0,added:+w.added||0,upd:+w.upd||0})));
    return{own:true,name:'',words:ws,act:actAll(),goal:S.stats.goal||10,streak:S.stats.streak||0,best:S.stats.best||0};
  }
  const s=(AUTH.students||[]).find(x=>x.id===sid)||{},st=s.stats||{},c=TC.owner[sid]||{words:[],sets:[]};
  const ok=st.day===dayKey()||st.day===dayKey(new Date(Date.now()-DAY));
  const act=(st.act&&typeof st.act==='object'&&!Array.isArray(st.act))?st.act:{};
  return{own:false,sid,name:s.display_name||'Student',words:(c.words||[]).map(w=>({en:w.en,ru:w.ru||'',arch:!!w.arch,aat:+w.aat||0,ok:w.ok||0,bad:w.bad||0,added:0,upd:+new Date(w.updated_at)||0,set_id:w.set_id})),
    act,goal:st.goal||10,streak:ok?(st.streak||0):0,best:st.best||0};
}
function anWeekOf(D,off){
  const m=anMon(off),days=[];let a=0,c=0;
  for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);const v=D.act[dIdx(d)]||[0,0];days.push(v[0]);a+=v[0];c+=v[1];}
  const end=new Date(m);end.setDate(m.getDate()+7);
  const learned=D.words.filter(w=>w.arch&&w.aat>=+m&&w.aat<+end).length;
  const touched=D.words.filter(w=>w.upd>=+m&&w.upd<+end).length;
  return{m,end,days,a,c,act:days.filter(x=>x>0).length,learned,touched};
}

function anNav(key,d){view[key]=Math.min(0,(view[key]||0)+d);viewSave();render();}
const anSeg=(tabs,cur,fn)=>`<div class="anseg">${tabs.map(([k,l])=>`<span class="${cur===k?'on':''}" onclick="${fn}('${k}')">${t(l)}</span>`).join('')}</div>`;
const anNavBar=(label,key,off)=>`<div class="annav"><button class="ic" aria-label="Back" onclick="anNav('${key}',-1)">${ic('left',18)}</button><b>${label}</b><button class="ic" aria-label="Next" ${off>=0?'disabled':''} onclick="anNav('${key}',1)">${ic('right',18)}</button></div>`;

/* ---- the student's own screen ---- */
VIEWS.progress=function(app){app.innerHTML=anProgressHtml(anData(null),"go('me')",false);};
function anProgressHtml(D,back,teach){
  const tab=view.tab||'cal';
  return hdr(teach?D.name:t('My progress'),back,'')+anSeg([['cal','Calendar'],["words","Chart"],['week','Week']],tab,'anTab')+
    (tab==='cal'?anCalHtml(D):tab==='words'?anWordsHtml(D):anWeekHtml(D));
}
function anCalHtml(D){
  const off=Math.min(0,view.m||0),now=new Date(),m0=new Date(now.getFullYear(),now.getMonth()+off,1);
  const first=(m0.getDay()+6)%7,dim=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate(),today=dIdx();
  let cells='',days=0,ans=0;
  for(let i=0;i<first;i++)cells+='<i class="e"></i>';
  for(let d=1;d<=dim;d++){
    const dt=new Date(m0.getFullYear(),m0.getMonth(),d),ix=dIdx(dt),v=D.act[ix],n=v?v[0]:0;
    if(n>0){days++;ans+=n;}
    cells+=`<i class="l${anLvl(n,D.goal)}${ix===today?' today':''}${ix>today?' fut':''}" title="${n}"><b>${d}</b></i>`;
  }
  const keys=Object.keys(D.act).filter(k=>D.act[k]&&D.act[k][0]>0).map(Number);
  const since=keys.length?idxDate(Math.min(...keys)):null;
  const title=m0.toLocaleDateString(anLoc(),{month:'long',year:'numeric'});
  return anNavBar(esc(title),'m',off)+
   `<div class="ancard"><div class="ancal">${[0,1,2,3,4,5,6].map(i=>`<span>${anDn(i)}</span>`).join('')}${cells}</div>
     <div class="anleg"><span>${t('less')}</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>${t('more')}</span></div></div>
    <div class="ancard anstats"><div><div class="anbig">${D.streak||0}</div><div class="ant">${t('streak')}</div></div><div><div class="anbig">${D.best||0}</div><div class="ant">${t('best')}</div></div><div><div class="anbig">${days}</div><div class="ant">${t('active days')}</div></div><div><div class="anbig">${ans}</div><div class="ant">${t('answers')}</div></div></div>
    <div class="hint" style="margin:4px 4px 0">${since?t('The calendar is kept since')+' '+since.toLocaleDateString(anLoc(),{day:'numeric',month:'long'})+'.':(D.own?t('Days you study will appear here. Recording starts with this version.'):t('No days recorded yet — they appear after the student updates the app.'))}</div>`;
}
function anWordsHtml(D){
  const N=12,mons=[];for(let i=N-1;i>=0;i--)mons.push(anMon(-i));
  const ends=mons.map(m=>{const e=new Date(m);e.setDate(m.getDate()+7);return +e;}),t0=+mons[0];
  const total=D.words.filter(w=>w.arch).length;
  const base=D.words.filter(w=>w.arch&&(!w.aat||w.aat<t0)).length;
  const per=mons.map((m,i)=>D.words.filter(w=>w.arch&&w.aat>=+m&&w.aat<ends[i]).length);
  const added=mons.map((m,i)=>D.words.filter(w=>w.added>=+m&&w.added<ends[i]).length);
  let c=base;const cum=per.map(x=>c+=x);
  const W=300,H=110,vmin=Math.max(0,cum[0]-Math.max(2,per[0])),vmax=Math.max(cum[N-1],vmin+5);
  const X=i=>(i*(W/(N-1))).toFixed(1),Y=v=>(H-8-(v-vmin)/(vmax-vmin)*(H-22)).toFixed(1);
  const pts=cum.map((v,i)=>X(i)+' '+Y(v)),line='M'+pts.join(' L'),area=line+` L${W} ${H} L0 ${H}Z`;
  const hasAdd=added.some(x=>x>0),mx=Math.max(1,...per,...added);
  const bw=W/N,bars=mons.map((m,i)=>{
    const h1=per[i]/mx*60,h2=added[i]/mx*60,x=i*bw+2;
    return (hasAdd?`<rect x="${(x).toFixed(1)}" y="${(64-h2).toFixed(1)}" width="${(bw/2-2).toFixed(1)}" height="${h2.toFixed(1)}" rx="2" class="b2"/>`:'')+
      `<rect x="${(x+(hasAdd?bw/2-1:0)).toFixed(1)}" y="${(64-h1).toFixed(1)}" width="${(hasAdd?bw/2-2:bw-4).toFixed(1)}" height="${h1.toFixed(1)}" rx="2" class="b1"/>`;}).join('');
  const lab=d=>d.toLocaleDateString(anLoc(),{day:'numeric',month:'short'});
  const m4=cum[N-1]-cum[N-5];
  return `<div class="ancard"><div class="ant">${t('Learned in total')}</div><div class="anbig">${total} <span class="anup">${m4>0?'+'+m4+' '+t('in 4 weeks'):''}</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" class="ansvg" role="img" aria-label="${t('Learned words')}"><path d="${area}" class="ar"/><path d="${line}" class="ln"/><circle cx="${X(N-1)}" cy="${Y(cum[N-1])}" r="3.5" class="dt"/></svg>
    <div class="anax"><span>${lab(mons[0])}</span><span>${lab(mons[Math.floor(N/2)])}</span><span>${lab(mons[N-1])}</span></div></div>
   <div class="ancard"><div class="ant">${t('By week')}</div>
    <svg viewBox="0 0 ${W} 66" width="100%" class="ansvg2">${bars}</svg>
    <div class="anleg" style="justify-content:flex-start;gap:12px"><span><i class="sq b1"></i> ${t('learned')}</span>${hasAdd?`<span><i class="sq b2"></i> ${t('added')}</span>`:''}</div>
    <div class="hint" style="margin:6px 2px 0">${t('This week')}: ${t('learned')} ${per[N-1]}${hasAdd?', '+t('added')+' '+added[N-1]:''}</div></div>`;
}
function anWeekHtml(D){
  const off=Math.min(0,view.w||0),W=anWeekOf(D,off),P=anWeekOf(D,off-1);
  const acc=W.a?Math.round(W.c/W.a*100):null;
  const delta=P.a>0?Math.round((W.a-P.a)/P.a*100):null;
  const hard=D.words.filter(w=>!w.arch&&(w.bad||0)>=2&&(w.bad||0)>(w.ok||0)).sort((a,b)=>(b.bad-b.ok)-(a.bad-a.ok)).slice(0,5);
  const has=Object.keys(D.act).length>0;
  const bars=W.days.map((n,i)=>`<div class="wd"><i class="l${anLvl(n,D.goal)}"></i><small>${anDn(i)}</small><em>${n||''}</em></div>`).join('');
  return anNavBar(esc(anRange(W.m)),'w',off)+
   `<div class="anhero"><div class="anh1">${W.act} ${t('of 7 days')}</div><div class="anh2">${D.streak?t('streak')+' '+D.streak:''}${delta!==null&&W.a&&off<0?(D.streak?' · ':'')+(delta>=0?'+':'')+delta+'% '+t('vs previous week'):''}</div></div>
    <div class="ancard anstats"><div><div class="anbig">${has?W.a:'—'}</div><div class="ant">${t('answers')}</div></div><div><div class="anbig">${W.learned}</div><div class="ant">${t('learned')}</div></div><div><div class="anbig">${acc===null?'—':acc+'%'}</div><div class="ant">${t('accuracy')}</div></div></div>
    <div class="ancard"><div class="wdays">${bars}</div></div>`+
   (hard.length?`<div class="ancard"><div class="ant">${t('Hardest words')}</div><div>${hard.map(w=>`<span class="antag">${esc(w.en)}</span>`).join('')}</div>${D.own&&off===0?`<button class="btn pri" style="margin-top:12px" onclick="go('hard')">${t('Review tricky words')}</button>`:''}</div>`:'')+
   (has?'':`<div class="hint" style="margin:4px 4px 0">${D.own?t('Answers per day are recorded since this version.'):t('No days recorded yet — they appear after the student updates the app.')}</div>`);
}
/* Sunday and Monday: a card on Today */
function anTodayCard(){
  const d=new Date().getDay();if(d!==0&&d!==1)return '';
  const off=d===0?0:-1,W=anWeekOf(anData(null),off);if(!W.a)return '';
  return `<button class="rowlink" onclick="go('progress',{tab:'week',w:${off}})"><span>${ic('trend',19)}${t(d===0?'Week summary':'Last week summary')}</span><em>${W.act} ${t('of 7 days')} · ${W.a}</em></button>`;
}

/* ---- the teacher: Analytics ---- */
const TAN={seq:0,at:0,open:new Set(),quiet:false,rows:[]};
VIEWS.tan=function(app){
  app.innerHTML=hdr(t('Analytics'),"go('students')",`<button class="ic" aria-label="Refresh" onclick="TAN.at=0;render()">${ic('sync')}</button>`)+
    anSeg([['words','Words'],['week','Week'],['lists','Lists']],view.tab||'words','anTab')+`<div id="anBody">${skel(4)}</div>`;
  tanRun();
};
async function tanRun(){
  const my=++TAN.seq;
  let ss=AUTH.students||[];
  if(!ss.length){try{await loadStudents();}catch(e){}ss=AUTH.students||[];}
  if(my!==TAN.seq||view.name!=='tan')return;
  const cached=ss.length&&ss.every(s=>TC.owner[s.id]);
  if(cached)tanDraw();
  if(Date.now()-TAN.at>60000&&sb){
    TAN.at=Date.now();topLoad(true);
    try{
      const ids=ss.map(s=>s.id);
      const p1=ids.length?sb.from('profiles').select('id,display_name,stats').in('id',ids).then(r=>{if(!r.error&&r.data)r.data.forEach(p=>{const s=ss.find(x=>x.id===p.id);if(s)s.stats=p.stats;});},()=>{}):Promise.resolve();
      const p2=Promise.all(ss.map(async s=>{const r=await fetchOwner(s.id);if(r.ok||!TC.owner[s.id])TC.owner[s.id]={sets:r.sets,words:r.words};}));
      await Promise.all([p1,p2]);
    }catch(e){}
    topLoad(false);
  }
  if(my===TAN.seq&&view.name==='tan')tanDraw();
}
function tanDraw(){
  const b=$('#anBody');if(!b)return;
  const ss=AUTH.students||[];
  if(!ss.length){b.innerHTML=`<div class="empty"><div class="big">${ic('users',26)}</div><b>${t('No students linked yet')}</b></div>`;return;}
  const tab=view.tab||'words';
  b.innerHTML=tab==='week'?tanWeek(ss):tab==='lists'?tanLists(ss):tanWords(ss);
}
function tanWords(ss){
  const map=new Map();
  ss.forEach(s=>{
    const c=TC.owner[s.id];if(!c)return;
    const sn=id=>(c.sets.find(x=>x.id===id)||{}).name||'';
    c.words.forEach(w=>{
      if(!w.en)return;
      const k=fold(w.en);let e=map.get(k);
      if(!e)map.set(k,e={en:w.en,ru:{},have:new Set(),bad:new Map(),list:{}});
      e.have.add(s.id);
      if(!w.arch&&(w.bad||0)>=2&&(w.bad||0)>(w.ok||0))e.bad.set(s.id,(w.bad||0)-(w.ok||0));
      const r=(w.ru||'').trim();if(r&&r!=='—')e.ru[r]=(e.ru[r]||0)+1;
      const l=sn(w.set_id);if(l&&l!==ARCH_NAME)e.list[l]=(e.list[l]||0)+1;
    });
  });
  const need=Math.min(2,ss.length);
  const rows=[...map.values()].filter(e=>e.bad.size>=need&&e.bad.size/e.have.size>=.5)
    .sort((a,b)=>b.bad.size-a.bad.size||(b.bad.size/b.have.size-a.bad.size/a.have.size)||a.en.localeCompare(b.en)).slice(0,40);
  TAN.rows=rows;
  const top=o=>Object.keys(o).sort((x,y)=>o[y]-o[x])[0]||'';
  const nm=id=>((ss.find(s=>s.id===id)||{}).display_name||'Student');
  if(!rows.length)return `<div class="empty"><div class="big">${ic('check',26)}</div><b>${t('No shared trouble spots')}</b><p>${t('Words that most of your students keep missing will appear here.')}</p></div>`;
  return `<div class="ancard"><div class="ant">${t('Most students keep missing')} · ${ss.length} ${plr(ss.length,t('student'),t('student2'),t('students'))}</div>`+
   rows.map((e,i)=>{
     const open=TAN.open.has(i),pct=Math.round(e.bad.size/e.have.size*100);
     return `<div class="r anw" onclick="tanOpen(${i})"><div class="n"><b>${esc(e.en)}</b><small>${esc(top(e.ru))}${top(e.list)?' · '+esc(top(e.list)):''}</small>
       ${open?`<div class="anwho">${[...e.bad.keys()].map(id=>`<span class="antag">${esc(nm(id))}</span>`).join('')}</div>`:''}</div>
       <div class="anbar"><i style="width:${pct}%"></i></div><span class="pill pb">${e.bad.size}/${e.have.size}</span></div>`;}).join('')+
   `</div><button class="btn pri" onclick="tanMakeSet()">${ic('plus',18)}${t('Make a list for the lesson')} (${Math.min(30,rows.length)})</button>`;
}
function tanOpen(i){if(TAN.open.has(i))TAN.open.delete(i);else TAN.open.add(i);tanDraw();}
function tanMakeSet(){
  const rows=TAN.rows.slice(0,30);if(!rows.length)return;
  const top=o=>Object.keys(o).sort((x,y)=>o[y]-o[x])[0]||'—';
  const nm=t('Hard for everyone')+' · '+new Date().toLocaleDateString(anLoc(),{day:'numeric',month:'short'});
  const set={id:uid(),name:nm,lang:'en',words:[],upd:Date.now(),synced:false};
  set.words=rows.map((e,i)=>{const w=newWord(e.en,top(e.ru),'');w.pos=posNow(i,rows.length);return w;});
  S.sets.push(set);save();toast(t('List created')+' ✓');go('set',{id:set.id});
}
function tanWeek(ss){
  const off=Math.min(0,view.w||0);
  const rows=ss.map(s=>{
    const D=anData(s.id),W=anWeekOf(D,off),P=anWeekOf(D,off-1);
    const keys=Object.keys(D.act).filter(k=>D.act[k]&&D.act[k][0]>0).map(Number);
    const hasAct=keys.length>0;
    const lastW=D.words.reduce((m,w)=>Math.max(m,w.upd||0),0);
    const idle=hasAct?dIdx()-Math.max(...keys):(Math.max(lastW,stuSeen(s))?Math.floor((Date.now()-Math.max(lastW,stuSeen(s)))/DAY):null);
    return{s,D,W,P,hasAct,idle};
  }).sort((a,b)=>b.W.a-a.W.a||b.W.touched-a.W.touched||String(a.s.display_name).localeCompare(String(b.s.display_name)));
  const anyAct=rows.some(r=>r.hasAct);
  const shown=(TAN.quiet&&off===0)?rows.filter(r=>r.idle===null||r.idle>=3):rows;
  TAN.report=rows;
  const trend=r=>{
    if(!r.hasAct)return '';
    if(r.W.a===0&&r.P.a>0)return '<span class="pill pb">!</span>';
    if(!r.W.a)return '';
    if(!r.P.a||(r.W.a-r.P.a)/r.P.a>.15)return '<span class="pill po">▲</span>';
    if((r.W.a-r.P.a)/r.P.a<-.15)return '<span class="pill pb">▼</span>';
    return '<span class="pill pw">▬</span>';
  };
  return anNavBar(esc(anRange(anMon(off))),'w',off)+
   (anyAct?'':`<div class="hint" style="margin:0 4px 10px">${t('Days and answers are recorded since the student updates the app. Until then only changed words are shown.')}</div>`)+
   (off===0?`<div class="anchips"><button class="chip ${TAN.quiet?'on':''}" onclick="TAN.quiet=!TAN.quiet;tanDraw()">${t('Missed 3+ days')}</button></div>`:'')+
   (shown.length?`<div class="ancard" style="padding:2px 12px">`+shown.map(r=>{
     const nm=r.s.display_name||'Student';
     const meta=r.hasAct?`${r.W.a} ${t('answers')} · ${t('learned')} ${r.W.learned}${(off===0&&r.idle!==null&&r.idle>=3)?` · <span style="color:var(--bad)">${t('away')} ${r.idle} ${plr(r.idle,t('day'),t('day2'),t('days'))}</span>`:''}`:`${r.W.touched} ${t('words changed')} · ${t('learned')} ${r.W.learned}`;
     return `<div class="r anr" onclick="go('tprog',{sid:'${r.s.id}',tab:'week',w:${off}})"><div class="n"><b>${esc(nm)}</b><small>${meta}</small></div>
       <div class="dots">${r.W.days.map(n=>`<i class="l${anLvl(n,r.D.goal)}"></i>`).join('')}</div>${trend(r)}</div>`;}).join('')+`</div>`
    :`<div class="empty"><p>${t('Nobody missed 3 days')}</p></div>`)+
   `<button class="btn" style="margin-top:12px" onclick="tanCopy()">${t('Copy the report for chat')}</button>`;
}
function tanCopy(){
  const off=Math.min(0,view.w||0),m=anMon(off),rows=TAN.report||[];
  let tx='NOEON Words · '+anRange(m)+'\n';
  rows.forEach(r=>{
    const nm=r.s.display_name||'Student';
    tx+='\n'+nm+': '+(r.hasAct?`${r.W.act} ${t('of 7 days')}, ${r.W.a} ${t('answers')}, ${t('learned')} ${r.W.learned}`:`${t('learned')} ${r.W.learned}`);
    if(off===0&&r.idle!==null&&r.idle>=3)tx+=` — ${t('away')} ${r.idle} ${plr(r.idle,t('day'),t('day2'),t('days'))}`;
  });
  const done=()=>toast(t('Copied ✓'));
  try{navigator.clipboard.writeText(tx).then(done,()=>tanCopyFb(tx,done));}catch(e){tanCopyFb(tx,done);}
}
function tanCopyFb(tx,done){const a=document.createElement('textarea');a.value=tx;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){}a.remove();}
function tanLists(ss){
  const cnt={};
  ss.forEach(s=>{const c=TC.owner[s.id];if(!c)return;new Set(c.sets.filter(x=>x.name&&x.name!==ARCH_NAME).map(x=>x.name)).forEach(n=>cnt[n]=(cnt[n]||0)+1);});
  const names=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b)).slice(0,8);
  if(!names.length)return `<div class="empty"><p>${t('No lists yet')}</p></div>`;
  const cell=(s,n)=>{
    const c=TC.owner[s.id];if(!c)return '<div class="c none">—</div>';
    const st=c.sets.filter(x=>x.name===n);if(!st.length)return '<div class="c none">—</div>';
    const ids=new Set(st.map(x=>x.id)),ws=c.words.filter(w=>ids.has(w.set_id));
    if(!ws.length)return '<div class="c none">0</div>';
    const p=Math.round(ws.filter(w=>w.arch).length/ws.length*100);
    const cl=p>=70?'hi':p>=30?'mid':p>0?'lo':'zero';
    return `<div class="c ${cl}" onclick="go('twords',{sid:'${s.id}',sname:'${q1(s.display_name||'Student')}',setId:'${st[0].id}',setName:'${q1(n)}'})">${p}%</div>`;
  };
  return `<div class="ancard anmxw"><div class="anmx" style="grid-template-columns:92px repeat(${names.length},minmax(58px,1fr))"><span class="anh"></span>${names.map(n=>`<b title="${esc(n)}">${esc(n)}</b>`).join('')}`+
    ss.map(s=>`<span class="anrn">${esc(s.display_name||'Student')}</span>`+names.map(n=>cell(s,n)).join('')).join('')+`</div></div>
    <div class="hint" style="margin:6px 4px 0">${t('Share of learned words in each list. Tap a cell to open the list.')}</div>`;
}
/* one student, seen by the teacher: the same three screens */
VIEWS.tprog=function(app){
  const sid=view.sid;
  const s=(AUTH.students||[]).find(x=>x.id===sid);
  if(!s){
    app.innerHTML=hdr(t('Analytics'),"go('tan',{tab:'week'})",'')+skel(3);
    if(!VIEWS.tprog._t){VIEWS.tprog._t=1;loadStudents().then(()=>{VIEWS.tprog._t=0;if(view.name==='tprog'&&(AUTH.students||[]).some(x=>x.id===sid))render();},()=>{VIEWS.tprog._t=0;});}
    return;
  }
  app.innerHTML=anProgressHtml(anData(sid),"go('tan',{tab:'week'})",true);

/* ---- live updates: what changes in the cloud shows up here without a refresh ---- */
const LIVE={ch:null,key:'',seen:'',deb:0,pull:0};
function liveIds(){
  const me=AUTH.user&&AUTH.user.id;if(!me)return [];
  const ids=[me];
  if(AUTH.profile&&AUTH.profile.role==='teacher')(AUTH.students||[]).forEach(s=>{if(s&&s.id&&ids.indexOf(s.id)<0)ids.push(s.id);});
  return ids.slice(0,100);
}
function liveStart(){
  if(!cloudEnabled()||!sb.channel){return;}
  const ids=liveIds();if(!ids.length)return;
  const key=ids.join(',');
  if(LIVE.ch&&LIVE.key===key)return;
  liveStop();LIVE.key=key;
  const f=ids.length===1?'owner_id=eq.'+ids[0]:'owner_id=in.('+ids.join(',')+')';
  try{
    LIVE.ch=sb.channel('live-'+ids[0].slice(0,8))
      .on('postgres_changes',{event:'*',schema:'public',table:'words',filter:f},p=>liveRow('words',p))
      .on('postgres_changes',{event:'*',schema:'public',table:'sets',filter:f},p=>liveRow('sets',p))
      .subscribe();
  }catch(e){LIVE.ch=null;LIVE.key='';}
}
function liveStop(){try{if(LIVE.ch&&sb)sb.removeChannel(LIVE.ch);}catch(e){}LIVE.ch=null;LIVE.key='';}
function liveDrop(table,id){
  if(!id)return false;let hit=false;
  if(table==='sets'){const n=S.sets.length;S.sets=S.sets.filter(s=>s.id!==id);hit=S.sets.length!==n;}
  else S.sets.forEach(s=>{const n=s.words.length;s.words=s.words.filter(w=>w.id!==id);if(s.words.length!==n)hit=true;});
  return hit;
}
function liveRow(table,p){
  try{
    const me=AUTH.user&&AUTH.user.id,r=p&&p.new&&p.new.id?p.new:null,old=(p&&p.old)||{};
    const owner=(r&&r.owner_id)||old.owner_id||null;
    let mine=!owner||owner===me,touched=false;
    if(mine){
      if(p.eventType==='DELETE'||(r&&r.deleted)){touched=liveDrop(table,(r||old).id);}
      else if(r){
        if(table==='sets')mergeCloud([r],[],false);
        else if(S.sets.some(s=>s.id===r.set_id))mergeCloud([],[r],false);
        else{liveCatchUp();return;}                    /* a word for a list we don't have yet */
        touched=true;
      }
      if(touched)persist();
    }
    liveRefresh(owner&&owner!==me?owner:null,touched||!mine);
  }catch(e){}
}
/* many rows can arrive at once (an import): redraw once */
function liveRefresh(otherOwner,doIt){
  if(!doIt)return;
  clearTimeout(LIVE.deb);
  LIVE.deb=setTimeout(()=>{
    if(otherOwner){
      if(TEACH_VIEWS.indexOf(view.name)<0)return;
      if(view.name!=='students'&&view.sid!==otherOwner)return;
    }
    softRender();
  },260);
}
function liveCatchUp(){clearTimeout(LIVE.pull);LIVE.pull=setTimeout(()=>{if(cloudEnabled())cloudPull().then(softRender);},500);}
/* safety net for when the instant channel is not available: one tiny request every 20 s */
async function liveCheck(){
  if(!cloudEnabled()||document.visibilityState!=='visible'||syncing)return;
  liveStart();
  const ids=liveIds();if(!ids.length)return;
  try{
    const q=tb=>sb.from(tb).select('updated_at').in('owner_id',ids).order('updated_at',{ascending:false}).limit(1);
    const [a,b]=await Promise.all([q('words'),q('sets')]);
    if(a.error||b.error)return;
    const k=((a.data&&a.data[0]&&a.data[0].updated_at)||'')+'|'+((b.data&&b.data[0]&&b.data[0].updated_at)||'');
    const was=LIVE.seen;LIVE.seen=k;
    if(was&&was!==k){await cloudPull();softRender();}
  }catch(e){}
}
