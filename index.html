<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocab">

<title>Vocabulary</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v2.png">
<meta name="description" content="Vocabulary — личный словарь для изучения английских слов: карточки, тесты и интервальные повторения.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>(function(){try{var s=(JSON.parse(localStorage.getItem('vocab.v2')||'{}').settings)||{};var m=s.theme||'auto',dark;if(m==='dark')dark=true;else if(m==='light')dark=false;else{var h=new Date().getHours();dark=h<7||h>=19;}document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>
@font-face{font-family:Madefor;src:url(wixt-lat.woff2)format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Madefor;src:url(wixt-cyr.woff2)format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:MadeforD;src:url(wixd-lat.woff2)format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:MadeforD;src:url(wixd-cyr.woff2)format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{
  --bg:#f3f6fb; --surf:#ffffff; --surf2:#f2f6fd;
  --tx:#0f1a2e; --mut:#5a6885; --fade:#808ea9;
  --line:#e4eaf4; --line2:#d2dcec;
  --pri:#1f66ee; --pri-d:#1a56db; --pri-soft:#e9f0ff; --on-pri:#ffffff;
  --acc:#a8ccff; --acc-ink:#1a46a8; --mint:#9ed0ff;
  --grad:linear-gradient(135deg,#1a56db,#2f86f5 62%,#9ed0ff);
  --ok:#1b7a4d; --ok-soft:#e3f1e9; --bad:#c03a28; --bad-soft:#fae7e3;
  --warn:#a9700f; --info:#1f6f8b;
  --word:#0f1a2e; --card-bg:#1a46a8; --card-tx:#f4f8ff; --card-mut:#aec6ef;
  --sh-sm:0 1px 2px rgba(15,26,46,.05); --sh:0 10px 30px rgba(15,26,46,.10),0 2px 6px rgba(15,26,46,.05);
  --r:16px; --r-sm:12px;
  --ff:Madefor,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --ff-serif:MadeforD,Madefor,-apple-system,"SF Pro Display",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#070c17; --surf:#0f1726; --surf2:#141e32;
  --tx:#e8eefb; --mut:#94a3c0; --fade:#6d7d9c;
  --line:#1b2538; --line2:#27344b;
  --pri:#7db4ff; --pri-d:#aed2ff; --pri-soft:#15243f; --on-pri:#06142e;
  --acc:#b6d6ff; --acc-ink:#0b1d3f; --mint:#9ed0ff;
  --grad:linear-gradient(135deg,#2f86f5,#7db4ff 62%,#c6e2ff);
  --ok:#4ed39a; --ok-soft:#0d2a20; --bad:#ef8a76; --bad-soft:#2d1512;
  --word:#f2f6ff; --card-bg:#19356d; --card-tx:#f0f6ff; --card-mut:#a8c3ec;
  --sh-sm:0 1px 2px rgba(0,0,0,.35); --sh:0 14px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.i{display:block;flex:none}
.btn .i{margin-right:-1px}
.seg3 button,.seg button,.tabs2 button{display:flex;align-items:center;justify-content:center;gap:7px}
.flame .n{display:flex;align-items:center;gap:5px;justify-content:center}
.lnk{display:inline-flex;align-items:center;gap:6px}
.item .pips,.item .chk,.item .cbox{align-self:center}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
#app{max-width:680px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
::selection{background:var(--pri-soft)}

/* header */
header{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(var(--bg) 72%,transparent)}
header h1{flex:1;min-width:0;margin:0;font-family:var(--ff-serif);font-size:25px;font-weight:700;letter-spacing:-.025em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;flex:none;border-radius:11px;background:transparent;
  border:1px solid transparent;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ic:hover{color:var(--tx);background:var(--surf2)}
.ic{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.ic:active{transform:scale(.96);transition-duration:.12s}
.back{font-size:26px;font-weight:600;color:var(--pri)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:14px 18px;border-radius:var(--r-sm);background:var(--surf);
  border:1px solid var(--line2);font-weight:600;font-size:16px;letter-spacing:-.01em}
.btn{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .18s ease}
.btn:active{transform:scale(.988);transition-duration:.12s}
.btn.pri{background:var(--pri);color:var(--on-pri);border:1px solid transparent;font-weight:650}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line2)}
.btn.danger{color:var(--bad)}
.stack>*+*{margin-top:10px}


/* mode pills */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.modes .mcard{width:auto;padding:14px 5px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.modes .mcard .em{width:48px;height:48px;border-radius:15px;margin:0}
.modes .mcard b{font-size:13px;letter-spacing:-.015em}
.mcard{flex:none;width:113px;padding:13px 12px;border-radius:var(--r-sm);background:var(--surf);
  border:1px solid var(--line);text-align:left}
.mcard{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease}
.mcard:active{transform:scale(.978);transition-duration:.12s}
.mcard .em{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--pri-soft);color:var(--pri)}
.mcard b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.mcard small{color:var(--mut);font-size:11.5px;font-weight:500}
.mcard:hover .em{background:var(--pri-soft)}

/* list / dictionary */
.subhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px}
.subhead .t{font-size:13.5px;font-weight:600;color:var(--fade);letter-spacing:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:0 13px;margin-bottom:10px;box-shadow:var(--sh-sm)}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;color:var(--tx)}
.search svg{width:17px;height:17px;fill:var(--fade);flex:none}
.item{display:flex;align-items:center;gap:13px;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:8px}
.item{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease}
.item:active{background:var(--surf2);transform:scale(.995);transition-duration:.12s}
/* words read as one continuous list, the way a dictionary page does */
.wlist{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);overflow:hidden}
.wlist .item{background:none;border:0;border-radius:0;margin:0;box-shadow:none;
  border-bottom:1px solid var(--line);padding:13px 16px}
.wlist .item:last-child{border-bottom:0}
.wlist .item:active{background:var(--surf2);transform:none}
.wlist .item.pick{background:var(--pri-soft);box-shadow:inset 3px 0 0 var(--pri)}
.item .t{flex:1;min-width:0}
.item .en{font-family:var(--ff-serif);font-weight:700;font-size:17px;letter-spacing:-.005em;color:var(--word);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ru{color:var(--mut);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;align-items:flex-end;gap:3px;flex:none;height:16px}
.pip{width:4px;border-radius:2px;background:var(--line2)}
.pip:nth-child(1){height:7px}.pip:nth-child(2){height:11px}.pip:nth-child(3){height:15px}
.pip.on1,.pip.on2,.pip.on3{background:var(--pri)}
.pip.on1{opacity:.4}.pip.on2{opacity:.7}.pip.on3{opacity:1}
.numx{min-width:30px;height:24px;padding:0 5px;border-radius:7px;background:var(--line);color:var(--mut);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;
  font-variant-numeric:tabular-nums}
.rangebar{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:12px 14px;
  background:var(--surf);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-align:left}
.rangebar>span{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14.5px;flex:none}
.rangebar em{flex:1;font-style:normal;color:var(--mut);font-size:14px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rangebar.on{border-color:var(--pri);color:var(--pri)}
.rangebar.on em{color:var(--pri);font-weight:650}
.rangerow{display:flex;gap:10px}
.akword{text-align:center;padding:18px 10px 14px}
.akword .en{font-family:var(--ff-serif);font-weight:700;font-size:26px;color:var(--word)}
.akword .ru{color:var(--mut);font-size:16px;margin-top:5px}
.aklist{max-height:44vh;overflow:auto;margin:10px 0 14px}
.chk{width:24px;height:24px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none}
.spk{width:34px;height:34px;flex:none;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.spk{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.spk:active{background:var(--pri-soft);color:var(--pri);transform:scale(.95);transition-duration:.12s}

/* selection / bulk archive */
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px;min-height:24px}
.tbar .t{font-size:13.5px;font-weight:600;color:var(--fade);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{font-size:14.5px;font-weight:700;color:var(--pri);padding:5px 4px;flex:none;border-radius:9px}
.lnk:active{background:var(--pri-soft)}
.cbox{width:25px;height:25px;flex:none;border-radius:50%;border:2px solid var(--line2);background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;transition:.12s}
.cbox.on{background:var(--pri);border-color:var(--pri);transform:scale(1.06)}
.item.pick{border-color:var(--pri);background:var(--pri-soft)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(transparent,var(--bg) 34%);
  padding:20px 16px calc(14px + env(safe-area-inset-bottom))}
.selbar .in{max-width:680px;margin:0 auto}
.btn:disabled{opacity:.5;box-shadow:none}
.ans-bad,.ans-ok{font-size:14px;font-weight:650;padding:6px 12px;border-radius:11px;line-height:1.2}
.ans-bad{background:var(--bad-soft);color:var(--bad);font-family:var(--ff-serif);font-weight:600}
.ans-ok{background:var(--ok-soft);color:var(--ok);font-family:var(--ff-serif);font-weight:600}
/* test question palette */
.qpalbox{display:flex;align-items:flex-start;gap:8px;margin:0 0 12px}
.qpal{position:relative;flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:7px;max-height:79px;overflow:hidden;
  transition:max-height .3s cubic-bezier(.22,1,.36,1)}
.qpal.open{max-height:min(42vh,340px);overflow:auto}
.qpal::-webkit-scrollbar{display:none}
.qmore{flex:none;width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line2);
  background:var(--surf);color:var(--mut);font-size:15px;font-weight:800;line-height:1;
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.qmore:active{transform:scale(.95);transition-duration:.12s}
.qmore .n{font-size:11px;font-weight:700;display:block;margin-top:-2px}
.qdot{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:11px;border:1.5px solid var(--line2);background:var(--surf);color:var(--mut);font-weight:700;font-size:14.5px}
.qdot.on{border-color:var(--pri);color:var(--pri-d);background:var(--pri-soft)}
.qdot{transition:transform .2s cubic-bezier(.22,1,.36,1),background-color .18s ease,border-color .18s ease,color .18s ease}
.qdot:active{transform:scale(.95);transition-duration:.12s}
.qdot.cur{background:var(--pri);color:var(--on-pri);border-color:transparent}
.opt.pick{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.btn.selp{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.btn.tfy{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.btn.tfn{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700}
.btn.tfy.selp{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 16px rgba(27,122,77,.28)}
.btn.tfn.selp{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 6px 16px rgba(192,58,40,.28)}
.arch-ic{width:44px;height:44px;flex:none;border-radius:13px;background:var(--surf2);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.src{color:var(--fade);font-size:12.5px;font-weight:600}

/* account */
.ic{position:relative}
.tabs2{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--sh-sm);margin-bottom:14px}
.tabs2 button{flex:1;padding:10px 6px;border-radius:10px;font-weight:650;font-size:15px;color:var(--mut)}
.tabs2 button{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.tabs2 button.on{background:var(--pri);color:var(--on-pri)}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pri-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px;margin:4px 0 12px}
.codebox b{font-family:var(--ff-serif);font-size:30px;font-weight:700;letter-spacing:.1em;color:var(--pri)}
.roster{display:flex;align-items:center;gap:13px;background:var(--surf);box-shadow:var(--sh-sm);border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:9px}
.roster{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.roster:active{transform:scale(.995);transition-duration:.12s}
.roster .av{width:40px;height:40px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.roster .t{flex:1;min-width:0}
.roster .nm{font-weight:700;font-size:16px}
.roster .meta{color:var(--mut);font-size:13px}
.err{color:var(--bad);font-size:13.5px;font-weight:600;margin:2px 2px 8px;min-height:17px}

/* daily goal + review */
.daycard{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);
  border-radius:15px;padding:12px 15px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.daycard .t{flex:1;min-width:0}
.daycard .lbl{font-size:13.5px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.daycard .lbl b{font-family:var(--ff-serif);color:var(--tx);font-weight:700;font-size:14.5px}
.daycard .pbar{margin-top:7px}
.flame{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;min-width:40px}
.flame .n{font-family:var(--ff-serif);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1}
.flame .c{font-size:11px;color:var(--fade);font-weight:500}
.near{background:#fff4e0;color:#b45309}
:root[data-theme="dark"] .near{background:#3a2c10;color:#fbbf24}
.fb.near{background:#fff4e0;color:#b45309}
:root[data-theme="dark"] .fb.near{background:#3a2c10;color:#fbbf24}

/* set card on home */
.setcard{display:flex;align-items:center;gap:14px;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.setcard{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease,border-color .2s ease}
.setcard:active{transform:scale(.993);transition-duration:.12s}
.setcard .t{flex:1;min-width:0}
.setcard .nm{font-weight:750;font-size:18px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setcard .meta{color:var(--mut);font-size:13.5px;margin-top:2px}
.ring{flex:none}
.ring text{font-family:var(--ff-serif);font-weight:700}

/* empty */
.empty{text-align:center;color:var(--mut);padding:46px 24px}
.empty .big{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--surf);border:1px solid var(--line);color:var(--fade);display:flex;align-items:center;justify-content:center}
.empty b{display:block;color:var(--tx);font-size:18px;font-weight:700;margin-bottom:5px;letter-spacing:-.02em}
.empty p{margin:0;font-size:14.5px;line-height:1.5}

/* banner */
.banner{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:14px;font-size:14px;line-height:1.5;align-items:flex-start;color:var(--mut)}
.banner b{color:var(--tx)}
.banner .ib{color:var(--pri);flex:none;margin-top:1px}
.banner .x{margin-left:auto;font-size:18px;color:var(--pri);flex:none;padding:0 2px}
.banner b{font-weight:700}

/* fab */
.fab{position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:15;
  width:56px;height:56px;border-radius:18px;background:var(--pri);color:var(--on-pri);
  box-shadow:0 10px 26px rgba(14,59,44,.30);display:flex;align-items:center;justify-content:center;line-height:1}
.fab{transition:transform .3s cubic-bezier(.33,1,.68,1),box-shadow .2s ease}
.fab:active{transform:scale(.95);transition-duration:.12s}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;animation:fade .26s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(12px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes down{to{transform:translateY(14px);opacity:0}}
@keyframes fadeout{to{opacity:0}}
.sheet{width:100%;max-width:680px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
  animation:up .28s cubic-bezier(.33,1,.68,1);will-change:transform}
.scrim.closing{animation:fadeout .18s ease forwards;pointer-events:none}
.scrim.closing .sheet{animation:down .18s ease forwards}
.grip{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
.sheet h2{margin:0 0 14px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.field{margin-bottom:11px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 2px 7px}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--pri)}
textarea.inp{resize:vertical;line-height:1.5;min-height:120px;font-size:15px}
.row{display:flex;gap:9px;align-items:center}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.hint{color:var(--mut);font-size:13px;min-height:17px;margin:2px 2px 6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.chip{background:var(--pri-soft);color:var(--pri-d);border-radius:11px;padding:7px 13px;font-size:14px;font-weight:600}
.chip{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.chip:active{transform:scale(.97);transition-duration:.12s}
.sel-opt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sel-opt button{padding:9px 13px;border-radius:11px;background:var(--surf);border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--mut)}
.sel-opt button{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .22s cubic-bezier(.22,1,.36,1)}
.sel-opt button:active{transform:scale(.975);transition-duration:.12s}
.sel-opt button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d)}
.toggle{display:flex;align-items:center;gap:10px;padding:12px 2px}
.toggle label{flex:1;font-weight:600;font-size:15px}
.sw{width:50px;height:30px;border-radius:16px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw.on{background:var(--pri)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:23px}

/* study */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .x{font-size:15px;font-weight:650;color:var(--mut)}
.pbar{flex:1;height:7px;background:var(--line2);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .3s ease-out}
.stat{font-size:14px;font-weight:700;color:var(--mut);flex:none;min-width:52px;text-align:right}
.fc{perspective:1200px;margin:12px 0}
.card{background:var(--card-bg);border:1px solid transparent;border-radius:22px;min-height:min(60vh,340px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:var(--sh)}
.card .word{font-family:var(--ff-serif);font-size:clamp(30px,8.4vw,44px);font-weight:700;letter-spacing:-.015em;line-height:1.12;color:var(--card-tx);overflow-wrap:anywhere;max-width:100%}
.card .ex{overflow-wrap:anywhere;font-size:16.5px;font-weight:450;color:var(--card-mut);margin-top:18px;line-height:1.45}
.card .tip{font-size:13.5px;color:var(--card-mut);opacity:.8;margin-top:20px;font-weight:450}
.card .lbl{font-size:13.5px;font-weight:500;color:var(--card-mut);margin-bottom:18px}
.opt{display:flex;align-items:center;width:100%;text-align:left;overflow-wrap:anywhere;background:var(--surf);border:1.5px solid var(--line2);
  border-radius:15px;padding:16px 17px;margin-bottom:10px;font-size:17px;font-weight:600;box-shadow:var(--sh-sm);
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,color .18s ease}
.opt:active{transform:scale(.995);transition-duration:.12s}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{padding:15px;border-radius:15px;margin:12px 0;font-weight:700;font-size:16px;line-height:1.4}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:500;margin-top:5px;opacity:.85}
.big-pct{text-align:center;font-size:58px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:14px 0 2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:72px;padding:10px;border-radius:16px;background:var(--surf);border:1.5px solid var(--line2);
  box-shadow:var(--sh-sm);font-weight:650;font-size:15.5px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
.tile{transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease,border-color .18s ease,opacity .3s ease}
.tile:active{transform:scale(.98);transition-duration:.12s}
.tile.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.tile.done{opacity:0;pointer-events:none;transform:scale(.8);transition:.3s}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:#15171f;color:#fff;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:600;z-index:60;
  opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
:root[data-theme="dark"] #toast{background:#2a2e3d}

/* theme segmented control */
.seg3{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:4px;box-shadow:var(--sh-sm)}
.seg3 button{flex:1;padding:10px 6px;border-radius:9px;font-weight:650;font-size:14.5px;color:var(--mut)}
.seg3 button{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.seg3 button.on{background:var(--pri);color:var(--on-pri)}

/* result hero + score ring */
.hero{text-align:center;padding:14px 0 6px}
.hero-ic{width:62px;height:62px;margin:0 auto;border-radius:20px;background:var(--pri-soft);color:var(--pri);
  display:flex;align-items:center;justify-content:center;animation:pop .34s ease-out both}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes viewin{from{opacity:.4}to{opacity:1}}
.viewin{animation:viewin .22s ease-out}
/* top loading pill: slides down from above, never replaces content */
#tload{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:60;display:flex;align-items:center;gap:8px;
  padding:8px 15px 8px 12px;border-radius:99px;background:var(--surf);color:var(--mut);font-size:13px;font-weight:650;
  border:1px solid var(--line);box-shadow:0 8px 22px rgba(10,12,20,.14);pointer-events:none;
  transform:translate(-50%,-70px);opacity:0;transition:transform .42s cubic-bezier(.34,1.3,.64,1),opacity .25s ease}
#tload.on{transform:translate(-50%,0);opacity:1}
#tload i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--pri);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* list entrance: items glide in one after another */
@keyframes itemin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{animation:itemin .38s cubic-bezier(.33,1,.68,1) both}
.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}
.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(6){animation-delay:.2s}.stag>*:nth-child(n+7){animation-delay:.24s}
/* skeleton placeholders */
.skel{height:68px;border-radius:15px;margin-bottom:9px;background:linear-gradient(100deg,var(--line) 30%,var(--line2) 50%,var(--line) 70%);
  background-size:220% 100%;animation:shim 1.3s ease-in-out infinite;opacity:.7}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
@keyframes flipout{from{transform:rotateY(0)}to{transform:rotateY(90deg)}}
@keyframes flipin{from{transform:rotateY(-90deg)}to{transform:rotateY(0)}}
.card.fout{animation:flipout .19s cubic-bezier(.4,0,.8,.45) forwards}
.card.fin{animation:flipin .25s cubic-bezier(.2,.65,.3,1)}
.fc .card{transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}
.hero-title{font-size:27px;font-weight:800;letter-spacing:-.025em;margin-top:8px}
.hero-sub{color:var(--mut);font-size:16px;margin-top:5px;font-weight:500}
.ring-big{display:block;margin:6px auto 2px}
.rb-track{fill:none;stroke:var(--line2);stroke-width:13}
.rb-fill{fill:none;stroke:url(#gbig);stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--off);animation:ringfill 1.15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
.rb-pct{font-family:var(--ff-serif);font-size:40px;font-weight:700;fill:var(--tx);letter-spacing:-.01em}
:root[data-theme="dark"] #g stop:first-child,:root[data-theme="dark"] #gbig stop:first-child{stop-color:#2f7d4f}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* bottom navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:2px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:var(--surf);border-top:1px solid var(--line)}
.tab{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 4px;border-radius:12px;color:var(--fade);font-size:11.5px;font-weight:600;
  transition:color .18s ease,background-color .18s ease}
.tab.on{color:var(--pri)}
.linkbtn{display:block;margin:-2px 0 8px auto;padding:6px 2px;color:var(--pri);font-size:14px;font-weight:650}
.tabs{transition:transform .38s cubic-bezier(.33,1,.68,1),opacity .3s ease;will-change:transform}
.tabs.hide{transform:translateY(105%);opacity:0;pointer-events:none}
.tab .ti{display:flex;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tab.on .ti{transform:translateY(-1px) scale(1.08)}
.tab:active .ti{transform:scale(.9)}
.tab:active{background:var(--surf2)}

/* today: the one thing to do */
.sess{background:var(--card-bg);color:var(--card-tx);border-radius:20px;padding:28px 20px 20px;text-align:center;margin-bottom:14px}
.sess-n{font-family:var(--ff-serif);font-size:60px;line-height:1;font-weight:700;color:var(--acc);letter-spacing:-.02em}
.sess-t{color:var(--card-mut);font-size:15px;margin-top:8px}
.sess .btn{margin-top:20px;background:#ffffff;color:var(--card-bg);border-color:transparent;font-weight:700}
.sess .btn:active{background:#eef4ff}
.sess-m{color:var(--card-mut);font-size:13.5px;margin-top:13px;min-height:18px}
.sess.done{padding:26px 20px 20px}
.sess.done .btn{background:transparent;color:var(--card-tx);border:1px solid rgba(255,255,255,.22)}
.sess-ic{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:rgba(255,255,255,.08);
  color:var(--acc);display:flex;align-items:center;justify-content:center}
.sess.done .sess-t{color:var(--card-tx);font-size:19px;font-weight:650}

/* a settings-style row that leads somewhere */
.resumebar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.resumebar .rowlink{margin:0;flex:1}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 15px;margin-bottom:8px;font-size:15.5px;font-weight:600;color:var(--tx);
  transition:transform .3s cubic-bezier(.33,1,.68,1),background-color .18s ease}
.rowlink:active{transform:scale(.995);transition-duration:.12s;background:var(--surf2)}
.rowlink>span{display:flex;align-items:center;gap:11px;min-width:0}
.rowlink>span .i{color:var(--mut)}
.rowlink em{font-style:normal;color:var(--mut);font-weight:500;font-size:14px;flex:none}
.rowlink .i:last-child{color:var(--fade)}


/* modes live in one sheet now */
.modes-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modes-grid .mcard{width:auto}

/* bigger, fuller desktop layout */
@media(min-width:720px){
  body{font-size:17.5px}
  #app{max-width:780px;padding:0 24px}
  header h1{font-size:32px}
  .ic{width:46px;height:46px;font-size:21px}
  .btn{font-size:17px;padding:16px 20px}
  .setcard{padding:20px}.setcard .nm{font-size:21px}.setcard .meta{font-size:15px}
  .item{padding:15px 18px}.item .en{font-size:18.5px}.item .ru{font-size:16px}
  .wlist .item{padding:15px 19px}
  .mcard{width:120px;padding:17px 14px}.mcard b{font-size:16px}.mcard small{font-size:12.5px}
  .modes{gap:11px}.modes .mcard{padding:17px 6px 15px}.modes .mcard .em{width:58px;height:58px;border-radius:18px}.modes .mcard b{font-size:15px}
  .card .word{font-size:clamp(36px,4.6vw,50px)}
  .opt{font-size:18px;padding:18px 19px}
  .hero-title{font-size:32px}.hero-sub{font-size:17px}
  .rb-pct{font-size:46px}
  .subhead .t{font-size:14px}
  .tab{font-size:12.5px}
  .sess-n{font-size:66px}
}

function plr(n,one,few,many){const a=n%10,b=n%100;return (S.settings.lang||"ru")==="en"?(n===1?one:few):(a===1&&b!==11?one:(a>=2&&a<=4&&(b<10||b>=20)?few:many));}

const archStamp=()=>{const n=Date.now();if(n-_abt>2500)_ab=n;_abt=n;return _ab;};
let noAatCol=false;
const withAat=o=>{if(noAatCol&&o&&'aat' in o){o=Object.assign({},o);delete o.aat;}return o;};
const aatErr=e=>/aat/i.test(((e&&(e.message||e.details||e.hint))||'')+'');
async function aatRetry(run){let r=await run();if(r&&r.error&&!noAatCol&&aatErr(r.error)){noAatCol=true;r=await run();}return r;}
const newWord=(en,ru,ex='',ipa='')=>({id:uid(),en:en.trim(),ru:ru.trim(),ex:ex.trim(),ipa:ipa.trim(),box:0,arch:false,ok:0,bad:0,added:Date.now(),due:0,rep:0,upd:Date.now(),synced:false});
const touch=x=>{x.upd=Date.now();x.synced=false;};
const curSet=()=>S.sets.find(s=>s.id===(view.id||view.set));
/* new words land in the list you are filtered to, else the last one you used */
function addTarget(){
  const f=curSet();if(f)return f;
  const last=S.sets.find(s=>s.id===S.settings.lastSet);if(last)return last;
  if(lists().length)return lists()[0];
  const s={id:uid(),name:t('My words'),lang:newSetLang(),words:[],upd:Date.now(),synced:false};S.sets.push(s);return s;
}
/* the language a word added right now would get — without creating the list yet */
function targetLang(){
  const f=curSet();if(f)return setLangOf(f);
  const last=S.sets.find(s=>s.id===S.settings.lastSet);if(last)return setLangOf(last);
  if(lists().length)return setLangOf(lists()[0]);
  return newSetLang();
}
const active=s=>s.words.filter(w=>!w.arch);
const archived=s=>s.words.filter(w=>w.arch);
/* with no language given these cover every list, exactly as they used to */
const inLang=(s,lang)=>!lang||setLangOf(s)===lang;
const allArchived=lang=>S.sets.filter(s=>inLang(s,lang)).flatMap((s,si)=>s.words.map((w,wi)=>({w,sn:isHolder(s)?'':s.name,sid:s.id,lg:setLangOf(s),si,wi})).filter(x=>x.w.arch))
  /* newest batch first; inside a batch — the order the words were added to their list */
  .sort((a,b)=>((b.w.aat||0)-(a.w.aat||0))||(a.si-b.si)||((a.w.added||0)-(b.w.added||0))||(a.wi-b.wi));
const archCount=lang=>S.sets.reduce((n,s)=>n+(inLang(s,lang)?s.words.filter(w=>w.arch).length:0),0);
/* a slice of the Archive the student picked to work on, e.g. words 650–750 */
let archRange=null;
function archNumbered(lang){return allArchived(lang).map((x,i)=>Object.assign({},x,{n:i+1}));}
/* everything in the chosen range — the whole Archive when no range is set */
function archSlice(lang){
  const all=archNumbered(lang);
  if(!archRange)return all;
  const a=Math.max(1,archRange.from),b=Math.min(all.length,archRange.to);
  return all.filter(x=>x.n>=a&&x.n<=b);
}
function archRangeLabel(lang){

  if(!archRange)return t('Whole Archive')+' · '+nWords(total);
  const a=Math.max(1,archRange.from),b=Math.min(total,archRange.to);
  return a+'–'+b+' '+t('of')+' '+total;
}
/* the same "pick words 5–15" slice also works inside one list, and for a teacher inside a student's list */
let setRange=null,tRange=null;
function setNumbered(s){return active(s).map((w,i)=>({w,sn:s.name,n:i+1}));}
function setSliceOf(s){
  const all=setNumbered(s),r=(setRange&&setRange.id===s.id)?setRange:null;
  if(!r)return all;
  const a=Math.max(1,r.from),b=Math.min(all.length,r.to);
  return all.filter(x=>x.n>=a&&x.n<=b);
}
function rctx(){

function findWord(id){
  for(const s of S.sets){const w=s.words.find(x=>x.id===id);if(w)return{w,s};}
  /* a teacher practising a student's words: they live only in memory */
  if(PRACTICE){const w=PRACTICE.words.find(x=>x.id===id);if(w)return{w,s:{name:'',lang:w.lg,words:PRACTICE.words}};}

}
let PRACTICE=null;   /* {words:[…]} — a student's words loaded for the teacher to practise, never saved */
let scope={kind:'all',id:null};
function setScope(kind,id){scope={kind,id:id||null};}
/* the words actually on screen right now — what Select all must act on */
function viewPool(){
  if(view.name==='archive')return archSlice(view.lang).map(x=>x.w);
  if(view.name==='hard')return hardWords();
  if(view.name==='set'){const s=curSet();return s?setSliceOf(s).map(x=>x.w):[];}
  return poolNow();
}
function poolNow(){
  if(scope.kind==='prac')return PRACTICE?PRACTICE.words.slice():[];
  /* for 'arch' and 'lang', scope.id carries a language code (null = every language) */
  if(scope.kind==='arch')return archSlice(scope.id).map(x=>x.w);
  if(scope.kind==='lang')return S.sets.filter(s=>setLangOf(s)===scope.id).flatMap(s=>active(s));
  if(scope.kind==='hard')return hardWords();
  if(scope.kind==='set'){const s=S.sets.find(x=>x.id===scope.id);return s?setSliceOf(s).map(x=>x.w):[];}
  return S.sets.flatMap(s=>active(s));
}

/* ---------- what to study right now ---------- */
function buildSession(force){
  const goal=S.stats.goal||10, target=Math.max(6,goal);
  const due=dueWords();                       /* archived words that came back */
  const seen=new Set(due.map(w=>w.id));
  const tricky=hardWords().filter(w=>!w.arch&&!seen.has(w.id)).slice(0,5);
  tricky.forEach(w=>seen.add(w.id));
  const fresh=S.sets.flatMap(s=>active(s))
    .filter(w=>!seen.has(w.id))
    .sort((a,b)=>(a.box||0)-(b.box||0)||(a.upd||0)-(b.upd||0))
    .slice(0,Math.max(0,target-due.length-tricky.length));
  let words=[...due,...tricky,...fresh];
  if(!words.length&&force)words=shuffle(S.sets.flatMap(s=>s.words)).slice(0,target);
  return {due,tricky,fresh,words:shuffle(words)};
}

/* ---------- one adaptive session: the question fits the word ---------- */
function startSession(force){
  const plan=buildSession(force);
  if(!plan.words.length)return toast(t('Nothing due right now'));
  const pool=S.sets.flatMap(s=>s.words);
  let queue=plan.words.slice();
  let total=queue.length,done=0,good=0,learnt=0,back=0;const retried=new Set();
  const app=$('#app');
  function next(){
    if(!queue.length)return finish();
    const w=queue.shift();done++;
    app.innerHTML=studyTop(t('Session'),(done-1)/total*100,(done-1)+'/'+total);
    const lvl=w.arch?3:(w.box||0);
    const kind=w.arch?'type':(lvl<=1?'mc':'type');
    const dir=w.arch?'ru2en':(lvl===0?'en2ru':'ru2en');
    const q=mkQ(pool,w,kind,dir);
    pulse($('#qb'));
    renderQ($('#qb'),q,{feedback:true,onDone:ok=>{
      if(w.arch){
        const r=srAnswer(w,ok);
        if(ok){w.ok=(w.ok||0)+1;}else{w.bad=(w.bad||0)+1;if(r==='relearn')back++;}
        if(ok)good++;
        touch(w);bumpStudy(w.id);save();
        return next();
      }else{
        const r=award(w,ok);
        if(!ok&&!retried.has(w.id)){retried.add(w.id);queue.push(w);total++;}
        if(ok)good++;
        touch(w);bumpStudy(w.id);save();
        return next();
      }
    }});
  }
  function finish(){
        finish2();
  }
  function finish2(){
    const pct=Math.round(good/Math.max(1,done)*100);
    const bits=[];
    if(learnt)bits.push(learnt+' '+t('mastered'));
    if(plan.due.length)bits.push(plan.due.length+' '+t('reviewed'));
    if(back)bits.push(back+' '+t('returned to learning'));
    app.innerHTML=hdr(t('Session'),"go('today')")+
      scoreHero(pct,bits.length?bits.join(' · '):good+' / '+done+' '+t('correct'))+
      '<div style="height:14px"></div><button class="btn pri" onclick="go(\'today\')">'+t('Done')+'</button>';
    if(pct>=80)confetti(90);
  }
  next();
}

/* ---------- spaced repetition (archive) ---------- */
const DAY=864e5;
function srCfg(){return Object.assign({},DEF_SR,(S.settings&&S.settings.sr)||{});}
function srDays(){
  const c=srCfg();
  if(c.plan==='custom'&&Array.isArray(c.days)&&c.days.length)return c.days;
  return SR_PLANS[c.plan]||SR_PLANS.standard;
}
/* schedule an archived word for its next review */
function srSchedule(w,reset){
  const d=srDays();
  if(reset)w.rep=0;
  const step=Math.min(w.rep||0,d.length-1);
  w.due=Date.now()+d[step]*DAY;
}
/* a word has just been archived → put it on the ladder */
function srStart(w){if(!srCfg().on){w.due=0;w.rep=0;return;}w.rep=0;srSchedule(w,true);}
function srAnswer(w,ok){
  const c=srCfg();
  if(ok){w.rep=(w.rep||0)+1;srSchedule(w,false);return 'kept';}
  if(c.onFail==='relearn'){w.arch=false;w.aat=0;w.box=1;w.rep=0;w.due=0;return 'relearn';}
  w.rep=Math.max(0,(w.rep||0)-1);w.due=Date.now()+DAY;return 'again';
}
function dueAll(lang){
  if(!srCfg().on)return [];
  const now=Date.now();
  return S.sets.filter(s=>inLang(s,lang)).flatMap(s=>s.words.filter(w=>w.arch&&w.due&&w.due<=now))
    .sort((a,b)=>(a.due||0)-(b.due||0));
}
function dueWords(){const lim=srCfg().limit||20;return dueAll().slice(0,lim);}
function dueCount(lang){return dueAll(lang).length;}
function nextDueAt(lang){
  const f=S.sets.filter(s=>inLang(s,lang)).flatMap(s=>s.words.filter(w=>w.arch&&w.due)).map(w=>w.due).sort((a,b)=>a-b)[0];
  return f||0;
}
function whenTxt(ts){
  if(!ts)return '';
  const d=Math.round((ts-Date.now())/DAY);
  if(d<=0)return t('today');
  if(d===1)return t('tomorrow');
  if(d<7)return t('in')+' '+d+' '+plr(d,t('day'),t('day2'),t('days'));
  if(d<30){const w=Math.round(d/7);return t('in')+' '+w+' '+plr(w,t('week'),t('week2'),t('weeks'));}
  const mo=Math.round(d/30);return t('in')+' '+mo+' '+plr(mo,t('month'),t('month2'),t('months'));
}

/* ---------- tricky words ---------- */
function hardWords(){

/* ---------- daily goal + streak ---------- */
const dayKey=d=>{const x=d||new Date();return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();};
function rollDay(){
  const st=S.stats,k=dayKey();
  if(st.day===k)return;
  const y=dayKey(new Date(Date.now()-DAY));
  if(!(st.day===y&&st.met))st.streak=0;
  st.day=k;st.ids=[];st.met=false;st.upd=Date.now();
}
function bumpStudy(id){
  rollDay();const st=S.stats;
  if(st.ids.indexOf(id)<0)st.ids.push(id);
  const goal=st.goal||10;
  if(!st.met&&st.ids.length>=goal){st.met=true;st.streak=(st.streak||0)+1;if(st.streak>(st.best||0))st.best=st.streak;}
  st.upd=Date.now();
}
function todayCount(){rollDay();return S.stats.ids.length;}

let _voices=[];function loadVoices(){try{_voices=speechSynthesis.getVoices()||[]}catch(e){_voices=[]}}
/* which voice tag to ask the device for — English still follows the accent setting */
function ttsTag(lang){
  const c=LANG_MAP[lang]?lang:DEF_LANG;
  if(c==='en')return S.settings.accent==='us'?'en-US':'en-GB';
  return langInfo(c).tts||'';
}
const vScore=v=>{let s=0;const n=(v.name||'').toLowerCase();
  if(/\b(enhanced|premium|neural|natural)\b/.test(n))s+=70;
  if(/\b(siri|ava|allison|samantha|serena|daniel|kate|arthur|oliver|stephanie|aria|jenny|guy|libby|sonia|ryan|nicky|aaron)\b/.test(n))s+=42;
  if(/\bgoogle\b/.test(n))s+=34;
  if(/\b(compact|eloquence|fred|albert|zarvox|trinoids|whisper|novelty|bad|bells|boing|bubbles|cellos|wobble|superstar)\b/.test(n))s-=90;
  return s;};
/* the exact region if the device has it, otherwise any voice for the language */
function bestVoice(tag){
  if(!tag)return null;
  const want=tag.toLowerCase(),base=want.split('-')[0];
  const fam=_voices.filter(v=>((v.lang||'').replace('_','-').toLowerCase().split('-')[0])===base);
  if(!fam.length)return null;
  const exact=fam.filter(v=>(v.lang||'').replace('_','-').toLowerCase()===want);
  return (exact.length?exact:fam).slice().sort((a,b)=>vScore(b)-vScore(a))[0];
}
function speak(txt,lang){try{
  const tag=ttsTag(lang);if(!tag)return;            /* Latin and the like: no voice to ask for */
  const u=new SpeechSynthesisUtterance(txt);const v=bestVoice(tag);
  u.lang=(v&&v.lang)||tag;u.rate=.9;u.pitch=1;
  if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function speakWord(id){const f=findWord(id);if(f)speak(f.w.en,setLangOf(f.s));}

/* ---------- theme (day/night) ---------- */
function sunTimes(date,lat,lon){
  const rad=Math.PI/180,deg=180/Math.PI;
  const J=date.getTime()/86400000+2440587.5;
  const n=Math.round(J-2451545.0+0.0008);
  const Js=n-lon/360;
  const M=(357.5291+0.98560028*Js)%360;
  const C=1.9148*Math.sin(M*rad)+0.0200*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const lam=(M+C+180+102.9372)%360;
  const Jt=2451545.0+Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*lam*rad);
  const dec=Math.asin(Math.sin(lam*rad)*Math.sin(23.44*rad));
  let cH=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  cH=Math.max(-1,Math.min(1,cH));
  const H=Math.acos(cH)*deg;
  const toD=x=>new Date((x-2440587.5)*86400000);
  return {rise:toD(Jt-H/360),set:toD(Jt+H/360)};
}
function resolveDark(){
  const m=(S.settings.theme)||'auto';
  if(m==='dark')return true;if(m==='light')return false;
  const now=new Date(),g=S.settings.geo;
  if(g){try{const t=sunTimes(now,g.lat,g.lon);return now<t.rise||now>t.set;}catch(e){}}
  const h=now.getHours()+now.getMinutes()/60;return h<7||h>=19;
}
let _themeTimer=null;
function applyTheme(){
  const dark=resolveDark();
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute('content',dark?'#070c17':'#f3f6fb');
  clearTimeout(_themeTimer);
  if(((S.settings.theme)||'auto')==='auto')_themeTimer=setTimeout(applyTheme,60000);
}
function themeIcon(){return ic(document.documentElement.getAttribute('data-theme')==='dark'?'sun':'moon');}
function toggleTheme(){const dark=document.documentElement.getAttribute('data-theme')==='dark';S.settings.theme=dark?'light':'dark';save();applyTheme();render();}
function setLang(l){S.settings.lang=l;S.settings.upd=Date.now();save();settingsSheet();render();}
function setTheme(m){S.settings.theme=m;save();applyTheme();if($('#scrim'))settingsSheet();render();}
function useLocation(){
  if(!navigator.geolocation)return toast(t('Location not available'));
  toast(t('Requesting location…'));
  navigator.geolocation.getCurrentPosition(p=>{
    S.settings.geo={lat:p.coords.latitude,lon:p.coords.longitude};save();applyTheme();
    toast(t('Using your sunrise & sunset'));if($('#scrim'))settingsSheet();
  },()=>toast(t('Location denied')),{maximumAge:36e5,timeout:8000});
}

function bigRing(pct){

  return `<svg class="ring-big" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="--c:${c.toFixed(1)};--off:${off.toFixed(1)}">

function scoreHero(pct,sub){
  const em=ic(pct>=90?'award':pct>=70?'check':pct>=50?'trend':'repeat',30,1.6);
  const ti=pct>=90?t('Excellent!'):pct>=70?t('Great job!'):pct>=50?t('Good effort'):t('Keep practising');

function confetti(n){
  try{
    const cv=document.createElement('canvas');cv.className='confetti';
    const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    document.body.appendChild(cv);
    const cols=['#1a56db','#1f66ee','#2f86f5','#7db4ff','#9ed0ff','#c6e2ff','#ffffff'];
    const N=n||120,P=[];
    for(let i=0;i<N;i++)P.push({x:W/2+(Math.random()-.5)*160,y:H*0.3+(Math.random()-.5)*50,
      vx:(Math.random()-.5)*11,vy:Math.random()*-9-4,g:0.3+Math.random()*0.12,
      s:5+Math.random()*7,rot:Math.random()*6.28,vr:(Math.random()-.5)*0.4,
      col:cols[i%cols.length],sq:Math.random()<.5,life:0});
    const start=performance.now();let t0=start;
    function frame(t){const dt=Math.min(34,t-t0);t0=t;ctx.clearRect(0,0,W,H);let alive=0;
      for(const p of P){p.life+=dt;p.vy+=p.g*(dt/16);p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);p.rot+=p.vr;
        const a=Math.max(0,1-(p.life-1300)/1500);
        if(p.y<H+24&&a>0){alive++;ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;
          if(p.sq)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.283);ctx.fill();}ctx.restore();}}
      if(alive>0&&t-start<3400)requestAnimationFrame(frame);else cv.remove();}
    requestAnimationFrame(frame);
  }catch(e){}
}

/* award: update mastery; returns 'arch' if word just archived */
/* box 4 = mastered, but the student chose to keep the word in the list */
const KEPT=4;
function award(w,correct){
  touch(w);bumpStudy(w.id);
  if(correct){
    w.ok++;
    if((w.box||0)>=KEPT)return '';                 /* already kept on purpose — don't ask again */
    w.box=Math.min(3,(w.box||0)+1);
    /* the word is mastered, but nothing moves until the student says so */
    if(w.box>=3&&!w.arch)return 'ready';
  }
  else{w.bad++;w.box=Math.max(0,((w.box||0)>=KEPT?3:(w.box||0))-1);}
  return '';
}
/* the two answers to “mastered — what now?” */
function archYes(w){w.arch=true;w.box=3;w.aat=archStamp();srStart(w);touch(w);}
function archNo(w){w.box=KEPT;w.arch=false;w.aat=0;w.due=0;w.rep=0;touch(w);}

/* ask before anything leaves a list. Dismissing the sheet keeps the words. */
function archAsk(ws,onDone){
  ws=(ws||[]).filter(w=>w&&!w.arch);
  if(!ws.length)return onDone(0);
  const done=n=>{closeSheet();save();onDone(n);};

/* txt is translated from the list's language into Russian */
async function translate(txt,lang){
  const src=LANG_MAP[lang]?lang:DEF_LANG;
  const order=S.settings.prov==='mm'?['mm']:['google','mm'];
  for(const p of order){
    try{
      if(p==='google'){
        const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+src+'&tl=ru&dt=t&dt=bd&q='+encodeURIComponent(txt));
        if(!r.ok)continue;const j=await r.json();const main=(j[0]||[]).map(x=>x[0]).join('').trim();
        const alts=(j[1]||[]).flatMap(e=>e[1]||[]).filter(x=>x&&x.toLowerCase()!==main.toLowerCase()).slice(0,6);
        if(main)return{main,alts};
      }else{
        const r=await fetch('https://api.mymemory.translated.net/get?langpair='+src+'|ru&q='+encodeURIComponent(txt));
        if(!r.ok)continue;const j=await r.json();const main=(j.responseData.translatedText||'').trim();
        const alts=[...new Set((j.matches||[]).map(m=>m.translation).filter(x=>x&&x.toLowerCase()!==main.toLowerCase()))].slice(0,5);
        if(main&&!/^[A-Z\s]+$/.test(main))return{main,alts};
      }
    }catch(e){}
  }
  return null;
}

let noPrefsSync=false,noSettingsCol=false,statsSyncedUpd=-1,settingsSyncedUpd=-1,prefsErr='';

function colMissing(e){const m=errText(e);return m.indexOf('column')>=0||m.indexOf('schema')>=0||m.indexOf('does not exist')>=0||m.indexOf('not found')>=0;}

const dayNum=k=>{if(!k)return 0;const p=String(k).split('-');return (+p[0]||0)*10000+(+p[1]||0)*100+(+p[2]||0);};

function statsBlob(){const st=S.stats;return {day:st.day||'',ids:st.ids||[],streak:st.streak||0,best:st.best||0,met:!!st.met,goal:st.goal||10,upd:st.upd||0};}
/* combine another device's stats into ours without ever losing a streak */
function mergeStats(r){
  if(!r||typeof r!=='object')return false;
  const l=S.stats;let ch=false;
  const best=Math.max(l.best||0,r.best||0);
  if(best!==(l.best||0)){l.best=best;ch=true;}
  const ln=dayNum(l.day),rn=dayNum(r.day);
  if(rn>ln){                                  /* the other device has a more recent day */
    l.day=r.day;l.ids=Array.isArray(r.ids)?r.ids.slice():[];l.met=!!r.met;l.streak=r.streak||0;ch=true;
  }else if(rn===ln&&rn>0){                     /* same day on both — combine the progress */
    const set=new Set(l.ids||[]);let grew=false;
    (r.ids||[]).forEach(x=>{if(!set.has(x)){set.add(x);grew=true;}});
    if(grew){l.ids=[...set];ch=true;}
    if(r.met&&!l.met){l.met=true;ch=true;}
    const st=Math.max(l.streak||0,r.streak||0);
    if(st!==(l.streak||0)){l.streak=st;ch=true;}
  }
  if(r.goal&&(r.upd||0)>(l.upd||0)&&r.goal!==l.goal){l.goal=r.goal;ch=true;}
  if((l.best||0)<(l.streak||0)){l.best=l.streak;ch=true;}
  if(ch)l.upd=Math.max(l.upd||0,r.upd||0,Date.now());   /* re-sync the merged truth */
  return ch;
}

/* last-write-wins on the whole settings blob */
function mergeSettings(r){
  if(!r||typeof r!=='object')return false;
  if((r.upd||0)<=(S.settings.upd||0))return false;      /* ours is newer */
  let ch=false;
  ['prov','accent','lang'].forEach(k=>{if(r[k]!==undefined&&r[k]!==S.settings[k]){S.settings[k]=r[k];ch=true;}});
  if(r.sr&&typeof r.sr==='object'){S.settings.sr=Object.assign({},DEF_SR,r.sr);ch=true;}
  if(ch)S.settings.upd=r.upd;

}

async function pushPrefs(me){
  if(noPrefsSync)return;
  /* read-merge-write: never overwrite what another device has already saved */
  await pullPrefs(me,true);
  if(noPrefsSync)return;
  const patch={};
  if((S.stats.upd||0)>0)patch.stats=statsBlob();
  if(!noSettingsCol&&(S.settings.upd||0)>0)patch.settings=settingsBlob();
  if(!Object.keys(patch).length)return;
  const run=()=>sb.from('profiles').update(patch).eq('id',me).select('id');
  let {data,error}=await run();
  /* a database that has stats but not the newer settings column — send stats alone */
  if(error&&('settings' in patch)&&colMissing(error)&&errText(error).indexOf('settings')>=0){
    noSettingsCol=true;delete patch.settings;
    if(Object.keys(patch).length)({data,error}=await run());
  }
  if(error){
    prefsErr=isJwtErr(error)?t('Your login expired — sign out and sign in again.'):(errText(error).slice(0,140)||'error');
    if(colMissing(error))noPrefsSync=true;
    return;
  }
  /* RLS hides a refused update: no error, just zero rows touched */
  if(!data||!data.length){prefsErr='no row updated (access rule missing)';return;}
  prefsErr='';
  if(patch.stats)statsSyncedUpd=S.stats.upd||0;
  if(patch.settings)settingsSyncedUpd=S.settings.upd||0;
}

  if(error){prefsErr=errText(error).slice(0,140)||'error';if(colMissing(error))noPrefsSync=true;return;}
  let ch=false;
  if(data){if(data.stats&&mergeStats(data.stats))ch=true;if(data.settings&&mergeSettings(data.settings))ch=true;}

/* the server caps how many rows one reply may carry, so ask page by page */
async function fetchPaged(table,ownerId){
  const PAGE=1000;let from=0,rows=[];
  for(;;){
    const {data,error}=await sb.from(table).select('*').eq('owner_id',ownerId).eq('deleted',false).range(from,from+PAGE-1);
    if(error)return {rows,complete:false};
    rows=rows.concat(data||[]);
    if(!data||data.length<PAGE)return {rows,complete:true};
    from+=PAGE;
    if(from>100000)return {rows,complete:false};   /* never loop forever */
  }
}

function mergeCloud(cs,cw,authoritative){

    cs.forEach(c=>{
      const u=+new Date(c.updated_at),l=S.sets.find(x=>x.id===c.id);
      /* a row from a database without the column keeps whatever language we already had */
      const cl=LANG_MAP[c.lang]?c.lang:null;
      if(!l)S.sets.push({id:c.id,name:c.name,lang:cl||DEF_LANG,words:[],upd:u,synced:true});
      else if(u>(l.upd||0)){l.name=c.name;if(cl)l.lang=cl;l.upd=u;l.synced=true;}
    });
    if(authoritative)S.sets=S.sets.filter(s=>setIds.has(s.id)||!s.synced);
    cw.forEach(c=>{
      const s=S.sets.find(x=>x.id===c.set_id);if(!s)return;

      else if(u>(l.upd||0))Object.assign(l,{en:c.en,ru:c.ru||'',ex:c.ex||'',ipa:c.ipa||'',due:c.due||0,rep:c.rep||0,box:c.box||0,arch:!!c.arch,aat:c.aat||0,ok:c.ok||0,bad:c.bad||0,upd:u,synced:true});
    });
    if(authoritative)S.sets.forEach(s=>{s.words=s.words.filter(w=>wordIds.has(w.id)||!w.synced);});
    _lgIdx=null;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  }catch(e){}

function authErrMsg(e){

  if(/already registered|already exists|User already/i.test(m))return t('This email is already registered — sign in instead.');
  if(/Invalid login/i.test(m))return t('Wrong email or password.');
  if(/least 6|Password should/i.test(m))return t('Password must be at least 6 characters.');
  if(/Email not confirmed/i.test(m))return t('Confirm your email first — check your inbox.');
  if(/valid email|invalid format/i.test(m))return t('That email address doesn’t look right.');
  if(/Failed to fetch|NetworkError/i.test(m))return t('No connection — try again when you’re online.');
  return m||t('Something went wrong');

let softMode=false;
(function(){
  const app=document.getElementById('app'),d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
  if(!app||!d)return;
  Object.defineProperty(app,'innerHTML',{configurable:true,get(){return d.get.call(this);},set(v){
    if(softMode&&v===this._last)return;
    this._last=v;
    const y=softMode?window.scrollY:null;
    if(softMode)this.style.minHeight=this.offsetHeight+'px';
    d.set.call(this,v);
    if(softMode){window.scrollTo(0,y);requestAnimationFrame(()=>{this.style.minHeight='';});}
  }});
})();

function syncTabs(){
  let nav=document.getElementById('tabs');
  const cur=view.name==='home'?'today':view.name,isT=!!(AUTH.profile&&AUTH.profile.role==='teacher');
  const tabs=[['today','target',t('Today')],['vocab','book',t('Vocabulary')]];
  if(isT)tabs.push(['students','users',t('Students')]);
  tabs.push(['me','user',t('Profile')]);
  const key=tabs.map(x=>x[0]+x[2]).join('|');
  if(!nav){nav=document.createElement('nav');nav.id='tabs';nav.className='tabs hide';document.body.appendChild(nav);tabsKey='';}
  if(key!==tabsKey){
    tabsKey=key;
    nav.innerHTML=tabs.map(([n,i,l])=>`<button class="tab" data-tab="${n}" onclick="go('${n}')"><span class="ti"></span><span>${esc(l)}</span></button>`).join('');
    nav._on={};
  }
  const act=n=>n===cur||(n==='students'&&(cur==='tsets'||cur==='twords'));
  tabs.forEach(([n,i])=>{
    const b=nav.querySelector('[data-tab="'+n+'"]');if(!b)return;
    const on=act(n);
    if(nav._on[n]===on)return;
    nav._on[n]=on;
    b.classList.toggle('on',on);
    b.querySelector('.ti').innerHTML=ic(i,21,on?'fill':'');

  const show=tabWanted&&!selMode;

/* one row renderer for every word list */
let rowCap=400;
function showAllRows(){rowCap=1e9;render();}
function wordRows(items,qs,showSrc){
  qs=fold(qs);
  let its=qs?items.filter(x=>fold(x.w.en+' '+x.w.ru+' '+(x.w.ex||'')).includes(qs)):items;
  const hidden=Math.max(0,its.length-rowCap);
  if(hidden)its=its.slice(0,rowCap);
  if(!items.length)return `<div class="empty"><div class="big">${ic('pen',26)}</div><b>${t('Add your first word')}</b><p>${t('Tap ＋ below to enter a word and its translation, or import a whole list from the ⋯ menu.')}</p></div>`;
  if(!its.length)return `<div class="empty"><p>${t('Nothing found')}</p></div>`;
  return '<div class="wlist">'+its.map(({w,sn,n})=>{
    const picked=selIds.has(w.id);
    const tricky=(w.bad||0)>=2&&(w.bad||0)>(w.ok||0);
    const left=selMode
      ?`<span class="cbox ${picked?'on':''}">${picked?ic('check',14,2.4):''}</span>`
      :(n?`<span class="numx">${n}</span>`
        :w.arch?'<span class="chk">'+ic('check',14,2.2)+'</span>'
        :tricky?`<span class="chk" style="background:var(--bad-soft);color:var(--bad)">${w.bad}</span>`
        :`<span class="pips"><i class="pip ${w.box>=1?'on1':''}"></i><i class="pip ${w.box>=2?'on2':''}"></i><i class="pip ${w.box>=3?'on3':''}"></i></span>`);
    const meta=[showSrc?esc(sn):'',w.arch&&w.due?esc(whenTxt(w.due)):''].filter(Boolean).join(' · ');
    return `<div class="item ${picked&&selMode?'pick':''}" onclick="${selMode?`togglePick('${w.id}')`:`wordForm('${w.id}')`}">
      ${left}
      <div class="t"><div class="en">${esc(w.en)}</div>
      <div class="ru">${esc(w.ru)}${meta?`<span class="src"> · ${meta}</span>`:''}</div></div>
      ${(n&&!w.arch&&!selMode)?`<span class="pips"><i class="pip ${w.box>=1?'on1':''}"></i><i class="pip ${w.box>=2?'on2':''}"></i><i class="pip ${w.box>=3?'on3':''}"></i></span>`:''}
      ${selMode?'':`<button class="spk" aria-label="Pronounce" onclick="event.stopPropagation();speakWord('${w.id}')">${ic('sound',17)}</button>`}</div>`;
  }).join('')+'</div>'+(hidden?`<button class="btn ghost" style="margin-top:4px" onclick="showAllRows()">${t('Show all')} · ${hidden}</button>`:'');
}

  lists().forEach(s=>opts.push([s.id,multi?s.name+' · '+langName(setLangOf(s)):s.name]));
  if(multi)ls.forEach(c=>{if(archCount(c))opts.push(['arch:'+c,t('Archive')+' · '+langName(c)]);});

  sheet(`<h2>${t('Choose a mode')}</h2>

     <select class="inp" id="mscope" onchange="pickScope(this.value)">
       ${opts.map(([v,n])=>`<option value="${v}" ${v===cur?'selected':''}>${esc(n)}</option>`).join('')}</select></div>

  return `<div class="modes">
   <button class="mcard" ${go('cards')}><div class="em">${ic('cards',25,1.7)}</div><b>${t('Flashcards')}</b></button>

function launchMode(kind,id,m){
  if(selMode)toggleSelMode();

function pickScope(v){
  if(v==='all'||v==='arch'||v==='hard')return setScope(v);
  const i=v.indexOf(':');
  if(i>0){const k=v.slice(0,i);if(k==='arch'||k==='lang')return setScope(k,v.slice(i+1));}
  setScope('set',v);
}
function runMode(m){
  const v=($('#mscope')||{}).value;if(v)pickScope(v);
  const review=scope.kind==='arch';
  closeSheet();
  if(m==='cards')startCards(review);
  else if(m==='learn')startLearn(review);
  else if(m==='test')testSetup(review);
  else startMatch(review);
}

async function fetchOwner(ownerId){
  try{
    const [rs,rw]=await Promise.all([fetchPaged('sets',ownerId),fetchPaged('words',ownerId)]);
    return {sets:rs.rows.sort((a,b)=>(a.position||0)-(b.position||0)),words:rw.rows,ok:rs.complete&&rw.complete};
  }catch(e){return {sets:[],words:[],ok:false};}

function agoTxt(ts){
  if(!ts)return t('no activity yet');
  const d=Math.floor((Date.now()-ts)/DAY);
  if(d<=0)return t('active today');
  if(d===1)return t('active yesterday');
  if(d<7)return t('active')+' '+d+' '+plr(d,t('day'),t('day2'),t('days'))+' '+t('ago');
  if(d<30){const w=Math.round(d/7);return t('last seen')+' '+w+' '+plr(w,t('week'),t('week2'),t('weeks'))+' '+t('ago');}
  const mo=Math.round(d/30);return t('last seen')+' '+mo+' '+plr(mo,t('month'),t('month2'),t('months'))+' '+t('ago');
}

function topLoad(on){

}

           which silently dropped every student after the biggest ones */
        let failed=false;
        const per=await Promise.all(AUTH.students.map(async st=>{
          let rows=[];
          for(let from=0;from<100000;from+=1000){
            const {data,error}=await sb.from('words').select('owner_id,arch,ok,bad,updated_at').eq('owner_id',st.id).eq('deleted',false).range(from,from+999);
            if(error){failed=true;return rows;}
            rows=rows.concat(data||[]);
            if(!data||data.length<1000)break;
          }

  if(/Failed to fetch|NetworkError|offline/i.test(m)||!navigator.onLine)return fallback;
  return m?fallback+' — '+m:fallback;
}

/* ---------- sheets ---------- */
/* a backdrop closes its sheet only when the press AND the release both happen on it —
   dragging a text selection out of the sheet must never count as a tap outside */
function backdrop(d,fn){
  d._dn=false;
  d.addEventListener('pointerdown',e=>{d._dn=(e.target===d);},true);
  d.onclick=e=>{const ok=e.target===d&&d._dn;d._dn=false;if(ok)fn();};
}
function sheet(html){
  const ex=$('#scrim');
  if(ex&&!ex.classList.contains('closing')){      /* already open: swap the contents, don't replay the slide-up */
    const box=ex.querySelector('.sheet'),top=box.scrollTop,h0=box.offsetHeight;
    box.innerHTML=`<div class="grip"></div>${html}`;
    box.scrollTop=top;
    const h1=box.offsetHeight;
    if(Math.abs(h1-h0)>4){
      box.style.height=h0+'px';box.style.overflow='hidden';
      requestAnimationFrame(()=>{
        box.style.transition='height .26s cubic-bezier(.22,1,.36,1)';box.style.height=h1+'px';
        setTimeout(()=>{box.style.transition='';box.style.height='';box.style.overflow='';},280);
      });
    }
    return;
  }
  const d=document.createElement('div');d.className='scrim';d.id='scrim';
  backdrop(d,closeSheet);
  d.innerHTML=`<div class="sheet"><div class="grip"></div>${html}</div>`;
  document.body.appendChild(d);d.querySelector('.sheet').scrollTop=0;
}
function closeSheet(){
  const s=$('#scrim');if(!s)return;
  s.id='';s.classList.add('closing');                /* free the id at once so a new sheet can open */
  setTimeout(()=>s.remove(),190);
}

}
/* choose which slice of the Archive to work on */
function rangeSheet(){
  const c=rctx(),total=c.total;
  const a=c.cur?Math.max(1,c.cur.from):1;

/* which fields the translator writes into — the student form and the teacher form share it */
let TR={en:'fEn',ru:'fRu',st:'trSt',chips:'chips',lang:DEF_LANG};
function trSetup(cfg){TR=Object.assign({en:'fEn',ru:'fRu',st:'trSt',chips:'chips',lang:DEF_LANG},cfg||{});}
function autoTr(){clearTimeout(trTimer);trTimer=setTimeout(()=>doTr(false),650);}
async function doTr(force){
  const enEl=$('#'+TR.en);if(!enEl)return;const en=enEl.value.trim();if(!en)return;
  const seq=++trSeq;const st=$('#'+TR.st);if(st)st.textContent=t('Translating…');
  const r=await translate(en,TR.lang);
  const now=$('#'+TR.en);
  if(seq!==trSeq||!now||now.value.trim()!==en)return;     /* the field moved on while we waited */
  const ruEl=$('#'+TR.ru);if(!ruEl)return;
  const stEl=$('#'+TR.st);
  if(!r){if(stEl)stEl.textContent='⚠ '+t('Can’t reach the translator — enter the translation manually');return;}
  if(force||(!ruTouched&&!ruEl.value)){ruEl.value=r.main;ruTouched=false;}
  if(stEl)stEl.textContent=t('Options — tap to use:');
  const ch=$('#'+TR.chips);
  if(ch)ch.innerHTML=[r.main,...r.alts].map(a=>`<button class="chip" onclick="$('#${TR.ru}').value='${q1(a)}';ruTouched=true">${esc(a)}</button>`).join('');
}
function saveWord(){
  const en=$('#fEn').value.trim(),ru=$('#fRu').value.trim(),ex=$('#fEx').value.trim();

  else if(formArch){

function toggleArch(id){const f=findWord(id);if(!f)return;const w=f.w;w.arch=!w.arch;

function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=()=>rej(new Error('load '+src));document.head.appendChild(e);});}
let _pdfReady=null;
/* the PDF library and its font are fetched only when someone actually exports */
function pdfLibs(){
  if(!_pdfReady)_pdfReady=(async()=>{
    if(!(window.jspdf&&window.jspdf.jsPDF))await loadScript('lib/jspdf.umd.min.js');
    if(!window.PDF_FONTS)await loadScript('lib/pdf-font.js');
  })().catch(e=>{_pdfReady=null;throw e;});

}
let PDFSPEC=null;
function pdfSheet(spec){

function pdfFromItems(title,lang,items){

function tPdf(){
  const base=TV.base||[],list=TV.list||[];
  const items=list.map(w=>({n:base.indexOf(w)+1,w:{en:w.en,ru:w.ru,ex:w.ex}}));

}
async function makePdf(){
  const sp=PDFSPEC;if(!sp)return;
  const mode=(($('#pdfMode')||{}).value)||'both',withEx=!!($('#pdfEx')&&$('#pdfEx').classList.contains('on'));
  const btn=$('#pdfBtn'),err=$('#pdfErr');
  if(btn){btn.disabled=true;btn.textContent=t('Creating…');}
  try{
    await pdfLibs();
    const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
    doc.addFileToVFS('dv.ttf',PDF_FONTS.regular);doc.addFont('dv.ttf','DV','normal');
    doc.addFileToVFS('dvb.ttf',PDF_FONTS.bold);doc.addFont('dvb.ttf','DV','bold');
    const W=210,H=297,M=16,NUMW=11,GAP=4,colW=(W-2*M-NUMW-GAP)/2,x1=M+NUMW,x2=x1+colW+GAP;
    const date=new Date().toLocaleDateString(uiEn()?'en-GB':'ru-RU');
    let y=M;
    const head=first=>{
      if(first){
        doc.setFont('DV','bold');doc.setFontSize(18);doc.setTextColor(20,28,48);
        doc.text(doc.splitTextToSize(sp.title,W-2*M),M,y+6);y+=6+Math.max(0,(doc.splitTextToSize(sp.title,W-2*M).length-1)*7.5);
        doc.setFont('DV','normal');doc.setFontSize(10);doc.setTextColor(110,120,140);
        doc.text(langName(sp.lang)+' · '+nWords(sp.items.length)+' · '+date,M,y+6);y+=11;
      }
      doc.setFont('DV','bold');doc.setFontSize(9);doc.setTextColor(110,120,140);
      doc.text('№',M,y+4);
      doc.text(langName(sp.lang),x1,y+4);doc.text(uiEn()?'Russian':'Русский',x2,y+4);
      doc.setDrawColor(200,206,220);doc.line(M,y+6,W-M,y+6);y+=9;
    };
    head(true);
    sp.items.forEach((it,i)=>{
      const wrap=(txt,font,size,w)=>{doc.setFont('DV',font);doc.setFontSize(size);return doc.splitTextToSize(String(txt),w);};
      const left=mode==='tr'?[]:wrap(it.en,'bold',11,colW-1);
      const right=mode==='words'?[]:wrap(it.ru,'normal',11,colW-1);
      const exL=(withEx&&it.ex&&mode==='both')?wrap(it.ex,'normal',9,W-2*M-NUMW):[];
      const lines=Math.max(left.length,right.length,1);
      const rh=lines*5.2+3+(exL.length?exL.length*4.2+1:0);
      if(y+rh>H-18){doc.addPage();y=M;head(false);}
      if(i%2===0){doc.setFillColor(244,246,251);doc.rect(M-1,y-1.5,W-2*M+2,rh,'F');}
      doc.setFont('DV','normal');doc.setFontSize(9);doc.setTextColor(120,130,150);doc.text(String(it.n),M,y+3.6);
      doc.setFontSize(11);
      if(left.length){doc.setFont('DV','bold');doc.setTextColor(20,28,48);doc.text(left,x1,y+3.8);}
      if(right.length){doc.setFont('DV','normal');doc.setTextColor(40,48,70);doc.text(right,x2,y+3.8);}
      if(exL.length){doc.setFont('DV','normal');doc.setFontSize(9);doc.setTextColor(120,130,150);doc.text(exL,x1,y+lines*5.2+3.8);}
      y+=rh;
    });
    const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('DV','normal');doc.setFontSize(8.5);doc.setTextColor(150,158,175);
      doc.text(p+' / '+n,W/2,H-9,{align:'center'});doc.text('NOEON · Vocabulary',M,H-9);}
    const name=(sp.title.replace(/[^\wа-яёА-ЯЁ\- ]/gi,'_').replace(/\s+/g,' ').trim()||'words')+'.pdf';
    const blob=doc.output('blob');
    closeSheet();
    try{const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}
    catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(t('Saved ✓'));
  }catch(e){
    if(err)err.textContent=t('Couldn’t create the PDF')+(navigator.onLine?'':' — '+t('No connection — try again when you’re online.'));
    if(btn){btn.disabled=false;btn.textContent=t('Create PDF');}
  }
}

let impTerm='auto',impCard='line',impAuto=true;

function importSheet(toStudent,opts){

   <div class="hint">${impArch?t('These words go straight to the Archive.'):impTo?t('The words go straight into the student’s list.'):t("Paste a list from Quizlet, Excel or plain text. Translations are optional — they'll be filled in automatically.")}
     ${impArch?'':`<br><b>${esc(langName(impTo?tSetLang(impTo.setId):targetLang()))} → ${uiEn()?'Russian':'Русский'}</b>`}</div>
   ${impArch?`<div class="field"><label>${t('List language')}</label><select class="inp" id="impLg">${langOptions(archLg)}</select></div>`:''}
   <div class="field"><textarea class="inp" id="imp" placeholder="apple&#9;яблоко&#10;reliable&#9;надёжный&#10;to give up&#10;book	книга" oninput="impPrev()"></textarea></div>
   <div class="field"><label>${t('Between word and translation')}</label><div class="sel-opt" id="selT">
     ${[['auto',t('Auto')],['tab',t('Tab ⇥')],['dash',t('Dash –')],['comma',t('Comma')],['eq','= ']].map(o=>`<button data-v="${o[0]}" class="${o[0]==='auto'?'on':''}" onclick="impTerm='${o[0]}';syncSel();impPrev()">${o[1]}</button>`).join('')}</div></div>
   <div class="field"><label>${t('Between cards')}</label><div class="sel-opt" id="selC">
     ${[['line',t('New line')],['semi',t('; semicolon')],['blank',t('Blank line')]].map(o=>`<button data-v="${o[0]}" class="${o[0]==='line'?'on':''}" onclick="impCard='${o[0]}';syncSel();impPrev()">${o[1]}</button>`).join('')}</div></div>
   <div class="toggle"><label>${t('Translate when the translation is missing')}</label><div class="sw on" id="swA" onclick="impAuto=!impAuto;this.classList.toggle('on',impAuto)"><i></i></div></div>
   <div class="hint" id="impInfo">${t('Preview will appear here')}</div>
   <div class="err" id="impErr"></div>
   <button class="btn pri" id="impBtn" onclick="runImport()">${t('Add')}</button>`);
  setTimeout(()=>$('#imp')&&$('#imp').focus(),60);
}
function syncSel(){$$('#selT button').forEach(b=>b.classList.toggle('on',b.dataset.v===impTerm));
  $$('#selC button').forEach(b=>b.classList.toggle('on',b.dataset.v===impCard));}
function splitCards(text){
  if(impCard==='semi')return text.split(';');
  if(impCard==='blank')return text.split(/\n\s*\n/);
  return text.split(/\r?\n/);
}
function splitPair(line){
  line=line.trim();if(!line)return null;
  let en,ru;
  if(impTerm==='tab'){[en,...ru]=line.split('\t');ru=(ru||[]).join(' ');}
  else if(impTerm==='comma'){[en,...ru]=line.split(',');ru=(ru||[]).join(',');}
  else if(impTerm==='eq'){[en,...ru]=line.split('=');ru=(ru||[]).join('=');}
  else if(impTerm==='dash'){const m=line.split(/\s+[-–—]\s+/);en=m[0];ru=m.slice(1).join(' - ');}
  else{ // auto
    if(line.includes('\t')){[en,...ru]=line.split('\t');ru=ru.join(' ');}
    else{const m=line.split(/\s+[-–—:]\s+/);if(m.length>1){en=m[0];ru=m.slice(1).join(' - ');}
      else{en=line;ru='';}}
  }
  en=(en||'').trim();ru=(ru||'').trim();
  return en?{en,ru}:null;
}
function parseImport(){const t=$('#imp').value;return splitCards(t).map(splitPair).filter(Boolean);}
function impPrev(){
  const p=parseImport();const miss=p.filter(x=>!x.ru).length;
  const info=$('#impInfo');if(!info)return;
  if(!p.length){info.textContent=t('Preview will appear here');return;}

async function runImport(){
  const pairs=parseImport();if(!pairs.length)return toast(t('Nothing to import'));
  const btn=$('#impBtn');btn.disabled=true;
  const s=(impTo||impArch)?null:addTarget();
  const lg=impArch?((($('#impLg')||{}).value)||DEF_LANG):(impTo?tSetLang(impTo.setId):setLangOf(s));
  const er=$('#impErr');if(er)er.textContent='';
  const need=pairs.filter(p=>!p.ru&&impAuto);
  if(need.length){
    const queue=need.slice();let done=0;
    const worker=async()=>{
      while(queue.length){
        const p=queue.shift();
        const r=await translate(p.en,lg);
        p.ru=r?r.main:'';
        done++;if(btn)btn.textContent=t('Translating…')+' '+done+'/'+need.length;
      }
    };
    await Promise.all(Array.from({length:Math.min(5,need.length)},worker));
  }
  if(impTo)return tFinishImport(pairs,btn,lg);
  if(impArch){
    const h=holderFor(lg);
    {const st=archStamp();pairs.forEach(p=>{const w=newWord(p.en,p.ru||'—');w.arch=true;w.box=3;w.aat=st;srStart(w);h.words.push(w);});}
    save();closeSheet();render();toast(t('Added to the Archive ✓')+': '+nWords(pairs.length));return;
  }
  pairs.forEach(p=>s.words.push(newWord(p.en,p.ru||'—')));
  save();closeSheet();render();toast(t('Added')+': '+nWords(pairs.length));
}
/* write an imported batch into the student's list, in chunks the server accepts */
async function tFinishImport(pairs,btn,lg){
  const now=new Date().toISOString(),base=TV.words.length;
  try{
    let setId=impTo.setId,mk=()=>({box:0,arch:false,due:0,rep:0});

    }
    const rows=pairs.map((p,i)=>Object.assign({id:uid(),set_id:setId,owner_id:impTo.sid,en:p.en,ru:p.ru||'—',ex:'',
      ok:0,bad:0,position:base+i,deleted:false,updated_at:now},mk()));
    for(let i=0;i<rows.length;i+=100){
      if(btn)btn.textContent=t('Saving…')+' '+Math.min(i+100,rows.length)+'/'+rows.length;

/* ---------- questions engine ---------- */
function mkQ(pool,w,kind,forceDir){
  const lg=langOf(w);
  /* decoys must be in the same language as the word, or the question makes no sense */
  const others=pool.filter(x=>x!==w&&langOf(x)===lg);
  if(kind==='mc'&&others.length<1)kind='type';
  if(kind==='tf'&&others.length<1)kind='type';
  const dir=forceDir||(Math.random()<.5?'en2ru':'ru2en');
  if(kind==='mc'){const ds=shuffle(others).slice(0,Math.min(3,others.length));
    return{w,lg,type:'mc',dir,opts:shuffle([w,...ds]).map(x=>({t:dir==='en2ru'?x.ru:x.en,c:x===w}))};}
  if(kind==='tf'){const isTrue=Math.random()<.5;const d=isTrue?w:shuffle(others)[0];
    const td=forceDir==='ru2en'?'ru2en':'en2ru';
    return{w,lg,type:'tf',dir:td,shown:td==='ru2en'?d.en:d.ru,isTrue};}
  return{w,lg,type:'type',dir};
}
/* “Напишите по-венгерски” / “Выберите слово — венгерский” once more than one language is in play */
function qLabel(q){
  const en2ru=q.dir==='en2ru',lg=q.lg||langOf(q.w);
  if(q.type==='tf')return t('Is this a correct match?');
  /* answering into the studied language: always say which one, so a mixed session stays clear */
  if(q.type==='type')return en2ru?t('Type the translation')
    :(lg==='en'?t('Type in English'):t('Type')+' '+langAdv(lg));
  return en2ru?t('Choose the translation')
    :(multiLang()?t('Choose the word')+' '+langPrep(lg):t('Choose the word'));
}
function renderQ(box,q,o){
  const w=q.w,en2ru=q.dir==='en2ru',prompt=en2ru?w.en:w.ru,answer=en2ru?w.ru:w.en;

/* ---------- learn (active only) ---------- */
function startLearn(review){
  const pool=review?poolNow():(view.name==='set'?viewPool():poolNow());
  if(!pool.length)return toast(review?t('No words'):t('No words to learn'));
  const B={};if(review)pool.forEach(w=>B[w.id]=0);
  const lvl=w=>Math.min(3,review?B[w.id]:(w.box||0));
  let queue=shuffle(pool.filter(w=>lvl(w)<3));
  /* every word already mastered: one practice pass, a word counts once it is answered right */
  const practice=!queue.length;if(practice)queue=shuffle(pool);
  const session=queue.slice(),N=session.length,app=$('#app');
  const start=new Map(session.map(w=>[w.id,practice?0:lvl(w)])),okSet=new Set();
  /* the count is read from the words' real state, so a slip and a re-learn can never be counted twice */
  const isDone=w=>practice?okSet.has(w.id):lvl(w)>=3;
  const doneN=()=>session.filter(isDone).length;
  const progress=()=>{
    if(practice)return okSet.size/N;
    let base=0,now=0;session.forEach(w=>{base+=start.get(w.id);now+=lvl(w);});
    const tot=3*N-base;return tot>0?Math.max(0,Math.min(1,(now-base)/tot)):1;
  };
  function finish(){
    app.innerHTML=hdr(t('Learn'),"render()")+
      `<div class="hero"><div class="hero-ic">${ic('award',30,1.6)}</div><div class="hero-title" style="margin-top:14px">${review?t('Review complete'):t('Great job!')}</div>
       <div class="hero-sub">${N} / ${N} ${t('mastered')}<br>${review?t('You revised every word in this session.'):t('Every word this session is mastered.')+' '+t('Take a test to move them to the Archive.')}</div></div>
      <div style="height:14px"></div><button class="btn pri" onclick="render()">${t('Done')}</button>`;
    confetti(90);
  }
  function next(){
    if(doneN()>=N)return finish();
    if(!queue.length)queue=shuffle(session.filter(w=>!isDone(w)));
    const w=queue.shift();const L=lvl(w);const kind=L<=1?'mc':'type';const dir=L===0?'en2ru':'ru2en';
    app.innerHTML=studyTop(t('Learn'),progress()*100,t('mastered')+' '+doneN()+'/'+N);
    const q=mkQ(pool,w,kind,dir);
    pulse($('#qb'));
    renderQ($('#qb'),q,{feedback:true,onDone:ok=>{
      const before=lvl(w);
      if(review){B[w.id]=ok?Math.min(3,before+1):Math.max(0,before-1);}
      else{award(w,ok);save();}
      if(ok&&practice)okSet.add(w.id);
      if(isDone(w)){}
      else if(ok)queue.splice(Math.min(queue.length,3+(Math.random()*3|0)),0,w);
      else queue.splice(Math.min(queue.length,2),0,w);
      next();
    }});
  }
  next();
}
